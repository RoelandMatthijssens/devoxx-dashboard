gging a consistently failing unit test is easy; you set a breakpoint and fix it. But how do you debug a \"random\" failure in a massive microservices landscape or a distributed monolith?<br><br>During an interview, I was once told, \"You are more of a debugger than a coder.\" They were right: I thrive on the bugs that make others give up: the nasty, intermittent issues hidden under the carpet. <br>But you cannot solve these issues with 'System.out.println()' or a simple debugger attached to localhost.<br><br>Debugging at scale requires a shift in mindset and tooling. It requires moving from the paradigm of \"5 Whys\" and 'logger.info' to a structured observational approach based on observability data.<br>Based on production outages, I'll share how I uncovered the problems, the lessons I learned and how you can combine a debugging mindset with observability tooling like OpenTelemetry and the Grafana toolset to gain deeper insights.", "totalFavourites": 143, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-06T10:40:00Z", "to": "2026-10-06T11:20:00Z", "room": "Room 6", "kind": "Lunch Talk", "pause": false, "talk": null}, {"from": "2026-10-06T10:40:00Z", "to": "2026-10-06T11:20:00Z", "room": "Room 8", "kind": "Lunch Talk", "pause": false, "talk": {"id": 10016, "title": "Measuring the Unmeasurable: Evaluating Generative AI in Practice", "speakers": [{"fullName": "Erin Pacquetet", "company": "SCIAM", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-221944f9-cdfb-40ed-93c6-0c8a396d106e.jpg"}], "track": {"name": "Agentic Engineering & Tooling"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=Qdn-I3q50Ww", "description": "Getting a generative AI prototype to impress a demo audience is easy. Getting it to behave reliably in production is another story. In production, you don't control what users ask or what the model answers. That's not a bug, that's the whole point of using LLMs. But it is also what makes evaluation genuinely hard, and what separates a convincing proof of concept from a trustworthy production system.<br><br>This session tackles the core paradox of building with large language models: how do you harness their creativity while maintaining control over their outputs? We will use a RAG-based chatbot as our running example, a real-world case where you have to guarantee output quality without ever controlling what users actually ask, and where linguistic fluency and factual accuracy constantly pull in opposite directions, to show what a complete, reproducible evaluation pipeline actually looks like in practice.<br><br>Along the way, we will cover why traditional metrics fall short, how to use LLMs as judges and where that approach quietly fails, when human evaluation is non-negotiable, and how to set up continuous monitoring to catch drift before your users do.<br><br>You will leave with practical frameworks and a clear methodology to make evaluation a constant driver of development, from the first prototype to the last production release.", "totalFavourites": 186, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-06T11:30:00Z", "to": "2026-10-06T14:30:00Z", "room": "Room 4", "kind": "Deep Dive", "pause": false, "talk": {"id": 7032, "title": "Don’t burn your fingers in the heat of the AI (r)evolution. (And get an OpenClaw).", "speakers": [{"fullName": "Maarten Vandeperre", "company": "Red Hat", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-909df07a-dfbf-40e8-9065-be12fa662faf.jpg"}], "track": {"name": "Agentic Engineering & Tooling"}, "audienceLevel": "BEGINNER", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=zDqS1U5Gnk8", "description": "“You get an OpenClaw, you get an OpenClaw, and you get an OpenClaw.” (And you’ll get an OpenClaw). What sounds like a joke is actually an experiment: can we make agentic AI available at enterprise level, with the security, governance, observability, and platform boundaries needed to make it safe?<br><br>AI demos are easy. Getting them into production is where things usually break: security, data, observability, ownership, governance, and all the boring-but-important platform work. This talk is about the patterns you need to avoid becoming part of the 95% that never make it past the demo stage. And although we use AI as the example, most of these patterns are just as useful for application modernization.<br><br>We will deep dive (with demos!) into the underlying platform patterns: agentic guardrailing, change-data-capture, service mesh, model-as-a-service, sandboxed AI environments, and MLflow with tracing enabled. We asked developers to shift left for years, but maybe it is time to shift right as well: push the right responsibilities back into the platform, where they can be standardized, automated, governed, and reused.<br><br>Let’s embrace AI in an enterprise context.", "totalFavourites": 60, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-06T11:30:00Z", "to": "2026-10-06T14:30:00Z", "room": "Room 5", "kind": "Deep Dive", "pause": false, "talk": {"id": 16439, "title": "AI Security Deep Dive, Securing Agents and AI Applications", "speakers": [{"fullName": "Brian Vermeer", "company": "Snyk", "imageUrl": "https://lh3.googleusercontent.com/a/ACg8ocIVtHtowJv_NiNRnihOsjh4F37Gwk5jjlcoLoxADz1WPzaLlDTS=s96-c"}], "track": {"name": "Security, Trust & Compliance"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=5AaJ3H9fG6M", "description": "AI is transforming how we write software and the applications we build, introducing entirely new security challenges.<br><br>In this session, we’ll explore two critical areas of AI security. First, we’ll look at agentic coding and the risks of AI agents that read untrusted content, execute commands, and interact with your development environment. Next, we’ll examine AI-powered applications, covering threats such as prompt injection, tool abuse, poisoned retrieval, and memory manipulation.<br><br>The focus is on practical defence. You’ll learn proven mitigation strategies, architectural patterns, and the current landscape of AI security tooling, including guardrails, runtime protection, and security testing frameworks. Through live demos and real-world examples, you’ll leave with actionable techniques to build and use AI systems more securely.", "totalFavourites": 297, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-06T11:30:00Z", "to": "2026-10-06T14:30:00Z", "room": "Room 6", "kind": "Deep Dive", "pause": false, "talk": {"id": 19714, "title": "Specialized AI Agents: from concept to production", "speakers": [{"fullName": "David Gageot", "company": "Docker", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-00adb09a-3b25-4aa0-a9c0-c7a771d40845.jpg"}], "track": {"name": "Agentic Engineering & Tooling"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=npSWywhFDHo", "description": "More and more of us use <strong>**Coding Assistants**<\/strong> that excel at <strong>**writing code**<\/strong>.<br><br>They are <strong>**good**<\/strong> and they are <strong>**expensive**<\/strong>!<br><br>For our business needs, we need <strong>**more specialised AI agents**<\/strong> that are as good<br>or ever better, but for a much <strong>**cheaper**<\/strong> price.<br><br>The same underlying models can be used to write<br>more <strong>**specialized, cheaper, more predictable AI agents**<\/strong>.<br><br>We'll start by writing very disposable agents in literally seconds, <strong>**without code**<\/strong>.<br><br>And then we'll demonstrate how to grow such agent into solving a real business case.<br>We'll iterate on the agent, we'll give it tools and then we'll evaluate it and optimize it with <strong>**solid evals**<\/strong>.<br>We'll monitor its costs and see how changing models help or degrade.<br><br>Finally, we'll discover how multiple agents can connect and collaborate in production<br>with <strong>**MCP, ACP and A2A**<\/strong>.<br><br>All of that can be done with almost no code, leveraging [Docker Agent](<u>https://docker.github.io/docker-agent/<\/u>),<br>an open-source project and a real Swiss Army knife for AI agent creation.", "totalFavourites": 87, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-06T11:30:00Z", "to": "2026-10-06T14:30:00Z", "room": "Room 8", "kind": "Deep Dive", "pause": false, "talk": {"id": 31452, "title": "Responsibly Dimming the Lights in the Software Factory", "speakers": [{"fullName": "Victor Rentea", "company": "Freelance", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-51aee41f-0079-4820-98bb-56e70a2e89d3.jpg"}], "track": {"name": "Agentic Engineering & Tooling"}, "audienceLevel": "BEGINNER", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=C10mZ3pCnGo", "description": "The most agentified engineering teams of my clients are all converging towards the same workflow, aiming to optimize the code review step while preventing human cognitive debt and skill erosion. This talk summarizes their practices, teaching actionable steps and milestones to gradually improve the quality of AI-generated code up to a point in which you can safely start decreasing the code review ‘intensity’. Dark Factories are not built ground up - instead, lights are responsibly dimmed, then turned off one by one, area by area, after observing impeccable code produced consistently.<br><br>", "totalFavourites": 508, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-06T11:30:00Z", "to": "2026-10-06T14:30:00Z", "room": "Room 9", "kind": "Deep Dive", "pause": false, "talk": {"id": 8194, "title": "Write Java Code Like a Seasoned Hacker: 2026 Edition", "speakers": [{"fullName": "Soroosh Khodami", "company": "Rabobank", "imageUrl": "https://lh3.googleusercontent.com/a/AAcHTtdOw1DaVsLzC-GyXIj6Db1K0D66F-cMGH5gQp9I0Q=s96-c"}], "track": {"name": "Security, Trust & Compliance"}, "audienceLevel": "ADVANCED", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=Upd5ZqUn1qY", "description": "Ever wondered how you would write code if you were a seasoned hacker?<br>In this hands-on session, you’ll learn how to adopt that mindset to build secure Java applications with confidence in the AI era. Every year, thousands of organizations are breached, and billions of records are exposed. Only in 2024, cyberattacks compromised 1.7 billion individuals, and millions of applications were targeted daily. Through \"live demos\" of real-world attacks and defenses, we’ll cover the essentials every modern Java developer needs in 2026.<br><br><strong>Key takeaways:<\/strong><br><ul><li>A quick look at the OWASP Top 10 (2025) and practical solutions for the newest risks.<\/li><li>How to implement supply chain security strategies to defend against threats like <em>Shai-Hulud<\/em> or <em>Log4Shell<\/em>.<\/li><li>Ways to integrate essential security checks (SAST/SCA) into your CI/CD pipeline for continuous protection.<\/li><li>Practical threat modeling techniques to identify and prioritize risks early in the design phase and later in incident response.<\/li><li>How to set up security monitoring and logging to detect and respond to attacks in production.<\/li><li>Practical strategies to use AI assistants securely in your development workflow.<\/li><li>And finally, why using hardened container images is a simple yet highly effective strategy for runtime security.<\/li><\/ul>", "totalFavourites": 266, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-06T11:30:00Z", "to": "2026-10-06T14:30:00Z", "room": "BOF 1", "kind": "Hands-on Lab", "pause": false, "talk": {"id": 8190, "title": "Technical Workshop on AI-Native Tooling for Java Development", "speakers": [{"fullName": "Juan Antonio Breña 🇪🇸🇪🇺", "company": "IG", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-40c3fd7e-fe96-414c-b6c4-4b52f1bd300a.jpg"}, {"fullName": "Leandro Loureiro", "company": "ING", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-799b0311-08e3-4eb8-b044-06dd89cfd2be.jpg"}], "track": {"name": "Agentic Engineering & Tooling"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "", "description": "<strong># Abstract<\/strong><br><br><strong>**Technical Workshop on AI-Native Tooling for Java Development**<\/strong><br><br>For nearly three decades, enterprise Java software has been built manually by software engineers. In 2023, a new generation of AI-powered tools emerged, and tools like Cursor AI, Claude Code, Codex, and GitHub Copilot are now changing how software is planned, designed, implemented, validated, and operated across the full SDLC.<br><br>This workshop will explain step by step how to use Skills, Agents, Commands, and MCP Servers for real world scenarios. <br><br>The workshop is designed for all levels and covers the following topics in a practical, hands-on way:<br><br>- How the SDLC has evolved with AI-native engineering workflows organized around the Design / Build / Operate model<br>- How to use Commands to automate repeatable actions across planning, implementation, validation, and operations<br>- How to compose reusable Skills across analysis, design, implementation, operations, and regulatory review<br>- How to connect issue-driven planning with OpenSpec, GitHub Issues, and Azure DevOps work items<br>- How to configure and delegate to specialized Agents<br>- How to apply a Zero Trust mindset to agent skills, generated artifacts, and automated workflows<br>- How to use OpenSpec/SpecKit<br>- How to extend agent capabilities with MCP Servers<br>- How to write a solid AGENTS.md<br>- How to write a solid Skill<br>- How to write a solid Agent<br>- How to write a solid Command<br><br>The demos will walk through real examples using Spring Boot, Quarkus, and Micronaut", "totalFavourites": 84, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-06T11:30:00Z", "to": "2026-10-06T14:30:00Z", "room": "BOF 2", "kind": "Hands-on Lab", "pause": false, "talk": {"id": 23520, "title": "Beyond the Chatbox: Ship On-Device AI in Your Browser", "speakers": [{"fullName": "Marcel Bagemihl", "company": "Consid", "imageUrl": "https://lh3.googleusercontent.com/a/ACg8ocJwfd_rXwWABVgw-xZIM9R-ZWdQO4IScSEi6kBSHk18uf7cq76m=s96-c"}, {"fullName": "Stefan Ludwig", "company": "Consid", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-a0d162ff-9f64-416a-a2d5-836f96faa9a7.jpg"}], "track": {"name": "Cloud Native, Data & Infrastructure"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "", "description": "Most AI features look the same: a chat panel bolted onto the side of the app. Chat is the command line of the AI era, powerful but lazy. In this lab, you'll build the alternative with your own hands: real ML models running inside the browser, powering interfaces that see, suggest, and react in real time, with no API key, no round trip, and no user data leaving the device.<br>We start on familiar ground: a Spring Boot + Kotlin service running pose estimation on the JVM with DJL. You'll measure its round-trip latency and write the number down. Then we move the model into the browser with LiteRT.js and WebGPU, step by step: first inference on a static image, then a live camera feed with a real-time skeleton overlay. In the final act, you'll race your browser against your own backend and produce the latency comparison that explains when AI belongs on-device, in the cloud, or nowhere at all.<br>You'll leave with a working project on your laptop, two bonus labs (in-browser semantic search and a camera-driven form that fills itself) to continue on the train home, and a decision framework you can defend in your next architecture discussion. The GDPR argument for inference that never leaves the device comes free with the code.<br>No machine learning background required. If you can build a Spring service and read TypeScript, you're good-to-go.", "totalFavourites": 25, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-06T14:30:00Z", "to": "2026-10-06T14:50:00Z", "room": "Exhibition Hall", "kind": "Coffee Break", "pause": true, "talk": null}, {"from": "2026-10-06T14:50:00Z", "to": "2026-10-06T15:20:00Z", "room": "Room 4", "kind": "Tools-in-Action", "pause": false, "talk": {"id": 19732, "title": "Tap into the NVIDIA Ecosystem from Java with TornadoVM's Hybrid API", "speakers": [{"fullName": "Thanos Stratikopoulos", "company": "Beestream.ai | TornadoVM", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-1eb3708e-af15-4778-a560-15ebbea2b133.jpg"}, {"fullName": "Michalis Papadimitriou", "company": "Neo4j | University of Manchester", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-85f7f25f-5f2c-4526-bed6-489be66ed5e1.jpg"}, {"fullName": "Mary Xekalaki", "company": "beestream.ai | TornadoVM", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-a82d2879-53f1-4330-b9cb-64cc383a1b02.jpg"}], "track": {"name": "Agentic Engineering & Tooling"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=6SPnBmQrYEk", "description": "Java developers have long relied on JNI or manually maintained native bindings to access GPU libraries such as CUDA, cuBLAS, cuFFT, and cuDNN. While these approaches unlock GPU performance, they also introduce complexity, reduce portability, and make Java applications harder to maintain.<br>This Tools in Action session introduces TornadoVM's new <strong>Hybrid API<\/strong>, a new programming model that allows Java developers to seamlessly combine GPU kernels written in Java with direct calls to the NVIDIA software ecosystem. Instead of switching between Java and C++, developers can write high-level Java code while transparently invoking NVIDIA's highly optimized AI and HPC libraries from the same application.<br>Through live coding demonstrations, attendees will learn how to:<br><ul><li>Write GPU kernels directly in Java.<\/li><li>Access CUDA runtime APIs from Java.<\/li><li>Invoke cuBLAS and cuFFT without writing JNI code.<\/li><li>Combine custom GPU kernels with vendor-optimized libraries for maximum performance.<\/li><li>Incrementally accelerate existing Java applications without changing their preferred JDK.<\/li><\/ul>Whether you're building AI applications, scientific simulations, financial analytics, or data-processing pipelines, this session will demonstrate how modern Java can access GPU hardware and NVIDIA libraries without sacrificing developer productivity or leaving the JVM.", "totalFavourites": 52, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-06T14:50:00Z", "to": "2026-10-06T15:20:00Z", "room": "Room 5", "kind": "Tools-in-Action", "pause": false, "talk": {"id": 16418, "title": "Solving Distributed Transactions with the Saga Pattern and Temporal", "speakers": [{"fullName": "Andrei Sulyz", "company": "Skyro", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-10dc359e-517c-4cfb-b859-7d7c9ca845a9.jpg"}], "track": {"name": "Architecture & Modernization"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=c45C2wNSZFc", "description": "<strong>Detailed Description<\/strong><br>Temporal makes it remarkably easy to implement long-running business workflows. But once those workflows span multiple services and require synchronous business decisions, straightforward Saga implementations quickly expose non-obvious problems.<br><br>We'll explore the challenges we encountered while building distributed transactions with Temporal in a real production system. Starting with a classic Saga implementation, we'll examine why it wasn't enough, what problems emerged around synchronous workflows, failures, cancellation and compensation, and how the architecture evolved to address them. We'll also discuss reconciliation, consistency guarantees, and the trade-offs between keeping workflows simple and building resilient distributed systems.<br><br><strong>Key Takeaways<\/strong><br>• Common pitfalls when implementing Saga with Temporal.<br>• Designing reliable synchronous workflows.<br><br><strong>Target Audience<\/strong><br>Backend engineers, software architects, and tech leads building distributed systems or using Temporal for business workflow orchestration.", "totalFavourites": 146, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-06T14:50:00Z", "to": "2026-10-06T15:20:00Z", "room": "Room 6", "kind": "Tools-in-Action", "pause": false, "talk": {"id": 22933, "title": "30 minutes to build your first Vidocq app, the 100% European Sovereign Java stack with zero external dependencies", "speakers": [{"fullName": "Sebastien Blanc", "company": "SCIAM", "imageUrl": "https://lh3.googleusercontent.com/a-/AOh14GghdlsQf-LeH_np8EgyP0zMkqdtdA3aeHvPYsYOag=s96-c"}], "track": {"name": "Java Language & Platform"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=U9pOWsERF6o", "description": "Vidocq, an open source implementation of the Jakarta EE Core Profile and MicroProfile, written in pure Java, with zero external dependencies and validated by 5,650 official TCK tests started as an experiment a few month ago by checking if a coding agent with detailed specs and TCKs could build a complte Java stack from scratch. <br><br>A few month later, here we are, a functional stack with no less than15 independent modules covering the entire Core Profile and MicroProfile ! Join me in this exciting live coding session where I will introduce you to Vidocq by building from scratch a complete application using most of the available modules. <br><br>No slides, just live \"human\" coding and maybe a bit of vibe coding for the 5 last minutes. And the end of the session, my goal is to give you the appetite to try out this stack and helping promoting this exciting European sovereign project !", "totalFavourites": 59, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-06T14:50:00Z", "to": "2026-10-06T15:20:00Z", "room": "Room 8", "kind": "Tools-in-Action", "pause": false, "talk": {"id": 5051, "title": "🧰 Dev Containers: the ultimate toolbox for developers?", "speakers": [{"fullName": "Stéphane Philippart", "company": "OVHcloud", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-9d422934-263f-49b6-a07c-fbc56af630a9.jpg"}], "track": {"name": "Mind the Geek"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=eyJ5LO-Kyuw", "description": "At some point, we’ve all had to (re)install our entire development environment after switching machines.<br>Whether by choice or simply during on-boarding at a new company, a new mission,...<br>We’ve also all spent far to many hours figuring out which tools to install just to submit a PR or MR to an open source project.<br><br>And in many other situations, we quickly find ourselves facing the nightmare of configuring tools and frameworks when all we really want to do is what we love: coding.<br>And let’s not even get started on version updates and inter-dependencies 😅...<br><br>Fortunately, there is a solution to all these problems: dev containers.<br><br>During this tools-in-action session, I invite you to explore them with me.<br>The only thing I allow myself to install on my machine: Docker!<br>Everything else will be handled through configuration so that tools, frameworks, version management, and dependencies become a non-event in your development workflow.<br><br>You’ll leave knowing how to use dev containers and how to build your entire development stack as code.<br>", "totalFavourites": 321, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-06T14:50:00Z", "to": "2026-10-06T15:20:00Z", "room": "Room 9", "kind": "Tools-in-Action", "pause": false, "talk": {"id": 11558, "title": "BootUI, the missing developer console for Spring Boot and Quarkus", "speakers": [{"fullName": "Julien Dubois", "company": "GitHub", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-832ab0d0-7760-423f-a78e-7f767c7e95b8.jpg"}], "track": {"name": "Development Practices"}, "audienceLevel": "BEGINNER", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=NkstzPeo400", "description": "This session will showcase BooUI, the developer console I have built for both Spring Boot and Quarkus. We'll detail how to:<br> <br><ul><li>Understand, analyse and fix your application using the \"live view\", showing what users are doing in real time<\/li><li>Improve the application code and architecture by using the different \"advisors\" panels<\/li><li>Study the application's memory usage and configure it correctly for production<\/li><\/ul><br>This hands-on talk will show you how easy it is to install BootUI on both Spring Boot and Quarkus, so have your app ready when coming and you'll be able to benefit from it straight during the session!", "totalFavourites": 96, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-06T14:50:00Z", "to": "2026-10-06T16:50:00Z", "room": "BOF 1", "kind": "Hands-on Lab", "pause": false, "talk": {"id": 15360, "title": "Analyze and Optimize Your Applications with JFR", "speakers": [{"fullName": "Ana-Maria Mihalceanu", "company": "Oracle", "imageUrl": "https://lh3.googleusercontent.com/a-/AOh14Gj1OS6OpAzuwBKwoUuCi9gxvNPvdmVA7nbW8lg3mg=s96-c"}, {"fullName": "José Paumard", "company": "Oracle", "imageUrl": "https://lh3.googleusercontent.com/a-/AOh14GhsVIUuTR9Onoo-D8UMW5QId2Yw1V_EUvqdWdNQ0RQ=s96-c"}], "track": {"name": "Java Language & Platform"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "", "description": "Understanding how to monitor and optimize Java applications is fundamental to building efficient software.<br>This hands-on lab will introduce you to capturing data to understand your application behavior using JDK Flight Recorder (JFR), managing and analyzing JFR recordings, and creating custom JFR events. We'll also cover how JFR can integrate with Prometheus to correlate application and infrastructure behavior, all aimed at enhancing observability.<br>After this lab, you'll have the confidence to use JFR to monitor, diagnose, and fine-tune your applications.", "totalFavourites": 105, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-06T14:50:00Z", "to": "2026-10-06T16:50:00Z", "room": "BOF 2", "kind": "Hands-on Lab", "pause": false, "talk": {"id": 7036, "title": "Building Production-Ready Agentic Systems with LangChain4j and Quarkus", "speakers": [{"fullName": "Mario Fusco", "company": "IBM", "imageUrl": "https://lh3.googleusercontent.com/a-/AOh14GinuLQCwL67BBgfGsiWRl3mu3Ya0TbDffhYFiXX=s96-c"}, {"fullName": "Georgios Andrianakis", "company": "IBM", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-95904645-1695-4adf-b24c-41926050b4b4.jpg"}, {"fullName": "Kevin Dubois", "company": "IBM", "imageUrl": "https://lh3.googleusercontent.com/a/ACg8ocInnMfs42NN14UEEtFboGAF5baXQdsTFdbDo_ZuR1DADFHUONPEfA=s96-c"}], "track": {"name": "Agentic Engineering & Tooling"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "", "description": "Agentic AI demos are easy. Building agentic systems that are reliable, observable, secure, testable, and ready for production is where the real challenge begins.<br><br>In this hands-on lab, you'll build an enterprise-grade agentic AI application from the ground up using LangChain4j and its Quarkus extension. Along the way, you'll learn how to connect remote tools and agents through emerging interoperability standards such as MCP and A2A. You'll also explore how to encapsulate business capabilities as reusable skills, enforce governance through guardrails, and implement resilience patterns such as fault tolerance, retries, and persistence to ensure reliable execution of long-running agent workflows.<br><br>Finally, we'll cover one of the most overlooked aspects of agentic development: testing. You'll learn practical techniques for validating agent behavior, mocking tools and models, and building automated tests that provide confidence before deployment.<br><br>By the end of the lab, you'll leave with a complete, working agentic application and a set of proven patterns for building AI systems that can move beyond prototypes and into production. Note that this lab will be based on the last part of a 3-sections workshop, but if you lack any prior knowledge you will be also allowed to work on the former 2 parts and proceed at your own pace.", "totalFavourites": 51, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-06T15:20:00Z", "to": "2026-10-06T15:35:00Z", "room": "Exhibition Hall", "kind": "Break", "pause": true, "talk": null}, {"from": "2026-10-06T15:35:00Z", "to": "2026-10-06T16:05:00Z", "room": "Room 4", "kind": "Tools-in-Action", "pause": false, "talk": {"id": 17558, "title": "From Laptop to Lakehouse: Analytical SQL with DuckDB", "speakers": [{"fullName": "Oliver Geisser", "company": "Geisser Consulting", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-49e100ac-5a9a-4e96-9a22-85b2a52b50d4.jpg"}], "track": {"name": "Cloud Native, Data & Infrastructure"}, "audienceLevel": "BEGINNER", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=B5-4mDLrWjM", "description": "<em>TL;DR: DuckDB is a complete analytical SQL engine that runs in-process. No server, no dependencies, one binary, MIT licensed. This session is one duck and a lot of live demos.<\/em><br><br>While the big data warehouses were busy adding pricing tiers, a small open source project from a research group in Amsterdam quietly built one of the fastest analytical engines around. No license fees, no vendor lock-in, no sales call required.<br><br>What makes DuckDB remarkable is how far the same engine scales. It starts as a CLI tool on your laptop, poking at CSV, JSON and Excel files with a friendly SQL dialect and larger-than-memory processing that spills to disk instead of falling over. The same binary embeds into your Java application via JDBC and runs analytics in-process, with no network hop in sight. Point it at S3 and it queries files in place; add DuckLake and it becomes a full lakehouse on open formats. And with the new Quack protocol, ducks are learning to talk to each other, turning DuckDB into a client-server database with multiple writers.<br><br>Expect live demos along that entire scale, from laptop to lakehouse.<br>You will leave with a good sense of what DuckDB can do for you, where its limits are, and why it keeps showing up in so many stacks.<br><br><strong>Who is this for?<\/strong> Developers, architects and data-curious engineers who occasionally need answers from data but would rather not operate a warehouse to get them. SQL basics are enough; no data engineering background required.", "totalFavourites": 54, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-06T15:35:00Z", "to": "2026-10-06T16:05:00Z", "room": "Room 5", "kind": "Tools-in-Action", "pause": false, "talk": {"id": 5519, "title": "The Magic of OpenTelemetry: Rewriting Your App in Production", "speakers": [{"fullName": "Bruce Bujon", "company": "Datadog", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-ddf330d5-d335-49d8-89b6-2d852531100e.jpg"}], "track": {"name": "Java Language & Platform"}, "audienceLevel": "ADVANCED", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=Lf_m5dIjjqw", "description": "OpenTelemetry makes traces, metrics, and logs appear as if by magic, but what actually happens behind the Java agent we routinely add to our applications?<br><br>This talk goes where most developers never look. You’ll see how the OpenTelemetry agent sneaks into your JVM, intercepts class loading, and rewrites your application on the fly. We’ll explore the power of the javaagent mechanism, the Instrumentation API, and the internals of ByteBuddy that allow instrumenting Spring, Servlets, JDBC, or gRPC without changing a single line of your code. Your application is running, but not quite the way you think it is.<br><br>You’ll leave with a clear understanding of the real impact these changes can have in production: latency, allocations, potential conflicts, and behavior modified at runtime, along with practical techniques to diagnose what is really happening under the hood.<br><br>If you’re using OpenTelemetry without really knowing what it’s doing inside your JVM, or if you want to finally understand how an agent can rewrite your application in production, then welcome: this session opens the black box… and reveals the magic.", "totalFavourites": 198, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-06T15:35:00Z", "to": "2026-10-06T16:05:00Z", "room": "Room 6", "kind": "Tools-in-Action", "pause": false, "talk": {"id": 9024, "title": "Beyond assertEquals: Probabilistic Security and Bias Testing for Java LLM Applications", "speakers": [{"fullName": "Iryna Dohndorf", "company": "Karakun", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-ee16aab0-6755-4c6b-8b99-3dd750f954c3.jpg"}], "track": {"name": "Security, Trust & Compliance"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=MmSvjJhZl3A", "description": "The LLM scanners like Augustus and Garak are established tools for security evaluation of LLM-based applications, as they are scanning by running through a fixed sample of adversarial attack data, and evaluating a response. However, LLMs are non-deterministic by design, meaning that each input can generate a different response. It is not only non-determinism, but also the vast linguistic attack surface and the wide variety of threats that demonstrate that traditional Unit testing methods are insufficient. This talk proposes a Java tool for security and safety testing for LLM-based applications using probabilistic testing methods, and security contracts. In contrast to the traditional scanners, Tiberius fits naturally into a standard Java test suite, and integrates with the probabilistic testing tool PUnit to support multi-trial scanning and statistical assertions. Different adversarial probes can be integrated and tested directly in Java code, e.g., application specific adversarial attacks, like prompt injections and jailbreaks. A scan (multi-) run can execute 200+ attack probes against a deployed model and serializes the results into versioned json test-fixtures, which can be used in downstream regression tests. The tool furthermore includes a fingerprinting capability, and detects systemic bias, as even system prompts and guardrails can be biased. The audience will leave knowing Java-native LLM security and safety testing techniques.", "totalFavourites": 68, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-06T15:35:00Z", "to": "2026-10-06T16:05:00Z", "room": "Room 8", "kind": "Tools-in-Action", "pause": false, "talk": {"id": 24234, "title": "AsyncAPI in action: OpenAPI for event-driven applications", "speakers": [{"fullName": "Michel Schudel", "company": "Craftsmen", "imageUrl": "https://lh3.googleusercontent.com/a-/AOh14GgNY5OcMk2ghQnNGYDAQBxLIE4ofeltIbvzAK_s=s96-c"}], "track": {"name": "Architecture & Modernization"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=A_fp7RaG5UY", "description": "Most developers know OpenAPI as the standard for describing and generating code around synchronous APIs like REST, a single spec that produces client code, server stubs, and (Swagger) docs, keeping everything originating from the same spec.<br><br>AsyncAPI brings that spec-first approach to event-driven systems: message brokers, topics, consumers and producers, described in a machine-readable definition that tooling can act on.<br><br>In this tools-in-action session, we'll use AsyncAPI to generate a working Spring Boot producer and consumer for Kafka, including the message DTOs and the API documentation straight from the spec. No hand-written boilerplate. We define the spec, generate both sides of the conversation, and watch a message flow end-to-end between them.<br><br>After this session, you'll have a clear understanding of what AsyncAPI is and how it relates to OpenAPI, how spec-first generation removes hand-written boilerplate and drift between producer, consumer, and docs, and enough hands-on familiarity with the tooling: spec structure, generator templates, to try it on your own event-driven services.", "totalFavourites": 197, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-06T15:35:00Z", "to": "2026-10-06T16:50:00Z", "room": "Room 9", "kind": "Documentary", "pause": false, "talk": {"id": 50101, "title": "The Java Story | The Official Documentary", "speakers": [{"fullName": "Georges Saab", "company": "Oracle", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-e81f731a-26bb-4e81-803c-4252372b3e61.jpg"}], "track": {"name": "Java Language & Platform"}, "audienceLevel": "BEGINNER", "language": null, "youtubeUrl": "", "description": "Java’s story is about much more than the evolution of a programming language. It is the story of a community that, more than once, could have watched something remarkable quietly fade away—but instead chose to fight for it, rebuild it, open it up, and pass it forward.<br><br>From its beginnings at Sun Microsystems to OpenJDK, the JVM ecosystem, and the transition from Java EE to Jakarta EE, this documentary traces 31 years of innovation, disruption, reinvention, and community.<br><br>The story is told by the people who shaped it, including James Gosling, Joshua Bloch, James Duncan Davidson, Tim Lindholm, Kim Polese, Carla Schroer, Sharat Chander, and many others.<br><br>Through their memories and perspectives, we revisit the decisions, breakthroughs, challenges, and communities that turned Java into one of the most influential software platforms ever created.<br><br>Thirty-one years later, Java is still here—not just because of the technology, but because generations of people decided it was worth carrying forward.<br>", "totalFavourites": 99, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-06T16:05:00Z", "to": "2026-10-06T16:20:00Z", "room": "Exhibition Hall", "kind": "Break", "pause": true, "talk": null}, {"from": "2026-10-06T16:20:00Z", "to": "2026-10-06T16:50:00Z", "room": "Room 4", "kind": "Tools-in-Action", "pause": false, "talk": {"id": 4077, "title": "Do We Need a Build Language? Java Builds Java", "speakers": [{"fullName": "Rafael Winterhalter", "company": "Scienta", "imageUrl": "https://lh3.googleusercontent.com/a-/AOh14GgLfkleUmHF-JurY4N1cWJatz7wACWQXFLsRQr1zw=s96-c"}], "track": {"name": "Java Language & Platform"}, "audienceLevel": "BEGINNER", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=y9JjxyKc6gU", "description": "This presentation introduces Jenesis, a proof of concept build tool for Java that explores a new approach to lowering the language's entry barrier. Rather than relying on external installation or non Java configuration, Jenesis can be embedded directly as source code and executed and modified like any other Java program. This enables a more approachable and transparent build experience for both newcomers and seasoned developers. <br><br>A second focus is security. By rethinking how external dependencies are introduced and managed, Jenesis seeks to reduce software supply chain risks while maintaining reproducible builds. The tool also separates build logic from dependency declaration and leverages the Java module system to promote clearer project boundaries and improved maintainability.", "totalFavourites": 48, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-06T16:20:00Z", "to": "2026-10-06T16:50:00Z", "room": "Room 5", "kind": "Tools-in-Action", "pause": false, "talk": {"id": 10021, "title": "Java Script (No, Not That One): Modern Automation with Java", "speakers": [{"fullName": "Loïc Magnette", "company": "Oniryx", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-cda3ea24-0a68-4fe3-a93c-e199a1d8fedf.jpg"}], "track": {"name": "Java Language & Platform"}, "audienceLevel": "BEGINNER", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=pgVJWp-SjxI", "description": "We've all been there: you need a quick automation script, so you reach for Bash or Python and immediately get tripped up by syntax you can never remember. Or you try JavaScript and watch 5 + 3 quietly become \"53\". You want something fast, but you also want type safety and a language you actually know.<br><br>Good news: modern Java has become a real scripting language. Shebang support, single-file execution, and instance main methods mean no boilerplate and no build step—just a file you can run. When you need external libraries, JBang handles dependencies with a single line. And unlike a hastily typed shell script, the compiler still has your back before anything runs.<br><br>Through live demos, we'll go from a throwaway one-liner to genuinely useful scripts, using records and text blocks to keep them short and readable: parsing a CSV and calling an API, or building a self-contained tool your AI harness can invoke, returning typed, predictable output instead of best-effort text. All in Java, and all without a pom.xml in sight. You'll leave with a new tool for the jobs you currently hand off to Bash.", "totalFavourites": 105, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-06T16:20:00Z", "to": "2026-10-06T16:50:00Z", "room": "Room 6", "kind": "Tools-in-Action", "pause": false, "talk": {"id": 21690, "title": "Exquisite Evals for Skills & MCPs", "speakers": [{"fullName": "Christian Tzolov", "company": "Spring Team @ Broadcom", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-970401c2-a699-4f02-8855-f855f219221a.jpg"}, {"fullName": "James Ward", "company": "AWS", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-607b90ef-e5ff-4f70-b91c-a3082787114d.jpg"}], "track": {"name": "Development Practices"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=mebPFAKSpzw", "description": "I built the javadocs.dev MCP server to help Java, Kotlin, and Scala developers give their agents more efficient access to documentation for the libraries they use. But until recently I didn't know if it was better than what base models, or base models with web search/fetch, use. I created a custom eval framework to provide verifiable evidence that the javadocs.dev MCP is up to 5x more token efficient than what the standard agents provide and provides correct answers, unlike the base models. This session will share the learned best practices for building and implementing evals that can provide the feedback you need to improve your agent skills & MCPs.", "totalFavourites": 99, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-06T16:20:00Z", "to": "2026-10-06T16:50:00Z", "room": "Room 8", "kind": "Tools-in-Action", "pause": false, "talk": {"id": 7017, "title": "The Importance of HITL to Avoid Chaos and EU Regulations for AI", "speakers": [{"fullName": "Juan Antonio Breña 🇪🇸🇪🇺", "company": "IG", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-40c3fd7e-fe96-414c-b6c4-4b52f1bd300a.jpg"}], "track": {"name": "Agentic Engineering & Tooling"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=t9e9FtHB-48", "description": "AI coding agents are rapidly becoming first-class citizens in enterprise software workflows. Teams are already delegating consequential decisions to autonomous agents: generating database migrations, refactoring service boundaries, modifying schemas, producing runbooks, and calling external tools. But as agent autonomy grows, a critical question emerges — who is responsible when something goes wrong?<br><br>This talk explores the discipline of Human-in-the-Loop (HITL) design, and how to build AI-assisted workflows that keep humans meaningfully in control without sacrificing the productivity gains that make agents worth adopting in the first place. It also examines the growing body of EU regulation that makes HITL not just a good engineering practice, but a legal requirement for certain classes of systems.<br><br>The session will demonstrate these concepts through a realistic microservices scenario — a Java enterprise platform with AI-assisted delivery — showing how the absence of human oversight leads to cascading failures, and how a well-designed HITL architecture, grounded in both engineering discipline and regulatory awareness, would have prevented them. Attendees will leave with a concrete framework for moving fast with AI agents without losing control of their systems or their compliance posture.", "totalFavourites": 99, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-06T16:50:00Z", "to": "2026-10-06T17:00:00Z", "room": "Exhibition Hall", "kind": "Break", "pause": true, "talk": null}, {"from": "2026-10-06T17:00:00Z", "to": "2026-10-06T18:00:00Z", "room": "BOF 1", "kind": "BOF", "pause": false, "talk": {"id": 10037, "title": "Quarkus Community BOF", "speakers": [{"fullName": "Dimitris Andreadis", "company": "IBM", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-c540ac38-0fdf-40cb-b0fe-8a357abd1f87.jpg"}], "track": {"name": "Java Language & Platform"}, "audienceLevel": "BEGINNER", "language": null, "youtubeUrl": "", "description": "Quarkus keeps growing and evolving while maintaining its focus on an efficient runtime and developer productivity. It offers a vibrant and ever-expanding ecosystem of 800+ publicly available extensions (the Quarkus universe or Quarkiverse), and is maintained by a community of 1000+ contributors. It is also now part of the CommonHaus Foundation, bolstering our commitment to open-source development and inspiring greater community participation.<br><br>Members of the Quarkus core team and extensions contributors will be present at Devoxx, and will be happy to discuss anything around the Quarkus ecosystem.<br><br>Bring your questions, share your challenges, and contribute your ideas to shape the future of Quarkus. Discover how you can become an active part of this vibrant community and take advantage of this unique opportunity to Ask Us Anything. Don’t miss out on being part of the conversation that’s setting the direction for Java’s next big leap, including all the work the Quarkus team has been doing around Agentic AI.<br><br>See you there!", "totalFavourites": 22, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-06T17:00:00Z", "to": "2026-10-06T18:00:00Z", "room": "BOF 2", "kind": "BOF", "pause": false, "talk": {"id": 10046, "title": "Who will build software after AI?", "speakers": [{"fullName": "Eddy Vos", "company": "Devoxx4Kids Netherlands", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-9b520e91-967e-42a4-9061-ff04e1ff6682.jpg"}], "track": {"name": "Mind the Geek"}, "audienceLevel": "BEGINNER", "language": null, "youtubeUrl": "", "description": "Everyone is talking about AI-assisted development, but what does that mean for the next generation?<br>Are we still teaching kids to code? Should we? What skills matter when AI generates code? How do we make technology attractive and accessible to children?<br><br>Join organizers, mentors, teachers, parents, and developers for an open discussion on the future of Devoxx4Kids, coding education, robotics, and growing the next generation of makers.", "totalFavourites": 47, "slidesUrl": "", "teamRating": null}}]}, {" p9tNzQu7c", "description": "<br>The welcome opening keynote for Devoxx Belgium 2026 by the founder of Devoxx giving a general update on the conference.", "totalFavourites": 540, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-07T07:30:00Z", "to": "2026-10-07T09:30:00Z", "room": "Room 9", "kind": "Keynote Overflow", "pause": null, "talk": {"id": 52105, "title": "Keynote overflow room", "speakers": [{"fullName": "Stephan Janssen", "company": "Devoxx", "imageUrl": "https://lh3.googleusercontent.com/a/ALm5wu39iQhWBfIgxSMBGJ-tLuCnWERa6Vp5RRnnq4exBw=s96-c"}], "track": {"name": "Java Language & Platform"}, "audienceLevel": "BEGINNER", "language": null, "youtubeUrl": "", "description": "The keynote overflow room. The keynote overflow room. The keynote overflow room. The keynote overflow room.", "totalFavourites": 44, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-07T07:50:00Z", "to": "2026-10-07T08:10:00Z", "room": "Room 8", "kind": "Keynote", "pause": false, "talk": {"id": 50102, "title": "From Brainless to Brilliant — Giving an Open-Source Robot a Mind of Its Own", "speakers": [{"fullName": "Jan Van Wassenhove", "company": "Sopra Steria", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-e7b52977-dc36-455d-a814-67a86c6644ab.jpg"}], "track": {"name": "Agentic Engineering & Tooling"}, "audienceLevel": "BEGINNER", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=ZDocIlx7Zvg", "description": "It arrives in a box, in pieces, and every part of it is open: hardware, firmware, simulator, SDK. An hour with a screwdriver and there is a robot on your kitchen table. What it does not arrive with is a mind.<br><br>So I bought one, and I wrote it a brain called AURA. No lab, no team, just a laptop and some evenings.<br><br>AURA knows the people in my house and treats each of them differently. What we told it stays separate from what it worked out on its own. Given a task, it opens VS Code, puts Claude Code to work on a real repository, and asks my permission before anything is committed.<br><br>It still gets things wrong. Nothing in the design promises otherwise; what it promises is that nothing sensitive happens without me saying yes.<br><br>The robot is not the point. The point is how little it now takes to build one, and that quietly changes who gets to build anything at all. I would rather show you that than argue it, so there will be demos, and no promises about all of them behaving.<br>", "totalFavourites": 434, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-07T08:10:00Z", "to": "2026-10-07T08:30:00Z", "room": "Room 8", "kind": "Keynote", "pause": false, "talk": {"id": 31455, "title": "Half of a billion Idle GPUs: The Case for On-Device AI", "speakers": [{"fullName": "Prince Canuma", "company": "Neywa Labs", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-05bb053f-e043-41b6-af64-c0fcd522a9b7.jpg"}], "track": {"name": "Agentic Engineering & Tooling"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=qFTuteOEtsE", "description": "The most powerful compute fleet ever assembled wasn't built by a cloud provider. It's the half a billion-plus Apple Silicon devices already in laps, pockets, and offices — each with a GPU, a neural engine, and unified memory that would have qualified as a workstation five years ago. Collectively they represent more silicon than any datacenter on Earth. And for AI, they sit almost entirely idle.<br>This keynote makes the case that the next era of AI won't be defined by bigger clusters, but by inference moving to where the data already lives. I'll tell that story through building the MLX open-source ecosystem (mlx-vlm, mlx-audio, nativ — 5M+ downloads, used by Google DeepMind, Hugging Face, and LM Studio): what it actually takes to make consumer hardware run frontier models, why the server playbook fails on-device, and the hard-won engineering — quantization that holds accuracy, KV-cache compression, speculative decoding across chip generations — that closes the gap.<br>You'll leave with a new mental model for where AI workloads belong: which belong in the cloud, which belong on-device, and why the answer is about to flip for more of them than you think, for reasons of privacy, latency, cost, and sovereignty.<br>For every engineer and leader deciding where their AI features will live.", "totalFavourites": 448, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-07T08:30:00Z", "to": "2026-10-07T08:50:00Z", "room": "Room 8", "kind": "Keynote", "pause": false, "talk": {"id": 48301, "title": "A Fleet of AI Agents, Each in Its Own Sandbox: Inside Docker's Agentic Platform", "speakers": [{"fullName": "Jean-Laurent de Morlhon", "company": "Docker", "imageUrl": "https://lh3.googleusercontent.com/a/ACg8ocKQ_A4jeRTG76_QurrAxTmBkNyMdIVg3FvYjAID2dJ1dKyF76k=s96-c"}], "track": {"name": "Agentic Engineering & Tooling"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=mnoUXIT4nMY", "description": "What if your next pull request was opened by an AI agent, one that read the issue, wrote the code, ran the tests, and only pinged you when it was ready to merge?<br><br>That's how Docker's engineering team ships software today. Built on top of <strong>Docker Cloud Sandboxes<\/strong>, the Docker Agentic Platform gives every AI agent its own isolated environment: real shell access, a live Docker daemon, git, GitHub CLI, and a JWT-scoped identity. Orchestrators spawn specialists, architect, implementer, reviewer ; that work in parallel across sandboxed boundaries, coordinating asynchronously without ever touching each other's secrets or state.<br><br>We'll walk the hard lessons (context cost, hallucinations, knowing when to keep a human in the loop), and what it takes to make autonomous agents safe and observable in production.", "totalFavourites": 486, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-07T08:50:00Z", "to": "2026-10-07T09:10:00Z", "room": "Room 8", "kind": "Keynote", "pause": false, "talk": {"id": 49251, "title": "The Year of the Runtime", "speakers": [{"fullName": "Ron Pressler", "company": "Oracle", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-be6279f3-d001-4451-baa8-03a4ca9af02d.jpg"}], "track": {"name": "Java Language & Platform"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=tle2mA7EwWU", "description": "AI coding agents are changing how we develop software. Existing evidence suggests that, up to a point, they significantly reduce the importance of the linguistic features of programming languages, and are able to write code equally well in most if not all mainstream languages. But a programming language is much more than syntax. An AI agent can't make Python code as fast as Java code, and it can't make Java code run as well as JavaScript in the browser. In a world where syntax is less important, the runtime gains even more prominence, and Java's runtime is a superb target for code written by, or with the assistance of, AI.<br><br>Java's runtime - the JVM and the standard library - has been Java's core strength since Java's inception. Java programs get faster and easier to operate just by upgrading to a newer JDK, thanks to continually improving JIT optimizations, better GCs, better observability, and a better standard library. This is an especially dynamic time for the Java runtime, integrating value classes from Project Valhalla, AOT code compilation from Project Leyden, making compact object headers the default from Project Lilliput, and removing the need to manually set the heap size so that the JVM could automatically optimise the CPU/RAM tradeoff. Each of these involved tremendous change under the hood, but little or no change to the programming model.", "totalFavourites": 460, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-07T09:10:00Z", "to": "2026-10-07T09:30:00Z", "room": "Room 8", "kind": "Keynote", "pause": false, "talk": {"id": 51951, "title": "Agentic Engineering Reconversion", "speakers": [{"fullName": "Victor Rentea", "company": "Freelance", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-51aee41f-0079-4820-98bb-56e70a2e89d3.jpg"}], "track": {"name": "Agentic Engineering & Tooling"}, "audienceLevel": "BEGINNER", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=vAfQ4f8wIVI", "description": "What does a \"software engineer\" do today? How do we balance our personal life with the anxiety about the future, and the burning excitment of the dreams that agents allow us to build today? What's the fastest way to onboard this reconversion and how can one speed it up? This keynote shares lessons from the experience of hundreds of AI-converted developers all over the world, aiming to help you navigate these extra-ordinary times our profession faces today.", "totalFavourites": 563, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-07T09:30:00Z", "to": "2026-10-07T10:00:00Z", "room": "Exhibition Hall", "kind": "Coffee Break", "pause": true, "talk": null}, {"from": "2026-10-07T10:00:00Z", "to": "2026-10-07T10:50:00Z", "room": "Room 3", "kind": "Conference", "pause": false, "talk": {"id": 24233, "title": "Build the Builder: A Java Coding Agent in Your IDE with ACP", "speakers": [{"fullName": "Vadim Briliantov", "company": "JetBrains", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-08d32376-4f7e-4483-800c-cd8ccf513b2f.jpg"}], "track": {"name": "Agentic Engineering & Tooling"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=y4F1XBtQeDw", "description": "Most agent talks stop when the agent can call a tool. This session tackles the harder and more practical question: how do you build a custom, production-minded agent for your organization’s workflows and guardrails and make it a first-class participant inside the developer’s IDE?<br><br>In this live-coded session, we’ll build a coding agent in Java / Kotlin, connect it directly to an IntelliJ-based IDE through the Agent Client Protocol (ACP), and extend it into an orchestrator that can collaborate with external coding agents such as Codex, Claude, and Gemini.<br><br>You’ll learn how to:<br><ol><li><strong>Build your own agent on the JVM<\/strong>, including its reasoning loop, tools, state, and guardrails. Although we’ll create a coding agent, the same techniques apply to chatbots, banking assistants, support agents, and other domain-specific systems.<\/li><li><strong>Connect a custom agent to an IDE through ACP protocol<\/strong>, without creating a dedicated integration for every agent.<\/li><li><strong>Integrate and orchestrate multiple external coding agents through ACP <\/strong>in a coordinated pipeline, assigning each task to the agent best suited to perform it.<\/li><li>Take advantage of the IDE as more than a chat window by <strong>giving agents access to the project context, code understanding, developer-defined skills, and more!<\/strong><\/li><\/ol><br>By the end of the session, you’ll have a practical blueprint for building an agent that understands your development environment, follows your rules, and can coordinate other agents to complete real software-engineering tasks.", "totalFavourites": 399, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-07T10:00:00Z", "to": "2026-10-07T10:50:00Z", "room": "Room 4", "kind": "Conference", "pause": false, "talk": {"id": 7022, "title": "Emergent DevEx: The Good, the Bad, and the Legacy", "speakers": [{"fullName": "Makan Sepehrifar", "company": "Productboard", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-68014c00-8dd0-4467-9ac6-f205258d440d.jpg"}, {"fullName": "Soroosh Khodami", "company": "Rabobank", "imageUrl": "https://lh3.googleusercontent.com/a/AAcHTtdOw1DaVsLzC-GyXIj6Db1K0D66F-cMGH5gQp9I0Q=s96-c"}], "track": {"name": "People, Practices & Career"}, "audienceLevel": "BEGINNER", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=9MPYPejgTGo", "description": "What happens when an organization grows from a few co-founders into 10,000 people?<br><br>In a big organization, the developer experience isn't something you sit down and design. It's the sum of countless small changes, layered year after year. It emerges slowly, pulled in different directions by three forces: <br><ul><li>the dead weight of history, baked into bureaucratic processes and controls; <\/li><li>the endless transformation projects that promise heaven but just swap one mess for another; <\/li><li>and the developers stuck in the middle, bearing the pressure. <\/li><\/ul><p><br>Through real-life scenarios, we'll show how small changes to implementation, not grand top-down strategy, are often what make a developer's life easier.<br><br><strong>Key Takeaways:<\/strong><br><ul><li>How developer experience grows alongside an organization, from a team of 5 to 10,000+.<\/li><li>How history, transformation efforts, and developers themselves each leave their mark.<\/li><li>What internal developer communities can do to shift things and how, even as one developer, you can change the details for the greater good.<\/li><\/ul>", "totalFavourites": 200, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-07T10:00:00Z", "to": "2026-10-07T10:50:00Z", "room": "Room 5", "kind": "Conference", "pause": false, "talk": {"id": 29351, "title": "Structured Concurrency Looms", "speakers": [{"fullName": "Alan Bateman", "company": "Oracle", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-777f0d6e-3ce7-4670-9962-7f3e5f309f46.jpg"}, {"fullName": "Viktor Klang", "company": "Oracle", "imageUrl": "https://lh3.googleusercontent.com/a/AAcHTtdkY-Lks0gsRcvl05pqpW8-GOpvuVndojO99ZxUsSy0rgo=s96-c"}], "track": {"name": "Java Language & Platform"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=aow56RgptLA&pp=0gcJCT8MAYcqIYzv", "description": "Structured Concurrency is the next major feature from Project Loom. Following the introduction of Virtual Threads in JDK 21, which dramatically reduced the effort of writing, maintaining, and observing high-throughput concurrent applications, structured concurrency raises the level of abstraction for concurrent programming. It treats groups of related tasks as a single unit of work, simplifying cancellation, error handling, and observability while making concurrent code easier to understand, maintain, and debug.<br><br>The feature has evolved through several preview releases, shaped by extensive real-world experience and community feedback. Despite its small surface area, the API enables a wide range of structured concurrency patterns.<br><br>In this session, we will explain the motivation and design of structured concurrency, show how to use it effectively, and discuss the lessons learned as the feature evolved. We'll also look beneath the surface at the new lower-level API behind the latest design, offering an early glimpse of work that is expected to form the basis of a future lower-level structured concurrency API.<br><br>", "totalFavourites": 300, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-07T10:00:00Z", "to": "2026-10-07T10:50:00Z", "room": "Room 6", "kind": "Conference", "pause": false, "talk": {"id": 8156, "title": "I Hired a Real Robot as My Junior Dev — and Now My Kids Don't Want to Learn Java Anymore", "speakers": [{"fullName": "Jan Van Wassenhove", "company": "Sopra Steria", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-e7b52977-dc36-455d-a814-67a86c6644ab.jpg"}], "track": {"name": "Mind the Geek"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=P14Fy05Gs38", "description": "For decades we taught software engineering through languages: Java, C#, Python, patterns, frameworks — because writing software was hard. But what if that’s no longer the hard part?<br><br>Take my son. He isn’t learning Java; he’s learning to turn ideas into products. He spins up ideas at the speed of boredom — a study companion app one week, a gaming crosshair overlay the next — shipping from idea to code to demo before the README has found its shoes.<br><br>Meanwhile I hired Reachy Mini, a real open-source desktop robot, as my junior developer. I direct it, it drives agents that code in parallel while I sleep. I’m not really a developer anymore — I’m running an agent factory with a robot foreman on my desk.<br><br>Part stand-up routine, part field report, part uncomfortable question: are we raising the last generation of developers, or the first generation of agentic builders?<br><br>We’ll explore the agentic inner loop: describe intent, provide context, let agents act, review output, tighten the spec, and loop again until something useful ships. My bet: writing software is becoming a commodity — but expertise isn’t. Architecture, systems thinking, integration, taste, validation and knowing what to build only get more valuable. The interface shifts from typing to talking, from directing code to directing agents — and yes, sometimes the robot still needs a stern code review.<br><br>Audience: developers, leads and architects who suspect their job is changing and would rather laugh about it than panic.", "totalFavourites": 306, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-07T10:00:00Z", "to": "2026-10-07T10:50:00Z", "room": "Room 7", "kind": "Conference", "pause": false, "talk": {"id": 24224, "title": "Post-Quantum Today: How Your Passwords Will Be Safe in a Quantum Future", "speakers": [{"fullName": "Julian Burr", "company": "Sonar AI", "imageUrl": "https://lh3.googleusercontent.com/a/ACg8ocLOSngLPQFgOpPGXfZqQbR2eBQyiBQsKODaA7Kz896TbM9pjw=s96-c"}], "track": {"name": "Security, Trust & Compliance"}, "audienceLevel": "ADVANCED", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=yUMnuh5U5k4", "description": "This talk explores:<br>* how classical RSA encryption works<br>* how quantum algorithms (i.e. Shor’s algorithm) break RSA<br>* brief overview of where we are regarding quantum hardware<br>* why PQC still matters right now, to prevent “harvest now, decrypt later” attacks<br>* what lattice-based PQC looks like and how far along we already are in adopting it<br><br>The target audience is everyone generally interested in future technologies. Especially everyone who might have heard about quantum computing and Shor's algorithm breaking encryption, but don't know what that means for the future of cryptography and where we're at today.<br><br>The key take aways are a (very basic) general understanding how quantum computing works, to understand how it has the potential to break RSA, as well as quantum-safe encryption methods that are already being put in place, how they work and what the future might look like.", "totalFavourites": 262, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-07T10:00:00Z", "to": "2026-10-07T10:50:00Z", "room": "Room 8", "kind": "Conference", "pause": false, "talk": {"id": 22923, "title": "Fun with Flags: How OpenFeature Solves Your Feature Flag Headaches", "speakers": [{"fullName": "Simon Schrottner", "company": "Flagsmith", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-6ede322c-0aa6-44f2-a5a3-d4636c24d456.jpg"}], "track": {"name": "Development Practices"}, "audienceLevel": "BEGINNER", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=Ij5RsREpjBg", "description": "Feature flags have revolutionized the software delivery lifecycle, enabling teams to decouple releases from deployments and create a more agile development process. They're often hailed as one of the key practices in modern software development—at least in theory.<br><br>However, as systems grow in complexity, so do the challenges associated with feature flagging. From supporting multiple languages and managing targeted evaluations to avoiding vendor lock-in and safely decommissioning obsolete code, what initially seems like a straightforward problem can quickly become daunting.<br><br>The OpenFeature community is tackling these challenges head-on by providing vendor-agnostic SDKs and a suite of powerful tools designed to simplify the feature flagging experience. Join me as we explore the common pitfalls of feature flagging and discover how OpenFeature can help bring the fun back into this critical aspect of software development.", "totalFavourites": 284, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-07T10:00:00Z", "to": "2026-10-07T10:50:00Z", "room": "Room 9", "kind": "Conference", "pause": false, "talk": {"id": 21691, "title": "MCP 2.0 - Stateless, New Auth (CIMD), and Exciting Extensions", "speakers": [{"fullName": "James Ward", "company": "AWS", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-607b90ef-e5ff-4f70-b91c-a3082787114d.jpg"}], "track": {"name": "Agentic Engineering & Tooling"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=fShgG3jtkXQ", "description": "The MCP Spec & Implementations have quickly evolved since initial release almost 2 years ago. This session covers what has changed and how it impacts MCP server developers. You will learn about the new stateless transport, new auth (CIMD), and the extensions including MCP Apps, Tasks, and Skills over MCP. You learn from code examples and demos how you can build MCP servers that utilize the latest MCP features & approaches.", "totalFavourites": 351, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-07T10:00:00Z", "to": "2026-10-07T10:50:00Z", "room": "Room 10", "kind": "Conference", "pause": false, "talk": {"id": 7040, "title": "Wrap, Reshape, or Redesign: Retrofitting Your APIs for a World of Agents", "speakers": [{"fullName": "Horacio Gonzalez", "company": "Clever Cloud", "imageUrl": "https://lh3.googleusercontent.com/a-/AOh14GgnPwnK39sExPDAN6yNucN0bQWpR_rhZT-VkdLFC10=s96-c"}], "track": {"name": "Architecture & Modernization"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=ymLlOAB8h_c", "description": "Most APIs we use today were designed for human developers. That worked because humans compensate: they read docs, infer conventions, recognize dangerous operations, and fill in what the interface never made explicit.<br><br>Now those same APIs have a second consumer: LLM-based agents, copilots, and agentic workflows. This new consumer does not compensate reliably. It takes descriptions literally, chooses wrong actions confidently, and cannot infer the operational boundaries your API never stated.<br><br>The naive response is to wrap existing APIs with tool descriptions and call it done. In practice, some capabilities can be wrapped as-is, some must be reshaped into narrower intent-level tools, and some expose deeper design flaws that need real redesign.<br><br>In this talk, I’ll share a practical framework for retrofitting existing APIs and platform capabilities for agent consumption, based on real platform examples. We’ll look at concrete before-and-after cases, discuss the tradeoffs of each strategy, and see why designing for agents often improves the platform for humans too.<br>", "totalFavourites": 254, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-07T10:00:00Z", "to": "2026-10-07T10:50:00Z", "room": "BOF 1", "kind": "Speaker Room", "pause": true, "talk": null}, {"from": "2026-10-07T10:50:00Z", "to": "2026-10-07T12:00:00Z", "room": "Exhibition Hall", "kind": "Lunch", "pause": true, "talk": null}, {"from": "2026-10-07T11:05:00Z", "to": "2026-10-07T11:45:00Z", "room": "Room 3", "kind": "Lunch Talk", "pause": false, "talk": {"id": 49254, "title": "Mission Possible: The 45-Minute Path to Bullet-Proof Java Container Images", "speakers": [{"fullName": "Pasha Finkelshtein", "company": "Bellsoft", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-a2b5ea87-cb3b-4cf7-ba56-5d667977ed3b.jpg"}], "track": {"name": "Java Language & Platform"}, "audienceLevel": "BEGINNER", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=1yndLHw9mbo", "description": "Your mission is to turn a bloated CVE-infested container image into a low-noise image with low vulnerability exposure and clear operational posture. You have 45 minutes before the explosive attack hits. Mission possible! This session provides a straight path towards building more secure and maintainable Java container images. We will identify the key culprits such as stale dependencies, outdated base, lack of provenance, and excessive privileges. Then, we will draft a step-by-step plan to:<br><ul><li>Pick a minimal and well-maintained base image,<\/li><li>Shrink privileges,<\/li><li>Prove provenance with version pinning, signatures and SBOMs,<\/li><li>Scan and classify with CVSS rules to cut noise and fix what’s exploitable,<\/li><li>Automatically monitor for updates with Dependabot/Renovate.<\/li><\/ul><br>Expect a before/after scan comparison, copy-and-paste Dockerfile instructions, verification checklist, and a clear and reproducible path towards hardened Java container images that provide an impenetrable lock-box for your applications.<br><br>", "totalFavourites": 203, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-07T11:05:00Z", "to": "2026-10-07T11:45:00Z", "room": "Room 4", "kind": "Lunch Talk", "pause": false, "talk": {"id": 10038, "title": "Eval Driven Development: Why you need it to make your Agentic Application survive Production", "speakers": [{"fullName": "Urs Peter", "company": "Xebia", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-3c2d9321-8b4a-418a-8a95-5788a1e66ccf.jpg"}], "track": {"name": "Agentic Engineering & Tooling"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=4qeUklTLyTs", "description": "Agentic systems unlock capabilities that traditional “deterministic” applications simply can’t deliver. But there’s a catch: their probabilistic nature introduces real and often unexpected risks—hallucinations, context drift, prompt degradation, and multi-step workflows that evolve in surprising ways. And you definitely don’t want to discover those in production.<br><br>The good news: there is a remedy. We can borrow the most reliable practice from deterministic software—test-driven development—and adapt it to the agentic world. The result is Eval-Driven Development (EDD): a systematic, engineering-first approach to bringing reliability into inherently probabilistic systems.<br><br>In this talk, we explore Eval-Driven Agentic Development and how it can transform your agents from unpredictable to reliable - using the (only?) full-fledged Java/Kotlin Eval framework: Dokimos. We’ll dive into techniques, tools, and patterns needed to make evals a first-class citizen of your development process—demonstrating all of these in a real-world application built with AI frameworks like Spring-AI, LanchChain4J, and Koog.<br><br>Along the way, you will learn how to:<br><ul><li>Design layered eval suites<\/li><li>Create golden datasets<\/li><li>Define rubrics and scoring criteria<\/li><li>Extract eval signals from agent traces<\/li><li>Use regression gates to detect degraded behavior after changes<\/li><li>Build a continuous eval loop<\/li><\/ul><br>Evaluation-Driven Development is the only path forward for reliable, smart next-generation applications. Let's learn how to walk it - together!", "totalFavourites": 263, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-07T11:05:00Z", "to": "2026-10-07T11:45:00Z", "room": "Room 5", "kind": "Lunch Talk", "pause": false, "talk": {"id": 50106, "title": "From User Prompt to JPA Query: Comparing Tool Calling, Structured Output & Hybrid Approach", "speakers": [{"fullName": "Sebastian Kühnau", "company": "Vaadin", "imageUrl": "https://lh3.googleusercontent.com/a/ACg8ocKJ7pHA4yXXBTPT1sa3oGVZ-ONpi-AtRLBtJIKuxKb5_sQOwm0=s96-c"}], "track": {"name": "Agentic Engineering & Tooling"}, "audienceLevel": "BEGINNER", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=-2vEfnB2mRw", "description": "With Java, data can be loaded easily from different sources and displayed in a web UI with little effort. However, as soon as users need to search for specific records, applications often rely on complex filter forms. Modern LLMs offer an alternative: they can extract filter criteria from natural language and turn them into suitable database queries.<br><br>Using an example project built with Spring AI and Vaadin, we compare three possible approaches. With Function Calling, the model invokes tool functions in the application code and passes the required parameters. This is easy to understand, but in a simple implementation it quickly reaches its limits when handling complex requests involving negations, operators, or multiple values. Structured Output, on the other hand, directly creates a custom filter object and can represent more complex requests in a compact form. A hybrid approach combines both concepts by using a tool call whose parameters themselves contain a structured filter definition.<br><br>All approaches are tested with the same queries against local Ollama models. We compare which approach is more reliable, faster, and more cost-efficient, and examine where each of them reaches its limits.", "totalFavourites": 76, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-07T11:05:00Z", "to": "2026-10-07T11:45:00Z", "room": "Room 6", "kind": "Lunch Talk", "pause": false, "talk": {"id": 49253, "title": "Engineering for the Long Haul: Operating Open Source at Scale", "speakers": [{"fullName": "Sven Sellen", "company": "TuxCare Inc.", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-4ae1c500-52d8-4173-ad59-1ade63a5a175.jpg"}], "track": {"name": "Development Practices"}, "audienceLevel": "BEGINNER", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=Pg5kS8l9CpI", "description": "Open-source software powers the world’s most innovative enterprises, but keeping it secure, compliant, and reliable over the long haul is where complexity (and unexpected risk) quietly creeps in. This presentation offers a guided tour through the challenges organizations face when working with open-source technologies that often have short lifecycles and require regular upgrades. Think of it as a practical playbook for extending the useful life of open-source software – keeping systems secure, audits calm, and engineers focused on building what’s next, not fighting what’s old. You will learn how TuxCare solutions, from rebootless patching and end-of-life security updates to noise-free vulnerability scanning and enterprise support for community operating systems, help enterprises run open-source software with confidence – even when the calendar, the threat landscape, or upstream support say otherwise", "totalFavourites": 37, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-07T11:05:00Z", "to": "2026-10-07T11:45:00Z", "room": "Room 7", "kind": "Lunch Talk", "pause": false, "talk": {"id": 25657, "title": "Safety, speed, and governance in the agentic era", "speakers": [{"fullName": "Oleg Šelajev", "company": "Docker", "imageUrl": "https://lh3.googleusercontent.com/a-/AOh14GirxluLvkptnsT5MxbBaxmupiXXUBlJRLyGooNrEZc=s96-c"}], "track": {"name": "Agentic Engineering & Tooling"}, "audienceLevel": "BEGINNER", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=N3VyoNNLDqQ", "description": "Letting an AI agent loose for solving development tasks is a productivity dream, until it decides to optimize your home directory, brick your system, or exfiltrate your private API keys. We
