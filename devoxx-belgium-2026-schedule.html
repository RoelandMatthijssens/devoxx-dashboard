rence", "pause": false, "talk": {"id": 25042, "title": "Owning the Code You Didn't Type", "speakers": [{"fullName": "Renato Guerra Cavalcanti", "company": "Octo Cogito", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-c563b2ce-c0f7-426b-8f1f-81169b8efe6b.jpg"}], "track": {"name": "Development Practices"}, "audienceLevel": "BEGINNER", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=SQUrHzMie3o", "description": "For most of our careers, the scarce thing was producing code. That world is ending. An assistant now produces competent code faster than any of us can read it, and the bottleneck has moved from writing to understanding.<br><br>Nothing moved on the responsibility side, though. We are still accountable for every line we merge, no matter who or what typed it. Staying in the loop, knowing the system, owning the design, that is the job description now.<br><br>This talk is not a manifesto, it is a set of recipes. The practices I use daily to stay in control of code that arrives faster than I could write it:<br><br><ol><li><strong>Phased delivery<\/strong> - Large tasks are split into small phases with a review gate after each one. No big-bang diffs.<\/li><li><strong>Walk-throughs<\/strong> - The assistant guides me through a change step by step, in reading order, instead of leaving me alone with a raw diff.<\/li><li><strong>Made for humans <\/strong>- Correct is not the bar, understandable is. Design and readability are acceptance criteria, and I send back what does not meet them.<\/li><li><strong>Engineering depth <\/strong>- Know your stuff. The deeper you understand your system, the harder it is to be fooled by a confident, plausible answer.<\/li><li><strong>Files and comments <\/strong>- Sessions produce files and in-code comments instead of long chat threads. Easy to navigate, easy to annotate for the assistant.<\/li><\/ol><br>Together these form a flow that keeps me in control and grows my knowledge instead of eroding it. You will leave with techniques you can apply the next day, whatever assistant you use.", "totalFavourites": 374, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-08T14:30:00Z", "to": "2026-10-08T15:20:00Z", "room": "Room 6", "kind": "Conference", "pause": false, "talk": {"id": 23539, "title": "Everyday JSON", "speakers": [{"fullName": "Viktor Klang", "company": "Oracle", "imageUrl": "https://lh3.googleusercontent.com/a/AAcHTtdkY-Lks0gsRcvl05pqpW8-GOpvuVndojO99ZxUsSy0rgo=s96-c"}, {"fullName": "Alan Bateman", "company": "Oracle", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-777f0d6e-3ce7-4670-9962-7f3e5f309f46.jpg"}], "track": {"name": "Java Language & Platform"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=5y_82lCevHg", "description": "JSON is ubiquitous in modern software, and many use cases are just too small to justify adding external dependencies.<br><br>To address these everyday use cases, a new JEP proposes a simple, incubating API for parsing, navigating, and generating JSON documents-both for Java developers and for the JDK itself.<br><br>While the Java ecosystem offers many libraries with JSON-processing capabilities, this built-in API is not intended to replace them, but rather to offer a low-friction option when an external library would be unnecessary or impractical.<br><br>In this talk, we will show how Data-Oriented Programming helps simplify the API, discuss its intended use cases, outline the design trade-offs, and demonstrate its capabilities.", "totalFavourites": 230, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-08T14:30:00Z", "to": "2026-10-08T15:20:00Z", "room": "Room 7", "kind": "Conference", "pause": false, "talk": {"id": 19708, "title": "Choose your own adventure in agentic design patterns", "speakers": [{"fullName": "Guillaume Laforge", "company": "Google", "imageUrl": "https://lh3.googleusercontent.com/a-/AFdZucoQ5lU7oZBBSXSkv4PJE8-JzMxuHatM3ouR8sOOnl8=s96-c"}], "track": {"name": "Agentic Engineering & Tooling"}, "audienceLevel": "ADVANCED", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=w2RTFWet_6c", "description": "Time to dive a little deeper, beyond the usual AI agent intros. When building your <strong>multi-agent systems<\/strong>, you’ll often be combining basic bricks like sequential, parallel, or loop flows. With those components, you create more complex patterns, like reflection loops, and reviewer/critique agents. <br><br>However the path to <em>\"AI-nlightment\"<\/em> might require you to make choices with the routing pattern, or to shepherd a swarm of agents to collaborate together. We'll talk about different approach to <strong>planning<\/strong> (from programmatic to <strong>goal oriented<\/strong>).We'll uncover the concept of <strong>progressive disclosure<\/strong> used in skills. We'll see that AI agents can improve baselines with the <strong>LLM-as-Judge<\/strong> pattern. And we'll finish with discussing <strong>agent loop<\/strong> approaches.<br><br>As a committer on both <strong>LangChain4j<\/strong> and <strong>ADK for Java<\/strong> (Agent Development Kit), it’ll be my pleasure to guide you through this agentic adventure, and help you make the right choices and use the right abstractions on your journey.", "totalFavourites": 310, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-08T14:30:00Z", "to": "2026-10-08T15:20:00Z", "room": "Room 8", "kind": "Conference", "pause": false, "talk": {"id": 49256, "title": "ADRs: The Why and How", "speakers": [{"fullName": "Venkat Subramaniam", "company": null, "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-83e2efa2-69c8-4599-8ec1-5ec974dd3673.jpg"}], "track": {"name": "Development Practices"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=wzN6qq08w0U", "description": "Decisions, decisions, decision, that is our life every day. But, what is worse than making a bad decision is not remembering why we made a decision, good or bad. Architectural Decision Records are highly important to document the decisions we make, to support the decisions, to bring in necessary and sufficient reasons, and to reevaluate decisions when the business requirements and/or the technologies change. In this presentation we will look at ADRs, how to create them, how to maintain them, and the values they provide.", "totalFavourites": 677, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-08T14:30:00Z", "to": "2026-10-08T15:20:00Z", "room": "Room 9", "kind": "Conference", "pause": false, "talk": {"id": 12751, "title": "Microservices Without the Distributed Mess", "speakers": [{"fullName": "Steven Hillaert", "company": "Sofico", "imageUrl": "https://lh3.googleusercontent.com/a/ACg8ocLs6Pu2B0uwDjIEHZbyZ-3DhqPhAT0bCQ8bP_sS8NWxNkEbRpKQfQ=s96-c"}], "track": {"name": "Architecture & Modernization"}, "audienceLevel": "ADVANCED", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=eFSEg54mwVU", "description": "Microservices are hard, that's probably the only thing we all agree on when it comes to microservices.<br><br>The promise of autonomy, scalability, and independent delivery often deliver something completely different: distributed spaghetti or lasagna. Where we have these blobs spread over the network, with synchronous call chains, unclear ownership, fragile transactions, and teams arguing where the “real” business logic should live.<br><br>This session looks at microservices from a pragmatic architecture perspective rooted in real experience. Not as a hype (anti-)pattern, but as a set of trade-offs around boundaries, ownership, communication, and consistency. <br><br>We will explore how Domain-Driven Design can help define service boundaries, but also where DDD terminology gets misused. What is a bounded context? How large should a service be? Can one microservice contain multiple APIs? When does orchestration make sense? Should we layer services?<br><br>The goal of this talk is not to sell microservices or dismiss them. The goal is to give developers and architects better mental models for designing services that are cohesive, autonomous, and understandable.<br><br>Attendees will leave with practical heuristics for spotting bad service boundaries, avoiding accidental distributed monoliths, and choosing communication patterns that fit the business problem instead of the architecture diagram.", "totalFavourites": 237, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-08T14:30:00Z", "to": "2026-10-08T15:20:00Z", "room": "Room 10", "kind": "Conference", "pause": false, "talk": {"id": 25661, "title": "Introducing Agent Control Theory: The System Runs the Model", "speakers": [{"fullName": "Mark Pollack", "company": "Tuvium", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-66cdea20-f3d9-49aa-8899-6579e673b1c3.jpg"}], "track": {"name": "Agentic Engineering & Tooling"}, "audienceLevel": "BEGINNER", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=KwQ76IvU59M", "description": "Hand two teams the same model and you get wildly different agents. That gap, the system around the model, is where the questions for enterprise software development live: Is it working? How would I know? Can I make it cheaper? Am I locked into one vendor? A better model alone answers none of them.<br><br>AI gives software development unprecedented velocity, but the challenge is doing the right thing faster. This talk introduces Agent Control Theory (ACT), adapting ideas from classical feedback-control theory to the systems around coding agents. The key elements of ACT are to define success, record what happened, evaluate the evidence, diagnose the result, and choose what to change.<br><br>ACT brings measurement to both behavior and results. State transitions and activity patterns reveal how a run unfolds; repeated experiments test whether an intervention improves quality, reliability, or cost. A simple performance index divides the cost of all attempts, successful or unsuccessful, by the number of verified acceptable results. Taken together, these measurements guide what to try next and help assess whether the change was worthwhile.<br><br>Through Java examples, we explore how evidence, evaluation, and repeatable experiments keep us in control, with workflows providing structure for execution.", "totalFavourites": 80, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-08T14:30:00Z", "to": "2026-10-08T15:20:00Z", "room": "BOF 2", "kind": "Speaker Room", "pause": true, "talk": null}, {"from": "2026-10-08T15:20:00Z", "to": "2026-10-08T15:40:00Z", "room": "Exhibition Hall", "kind": "Break", "pause": true, "talk": null}, {"from": "2026-10-08T15:40:00Z", "to": "2026-10-08T16:30:00Z", "room": "Room 3", "kind": "Conference", "pause": false, "talk": {"id": 51601, "title": "Production-Ready Java Containers: Smaller, Faster, Smarter", "speakers": [{"fullName": "Albert Attard", "company": "Oracle", "imageUrl": "https://lh3.googleusercontent.com/a/ACg8ocIR6CijGz4-NnZIdCoCaJA7iBZLFOc6f-jPY4Og8crbEeTpx23_jQ=s96-c"}], "track": {"name": "Java Language & Platform"}, "audienceLevel": "BEGINNER", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=LPhGSgO5eKE", "description": "Java runs exceptionally well in containers, but simply putting a JAR into a container image leaves a lot of optimization opportunities on the table.<br><br>In this session, we’ll explore practical techniques for building leaner and more efficient Java containers. We’ll look at using jlink to create tailored Java runtimes, techniques such as CDS and AOT to improve startup and warmup, JVM container awareness and memory configuration, and container-building practices that reduce image size and improve deployment.<br><br>But smaller isn’t always better. Every optimization comes with trade-offs involving startup time, memory consumption, throughput, observability, security, and maintainability.<br><br>Using a Java application as our starting point, we’ll progressively optimize its container and measure what actually changes. The goal is not to produce the smallest possible image, but to understand the tools available and make informed engineering decisions about what a better Java container means for your workload.", "totalFavourites": 188, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-08T15:40:00Z", "to": "2026-10-08T16:30:00Z", "room": "Room 4", "kind": "Conference", "pause": false, "talk": {"id": 9029, "title": "From a startup stack to 5 microseconds: inside a crypto trading engine", "speakers": [{"fullName": "Oleg Lobanov", "company": "Bitvavo", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-cbda3b84-b3f9-4e69-9a55-69096722a354.jpg"}], "track": {"name": "Architecture & Modernization"}, "audienceLevel": "ADVANCED", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=vcL6eCAwLwY", "description": "What does it take to rebuild the core of a crypto exchange while it is already operating 24/7?<br><br>In 2018, Bitvavo's exchange ran on a familiar startup stack: Node.js, Go, Redis, MySQL, and Kafka. It helped the company move fast and grow, but as trading volume increased, the same architecture began to show its limits. Latency became harder to predict, shared infrastructure became a bottleneck, and proving correct order processing became just as important as making it fast.<br><br>This talk is the story of how we rebuilt the exchange core into a deterministic, replayable, low-latency trading platform. We moved away from database-centered processing and redesigned the system around an ordered log, a replicated state machine, Raft consensus, and a reliable UDP transport.<br><br>I'll share the engineering trade-offs behind that migration: where determinism helps, where it hurts, what changes when state lives in memory, and how far you can push the JVM when garbage collection, networking, and operating-system noise are all part of the latency budget.<br><br>The result is a production system with sub-millisecond end-to-end latency, around 5 microseconds of internal processing time, and capacity for 100,000 orders per second. But the real story is not just the numbers — it is what we had to unlearn, redesign, and operationalize to make a financial system both fast and correct.<br>", "totalFavourites": 141, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-08T15:40:00Z", "to": "2026-10-08T16:30:00Z", "room": "Room 5", "kind": "Conference", "pause": false, "talk": {"id": 4090, "title": "Help! I hate my team mate!", "speakers": [{"fullName": "Jessica Siewert", "company": "Het ConsultancyHuis", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-e589f7fe-c186-49f3-adc0-9c3917209720.jpg"}], "track": {"name": "People, Practices & Career"}, "audienceLevel": "BEGINNER", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=sWP9osLV45I", "description": "Everybody now and then comes into a new team, or someone else comes into theirs. More often than not, cooperation does not go seamlessly straight away. Sometimes this evens out by itself along the way. But in many occasions, it does not. Ways of working could be different. Something one values a lot, may not be valued at all by another, creating conflict. One may criticise or get criticised and things get uncomfortable. Teams may split into \"camps\" or one person just never agrees with the others. Team members may feel stepped over, pushed aside or misunderstood. If this goes on for too long, team members start to feel generally disrespected and demotivated. Then there are cases one member feels another is not qualified, or just a bully. This goes beyond forming and storming, this becomes a (team-wide) problem. In this talk you will see you are not the only one experiencing these challenges. You will hear experiences on solving these kind of cases (or not!), get an idea of how others deal with it and what your options are if you ever find yourself in the weeds (again). In any case, you probably will be surprised by yourself or your team mate in one way or another...", "totalFavourites": 327, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-08T15:40:00Z", "to": "2026-10-08T16:30:00Z", "room": "Room 6", "kind": "Conference", "pause": false, "talk": {"id": 9017, "title": "AI in the Dark: Running LLMs in Air-Gapped Production Environments", "speakers": [{"fullName": "Mihaela Gheorghe-Roman", "company": "Systematic", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-c0e31945-3009-41b0-897c-e49880577f2a.jpg"}], "track": {"name": "Agentic Engineering & Tooling"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=kaT6UpLrzhU", "description": "Building an AI agent is easy. Building one you'd trust in production is harder. Building one that runs with no internet access, no cloud APIs, and no external services: that's a different problem entirely.<br><br>This talk follows a real journey: taking an AI-driven service from demo to production in an air-gapped defence environment where OpenAI, Azure and others are simply not an option.<br><br>The cloud disappearing changes everything: local LLMs under real performance constraints, tool-calling without external infrastructure, hallucination you can't fix by swapping an API, and human oversight in a system that talks to nothing outside its own network.<br><br>This is a production story from an environment where \"it works on my machine\" was never good enough and that's because the machine is isolated, locked down, and the usual shortcuts don't exist.", "totalFavourites": 130, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-08T15:40:00Z", "to": "2026-10-08T16:30:00Z", "room": "Room 7", "kind": "Conference", "pause": false, "talk": {"id": 22946, "title": "Decoding the Cosmos: Voyager's 1970s Algorithms Meet Today's Cutting-Edge Tech", "speakers": [{"fullName": "Pieter van der Meer", "company": "Dataworkz", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-7d190057-cbb1-4e91-bd32-8b10e9e50a71.jpg"}], "track": {"name": "Mind the Geek"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=CuvV3Aud3Q0", "description": "In the early 1970s, the world was grooving to disco, slide rules were essential tools for engineers, and pocket calculators were considered groundbreaking technology. During this era, NASA engineers achieved something extraordinary—they built Voyager’s data systems with incredible foresight, creating technology that could transmit signals across billions of miles and survive the noise of deep space.<br><br>Fast-forward to today, and we’re still decoding these signals. In this talk, we’ll explore how Voyager’s 1970s-era coding genius—developed without modern computing tools—collides with today’s technological breakthroughs. We’ll examine the Viterbi algorithm, a contemporary marvel from the same era, and compare it with the exciting potential of machine learning, a cutting-edge approach that could transform how we process interstellar data.<br><br>This isn’t just a history lesson—it’s an exciting adventure in algorithms and innovation. Expect examples of the science and demonstrations of real encoding and decoding methods using hardcore coding and modern machine-learning counterparts. Whether you’re a developer, a data scientist, or a space tech enthusiast, you’ll walk away with fresh insights, some serious “wow” moments, and a new appreciation for the intersection of vintage tech and next-gen innovation.", "totalFavourites": 192, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-08T15:40:00Z", "to": "2026-10-08T16:30:00Z", "room": "Room 8", "kind": "Conference", "pause": false, "talk": {"id": 14459, "title": "Bootiful Security", "speakers": [{"fullName": "Daniel Garnier-Moiroux", "company": "Spring", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-3e998da2-a249-46ae-baa9-dd880478c765.jpg"}, {"fullName": "Josh Long", "company": "the Spring team", "imageUrl": "https://lh3.googleusercontent.com/a-/AOh14GhTAlrBfIHBoWpP1mfcKm-kRON4bdBF_LccGehD=s96-c"}], "track": {"name": "Security, Trust & Compliance"}, "audienceLevel": "BEGINNER", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=W-OKVLMtPAw", "description": "Are you tired of juggling dozens of passwords? In 2022 alone, hackers exposed over 24 billion passwords, compromising personal identities, finances, and more. But what if there was a better way? Enter Passkeys. This cutting-edge solution not only offers robust multi-factor authentication but is now paving the way to replace passwords altogether. Join Daniel Garnier Moiroux and Josh Long as they unveil the power of Passkeys. Witness firsthand how the new Spring Security 7 can revolutionize your systems and services, making them more secure and easier to use. Say goodbye to password fatigue and hello to a secure, seamless login experience. Are you ready to embrace the future of authentication? <br>", "totalFavourites": 370, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-08T15:40:00Z", "to": "2026-10-08T16:30:00Z", "room": "Room 9", "kind": "Conference", "pause": false, "talk": {"id": 7035, "title": "Their API Went Down. So Why Is My App on Fire?", "speakers": [{"fullName": "Ines Panker", "company": "", "imageUrl": "https://lh3.googleusercontent.com/a/ACg8ocLNlh1gNsJdiz5UPDhCOOocXcWj-XVOiZXd2CjmRtRWKVVQSzQ=s96-c"}], "track": {"name": "Development Practices"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=PGpKfdXZrpc", "description": "You call APIs you don't control... and sooner or later they will have an outage. Will your app survive their outage? Or will they drag you down with them?<br><br>The first step in guarding against remote outages is to wrap calls in try-except statements. As long as we catch the error and log a message, we call our guardrails done. But just \"not crashing\" is a very low bar, and underneath it something worse can still be happening.<br><br>Imagine you are calling GitHub and their API goes down. You have 500 background tasks that all fires a request to GitHub, wait for the socket to time out, fail, get rescheduled, and try again. Now your workers are all sitting on dead sockets doing nothing, and no other task can get a free worker. Congratulations: someone else's outage is now your outage.<br><br>This talk is about better strategies for fighting unreliable remote APIs. I won't present any heroic distributed-systems wizardry, just a handful of boring but battle-tested patterns that stop other people's failures from amplifying into yours. <br><br>How to actually honor a rate limit without rewriting your codebase (cache the 429, let Redis' TTL be the waiting period). How to resume a 5,000-record sync from page 47 instead of starting from page 1. How a circuit breaker turns \"good manners for the other<br>company\" into plain self-defense for yours. <br><br>It's all real code pulled from a multi-tenant production system. We can't make other people's APIs reliable. We can only stop their bad day from becoming ours.<br>", "totalFavourites": 153, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-08T15:40:00Z", "to": "2026-10-08T16:30:00Z", "room": "Room 10", "kind": "Conference", "pause": false, "talk": null}, {"from": "2026-10-08T15:40:00Z", "to": "2026-10-08T16:30:00Z", "room": "BOF 2", "kind": "Speaker Room", "pause": true, "talk": null}, {"from": "2026-10-08T16:30:00Z", "to": "2026-10-08T16:50:00Z", "room": "Exhibition Hall", "kind": "Break", "pause": true, "talk": null}, {"from": "2026-10-08T16:50:00Z", "to": "2026-10-08T17:50:00Z", "room": "BOF 1", "kind": "BOF", "pause": false, "talk": {"id": 10043, "title": "What Does it Print? The Java Quiz (Hard Edition 🤯)", "speakers": [{"fullName": "Clément de Tastes", "company": "SCIAM", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-0a33a77f-9982-4862-8714-ad3c32701c94.jpg"}], "track": {"name": "Java Language & Platform"}, "audienceLevel": "ADVANCED", "language": null, "youtubeUrl": "", "description": "Java is full of subtleties, pitfalls, and rules we think we know until we have to predict what a piece of code will actually print.<br>In this interactive session, we will walk through a series of short Java snippets to analyze together.<br>The goal is to learn, revisit core concepts, challenge assumptions, and better understand how the Java language really behaves.", "totalFavourites": 96, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-08T16:50:00Z", "to": "2026-10-08T17:50:00Z", "room": "BOF 2", "kind": "BOF", "pause": false, "talk": {"id": 8167, "title": "Open Source in the Age of AI: Where's the value?", "speakers": [{"fullName": "Trisha Gee", "company": "Digital Aguacates", "imageUrl": "https://lh3.googleusercontent.com/a/ACg8ocLsMb8CUpH7W48b3uQ9kMWx6uoYjj07hJVCxmz2MT5fbaMVope5ow=s96-c"}], "track": {"name": "Development Practices"}, "audienceLevel": "ADVANCED", "language": null, "youtubeUrl": "", "description": "While some folks believe Open Source is important to do Because It's The Right Thing To Do, others have been able to persuade their organisations to open source valuable IP because it brings something to the company. Still others have been able to make money off an open source project they started.<br><br>Has this changed in the age of AI? If AI is being trained on open source and freely available code, does that make open source libraries and tools more or less valuable? Can an organisation still make money off their open source tools if AI agents can just go ahead and create code for them without needing training, consulting or support contracts?<br><br>Or was the value never in the money it brought, but in the community story? Making your code freely available, creating useful documentation and example code, supporting the community that grows around your open source tool might be the real goal, not simply the path to the destination.<br><br>Trisha wants to bring together open source maintainers, contributors and enthusiasts to discuss difficult questions around running an open source tool. Like:<br><ul><li>How does it support itself financially?<\/li><li>How do you decide what belongs in an open source offering vs what should be commercial/paid?<\/li><li>Why do we create open source tools in the first place?<\/li><li>What are the pros and cons of having open source tools in an AI world?<\/li><li>How do we build businesses around open source tools?<\/li><li>How do we use open source tools to support businesses?<\/li><\/ul>", "totalFavourites": 113, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-08T16:55:00Z", "to": "2026-10-08T17:40:00Z", "room": "Room 5", "kind": "Closing Keynote", "pause": false, "talk": {"id": 49751, "title": "F*ck The System, and other bad ideas for the future", "speakers": [{"fullName": "Jo Caudron", "company": null, "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-7aa19f72-a79a-4dde-b5fe-b911859b0c1f.jpg"}], "track": {"name": "Agentic Engineering & Tooling"}, "audienceLevel": "BEGINNER", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=wUyQmRriCng&pp=0gcJCT8MAYcqIYzv", "description": "The world as we know it is changing rapidly, and the old order is crumbling. In these uncertain times, it is tempting to lose faith in the future. But what if this is precisely the beginning of something new? <strong><em>Fuck the System – and Other Bad Ideas for the Future<\/em><\/strong> <em>(Fuck The System, en andere slechte ideeën voor de toekomst)<\/em> unravels the chaotic forces at play behind the geopolitical scenes and asks a fundamental question: can Europe grow into a strong player in the emerging world order? What do we need to build a Europe that is sovereign, resilient, and radically innovative? <br><br>This is a manifesto to understand the present and imagine the future – thought-provoking, sharp, and unorthodox. It breaks with old logic and prejudices and sees in today’s disorder the seed of something better. For thinkers and doers, for citizens, entrepreneurs, and policymakers who believe that Europe can be more than an old continent in crisis.", "totalFavourites": 377, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-08T18:00:00Z", "to": "2026-10-08T20:00:00Z", "room": "Room 8", "kind": "Devoxx Movie", "pause": true, "talk": null}]}, {"name": "Friday", "date": "2026-10-09", "slots": [{"from": "2026-10-09T06:30:00Z", "to": "2026-10-09T07:30:00Z", "room": "Exhibition Hall", "kind": "Breakfast", "pause": true, "talk": null}, {"from": "2026-10-09T07:30:00Z", "to": "2026-10-09T08:20:00Z", "room": "Room 4", "kind": "Conference", "pause": false, "talk": {"id": 52104, "title": "In the loop, not in the dark: staying in control in the era of dark software factories", "speakers": [{"fullName": "Alex Gavrilescu", "company": "Backlog.md", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-05b8ab40-661f-4685-ba72-9774462ba13b.jpg"}], "track": {"name": "Agentic Engineering & Tooling"}, "audienceLevel": "BEGINNER", "language": null, "youtubeUrl": "", "description": "Last year I built Backlog.md, an open source tool that captures your intent, splits it into small markdown tasks, and lets you follow your agents' progress on a TUI Kanban board. A year and 300,000 agent-written lines later, my projects had quietly turned into a small dark factory: software getting built with nobody really reviewing it. Task tracking told me what the agents did, but not what my system had become. I am no longer the owner of my code.<br><br>Today I am building Groma.md to fix this. Groma keeps a real-time architectural blueprint of your project's domain as the source of truth, and tasks become the means to reach the blueprint's next iteration. Imagine UML without the fear that it goes stale, where you can watch exactly which parts of the system your agents are modifying.<br><br>Whether you are adding an order management system to a brownfield codebase or starting a new project from scratch, you design it in Groma and let the agents write the code, while you keep an eye on the overall architecture and stay in control of the meaningful decisions.<br><br>In this talk I will take a large open source repository and map it into a Groma blueprint live on stage, to show you how to become the owner of your code again.<br>", "totalFavourites": 378, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-09T07:30:00Z", "to": "2026-10-09T08:20:00Z", "room": "Room 5", "kind": "Conference", "pause": false, "talk": {"id": 17794, "title": "Escaping Java's Allocation Gravity with Value Classes", "speakers": [{"fullName": "Clément de Tastes", "company": "SCIAM", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-0a33a77f-9982-4862-8714-ad3c32701c94.jpg"}, {"fullName": "Remi Forax", "company": "University Gustave Eiffel", "imageUrl": "https://lh3.googleusercontent.com/a/ACg8ocK8ScVAfwuF-N0FTBQLG4RDPeS7vzgzVc_VNU0pEJrFPgQ32w=s96-c"}], "track": {"name": "Java Language & Platform"}, "audienceLevel": "ADVANCED", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=lUB15M3mMLs", "description": "Java 28 will soon introduce, as a preview feature, value classes (JEP 401), a new kind of class that renounces its identity to get better performance.<br><br>In this presentation, we will explain what value classes are, how the Java spec was re-interpreted to conjure their existence, how they interact with existing code and what optimizations they enable both on the stack and the heap.<br><br>To make it concrete, we'll explore these ideas through the simulation and rendering of a black hole: calculating the trajectories of thousands of light rays through curved spacetime means manipulating huge numbers of vectors, rays, coordinates, and intermediate values.<br><br>Finally, we will look ahead at the experimental \"!\" syntax for null-restricted types, its optimization potential, and the limitations of the current design.<br><br>Join us to discover value classes and the current state of Project Valhalla.", "totalFavourites": 290, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-09T07:30:00Z", "to": "2026-10-09T08:20:00Z", "room": "Room 6", "kind": "Conference", "pause": false, "talk": {"id": 21694, "title": "Why it takes 3000 commits to bring Valhalla's value objects to the JDK", "speakers": [{"fullName": "David Simms", "company": "Java Platrform Group - Oracle", "imageUrl": "https://lh3.googleusercontent.com/a/ACg8ocIMYsGAPqwvdrbippzL2I0_rzyyLfPCLWgDp-0oAPQcJdnD5-Pcfg=s96-c"}], "track": {"name": "Java Language & Platform"}, "audienceLevel": "BEGINNER", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=D_AmK8-UnZg", "description": "After years of rounding off a square peg to fit into Java's mainline, JEP 401's value objects are coming to OpenJDK in its first preview. It is a single keyword change, you don't even need to recompile your libraries, yet there's so much happening. What you can learn here:<br><br><ul><li>What value objects are, why and how you want to use them<\/li><li>What value objects do for the Java Virtual Machine, and therefore your code<\/li><li>Where Is OpenJDK going with this: \"healing the rift\" between objects and primitives<\/li><\/ul><br>There will be some project history, concerning peak Valhalla prototype performance, and how all the dangerous bits were smoothed off to make it usable. There will be some JVM engineering details on implementation and a peek at some wild and crazy ideas for the future, hoping to be a few thesis papers in the coming months. The audience should come away with an understanding that, whilst we don't quite yet have `List`, there is a path to get there, which you will see with JEP 401.<br><br>In the meantime, JEP 401 Value Objects, holds plenty of subtle language features and interactions with the JVM to help your code be better from a safety and clarity point of view and also some performance wins along the way, with the promise of more to come...", "totalFavourites": 183, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-09T07:30:00Z", "to": "2026-10-09T08:20:00Z", "room": "Room 8", "kind": "Conference", "pause": false, "talk": {"id": 21675, "title": "All you need to know about Maven 4!", "speakers": [{"fullName": "Matthias Bünger", "company": "ITZBund", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-c097beff-4de0-4a4d-ab32-87019a3d1108.jpg"}], "track": {"name": "Development Practices"}, "audienceLevel": "BEGINNER", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=TgkY2UmWtBo", "description": "Maven is more than 20 years old, and it's last major version (Maven 3) was released in 2010. Since then Maven got several great updates, but the Maven team also realized that Maven can't evolve further without huge changes which have the capability to break the whole ecosystem if done wrong. Now - after years of intensive planning and coding - the release of Maven 4 is closer than ever before!<br><br>In this talk I'll speak about the motivation and challenges the team had while developing Maven 4 and of course about its new features and improvements.", "totalFavourites": 397, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-09T07:30:00Z", "to": "2026-10-09T08:20:00Z", "room": "Room 9", "kind": "Conference", "pause": false, "talk": {"id": 9025, "title": "The Quantum Tech Lead: Hands-On and Abstract at the Same Time", "speakers": [{"fullName": "Cristian Schuszter", "company": "CERN", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-8a031ed5-f55f-4758-8655-819459e29ce6.jpg"}], "track": {"name": "People, Practices & Career"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=Spxl1eDQJKs", "description": "So you got \"promoted\" to lead a team / project / whatever. What now? Do you have what it takes? It certainly seems that your hierarchy thinks so. But oftentimes things are not so black and white. Being a great plumber doesn't automatically make you a great leader of plumbers, so you need to adapt and adjust your ways of working by dropping old habits and picking up new ones. Then you start getting worried by the fact that you won't be able to have as much impact as before, since you're not coding as much as you used to in the past (and that's what you're good at, right?).<br><br>What if leadership can amplify your technical impact instead? In this talk, I’ll share how I evolved from individual contributor to a mix of Solution Architect, Tech Lead and classical Engineering Manager at CERN - keeping my hands in the code while scaling my influence through the team that I work with. I'll be sharing best practices and adjustment techniques for you to use when faced with the difficult transition process into technical leadership. And lastly, we'll be talking about how to stay relevant even if you're not spending countless hours honing your coding skills anymore.<br>", "totalFavourites": 240, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-09T07:30:00Z", "to": "2026-10-09T08:20:00Z", "room": "BOF 1", "kind": "Speaker Room", "pause": true, "talk": null}, {"from": "2026-10-09T08:20:00Z", "to": "2026-10-09T08:40:00Z", "room": "Exhibition Hall", "kind": "Break", "pause": true, "talk": null}, {"from": "2026-10-09T08:40:00Z", "to": "2026-10-09T09:30:00Z", "room": "Room 4", "kind": "Conference", "pause": false, "talk": {"id": 49257, "title": "Embabel Agent v1.5", "speakers": [{"fullName": "Rod Johnson", "company": "Embabel", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-8bd19dbe-7c4f-4457-970d-dcdcaeea60b0.jpg"}], "track": {"name": "Agentic Engineering & Tooling"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=DniA37kVfvI", "description": "Most agent frameworks ask a language model to decide what to do next. That works, until it doesn't — and when it doesn't, you're left with a non-reproducible trace and no way to explain what happened. Embabel takes the opposite approach.<br><br>Created by Rod Johnson — who calls it the most important project since founding Spring — Embabel is a JVM-native agent framework built on Spring AI and Spring Boot. Its core is Goal-Oriented Action Planning (GOAP), an algorithm borrowed from game AI: you declare goals, annotate actions with @Action and @AchievesGoal, and a deterministic, non-LLM planner chains them by pre- and post-conditions to reach the goal. The plan is code-generated, inspectable before it runs, and explainable afterwards. If Spring AI and LangChain4j are the Servlet API of GenAI, Embabel is Spring MVC.<br><br>Full presentation details pending.", "totalFavourites": 197, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-09T08:40:00Z", "to": "2026-10-09T09:30:00Z", "room": "Room 5", "kind": "Conference", "pause": false, "talk": {"id": 15359, "title": "Is AI killing XP practices? (Or are we letting it?)", "speakers": [{"fullName": "Nacho Cougil", "company": "Dynatrace", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-2a8cc803-44ba-4599-9b4a-53ce17c0085d.jpg"}], "track": {"name": "Development Practices"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=wrV4f83UMWI", "description": "For the last 20-30 years, the software industry has been learning — sometimes the hard way — how to build better software. Practices like TDD, refactoring, pair programming, simple design, collective code ownership, continuous integration, and coding standards didn't appear by magic. They came from pain, failed projects, and the brilliant minds behind XP — Kent Beck, Ward Cunningham, and Ron Jeffries — who asked: \"can we do this better?\"<br><br>And now? Now we have AI. And suddenly, some developers are asking: \"do we still need all that?\"<br><br>In this session, we'll look at 7 XP practices that are genuinely at risk in an AI-assisted world — not because they're wrong, but because AI makes it tempting to skip them. We'll see what happens when teams do skip them (spoiler: it's not pretty 😅), and more importantly, how these practices don't just survive the AI era — they become *more critical than ever*.<br><br>AI amplifies everything. Good habits and bad ones. If your team has no tests, no shared standards, no feedback loop — AI will help you build the mess of your life, faster than ever before.<br><br>AI is the best stress test XP practices have ever had. Spoiler: they pass 😉", "totalFavourites": 304, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-09T08:40:00Z", "to": "2026-10-09T09:30:00Z", "room": "Room 6", "kind": "Conference", "pause": false, "talk": {"id": 21655, "title": "What’s happening with Project Amber?", "speakers": [{"fullName": "Gavin Bierman", "company": "Oracle", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-81f196b1-a89f-4d7a-85d3-5e7e4e171a24.jpg"}], "track": {"name": "Java Language & Platform"}, "audienceLevel": "ADVANCED", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=Go76-9Q51wU", "description": "Project Amber has introduced a series of Java language features that together<br>enable a new programming style: data oriented programming. At its core is<br>compositional pattern matching, which allows values to be deconstructed<br>naturally and safely.<br><br>Where does Project Amber go from here? This talk explores the next wave of<br>language features under development. These experiments extend pattern matching<br>in several directions, including user-defined deconstruction for ordinary<br>interfaces and classes, nested constant patterns for more compact and expressive<br>matching, an exhaustive pattern-matching statement, safer primitive value<br>conversions within pattern matching, and a compact notation for deconstructing<br>and constructing record instances — a process we call reconstruction.<br><br>Along the way, I’ll present some of the experimental designs we’re exploring,<br>discussing both the opportunities they create and the language design challenges<br>they raise.<br>", "totalFavourites": 195, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-09T08:40:00Z", "to": "2026-10-09T09:30:00Z", "room": "Room 8", "kind": "Conference", "pause": false, "talk": {"id": 10023, "title": "You thought technical debt was bad? Meet design debt!", "speakers": [{"fullName": "Julien Topçu", "company": "Shodo Group", "imageUrl": "https://lh3.googleusercontent.com/a-/AOh14GgE8qpDBrF4vlQ9jm7d9eSagPY606rA7umzpIU6jQ=s96-c"}, {"fullName": "Josian Chevalier", "company": "Shodo", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-c4de4a52-ae2e-4937-bbeb-b359147c8675.jpg"}], "track": {"name": "Development Practices"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=SoWgxHeAPGU", "description": "In our job, technical debt is probably the most frustrating, draining and tenacious thing we have to fight against. Of course, there are best practices: refactor, aim for simplicity with KISS, avoid over-engineering with YAGNI in order to keep this debt as low as possible. And yet, we never really manage to get rid of it. Worse, it keeps piling up even when we apply those principles, as if it were inevitable.<br><br>But what if those very best practices sometimes made the problem worse instead of solving it? Technical debt may be only the visible part of something deeper: accidental design debt. A far more complex problem that leads to spaghetti software and microservices that are really just a distributed monolith, and that we often create ourselves without even realizing it.<br><br>In this talk, we will explore the mechanisms of design debt and its impact on our architecture, our processes, our organization, and even our business. Through concrete examples, we will see how to detect it, assess how deep it goes, and act before it becomes entrenched for good.", "totalFavourites": 514, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-09T08:40:00Z", "to": "2026-10-09T09:30:00Z", "room": "Room 9", "kind": "Conference", "pause": false, "talk": {"id": 16408, "title": "10 Billion Records vs. The Regulator: An Architectural Post-Mortem of an 11TB Exadata Failure", "speakers": [{"fullName": "Martin Ladecky", "company": "Commerzbank", "imageUrl": "https://lh3.googleusercontent.com/a/ACg8ocLM4sCcWIE0PSQd8FkkwMn4URk4bJz3Rk8M-_CCXwhGJvRNM0doNA=s96-c"}], "track": {"name": "Architecture & Modernization"}, "audienceLevel": "ADVANCED", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=TB45qqp-OxM", "description": "What happens when your architecture doesn't just fail a performance test, but triggers a national regulatory investigation? In this session, we go inside a critical system failure at a major bank that led to a formal report to BaFin and a complete rethink of our data strategy.<br>Dealing with 11TB of data on Oracle Exadata taught us that at a certain scale—specifically, the 10-billion-record mark—standard indexing strategies and read-side duplicate checks don't just slow down; they collapse. We will reverse-engineer this incident by walking through the five critical architectural milestones:<br><ol><li><strong>First Aid: <\/strong>Immediate application-layer mitigation steps to halt cascading timeouts.<\/li><li><strong>The Refactoring Oversight:<\/strong> How a missing 10-day query window check, removed years prior, silently waited to trigger an 11TB full scan. <\/li><li><strong>The Cache Bottleneck:<\/strong> The high-stakes \"do nothing\" war room decision to wait for the Exadata Smart Flash Cache to warm up and recover. <\/li><li><strong>The Structural Flip:<\/strong> Moving 10kB of complex analytic queries from read-side deduplication to a write-side integrity layer. <\/li><li><strong>The Exit Strategy:<\/strong> Designing and planning a zero-loss dual-write ingestion architecture to migrate 10 billion records to Cloud PostgreSQL without CDC. <\/li><\/ol>Walk away with an unvarnished, practical blueprint for navigating the compliance-performance paradox, handling database cold starts, and executing a zero-loss cloud modernization strategy under heavy pressure.", "totalFavourites": 216, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-09T08:40:00Z", "to": "2026-10-09T09:30:00Z", "room": "BOF 1", "kind": "Speaker Room", "pause": true, "talk": null}, {"from": "2026-10-09T09:30:00Z", "to": "2026-10-09T09:50:00Z", "room": "Exhibition Hall", "kind": "Break", "pause": true, "talk": null}, {"from": "2026-10-09T09:50:00Z", "to": "2026-10-09T10:40:00Z", "room": "Room 4", "kind": "Conference", "pause": false, "talk": {"id": 9036, "title": "My old trains have a second life, with TinyGo!", "speakers": [{"fullName": "Florian FORESTIER", "company": "Zenika", "imageUrl": "https://lh3.googleusercontent.com/a/ACg8ocLatBLU2zKU17CC2f1JFbRUurY_4zUYQUO80dqhsiKIfg2f4i81=s96-c"}, {"fullName": "Justine Bachelard", "company": "BeYs Cloud", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-34c987ce-cf32-424d-a942-b4d1c29344b7.jpg"}], "track": {"name": "Mind the Geek"}, "audienceLevel": "BEGINNER", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=LIGVpEuIrrY", "description": "In the 1970s, model trains were a popular hobby. Thanks to low production costs, anyone could afford a small HO gauge layout. The system was simple: a train, a motor, 12V DC in the track, and off you go!<br><br>Fifty years later, we took our trains out of the attic with a big idea in mind: to convert them to digital. With some Seeed Studio, Bluetooth, and TinyGo, we managed to get a functional railway network, were we can manage speed, direction, and lights of each train individually.<br><br>This talk speaks about hardware and software architecture for embedded systems, in a retrospective format about all our successes (and mistakes) during the conception of this project. Everything is open-source, so don't hesitate to use it, fork it, and enhance it!", "totalFavourites": 80, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-09T09:50:00Z", "to": "2026-10-09T10:40:00Z", "room": "Room 5", "kind": "Conference", "pause": false, "talk": {"id": 21687, "title": "10 boring reasons why Java is the best ecosystem for agentic development", "speakers": [{"fullName": "Ed Burns", "company": "GitHub", "imageUrl": "https://lh3.googleusercontent.com/a/ACg8ocKf_U-qcze7BB9GWQwsWdm2WDBkGgEsDAzUQT27yrdQd6H_CGu1=s96-c"}], "track": {"name": "Agentic Engineering & Tooling"}, "audienceLevel": "ADVANCED", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=Qg7Uu_XBvpI", "description": "I was about ten years into my Java career when I had spoken at enough conferences, and befriended enough speakers, that my sense for the hype cycle had been sharpened by the collective skepticism of the speaker jet-set. That was two decades ago. We've all heard the latest hype about what AI agents can do well. Less hyped is what can go wrong: non-determinism, DRY violations, hallucinated APIs, token cost, unreviewable code, and code reviews that start to improve the code, only to keep going until the code is actually broken.<br><br>This talk makes the case that it's the time-honed boring things about Java that keep the agents honest. Successful agentic development maximizes agent strengths — speed, breadth, fearless exploration, tolerance for boilerplate — while backstopping their weaknesses: non-determinism, dependency sprawl, inconsistent error handling, and code that works but nobody wants to maintain.<br><br>Here are the 10 boring reasons:<br>1. Type system<br>2. Testing ecosystem<br>3. Backwards compatibility culture<br>4. Deep static analysis<br>5. Build system maturity and dependency management<br>6. Code formatting and style enforcement<br>7. Virtual threads and structured concurrency<br>8. Observability stack<br>9. JVM performance tuning<br>10. Breadth of deployment options<br><br>For each, I'll show the specific agentic failure mode it addresses. I'll close with a practical checklist for making your Java development process agent-safe, and tie it up with the message that to move forward, you have to go back.<br>", "totalFavourites": 269, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-09T09:50:00Z", "to": "2026-10-09T10:40:00Z", "room": "Room 6", "kind": "Conference", "pause": false, "talk": {"id": 52101, "title": "Java Next - From Valhalla to Leyden, from Babylon to Panama, from Amber to Detroit", "speakers": [{"fullName": "Nicolai Parlog", "company": "Oracle", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-acf609a9-0afe-496f-90db-f7bc0e57fa11.jpg"}], "track": {"name": "Java Language & Platform"}, "audienceLevel": "BEGINNER", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=ufhs9THbYZI", "description": "Java's big projects are shaping its present and future. Over recent years, Amber and Leyden, Panama and Loom have greatly improved the <br>language, APIs, and runtime. But they're not done yet! And neither are Valhalla and Babylon - in fact they're just getting started. <br><br>Time to take a closer look at how...<br><br><ul><li>Project Valhalla mends the rift in Java's type system<\/li><li>Project Leyden improves Java's startup and warmup time<\/li><li>Project Babylon extends the reach of Java to foreign programming models and hardware<\/li><li>Project Panama cuts through the isthmus separating Java from native code<\/li><li>Project Amber makes the language more expressive and ready for today's and tomorrow's problems<\/li><li>Project Loom further improves efficient, structured concurrency<\/li><li>Project Detroit allows simple interop with Python and JavaScript<\/li><\/ul><br>After this talk, you will know what to expect from Java in the next few years and surely there's no better way to end a great Devoxx!<br>", "totalFavourites": 356, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-09T09:50:00Z", "to": "2026-10-09T10:40:00Z", "room": "Room 8", "kind": "Conference", "pause": false, "talk": {"id": 5538, "title": "Strangling the dragon: modernizing legacy systems with the Strangler Fig pattern", "speakers": [{"fullName": "Daniel Raneland", "company": "factor10", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-2252e0af-bbe1-4c6f-9ab8-0858a53ce963.jpg"}], "track": {"name": "Architecture & Modernization"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=AmL_OCs5F4E", "description": "Stuck in a legacy system that needs modernizing? Feel like the best course of action is to throw it in a dumpster, light it on fire and rewrite everything from scratch - maybe even in a different language?<br><br>Hold that thought. While it may be tempting to start a rewrite, rewrites of complicated systems rarely succeed for multiple reasons. Chief among them is time and the fact that not everything can stop and wait for the rewrite, but another important contributor is the second system effect, which usually causes rewrites to be over-engineered and bloated in comparison to what they replace<br><br>In this talk, I'll share my experiences with the Strangler Fig pattern, a better approach where the original system is gradually replaced by breaking out or rewriting parts into separate systems. I'll also talk about combining this with Domain Driven Design and how to use the new design to execute an Inverse Conway Manoeuvre to ensure you're working with Conway's law and not against it.", "totalFavourites": 305, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-09T09:50:00Z", "to": "2026-10-09T10:40:00Z", "room": "Room 9", "kind": "Conference", "pause": false, "talk": {"id": 23531, "title": "We created our own AI orchestrator and it became so much more!", "speakers": [{"fullName": "Ricky van Rijn", "company": "MetaFactory", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-5361a8d1-ea08-4d32-8575-5dbaae4cb186.jpg"}], "track": {"name": "Development Practices"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=niBYuCuViGw", "description": "Agentic AI is something everyone wants to use or sell. We wanted an overview of the work and active agents and therefore we created an orchestration tool. Using the Agent, Skills and Spec files from default locations so its interchangeable with other tools. And it really started to change the way we worked on software projects.<br><br>As a Java software Engineer it could be seen as a automation of tasks, as an Scrum Master/Product Owner a way to coordinate and for the business analyst a way to store functional requirements. We've used Embabel Agent as the fundamental layer. On top of that we've created a visual representation so we can have a website open in our office which shows which agent is active, what it's doing and what's the next task. <br><br>For Software Development teams this will be the biggest change, developers are more reviewing and delivering feedback to the AI while business analysts had a field day of delivering the requirements for the spec files which were reviewed by an AI agent before they could be assigned to an AI-agent. The product owner is in control of the queue where sprints are no longer weeks but days. <br><br>I want to share how we created this orchestrator and explain on which impact each technical step had on the way-of-work in our team. It wasn't just about creating an application anymore, everything had impact on how we work.", "totalFavourites": 285, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-09T10:40:00Z", "to": "2026-10-09T16:40:00Z", "room": "Exhibition Hall", "kind": "Safe travels home", "pause": true, "talk": null}]}];
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let active=0, videos=false;const pxPerMin=2, storageKey='devoxx-belgium-2026-seen', compact=new Intl.NumberFormat('en',{notation:'compact',maximumFractionDigits:1});
let seen=new Set;try{seen=new Set(JSON.parse(localStorage.getItem(storageKey)||'[]'))}catch(e){}
function toggleSeen(id,button){seen.has(id)?seen.delete(id):seen.add(id);localStorage.setItem(storageKey,JSON.stringify([...seen]));let event=button.closest('.event'),isSeen=seen.has(id);event.classList.toggle('seen',isSeen);button.textContent=isSeen?'✓':'○';button.title=button.setAttribute('aria-label',isSeen?'Mark as unseen':'Mark as seen')}
function mins(iso){let d=new Date(iso);return d.getUTCHours()*60+d.getUTCMinutes()+120} // October Brussels = UTC+2
function videoId(url){try{return new URL(url).searchParams.get('v')}catch(e){return''}}
function showTalk(t,s){let dialog=$('#talkDialog'),id=videoId(t.youtubeUrl||''),img=$('#modalImage');$('#modalTitle').textContent=t.title||'Talk';$('#modalMeta').textContent=[(t.speakers||[]).map(x=>x.fullName).join(', '),t.track?.name,s.room].filter(Boolean).join(' · ');$('#modalDescription').innerHTML=`<p><strong>Devoxx popularity:</strong> ${Number(t.totalFavourites||0).toLocaleString()} attendee favourites</p>`+(t.teamRating?`<p><strong style="color:${t.teamRating.rating>=8?'#ffc94d':t.teamRating.rating>=7?'#6ee7a8':'#c8d1df'}">Team rating: ${t.teamRating.rating}/10</strong> · ${t.teamRating.reviews} ${t.teamRating.reviews===1?'review':'reviews'}</p>`:'')+(t.description||'<p>No speaker description is available for this talk.</p>');img.hidden=!id;if(id){img.src=`https://i.ytimg.com/vi/${id}/hqdefault.jpg`;img.alt=`YouTube thumbnail for ${t.title}`}$('#modalActions').innerHTML=(t.youtubeUrl?`<a class="youtube-button" href="${esc(t.youtubeUrl)}" target="_blank" rel="noopener">▶ Watch on YouTube</a>`:'')+(t.slidesUrl?`<a class="youtube-button" style="background:#3478d4" href="${esc(t.slidesUrl)}" target="_blank" rel="noopener">▣ View slides</a>`:'');dialog.showModal()}
function render(){const q=$('#search').value.toLowerCase().trim();$('#tabs').innerHTML=DAYS.map((d,i)=>`<button class="${i===active?'active':''}" data-i="${i}">${d.name}</button>`).join(' ');let d=DAYS[active], slots=d.slots.filter(s=>{let t=s.talk||{};let hay=[t.title,(t.speakers||[]).map(x=>x.fullName).join(' '),s.room,t.track?.name,s.kind].join(' ').toLowerCase();return(!q||hay.includes(q))&&(!videos||t.youtubeUrl)});let rooms=[...new Set(slots.map(s=>s.room))].sort((a,b)=>{let n=x=>+(x.match(/\d+/)||[999])[0];return n(a)-n(b)||a.localeCompare(b)});let start=Math.min(...d.slots.map(s=>mins(s.from))), end=Math.max(...d.slots.map(s=>mins(s.to))), height=(end-start)*pxPerMin;let ticks='';for(let m=Math.ceil(start/30)*30;m<=end;m+=30)ticks+=`<div class="tick" style="top:${(m-start)*pxPerMin}px">${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}</div>`;let events=slots.map(s=>{let t=s.talk, top=(mins(s.from)-start)*pxPerMin, h=Math.max(28,(mins(s.to)-mins(s.from))*pxPerMin-4), left=rooms.indexOf(s.room)*245;let title=t?.title||s.kind, duration=mins(s.to)-mins(s.from), speakers=(t?.speakers||[]).map(x=>x.fullName).join(', '), url=t?.youtubeUrl||'', id=t?String(t.id):'', isSeen=id&&seen.has(id), cls=t?`${url?'video':''}${isSeen?' seen':''}${duration<60?' compact':''}`:'break';let tag='div';return `<${tag} class="event ${cls}" style="top:${top}px;left:calc(${rooms.indexOf(s.room)} * var(--lane));height:${h}px" ${t?`data-talk-id="${esc(id)}" title="Show talk details"`:''}>${t?`<button class="seen-toggle" data-id="${esc(id)}" title="${isSeen?'Mark as unseen':'Mark as seen'}" aria-label="${isSeen?'Mark as unseen':'Mark as seen'}">${isSeen?'✓':'○'}</button>`:''}<div class="title">${url?'<span class="watch">▶ </span>':''}${esc(title)}</div><div class="meta">${esc(speakers||s.kind)}${t?.track?.name?' · '+esc(t.track.name):''}</div>${t?`<div class="popularity" title="Attendee favourites in the Devoxx schedule app"><span>♥ ${compact.format(t.totalFavourites||0)}<span class="metric-label"> favourites</span></span></div>`:''}${t?.teamRating?`<span class="team-rating ${t.teamRating.rating>=8?'great':t.teamRating.rating>=7?'good':''}">★ ${t.teamRating.rating}/10 · ${t.teamRating.reviews} ${t.teamRating.reviews===1?'review':'reviews'}</span>`:''}</${tag}>`}).join('');$('#app').innerHTML=`<section class="day active"><h2 class="day-head">${esc(d.name)} · ${new Date(d.date+'T12:00:00').toLocaleDateString('en',{month:'long',day:'numeric',year:'numeric'})} <small style="color:var(--muted);font-weight:400">— ${slots.length} items</small></h2><div class="scroller"><div class="board"><div class="rooms">${rooms.map(r=>`<div class="room">${esc(r)}</div>`).join('')}</div><div class="timegrid" style="height:${height}px;width:calc(${rooms.length} * var(--lane))">${rooms.map((r,i)=>`<div class="lane" style="left:calc(${i} * var(--lane));height:${height}px"></div>`).join('')}${ticks}${events}</div></div></div></section>`;document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{active=+b.dataset.i;render()});document.querySelectorAll('.seen-toggle').forEach(b=>b.onclick=e=>{e.preventDefault();e.stopPropagation();toggleSeen(b.dataset.id,b)});document.querySelectorAll('.event[data-talk-id]').forEach(el=>el.onclick=()=>{let s=slots.find(x=>String(x.talk?.id)===el.dataset.talkId);if(s)showTalk(s.talk,s)})}
$('#talkDialog .modal-close').onclick=()=>$('#talkDialog').close();$('#talkDialog').onclick=e=>{if(e.target===$('#talkDialog'))$('#talkDialog').close()};$('#search').oninput=render;$('#videoOnly').onclick=()=>{videos=!videos;$('#videoOnly').classList.toggle('active',videos);render()};render();
