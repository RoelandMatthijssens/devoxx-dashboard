want that YOLO mode speed, but developer laptops are treasure troves of credentials that represent massive security nightmares.<br><br>In this session, we’ll look at Docker Sandboxes: a new isolation primitive designed to let agents operate in a secure local cocoon with restricted filesystems and virtualized credentials. But host isolation is only half the battle. We’ll dive into the typical mess AI agents create, see why basic sandbox boundaries aren't enough to stop application-level data leaks, and walk through a multi-layered security workflow combining local sandboxing with tool-level governance and policy controls for running agents that you can actually trust.", "totalFavourites": 198, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-07T11:05:00Z", "to": "2026-10-07T11:45:00Z", "room": "Room 8", "kind": "Lunch Talk", "pause": false, "talk": {"id": 4100, "title": "Life in the Ivory Tower: Confessions of a Former Developer Who Turned Into an Architect", "speakers": [{"fullName": "Robin Custers", "company": "Cegeka", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-b38b2424-ab8d-420c-9791-eb71faab2fd8.jpg"}], "track": {"name": "Architecture & Modernization"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=nhVRKv8VHKU", "description": "Up until a couple of years ago, I was riding the waves of the latest technologies, shipping code, and mocking the \"suits\" who spent their days writing documentation that was never read. But then, the unthinkable happened. I joined a new organization and transitioned to the dark side. I became one of them: an Enterprise Architect. Or as I like to call myself: a fake enterprise architect.<br><br>I quickly found out that my new reality meant dealing with consultants pitching one-shot solutions as the ultimate silver bullet (pun intended), and uncovering the psychology of IT by learning why technical decisions are rarely about technology. At the same time, I wanted to stay in touch with the real world where<strong> <\/strong>frameworks evolve and pipelines run. But how on earth do you find the time for that?<br><br>This talk is a transparent look inside my shiny new office, commonly known as the Ivory Tower. Whether you're a developer trying to challenge corporate IT decisions, an architect struggling to explain them, or you just want to make fun of enterprise architects (the real ones, that is): this session is for a broad audience, sharing lessons learned trying to bridge the gap between two worlds that should never be disconnected.<br><br><strong>Expect to walk away with:<\/strong><br><ul><li>Tips on how to keep your technical skills alive while moving up the corporate ladder<\/li><li>A look into the psychology behind IT decision-making and why it's never just about the code<\/li><li>How to foster real collaboration and break down the walls of the Ivory Tower<\/li><\/ul>", "totalFavourites": 501, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-07T11:05:00Z", "to": "2026-10-07T11:45:00Z", "room": "Room 9", "kind": "Lunch Talk", "pause": false, "talk": {"id": 23519, "title": "AI Doesn’t Click Buttons: Building APIs for the Agentic Age", "speakers": [{"fullName": "Kim Lauwers", "company": "Quality Coders BV", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-368e521c-af32-4f36-a53c-52a481610c38.jpg"}], "track": {"name": "Architecture & Modernization"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=QvyIzP4-OvM", "description": "For decades, software has been designed around graphical user interfaces. The application was the product, the UI was the primary entry point, and APIs mainly existed to support it.<br><br>AI agents reverse that relationship. They do not click through screens, interpret disabled buttons or understand vague error messages. They interact with APIs. Yet many APIs expose data without meaning, errors without possible resolutions and operations without explaining what can happen next.<br><br>This session explores what it means to design an AI-first API: an API built not only for applications and integrations, but also for copilots, automation and autonomous agents.<br><br>We will move beyond the idea that adding a chatbot makes a system AI-ready. Through practical examples, we will cover contract-first design, strongly typed schemas, explainable errors, machine-readable actions, deterministic workflows, observability, security, OpenAPI, Java records, migration strategies for legacy systems.<br><br>This is not about allowing an LLM to make critical business decisions. It is about giving AI enough structure, context and guardrails to safely use existing business capabilities.<br><br>Attendees will learn how to recognise where current APIs fail agents and how to evolve them without rewriting an entire application. <br><br>The session is aimed at Java developers, architects, API designers and technical leads. No previous experience with AI agents is required.", "totalFavourites": 167, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-07T11:05:00Z", "to": "2026-10-07T11:45:00Z", "room": "Room 10", "kind": "Lunch Talk", "pause": false, "talk": {"id": 50103, "title": "Let's dance! – Teaching your robot some moves with reinforcement learning", "speakers": [{"fullName": "Thomas Endres", "company": "TNG Technology Consulting GmbH", "imageUrl": "https://lh3.googleusercontent.com/a/AATXAJxWxubT7g3QJfDNjLG2FdVGAtl_5CZk3Jf_ukgT=s96-c"}, {"fullName": "Martin F.", "company": "TNG Technology Consulting GmbH", "imageUrl": "https://lh3.googleusercontent.com/a/ACg8ocKHzZww6LQp4Nh3bXnAyL3Vj9gaVLvqOiYx9PNf9fGoF_t3f1Pt=s96-c"}, {"fullName": "Tobias Lübbe", "company": "TNG Technology Consulting GmbH", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-54036c9e-b768-4f44-aeed-497f9307443c.jpg"}], "track": {"name": "Mind the Geek"}, "audienceLevel": "BEGINNER", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=gPtWq_LHL8o", "description": "Has this ever happened to you: You just spent €50,000 on a humanoid <br>robot, but it's not very fun at parties, so you have to train it to <br>dance using reinforcement learning in a simulation environment on your <br>€100,000 GPU cluster? What do you mean \"NO\"?<br><br>In this talk, Thomas Endres and David Winderl will teach you how you can <br>train your humanoid robot to dance using Reinforcement Learning (RL) in <br>simulation environments. They're gonna kick things off with an <br>introduction into RL, covering the basics of policies and rewards. After <br>that, they’ll take their first steps in simulation environments with the <br>introduction of NVIDIA Isaac Sim and the Unitree RL Lab. Our speakers <br>will run through the steps of shaping a walking policy, one hilarious <br>fall at a time. Finally, they're going to shake things up with a dancing <br>policy: You will learn how you can retarget human motion from videos to <br>the Unitree G1 robot and train an imitation policy that can dance just <br>as poorly as you.<br><br>For the grande finale, our humanoid robot will close the session with a <br>dancing performance, not missing out on a single step.", "totalFavourites": 114, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-07T12:00:00Z", "to": "2026-10-07T12:50:00Z", "room": "Room 3", "kind": "Conference", "pause": false, "talk": {"id": 31454, "title": "Run Frontier Open Models on consumer hardware", "speakers": [{"fullName": "Prince Canuma", "company": "Neywa Labs", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-05bb053f-e043-41b6-af64-c0fcd522a9b7.jpg"}], "track": {"name": "Agentic Engineering & Tooling"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=DseVLPC4Qjs", "description": "Getting a model to run on a Mac is easy. Getting it to run fast — with production-grade throughput, stable memory behavior, and accuracy that survives optimization — is where the real engineering lives. This session goes deep into the inference stack behind the MLX ecosystem (mlx-vlm, mlx-audio, nativ — 5M+ downloads).<br>We'll work through the full pipeline with measured numbers at every stage:<br><strong>Unified memory in practice<\/strong> — why the architecture that makes 512GB of \"VRAM\" possible also changes how you batch, allocate, and evict; and where memory bandwidth, not compute, becomes the wall across M-series generations.<br><strong>Continuous batching without a scheduler's luxury<\/strong> — handling concurrent requests when the same RAM serves the OS, the app, and the model.<br><strong>KV-cache compression and quantization<\/strong> — which techniques hold accuracy on real long-context workloads versus which only look good in benchmarks, with results from MATH500 and LongBench evaluations.<br><strong>Speculative decoding across chip generations<\/strong> — when draft models pay off and when the overhead eats the win.<br><strong>Porting war stories<\/strong> — bugs from porting 1000+ models, and the testing methodology that now catches them.<br>You'll leave able to reason about the accuracy/latency/memory triangle on consumer hardware — and knowing which server-side habits to unlearn.<br>For engineers building or deploying on-device inference. Familiarity with transformer inference assumed.", "totalFavourites": 327, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-07T12:00:00Z", "to": "2026-10-07T12:50:00Z", "room": "Room 4", "kind": "Conference", "pause": false, "talk": {"id": 4096, "title": "Deterministic by Design - Achieving Reproducible Builds with Maven", "speakers": [{"fullName": "Maarten Mulders", "company": "Info Support", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-caf6823d-09ef-45bb-8e40-43a6fd1d1e8e.jpg"}], "track": {"name": "Development Practices"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=9vtYvAI2Dtk", "description": "Modern software delivery pipelines face increasing pressure from auditors, regulators, and internal governance teams. Yet many builds remain non‑reproducible. This lack of determinism creates blind spots in compliance, undermines traceability, and exposes organisations to risks when validating what actually went into production.<br><br>This session demonstrates how developers can use Apache Maven features to reliably produce identical artifacts from identical inputs. You’ll also learn how to diagnose where reproducibility breaks down and how Maven’s built‑in verification tools can highlight sources of non‑determinism.<br><br>Join this talk to understand why reproducibility is becoming a non‑negotiable requirement for responsible software development and what you can do to make your build deterministic by design.", "totalFavourites": 152, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-07T12:00:00Z", "to": "2026-10-07T12:50:00Z", "room": "Room 5", "kind": "Conference", "pause": false, "talk": {"id": 4087, "title": "Harness Engineering: Building the System Around Your AI Coding Agent", "speakers": [{"fullName": "JI Darwish", "company": "Xomnia", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-69dfe225-6442-4759-bebe-064247f07b54.jpg"}], "track": {"name": "Architecture & Modernization"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=6N6qFqn1_Uo", "description": "AI coding agents feel like magic. It is easy to assume there is something exotic inside, some secret sauce that makes agents reliable. Well, there isn't, the core of every AI coding agent is very simple: send a message to a model, parse tool calls, execute them, feed the results back, repeat. Everything else (context management, permissions, observability, safety guardrails) is engineering layered on top of it that we should be building.<br><br>In this deep dive, we build that engine from scratch (in Java!), live on stage. Not to build the best agent, but to understand how the pieces fit together. We point it at a real codebase, and watch what happens. It compiles. Tests pass. And it violates every convention the team agreed on. So we iterate. We add context, constraints, and feedback, and at each step we examine what changed, why it helped, and what it maps to in the tools you already use.<br><br>The goal is a mental model. By the end, you will understand the components inside the AI coding tools you use every day, what you can layer on top to get smoother results and safer expectations, and where the honest limits still are, the gap no amount of engineering has closed yet.", "totalFavourites": 606, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-07T12:00:00Z", "to": "2026-10-07T12:50:00Z", "room": "Room 6", "kind": "Conference", "pause": false, "talk": {"id": 8164, "title": "The pizza party of the future 🍕 software teams and product value in the age of coding agents", "speakers": [{"fullName": "Katie Clark", "company": "Comsysto Reply", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-02e30f45-7d0b-455a-9fbf-17e105b17359.jpg"}, {"fullName": "Simon Rohrer", "company": "Saxo Bank", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-399454c9-6bcf-448e-ab7d-778aac81bcc3.jpg"}], "track": {"name": "People, Practices & Career"}, "audienceLevel": "BEGINNER", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=Tc2RFLa0ip8", "description": "AI is having a huge impact on our software development teams - nobody is sure how the role of a developer will evolve, and Simon and Katie don’t have the perfect prediction either!<br>Now that our teams have ever more capable coding assistants working around the clock, we are seeing “new” bottlenecks appear around value and trust questions. In response to this, we’re seeing organizations create new flavors of engineering roles, move down to one-pizza-teams, move to product owners and their AI wrangler (a one-pizza-slice team?), or even build factory lines. <br>This is not the first time the way we approach software teams has changed: we’ve gone from silos and super specialization to cross-functional Scrum teams and 2-pizza teams; from T-shaped and M-shaped professionals to full-stack, full-lifecycle, DevSecFin…Ops, value streams, Team Topologies, and more. We’ve added all kinds of coaches and then removed them again.<br>So who is invited to the pizza party of the future? Who makes decisions, who takes responsibility, what new and old roles and skills will be needed? And who is no longer welcome? We’ll take a look at what some of the friendlier agile critics from the past can warn us about. We will see how their takes can help us move to a more value-oriented future with agents and humans collaborating on user needs.", "totalFavourites": 293, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-07T12:00:00Z", "to": "2026-10-07T12:50:00Z", "room": "Room 7", "kind": "Conference", "pause": false, "talk": {"id": 9008, "title": "G1, ZGC, Shenandoah, ... with all these GCs in Java, which one do I choose?", "speakers": [{"fullName": "Antoine DESSAIGNE", "company": "Axway", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-763af354-0c0f-4884-9525-88a9034759dd.jpg"}], "track": {"name": "Java Language & Platform"}, "audienceLevel": "BEGINNER", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=8nY-kqwoD_A", "description": "It feels like with every new Java release, there are more and more Garbage Collectors (GCs) coming with more and more options. We hear cryptic phrases like: \"Oh, awesome, ZGC became generational while Shenandoah isn't\" or \"Did you heard how Netflix reduced their tail latencies with ZGC?\"<br><br>Naturally, it leaves us with a ton of questions:<br><ul><li>What on earth are they talking about?<\/li><li>What exactly is ZGC?<\/li><li>If this ZGC is so magical, why are there even other GCs left in Java anyway?<\/li><li>Why do we only ever talk about different GCs for Java, but never for Go or JavaScript? Can the Java folks make up their minds and pick one?<\/li><li>And what about native? Do we even need a GC there?<\/li><\/ul><br>Whether you are a Java developer or just plain curious, everyone is welcome! We will trace the journey from the creation of Java all the way to the present day to understand why we need a GC and why it isn't a solved problem. We will also take a tour of the various GCs, their evolutions, their strengths, and their weaknesses. (Spoiler alert: ZGC is not the one GC to rule them all).<br><br>By the end of this talk, you will know exactly when to use which GC so you can find the perfect fit for every project, every application, and every environment.", "totalFavourites": 152, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-07T12:00:00Z", "to": "2026-10-07T12:50:00Z", "room": "Room 8", "kind": "Conference", "pause": false, "talk": {"id": 7018, "title": "A Year of Agentic AI Evolution: Lessons Learned Building Production-grade Agentic Systems", "speakers": [{"fullName": "Mario Fusco", "company": "IBM", "imageUrl": "https://lh3.googleusercontent.com/a-/AOh14GinuLQCwL67BBgfGsiWRl3mu3Ya0TbDffhYFiXX=s96-c"}, {"fullName": "Kevin Dubois", "company": "IBM", "imageUrl": "https://lh3.googleusercontent.com/a/ACg8ocInnMfs42NN14UEEtFboGAF5baXQdsTFdbDo_ZuR1DADFHUONPEfA=s96-c"}], "track": {"name": "Agentic Engineering & Tooling"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=nEW0kosJjc8", "description": "Last year at Devoxx, we introduced the first version of LangChain4j's agentic framework and explored the core patterns behind agentic AI systems.<br><br>Since then, real-world usage, community feedback, and a lot of experimentation have taught us that production-ready agentic systems need more than a fixed set of predefined patterns. Different use cases need different trade-offs, and a predefined list can only take you so far.<br><br>In this session, we'll show how LangChain4j's agentic support has evolved. We have moved toward a more flexible orchestration model that lets developers compose their own strategies, while also allowing us to grow the library of built-in patterns. We will demonstrate in practice how these new patterns work discussing their respective pros and cons and fields of applicability.<br><br>We'll also cover the operational capabilities added to the framework to make these workloads production-ready. You'll see how to observe and trace agent execution, persist state, recover long-running workflows after failures, and handle human-in-the-loop pauses without losing control of the process.<br><br>Join us as we demonstrate these new features along with their trade-offs, and learn what it takes to build robust, production-ready agentic systems.", "totalFavourites": 552, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-07T12:00:00Z", "to": "2026-10-07T12:50:00Z", "room": "Room 9", "kind": "Conference", "pause": false, "talk": {"id": 24228, "title": "Java, Raspberry Pi, and the Art of Overengineering Everyday Life", "speakers": [{"fullName": "Matti Tahvonen", "company": "Vaadin", "imageUrl": "https://lh3.googleusercontent.com/a/AAcHTtcaGVDq7wOV5bdJHmWadJ7BtgNI9OrH-zBAbFvCpB2We-M=s96-c"}], "track": {"name": "Mind the Geek"}, "audienceLevel": "BEGINNER", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=5W4o_aYOaIY", "description": "Home automation promises to make life easier. Naturally, I used it to make mine more complicated—and much more fun. In this session, I’ll show how a professional Java developer can turn a Raspberry Pi into a practical automation platform without abandoning familiar tools or disappearing down a Python-shaped rabbit hole.<br>We’ll tour two of my real projects. A BBQ smoker controller drives micro servos and a fan, reads half a dozen temperature sensors, and warns me when to add more wood or tame the flames. Another home server, located at the jetty, takes time-lapse photos of sunsets, measures the water level, and tells me when conditions are right for fishing—even while I’m away at Devoxx.<br>Along the way, I’ll cover the parts that usually make people hesitate: project structure, accessing hardware from Java, fast development loops, remote deployment, running services reliably, building mobile-friendly UIs for my iPhone—I want to control my BBQ smoker while fishing 🤓—and accessing those services securely over the internet.<br>No grand smart-home platform, no Python magic—just pure Java, a Raspberry Pi, sensors, motors, and a healthy willingness to overengineer everyday life.", "totalFavourites": 234, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-07T12:00:00Z", "to": "2026-10-07T12:50:00Z", "room": "Room 10", "kind": "Conference", "pause": false, "talk": {"id": 22909, "title": "What rules the virtual? How our systems obey physical laws.", "speakers": [{"fullName": "Marianne Hoornenborg", "company": "NLJUG and KVK (Dutch Chamber of Commerce)", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-1d970225-bbf3-48a0-b336-b5fe908dad5c.jpg"}], "track": {"name": "Mind the Geek"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=yB6FIQPgsWE&pp=0gcJCT8MAYcqIYzv", "description": "What we call virtual is actually physical. Every bit of data we store, move, or erase is represented by a physical state, and every physical system obeys the laws of nature.<br><br>So let’s look beneath the abstractions of our digital world. What are the physical properties of the information we handle? Does data have weight? How much energy does it take to store or delete information? What really travels through our networks, at what speed, and can information ever truly disappear?<br><br>Our curiosity then takes us beyond binary computation into the quantum realm. How do superposition, uncertainty, and measurement challenge our understanding of state and information? How do stable, observable states emerge from a world governed by quantum rules?<br><br>After unveiling the simple math behind AI last year, Marianne now explores the physical foundations of computation. Without a formal background in physics, she follows her curiosity into the depths of our digital systems and resurfaces with what is hidden beneath the abstractions.", "totalFavourites": 114, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-07T12:00:00Z", "to": "2026-10-07T12:50:00Z", "room": "BOF 1", "kind": "Speaker Room", "pause": true, "talk": null}, {"from": "2026-10-07T12:50:00Z", "to": "2026-10-07T13:10:00Z", "room": "Exhibition Hall", "kind": "Break", "pause": true, "talk": null}, {"from": "2026-10-07T13:10:00Z", "to": "2026-10-07T14:00:00Z", "room": "Room 3", "kind": "Conference", "pause": false, "talk": {"id": 8166, "title": "Integration patterns for distributed systems", "speakers": [{"fullName": "Dirk Fröhner", "company": "Amazon Web Services", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-9094138b-d344-4f03-afe9-e4b468b44c70.jpg"}, {"fullName": "Sabarish Sekar", "company": "Amazon Web Services", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-a11d7926-36d1-477b-a2db-da30e0ed9982.jpg"}], "track": {"name": "Architecture & Modernization"}, "audienceLevel": "ADVANCED", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=_CtnBnmYQC0", "description": "Today's applications are interconnected: they expose APIs, publish events, call third-party services, and externalize states. They must therefore address the fundamental challenges of distributed systems, such as out-of-order delivery, retries, idempotence, and partial failures. To address these challenges, architects must carefully evaluate integration options while considering how to manage complex system interactions. In this session, learn about common design trade-offs for distributed systems and how to navigate them with design patterns, illustrated by examples.<br><br>The target audience is from many floors the architect elevator would stop by: Software architects, software developers, IT executives and everyone around - such general software architecture sessions are relevant for many roles in every company in every segment. For those with legacy architectures, it provides an outlook on what migration and modernization transformation they could go through in order to get towards flexible, individually evolvable and scalable systems that are loosely coupled.", "totalFavourites": 440, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-07T13:10:00Z", "to": "2026-10-07T14:00:00Z", "room": "Room 4", "kind": "Conference", "pause": false, "talk": {"id": 21666, "title": "Teaching an Old Handle New Tricks: From Core Reflection to FFM", "speakers": [{"fullName": "Maurizio Cimadamore", "company": "Oracle", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-66579526-c2c5-46b5-87ed-6bb6f34121af.jpg"}, {"fullName": "Viktor Klang", "company": "Oracle", "imageUrl": "https://lh3.googleusercontent.com/a/AAcHTtdkY-Lks0gsRcvl05pqpW8-GOpvuVndojO99ZxUsSy0rgo=s96-c"}], "track": {"name": "Java Language & Platform"}, "audienceLevel": "ADVANCED", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=4ck-T2gaMQ4", "description": "Core reflection has been a cornerstone of Java since Java SE 1.1. It provides a unified model for inspecting classes, invoking methods and accessing fields. But reflection is also inefficient. Every reflective call must check access, handle argument conversions like boxing and, finally, invoke the target.<br><br>Method handles, introduced in Java 7, address this problem with an execution model that closely mirrors the JVM's. A method handle is one resolved executable operation: a typed capability whose access rights and type are established up front. In Java 9, var handles extended this model to fields and array elements.<br><br>In this talk, we’ll show how this trick—moving expensive, one-off setup work out of the hot path—has paid dividends across the Java platform. Method and var handles now sit at the core of many modern runtime features, making string concatenation more efficient, revolutionizing native interop with the Foreign Function & Memory API, and enabling serialization to be redesigned on safer foundations.<br><br>This is both an advanced tour of an overlooked part of the Java runtime and a story of resilient platform design: how the right hammer keeps finding new nails.", "totalFavourites": 149, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-07T13:10:00Z", "to": "2026-10-07T14:00:00Z", "room": "Room 5", "kind": "Conference", "pause": false, "talk": {"id": 7008, "title": "How to survive and thrive as a dev (team) in the exponential age of AI. Real-world AI adoption, smarter ways of working, and lessons from the front lines", "speakers": [{"fullName": "Sander Hoogendoorn", "company": "ibood.com", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-4f2917e1-ef34-47e1-a864-09c5577f5ae8.jpg"}], "track": {"name": "Agentic Engineering & Tooling"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=BLBwQpczk7M", "description": "The AI revolution isn’t coming — it’s already altering how we architect products, ship features, and run engineering teams.<br><br>During this talk, in his signature charismatic style, Sander Hoogendoorn, CTO at iBOOD.com and a seasoned developer with over four decades of coding experience, doesn’t get stuck in theory or hype, but confronts the pressing issues head-on. You’ll get a no-fluff, grounded view from iBOOD — what we’re already doing with AI, how we built it into our systems, and how it shapes the way we work.<br><br>We won’t shy away from the dark side either — vendor lock-in, breaking prompts, model opacity, shifting APIs, and how quickly a dependency can become fragile. These are real risks that shape architectural and organizational decisions we make daily.<br><br>To survive exponential speed, we retired many practices: no Scrum, no rigid ceremonies, no big upfront plans, no pull requests or code reviews. Instead, we embrace working in fluid autonomous microteams, continuous learning, experimentation, and radical adaptability.<br><br>Expect an honest, fast-paced, and experience-driven session — mixing architecture, culture, and practical insight — on what it truly takes for developers and teams to survive and thrive in the age of AI.<br>", "totalFavourites": 717, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-07T13:10:00Z", "to": "2026-10-07T14:00:00Z", "room": "Room 6", "kind": "Conference", "pause": false, "talk": {"id": 22942, "title": "Why Documentation Won’t Write Itself—and AI Won’t Save You", "speakers": [{"fullName": "Christian Heitzmann", "company": "SimplexaCode AG", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-60ea3c3b-3bd0-4920-b014-21bb439cbb51.jpg"}], "track": {"name": "Development Practices"}, "audienceLevel": "BEGINNER", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=A8TBUalnfdc", "description": "For the last nearly two decades, I’ve joined and consulted software teams that all struggled with the same problem: nobody likes writing documentation, and everybody pays the price for it. New developers spend weeks reverse-engineering codebases, architecture lives in people’s heads, and wikis quietly decay into noise.<br><br>With AI now entering the picture, many hope it will fill the gaps. It won’t.<br><br>I’ll show the simple ideas that change everything: how to think about documentation in the right levels, how to keep it close to the code, and how to avoid the decay we all know too well. These are the decisions that have to be made before any tool or process can work.<br><br>The documentation won’t write itself. But there are ways to make it far easier and far more reliable.<br><br>Key take-aways:<br><br>• How to separate architecture, API, and code-level documentation<br>• What “docs as code” means once the slogans are gone<br>• Why missing context stays missing—with or without AI", "totalFavourites": 210, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-07T13:10:00Z", "to": "2026-10-07T14:00:00Z", "room": "Room 7", "kind": "Conference", "pause": false, "talk": {"id": 4051, "title": "CRAcking Compliance - The EU Cyber Resilience Act", "speakers": [{"fullName": "Christian Schabetsberger", "company": "Finxit IT Solutions", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-e4712227-61ca-4e98-85b2-5252890b3760.jpg"}], "track": {"name": "Security, Trust & Compliance"}, "audienceLevel": "BEGINNER", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=QQcsZNf0eWs", "description": "The Cyber Resilience Act (CRA) will be arriving in the European Union in 2027, and with it a lot of new obligations. What we already consider good practices in our software industry today will be required by law tomorrow. In this talk, we will take a look at what's inside the CRA, who will be affected by it, and what new requirements we will have to fulfil. After that, we will take a look at tooling to generate Software Bills of Materials (SBOMs) for our Java, .NET and JavaScript projects, as well as how to visualise and integrate them into existing CI workflows. Last but not least, we will take a look at how to handle the required vulnerability management with (semi-)automated dependency updates by utilising tools like Dependabot or Renovate and how to reduce dependencies with distroless images.", "totalFavourites": 176, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-07T13:10:00Z", "to": "2026-10-07T14:00:00Z", "room": "Room 8", "kind": "Conference", "pause": false, "talk": {"id": 19733, "title": "Bootiful Spring Boot 4", "speakers": [{"fullName": "Josh Long", "company": "the Spring team", "imageUrl": "https://lh3.googleusercontent.com/a-/AOh14GhTAlrBfIHBoWpP1mfcKm-kRON4bdBF_LccGehD=s96-c"}], "track": {"name": "Architecture & Modernization"}, "audienceLevel": "BEGINNER", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=1PtdpItmzTo", "description": "Spring Boot 4.x and Java 25+ have arrived, making it an exciting time to be a Java developer! Join me, Josh Long (@starbuxman), as we dive into the future of Spring Boot with Java 25. We'll learn how to scale your applications and codebases effortlessly, explore the robust Spring Boot ecosystem featuring AI, modularity, seamless data access, security, and cutting-edge production optimizations like Project Loom's virtual threads, Project Leyden, GraalVM, and more. Let's explore the latest-and-greatest in Spring Boot to build faster, more scalable, more efficient, more modular, more secure, and more intelligent systems and services.<br><br>", "totalFavourites": 519, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-07T13:10:00Z", "to": "2026-10-07T14:00:00Z", "room": "Room 9", "kind": "Conference", "pause": false, "talk": {"id": 8171, "title": "0 to 350 Engineers on Claude Code: What Could Go Wrong?", "speakers": [{"fullName": "Nicolas Martignole", "company": "Back Market", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-e4f8b008-e24f-4ca0-a520-acbb98ac703a.jpg"}], "track": {"name": "People, Practices & Career"}, "audienceLevel": "BEGINNER", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=HzbNrEDZkYU", "description": "We are living through a revolution. <br><br>From assisting us in writing code to coordinating a fleet of agents, we find ourselves in the eye of the storm. Coding agents like Claude Code, Copilot, Codex CLI, and Cursor are reshaping our craft and our place within the company.<br><br>I brought Claude Code to my company, Back Market, in June 2025. We were \"behind\" other companies, such as Doctolib. Step by step, we moved from smart autocompletion to writing features end-to-end. Today we have Product Managers who write code, developers who do architecture and design, and managers who build their own internal tools—all with Claude Code. And there's me, looking at how we can control our monthly spending, leading a team of 40 subject-matter experts, with successes (and failures).<br><br>But more broadly, what's the flip side? What happens when a junior developer opens a single pull request with 50 modified files using Claude Code? What happens when one team migrates a module in place of the team that originally owned it, with Claude Code? What are the risks, and how do you stay in control within your company?<br><br>Finally, as developers—whether junior or senior—this asks us to adapt. <br>How do we get up to speed? What does prompting actually mean? How does an agent work? What are Skills? What's the impact on CI/CD? On the Platform engineering teams? On the run side? On upfront design?<br><br>I don't think AI will replace developers. I think developers who use AI can replace us.", "totalFavourites": 386, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-07T13:10:00Z", "to": "2026-10-07T14:00:00Z", "room": "Room 10", "kind": "Conference", "pause": false, "talk": {"id": 4097, "title": "Pragmatic multi-cloud architecture: designing for resilience and portability beyond the hype", "speakers": [{"fullName": "Alexandre Touret", "company": "Magellan", "imageUrl": "https://lh3.googleusercontent.com/a-/AOh14Gi-vA-Ux4ew98kunpGudWlNMR_Olk594JYXJb_I9Q=s96-c"}], "track": {"name": "Cloud Native, Data & Infrastructure"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=mOmuF5fDiUM", "description": "Today, most of our applications are hosted in the cloud. But what if we leveraged multiple providers for a single application or platform?<br><br>The theory is attractive: cherry-picking the best services from each provider to build the ultimate architecture. The reality? Cloud providers that are \"more equal than others\" and a labyrinth of technical complexities—where network latency, fragmented data, and incompatible APIs threaten both your SLAs and your peace of mind.<br><br>In this session, we will tackle the challenge of designing a multi-cloud platform based on a real-world use case.<br><br>From defining bounded contexts to addressing production hurdles, security, and API design, we will navigate the pitfalls inherent to this architecture while highlighting essential best practices.<br><br>Finally, we will explore how a thorough understanding of customer needs and a pragmatic risk analysis can guide design choices to deliver a coherent, end-to-end vision.<br>", "totalFavourites": 69, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-07T13:10:00Z", "to": "2026-10-07T14:00:00Z", "room": "BOF 1", "kind": "Speaker Room", "pause": true, "talk": null}, {"from": "2026-10-07T14:00:00Z", "to": "2026-10-07T14:40:00Z", "room": "Exhibition Hall", "kind": "Break", "pause": true, "talk": null}, {"from": "2026-10-07T14:40:00Z", "to": "2026-10-07T15:30:00Z", "room": "Room 3", "kind": "Conference", "pause": false, "talk": {"id": 11562, "title": "Surviving the \"AI Slopageddon\": How AI shakes the foundations of Open Source", "speakers": [{"fullName": "Raphael Semeteys", "company": "Worldline", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-b486eee1-a8c4-41b6-9825-c2d3c8761c57.jpg"}], "track": {"name": "Development Practices"}, "audienceLevel": "BEGINNER", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=vN9jWqSvJNE", "description": "Vibe Coding promises unprecedented productivity. But for open source maintainers, this revolution feels more like an onslaught. Between the deluge of low-quality Pull Requests (<strong>AI Slop<\/strong>), hallucinated bug reports, and the rise of aggressive autonomous agents, the open-source social contract is broken.<br><br>This presentation explores the <strong>existential threat<\/strong> AI poses to the ecosystem and outlines <strong>new defensive strategies<\/strong> (closing the door, reorganizing the house, machine-adapted governance, etc.).", "totalFavourites": 140, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-07T14:40:00Z", "to": "2026-10-07T15:30:00Z", "room": "Room 4", "kind": "Conference", "pause": false, "talk": {"id": 24212, "title": "GraalVM Next: Layers, Crema, and WebAssembly in Action", "speakers": [{"fullName": "Alina Yurenko", "company": "Oracle", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-a31c43d1-c596-4e24-af3f-078f54609e6c.jpg"}], "track": {"name": "Development Practices"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=OLQ98Ko4p3Q", "description": "What if native images could share code and memory, load new classes at run time, and run applications in the browser?<br><br>In this session, we’ll explore three projects expanding what GraalVM Native Image can do.<br><br>— Native Image Layers introduce a brand-new concept of reusable base images, allowing multiple applications to share code and memory. <br>— Project Crema adds dynamic class loading and execution to native applications — goodbye, closed world!<br>— Web Image (experimental) can compile JVM applications to WebAssembly, bringing libraries and applications directly to browsers and other WebAssembly environments.<br><br>Each project expands a different aspect of Native Image: how applications are packaged, what happens at run time, and where applications can run.<br><br>In this session we’ll see these forward-looking projects in action and discuss where they stand today.", "totalFavourites": 121, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-07T14:40:00Z", "to": "2026-10-07T15:30:00Z", "room": "Room 5", "kind": "Conference", "pause": false, "talk": {"id": 17791, "title": "Consistency Patterns in Event-Driven Architecture", "speakers": [{"fullName": "Emanuel Trandafir", "company": "", "imageUrl": "https://lh3.googleusercontent.com/a/ACg8ocJIeD6DlrYMLqQ25N-MsDC0Oz2dracw1hlS6BqbbRBwEXJINS13=s96-c"}], "track": {"name": "Architecture & Modernization"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=8JuQaWFKk4w", "description": "Distributed systems have a dirty secret. Your message broker swears the domain event is published — others are already listening, already reacting to this new order. But then, in a split second, your database rolls back. A constraint violation. Something breaks. And now the entire system knows about an order that never actually existed.<br><br>This talk covers the patterns that prevent that chaos: the Dual Write problem, Outbox and Inbox patterns for consistency between database and event stream, idempotent consumers, and Sagas — Orchestration and Choreography.<br><br>You'll leave knowing which pattern solves which problem, when to use each, and what you're really trading off with eventual consistency", "totalFavourites": 410, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-07T14:40:00Z", "to": "2026-10-07T15:30:00Z", "room": "Room 6", "kind": "Conference", "pause": false, "talk": {"id": 49252, "title": "Big Runtimes Make Efficient Programs", "speakers": [{"fullName": "Ron Pressler", "company": "Oracle", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-be6279f3-d001-4451-baa8-03a4ca9af02d.jpg"}], "track": {"name": "Java Language & Platform"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=vhDwy1eCXbs", "description": "Every programming language except Assembly has a runtime - some bundled code that isn't a direct output of the compiler - that is used by most programs. Some programming languages, Java among them, have a relatively large runtime. Programming languages with relatively small runtimes tend to extract more information and make more decisions at compile-time, and some may intuit that this makes such programs faster. As we'll see, this intuition is wrong. A large runtime can not only make it more convenient to write many programs but also improve program performance.<br><br>AOT compilation and manual (or statically-determined) memory management introduce performance overheads that can become significant especially in large programs. While the JVM got its start as an effective way to abstract away differences in operating systems and hardware, it quickly became apparent that JIT compilers and moving garbage collectors serve as optimization vehicles for the overheads incurred by low-level languages with smaller runtimes, making the JVM an ideal target for large programs.<br><br>We will look at how big, sophisticated runtimes can make programs more efficient, see why the simplistic view of the convenience/performance tradeoff is wrong and how the real tradeoffs are more complex and interesting.", "totalFavourites": 142, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-07T14:40:00Z", "to": "2026-10-07T15:30:00Z", "room": "Room 7", "kind": "Conference", "pause": false, "talk": {"id": 50107, "title": "Building an Agent Ready Platform", "speakers": [{"fullName": "Timo Salm", "company": "Broadcom", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-93dfac6b-7673-4fca-81c6-aa9fb4a0c084.jpg"}], "track": {"name": "Agentic Engineering & Tooling"}, "audienceLevel": "BEGINNER", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=q58Y2tyRdCE", "description": "Writing an agent has never been easier. In Spring AI it takes a few lines of code to wire up a model, add a few<br>tools, point it at your data and watch it do something that felt impossible two years ago. The demo lands well.<br>Then you try to put it in front of real customers, and the questions start.<br>Which model are you allowed to use in production? Where do the credentials live now? What stops the agent<br>from calling a tool it should never touch? What does one conversation cost?<br>None of this is about the model. It is about the platform underneath it, and it looks a lot like the problem<br>developers hit when they first tried to ship containers.<br>This session shows what platform engineering has to offer next. Model access as a paved road, identity for<br>agents, guardrails you inherit instead of build, and observability that shows every step and what it cost. You will<br>leave knowing what to ask your platform team for, and if you are the platform team, what to build first.", "totalFavourites": 122, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-07T14:40:00Z", "to": "2026-10-07T15:30:00Z", "room": "Room 8", "kind": "Conference", "pause": false, "talk": {"id": 31453, "title": "Architecture Observability and Guardrails", "speakers": [{"fullName": "Victor Rentea", "company": "Freelance", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-51aee41f-0079-4820-98bb-56e70a2e89d3.jpg"}], "track": {"name": "Agentic Engineering & Tooling"}, "audienceLevel": "BEGINNER", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=BOcNjR2lBus&pp=0gcJCT8MAYcqIYzv", "description": "How do you observe and enforce the code quality to prevent AI Slop? The majority of the teams attending my workshops report 100% of their code is AI-generated already for many months. Some even report they often have to fix PRs that business vibe-coded. This talk summarizes the design feedback loops they setup for their agents, as well as techniques to maximize the human mental bandwidth in the code review step. You’ll hear about C4 model, plantuml diagrams, captured sequence diagrams, complexity visualisation, and efficient testing practices.<br>", "totalFavourites": 861, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-07T14:40:00Z", "to": "2026-10-07T15:30:00Z", "room": "Room 9", "kind": "Conference", "pause": false, "talk": {"id": 4086, "title": "AI Made Building Cheap. Now Decisions Are the Bottleneck.", "speakers": [{"fullName": "Dave Sammut", "company": "Equal Experts", "imageUrl": "https://lh3.googleusercontent.com/a/ACg8ocKrgiObZlQZmkuRHWqlDAwuHgNeuknmxFB4KLe9_yQTsjK7YDc-=s96-c"}, {"fullName": "João Rosa", "company": "João Rosa Consulting", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-791e4354-5d69-4aff-8a7c-94c975843c1a.jpg"}], "track": {"name": "People, Practices & Career"}, "audienceLevel": "ADVANCED", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=2pSyF44THEc&pp=0gcJCT8MAYcqIYzv", "description": "AI is transforming software delivery. Code can be generated, tests created, architectures sketched, and implementation options explored in minutes. Building has never been cheaper.<br>Yet many organisations are discovering an unexpected consequence: as execution accelerates, decision-making becomes the real bottleneck.<br>Drawing on consulting engagements across banking, insurance, retail, and telecommunications, this talk explores how AI is changing the economics of software delivery and why decision quality is emerging as a competitive advantage. Rather than focusing on generating code faster, I demonstrate how AI can improve discovery, architecture, and delivery conversations before implementation begins.<br>Through practical examples and live demonstrations, attendees will see how conversations can be transformed into Event Storming maps, Team Topologies views, C4 architecture diagrams, assumptions, risks, and architectural options. These techniques help teams expose hidden complexity, align stakeholders faster, and make better-informed decisions.<br><strong>Key takeaways:<\/strong> Understand why AI shifts the constraint from execution to judgement, learn practical techniques for AI-assisted discovery and architecture, expose risks and assumptions earlier, and balance delivery speed with architectural integrity.<br><strong>Target audience:<\/strong> Software architects, technical leads, senior engineers, engineering managers, enterprise architects, and technology leaders.", "totalFavourites": 326, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-07T14:40:00Z", "to": "2026-10-07T15:30:00Z", "room": "Room 10", "kind": "Conference", "pause": false, "talk": {"id": 19730, "title": "Building LLM Inference Engines in Java with TornadoVM and the NVIDIA Ecosystem", "speakers": [{"fullName": "Thanos Stratikopoulos", "company": "Beestream.ai | TornadoVM", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-1eb3708e-af15-4778-a560-15ebbea2b133.jpg"}, {"fullName": "Michalis Papadimitriou", "company": "Neo4j | University of Manchester", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-85f7f25f-5f2c-4526-bed6-489be66ed5e1.jpg"}, {"fullName": "Orion Papadakis", "company": "TornadoVM", "imageUrl": "https://lh3.googleusercontent.com/a/ACg8ocIQezQ2mlrR6otSHj3OK1aG_zKZMKPfr0c6b75C1Of0ruqBeoY8Lw=s96-c"}], "track": {"name": "Java Language & Platform"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=HO5CpETzywk", "description": "As Java enters the AI era, developers are looking for ways to run local large language models (LLMs)<br>without leaving the JVM. This session presents lessons learned from building GPU-accelerated LLM<br>inference engines natively in Java using TornadoVM, an open-source framework that transparently<br>offloads Java programs to GPUs and other accelerators.<br><br>Beyond generating optimized CUDA code directly from Java, TornadoVM now provides seamless<br>access to the NVIDIA software ecosystem, enabling Java applications to leverage libraries such as<br>cuBLAS, cuDNN, cuFFT, and CUDA runtime APIs without requiring JNI or manually written native<br>code. This allows developers to combine high-level Java programming with the performance of<br>NVIDIA’s AI and HPC libraries.<br><br>Using jitLLM, a lightweight GPU-accelerated inference engine for Llama models, the session explores<br>techniques for supporting quantized data types (FP16, Q8, and Q4), integrating with Quarkus and<br>LangChain4j, and optimizing LLM inference directly in Java. Along the way, attendees will see how<br>modern Java can target GPUs while interoperating with the broader NVIDIA ecosystem.<br>The session concludes by discussing how TornadoVM complements emerging JVM technologies such<br>as Project Babylon and Project Panama, and how these efforts are helping establish Java as a first-<br>class platform for AI, accelerated computing, and high-performance machine learning.", "totalFavourites": 61, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-07T14:40:00Z", "to": "2026-10-07T15:30:00Z", "room": "BOF 1", "kind": "Speaker Room", "pause": true, "talk": null}, {"from": "2026-10-07T15:30:00Z", "to": "2026-10-07T15:50:00Z", "room": "Exhibition Hall", "kind": "Break", "pause": true, "talk": null}, {"from": "2026-10-07T15:50:00Z", "to": "2026-10-07T16:40:00Z", "room": "Room 3", "kind": "Conference", "pause": false, "talk": {"id": 10802, "title": "A Deserter Returns: What the Java community helped me rediscover", "speakers": [{"fullName": "Thierry Chantier", "company": "Dataiku", "imageUrl": "https://lh3.googleusercontent.com/a/ACg8ocJIqLuDzHLmlJCLNs_i3ZQmzlennTw_KQgt3Dz4qdDy_JF2_w=s96-c"}], "track": {"name": "Mind the Geek"}, "audienceLevel": "BEGINNER", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=i_VXe0mNicY", "description": "After several years of Java development, I had left the ecosystem behind. Not out of spite, but out of pragmatism: Python was getting the job done. Beefy CI/CD pipelines, easier to write; daily tools that bent to fit any need; in short, the simple joy of writing a Hello World without filling out three XML files first. The rise of AI cemented Python as the obvious choice. I had no reason left to reopen a Java IDE. None.<br><br>Except that a handful of friends kept the thread alive, with that community, with that ecosystem. A conference here, an article there, and little by little, certain projects started catching my eye. Step by step, I discovered what you could now build CLIs in Java with picocli, with a type system that doesn't lie on top. Then came Quarkus: blazing-fast startup, native compilation, no more excuses about JVM heft. The final piece of the trinity was TamboUI: elegant TUIs and a pleasant DSL, offering a modern, refreshing take on terminal applications, in Java.<br><br>In this talk, let me tell you how Java found its way back into my toolbox and my geeky heart: why I had left, why I thought I'd never come back, and how the community kept my mind open. No sermon, no holy war, just a language and technology lover reconsidering things, and who thinks you might want to take a second look too.<br>", "totalFavourites": 50, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-07T15:50:00Z", "to": "2026-10-07T16:40:00Z", "room": "Room 4", "kind": "Conference", "pause": false, "talk": {"id": 16426, "title": "No Country For Old APIs. Wrapping legacy Java services as MCP tools without rewriting them.", "speakers": [{"fullName": "Željko Kozina", "company": "Chronomill", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-7290d103-d1e2-442b-8434-ddde35301e4f.jpg"}], "track": {"name": "Architecture & Modernization"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=a5cQAl0g2AM", "description": "Somewhere in your estate is a Java service old enough to vote. REST endpoints by the dozen, one SOAP relic nobody will admit to, session auth, and the person who understood it all has retired. It works, which is why nobody touches it. And now the business wants AI agents to use it.<br>Every enterprise is under pressure to connect AI agents to systems that were never designed for them, yet most MCP material assumes a greenfield project or a toy demo. This session addresses the situation attendees actually face: a brownfield estate of REST and SOAP services that cannot be rewritten. It is demo-driven, built on the official MCP Java SDK, Spring AI, and Spring for GraphQL, and it is honest about the failure modes: tool sprawl from auto-generation, auth translation, oversized responses, and unsafe retries against non-idempotent writes. Attendees leave with a reusable pattern set (facade first, curation over generation, read-only first, approval gates) they can apply to their own estate the following week.<br>", "totalFavourites": 185, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-07T15:50:00Z", "to": "2026-10-07T16:40:00Z", "room": "Room 5", "kind": "Conference", "pause": false, "talk": {"id": 9046, "title": "rm -rf self-doubt: Debugging Impostor Syndrome for Developers", "speakers": [{"fullName": "Vincent Mayers", "company": "Neo4j", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-f6ffe4ab-1e88-45a9-b47d-572232f3b9c5.jpg"}], "track": {"name": "People, Practices & Career"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=Tfrt19d3TEA", "description": "\"Whether you think you can or you think you can't – you're right.\"<br><br>In software, we trust the logic of our systems, but the \"human hardware\" running the code often executes a background process of self-doubt. Imposter Syndrome isn't a permanent bug; it's a physiological response hard-coded into our biology. From junior devs facing their first pull request to Java Champions keynote-ing at international conferences, the \"fraud detection\" alert is a universal experience.<br><br>This session deconstructs the neuroscience behind this phenomenon—from the amygdala's \"fight-or-flight\" triggers to the cognitive effects of cortisol. We will move beyond the \"soft skill\" fluff to examine practical, iterative steps for managing these triggers. Learn how to reframe self-doubt as a signal for growth, optimize your response to code reviews, and lean into the discomfort of the unknown to thrive in an industry that changes every week.<br><br>You’ll walk away with tools you can apply immediately, whether you’re debugging unfamiliar code, speaking up in design discussions, or stepping into a bigger role", "totalFavourites": 287, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-07T15:50:00Z", "to": "2026-10-07T16:40:00Z", "room": "Room 6", "kind": "Conference", "pause": false, "talk": {"id": 14463, "title": "When benchmarks go bad - what we learned from measuring performance wrong", "speakers": [{"fullName": "Francesco Nigro", "company": "IBM", "imageUrl": "https://lh3.googleusercontent.com/a/AItbvmlsKs3_saDtZgJ0buTR5LvusOsvlGmdbC7cEeks=s96-c"}, {"fullName": "Holly Cummins", "company": "IBM", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-77051efe-f3d4-4e19-b52a-fcf146ad6d77.jpg"}], "track": {"name": "Development Practices"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=yePre1hOvHE", "description": "The world of performance analysis is littered with flawed claims, cognitive biases, dangerous intuitions, and beguiling fallacies. Both Holly and Franz have been guilty of all of the above. Repeatedly. Especially Holly. But this is a no-judgement zone. Some measurement anti-patterns are subtle, and some are downright counter-intuitive. In this talk, Franz and Holly will explain why measuring performance is important, and talk through some of the ways it can go wrong. That would be depressing if that was all there was, so they’ll also introduce a toolbox of questions and principles that you can use to improve the performance of your own applications.<br>These include:<br><ul><li>How to set up a test system<\/li><li>Recommended load generators<\/li><li>The USE method<\/li><\/ul>", "totalFavourites": 251, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-07T15:50:00Z", "to": "2026-10-07T16:40:00Z", "room": "Room 7", "kind": "Conference", "pause": false, "talk": {"id": 16401, "title": "Beyond encryption at rest: computing on encrypted data", "speakers": [{"fullName": "Andrea Iacono", "company": "", "imageUrl": "https://lh3.googleusercontent.com/a/ACg8ocKiRDaPqgBWULLG0v-gb1k2a_Qm91MkYKsUy_4pXTRW6AsaFXi_=s96-c"}], "track": {"name": "Security, Trust & Compliance"}, "audienceLevel": "BEGINNER", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=ePQyy9sLmsY&pp=0gcJCT8MAYcqIYzv", "description": "Cloud providers encrypt data at rest and in transit, but most applications still decrypt information before processing it. Homomorphic Encryption (HE) challenges this model by allowing computations to be performed directly on encrypted data: the server computes the result without ever seeing the inputs.<br>This talk introduces the fundamentals of HE, from early partially homomorphic cryptosystems to Craig Gentry's 2009 breakthrough, explaining core concepts like ciphertext noise, noise budgets, and bootstrapping in an accessible way. We'll cover how modern schemes like CKKS, BGV, and TFHE differ in what they compute efficiently, and explore practical use cases: confidential AI inference where a model produces predictions without seeing user inputs and financial services where credit scoring operates entirely on encrypted records.<br>We'll also discuss current limitations (performance overhead, ciphertext size, and developer complexity) and how hardware acceleration and compiler tooling are rapidly closing these gaps. Attendees will leave with a clear picture of where HE is practical today and where it is not, and concrete pointers to start experimenting with open-source libraries.", "totalFavourites": 125, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-07T15:50:00Z", "to": "2026-10-07T16:40:00Z", "room": "Room 8", "kind": "Conference", "pause": false, "talk": {"id": 17759, "title": "Kubernetes for Developers", "speakers": [{"fullName": "Alain Regnier", "company": "SCIAM", "imageUrl": "https://lh3.googleusercontent.com/a-/AFdZucoMvtrrwfCGhvKIFfqBfRpLpaU_hbL3lYUoE_Dulw=s96-c"}], "track": {"name": "Cloud Native, Data & Infrastructure"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=AxhLQZqZdIg", "description": "Let's face it... containers and Kubernetes are everywhere!<br>But developers don't necessarily want to become Kubernetes specialists.<br><br>This presentation will focus on what developers need to know to get the most of Kubernetes without having to become a DevOps.<br><br>We will cover:<br><ul><li>modern local development environment (flox, kind...)<\/li><li>building container images (multistage build, build without docker...)<\/li><li>important kubernetes features developers need to know and how to handle them efficiently (requests/limits, graceful shutdown, probes, OCI volumes...)<\/li><li>how to investigate and debug code on kubernetes (kubectl debug, mirrord...)<\/li><li>how to secure applications (SecurityContext, CEL, SBOM, RuntimeClass with gVisor/Kata...)<\/li><li>how to integrate observability with OpenTelemetry<\/li><\/ul><br>The presentation will contain examples and demos with a strong focus on Best Practices.", "totalFavourites": 328, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-07T15:50:00Z", "to": "2026-10-07T16:40:00Z", "room": "Room 9", "kind": "Conference", "pause": false, "talk": {"id": 19713, "title": "Create your own AI Agents without code", "speakers": [{"fullName": "David Gageot", "company": "Docker", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-00adb09a-3b25-4aa0-a9c0-c7a771d40845.jpg"}], "track": {"name": "Agentic Engineering & Tooling"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=EJv0TMNSUjw", "description": "More and more of us use <strong>Coding Assistants<\/strong> that excel at **writing code**.<br><br>They are <strong>good<\/strong> and they are <strong>expensive<\/strong>!<br><br>The same underlying models can be used to write<br>more <strong>specialized, cheaper, more predictable AI agents<\/strong>.<br><br>+ Maybe you need an agent <strong>specialized for your business<\/strong>.<br>+ Or you need a <strong>cheap<\/strong>, disposable one for a quick and dirty task.<br>+ Later, you want <strong>multiple agents<\/strong> to collaborate.<br><br>All of that can be done with no code, leveraging Docker Agent,<br>an open-source project and a real Swiss Army knife for AI agent creation:<br><br>+ Create intelligent agents that solve real problems in minutes, <strong>without code<\/strong>.<br>+ Test, benchmark, and optimize agent behavior systematically through <strong>evals<\/strong>.<br>+ Build collaborative multi-agent architectures with <strong>MCP, ACP and A2A<\/strong>.<br>+ Work with any LLM provider on your own terms: <strong>frontier, local, small, large<\/strong>.", "totalFavourites": 265, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-07T15:50:00Z", "to": "2026-10-07T16:40:00Z", "room": "Room 10", "kind": "Conference", "pause": false, "talk": {"id": 5510, "title": "Quarkus Meets Leyden at the JVM Performance Edge", "speakers": [{"fullName": "Georgios Andrianakis", "company": "IBM", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-95904645-1695-4adf-b24c-41926050b4b4.jpg"}, {"fullName": "Ana-Maria Mihalceanu", "company": "Oracle", "imageUrl": "https://lh3.googleusercontent.com/a-/AOh14Gj1OS6OpAzuwBKwoUuCi9gxvNPvdmVA7nbW8lg3mg=s96-c"}], "track": {"name": "Java Language & Platform"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=cbSl8UVdMVg", "description": "Project Leyden raises a hard question for Quarkus: can we benefit from faster JVM startup and warm-up without undoing the assumptions that make Quarkus fast today? After years of optimizations to reduce startup costs, profiling JVM Quarkus applications still points to familiar hotspots: class loading and reading from JAR files.<br><br>Quarkus has already pushed hard in these areas through build-time processing, custom packaging, and class loading strategies. Leyden promises a major shift for JVM applications, but combining it with Quarkus is not just about enabling a new feature. Some of Leyden’s current constraints interact directly with optimizations Quarkus relies on, forcing us to question where responsibilities should sit between the framework, the JVM, and the application packaging model.<br><br>This talk shares findings from experimenting with Project Leyden inside Quarkus, and you will learn what to watch for when fine-tuning startup and warm-up behavior, and how to reason about the trade-offs between Quarkus’ existing optimizations and Leyden’s emerging JVM-level capabilities. Expect concrete findings, performance observations, current limitations, experimental prototypes, and practical lessons for developers who want to prepare their Quarkus applications for the next generation of JVM startup optimization.", "totalFavourites": 90, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-07T15:50:00Z", "to": "2026-10-07T16:40:00Z", "room": "BOF 1", "kind": "Speaker Room", "pause": true, "talk": null}, {"from": "2026-10-07T16:30:00Z", "to": "2026-10-07T18:30:00Z", "room": "Exhibition Hall", "kind": "Meet and Greet (until 19h30)", "pause": true, "talk": null}, {"from": "2026-10-07T16:50:00Z", "to": "2026-10-07T17:50:00Z", "room": "BOF 1", "kind": "BOF", "pause": false, "talk": {"id": 24206, "title": "GraalVM Community BOF", "speakers": [{"fullName": "Thomas Wuerthinger", "company": "Oracle", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-4f0ca29a-e775-47ce-be77-6e01a95e9abe.jpg"}, {"fullName": "Fabio Niephaus", "company": "Oracle", "imageUrl": "https://lh3.googleusercontent.com/a/ACg8ocI36wdxsTUDlY7nGdiA5a2FaCduN2Tb9WYzBhsx_07uMvIollc8PQ=s96-c"}, {"fullName": "Alina Yurenko", "company": "Oracle", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-a31c43d1-c596-4e24-af3f-078f54609e6c.jpg"}], "track": {"name": "Java Language & Platform"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "", "description": "GraalVM is taking exciting leaps forward, powered by its community of users, contributors, and early adopters.<br><br>Join core members of the GraalVM team to discuss what’s next for the project. We’ll share updates on Crema, which enables dynamic class loading to Native Image and brings together the best of the AOT and JIT worlds. We’ll also cover the latest developments in GraalOS, GraalPy, GraalWasm, and other areas across the GraalVM ecosystem, as well as GraalVM-related updates in Micronaut, Quarkus, and Spring. Finally, we’ll take a sneak peek at the project roadmap and what the users can expect next.<br><br>Bring your questions, feedback, and ideas for the future. This BOF is your opportunity to connect with the community and help shape the next chapter of GraalVM!", "totalFavourites": 36, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-07T16:50:00Z", "to": "2026-10-07T17:50:00Z", "room": "BOF 2", "kind": "BOF", "pause": false, "talk": {"id": 19707, "title": "Getting started with speaking: Your first conference talk", "speakers": [{"fullName": "Bert Jan Schrijver", "company": "OpenValue", "imageUrl": "https://avatars.githubusercontent.com/u/4464854?v=4"}], "track": {"name": "People, Practices & Career"}, "audienceLevel": "BEGINNER", "language": null, "youtubeUrl": "", "description": "Have you ever wondered what it takes to become a conference speaker? Where do you start? Which topic do you pick? And how do you actually deliver a talk that lands?<br>In this session, a group of experienced speakers will answer these questions and more. We'll share tips on getting started, writing proposals that get accepted, preparing your material, and delivering a great presentation. We'll talk about what worked, what didn't, and the lessons we learned along the way. You'll leave with practical takeaways - and the confidence to submit your first proposal.", "totalFavourites": 94, "slidesUrl": "", "teamRating": null}}]}, {"name": "Thursday", "date": "2026-10-08", "slots": [{"from": "2026-10-08T06:30:00Z", "to": "2026-10-08T07:30:00Z", "room": "Exhibition Hall", "kind": "Breakfast", "pause": true, "talk": null}, {"from": "2026-10-08T07:30:00Z", "to": "2026-10-08T08:20:00Z", "room": "Room 3", "kind": "Conference", "pause": false, "talk": {"id": 9023, "title": "Rewriting the rules: How AI transforms engineering and inspiring young minds", "speakers": [{"fullName": "Ayoub Hammou Ahabchane", "company": "ING", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-51e04d12-13b3-4cc8-bb6b-1ef8f869b597.jpg"}, {"fullName": "Kamel Zaraoui", "company": "ING", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-28ae1d02-a57f-4fa1-b5fe-8010caf6a1cd.jpg"}], "track": {"name": "Mind the Geek"}, "audienceLevel": "BEGINNER", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=eSSPOCeoF0c", "description": "<strong>Description<\/strong><br>This talk challenges the perception that innovation cannot thrive in highly regulated environments like banking. As engineers working within strict rules and predefined tech stacks, we showcase how AI is actively transforming our daily work. We explore concrete initiatives such as instruction files, agent-based automation, skills-driven architectures, emerging agentic hubs and internal prompt libraries that enhance knowledge sharing. We also highlight how tools like Copilot significantly boost developer productivity.<br>Beyond enterprise use, we share our involvement in ING’s Devoxx4Kids initiative, where we inspire children aged 7-14 to explore technology. We present two platforms we developed: <strong>CodeKids Lab<\/strong>, which teaches programming through playful interaction and <strong>Cybersecurity Lab<\/strong>, which raises awareness of digital threats in an engaging way. AI plays a key role in enabling both innovation and education.<br><br><br><strong>Key Takeaways<\/strong><br><ul><li>AI can thrive even in constrained, regulated environments<\/li><li>Tangible gains in developer productivity through AI tooling<\/li><li>AI can extend beyond business value to create social impact<\/li><li>A real example of engineers turning curiosity into meaningful initiatives<\/li><\/ul><br><br><strong>Target Audience<\/strong><br>This presentation targets software engineers, tech leads and innovation enthusiasts working in regulated industries, as well as developers interested in applied AI. It also appeals to educators and professionals passionate about using IT for social good and inspiring the next generation.", "totalFavourites": 151, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-08T07:30:00Z", "to": "2026-10-08T08:20:00Z", "room": "Room 4", "kind": "Conference", "pause": false, "talk": {"id": 25048, "title": "Java on Kubernetes Without Container Images: The WebAssembly Way", "speakers": [{"fullName": "Bruno Borges", "company": "GitHub", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-fd56814f-d6c5-4009-8f3d-9c9f8d2cd8f2.jpg"}], "track": {"name": "Cloud Native, Data & Infrastructure"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=fszyRIZXjQM", "description": "Every time you ship a Java service to Kubernetes, you ship a base image, a bundled JDK, and an OS layer. None of which you wrote besides your application code and the selection of dependencies, but all of which you must monitor and regularly patch. The real artifact you care about, your application JAR and its dependencies, are buried inside 250 MB of packaging you never wanted to own. WebAssembly already solved this. With KWasm, the Wasm runtime lives on the node, the developer ships only a .wasm module as an OCI artifact, and a RuntimeClass tells Kubernetes to execute it. There is no Dockerfile, no container image involved at all.<br><br>Most Kubernetes users know that \"runtimeClassName: kata\" or \"runtimeClassName: wasm\" routes a pod to a different executor. Few know how this works with the containerd Runtime v2 TTRPC protocol, OCI bundle assembly, overlay filesystems, and runc delegation that make all this possible.<br><br>In this talk we walk through how the KWasm analogy actually maps cleanly to Java, and what custom containerd shims, node provisioners, and CRDs can actually do: allow you to build your own Kubernetes-based platform (and quite easily with agentic AI). We will explore a new open source project called Brewlet.sh with live coding: its CLI <code>brewlet push target/app.jar<\/code>, the Kubernetes deployment approach <code>kubectl apply<\/code>, and see in practice how a Spring Boot service runs on Kubernetes without a single container image in sight.", "totalFavourites": 225, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-08T07:30:00Z", "to": "2026-10-08T08:20:00Z", "room": "Room 5", "kind": "Conference", "pause": false, "talk": {"id": 16414, "title": "From vibe coding to harness engineering: modernizing a regulated environment with AI", "speakers": [{"fullName": "Anyul Rivas", "company": "GFT", "imageUrl": "https://lh3.googleusercontent.com/a-/AFdZuco54-nbk6MLvqBg8AALCdJ63k0A6GKL0rnaPhQXAPY=s96-c"}], "track": {"name": "Agentic Engineering & Tooling"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=zEUSFvDOiCo", "description": "Migrating a banking mainframe to the cloud under fluctuating security regulations in three months seemed like an impossible mission. AI (agents, MCP tools) was the force multiplier that made it possible, but it demanded a paradigm shift. This session dissects the evolution from the illusion of vibe coding—generating code through fluid conversations—to the rigorous discipline of harness engineering.<br><br>When AI writes the code, software craftsmanship evolves. The focus is no longer on syntax, but on building safety nets. We will explore how to tame automated code generation in hostile and highly regulated environments by building relentless harnesses: Spec-Driven Development, evolutionary pipelines, and continuous validation.<br><br>Key Points<br>Evolution of Craftsmanship: The shift from typing code to orchestrating, limiting, and auditing systems generated by multiple sub-agents.<br><br>Harness Building: Using extreme testing (integration, test containers, environment simulation) to contain and certify the behavior of generated code.<br><br>Spec-Driven Development: The specification as a single, unbreakable contract between business, security, and AI agents.<br><br>Radical Pragmatism: How to maintain agility and design principles when the rules of the regulated environment change daily.<br>", "totalFavourites": 538, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-08T07:30:00Z", "to": "2026-10-08T08:20:00Z", "room": "Room 6", "kind": "Conference", "pause": false, "talk": {"id": 9035, "title": "Toxic Flows in MCP Servers and Skills: What Your Agent Blindly Trusts", "speakers": [{"fullName": "Brian Vermeer", "company": "Snyk", "imageUrl": "https://lh3.googleusercontent.com/a/ACg8ocIVtHtowJv_NiNRnihOsjh4F37Gwk5jjlcoLoxADz1WPzaLlDTS=s96-c"}], "track": {"name": "Security, Trust & Compliance"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=c4F7Iy3XqaY", "description": "AI agents don't just trust MCP servers. They trust Skills too. Both are attack surfaces, yet most teams treat neither as part of the same trust model.<br><br>In this talk, we introduce toxic flows: trust paths through an agent stack where tool descriptions, MCP responses, and Skill definitions can leak sensitive context, manipulate agent decisions, and trigger unintended actions without the model violating a single instruction. We demonstrate this live.<br><br>This session is not about adding authentication or wrapping everything in TLS. It's about understanding how trust failures emerge, how they mirror familiar software risks like dependency confusion and unsafe deserialization, and how to design MCP servers and Skill integrations that reduce trust, contain blast radius, and keep agent systems defensible.<br><br>Attendees will leave with a practical framework for identifying trust boundaries, evaluating agent integrations, and hardening their AI stack against toxic flows.<br>", "totalFavourites": 357, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-08T07:30:00Z", "to": "2026-10-08T08:20:00Z", "room": "Room 7", "kind": "Conference", "pause": false, "talk": {"id": 19748, "title": "Snake in 10 Lines: Learning More by Coding Less", "speakers": [{"fullName": "Guus de Wit", "company": "adesso", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-df4a0ee3-439b-464e-94f4-33a5dce8a655.jpg"}], "track": {"name": "Mind the Geek"}, "audienceLevel": "BEGINNER", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=LD2tKMpToYg", "description": "Can you create a complete game with just 10 lines of code? That was the quest I set myself when recreating the classic game Snake in as few lines as possible. Let me tell you: I was not ready for the types of challenges I would face. For example, just registering button presses was not as straightforward as I had hoped.<br><br>Through live coding, I will show you how I overcame these obstacles and distilled Snake to its absolute essence. What key elements make this game instantly recognizable? By only using tools from the JDK, we will end up with a minimal code base and if not award-winning, at least a playable version of Snake.<br><br>Striving for conciseness led me to a deeper understanding of the code. I will show how constraints push us to think outside the box and lead to more creative solutions. Moreover, my approach can be applied to any problem. Sometimes the best way to understand code is by seeing how little of it you actually need!", "totalFavourites": 162, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-08T07:30:00Z", "to": "2026-10-08T08:20:00Z", "room": "Room 8", "kind": "Conference", "pause": false, "talk": {"id": 11556, "title": "223 Pull Requests in 11 Days: The Recipe for Building Real Software with AI Agents", "speakers": [{"fullName": "Julien Dubois", "company": "GitHub", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-832ab0d0-7760-423f-a78e-7f767c7e95b8.jpg"}], "track": {"name": "Development Practices"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=0A2jqCqSIjg", "description": "I've always wanted to create a developer UI for Spring Boot, but the task was massive. The project I ended up doing has 83,000 lines of code, 116 test suites... The honest by-hand estimate for one experienced developer: 6.5 to 8.5 months.<br><br>I did it in about 11 days, shipping version 1 after less than 2 weeks.<br><br>Not by typing faster: I didn't even open my IDE. I did this by managing a fleet of AI agents: 223 merged pull requests, around 20 a day, with the agents doing all the scaffolding, the panels and the tests while I architected, reviewed and steered. That's roughly a 12–17× reduction in human effort, as measured from my git history and PR metadata.<br><br>This talk is about showing you the recipe for delivering
