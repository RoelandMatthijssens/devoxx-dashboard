at this speed, using modern AI tools. I'll show you how to run it: write the specifications, the test harness, running agents in parallel... And working differently: prep the agents in the afternoon, let them build overnight, merge the results over coffee the next day.<br><br>And as a bonus, we get a great new Spring Boot developer console!", "totalFavourites": 631, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-08T07:30:00Z", "to": "2026-10-08T08:20:00Z", "room": "Room 9", "kind": "Conference", "pause": false, "talk": {"id": 5503, "title": "AI without spaghetti: Clean architecture in the age of AI", "speakers": [{"fullName": "Maarten Vandeperre", "company": "Red Hat", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-909df07a-dfbf-40e8-9065-be12fa662faf.jpg"}, {"fullName": "Lutske van der Meer", "company": "Craftsmen", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-de0a5aeb-dc2b-4ea6-91e0-77d10cdc61c4.jpg"}], "track": {"name": "Development Practices"}, "audienceLevel": "BEGINNER", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=E--oDq3X74E", "description": "Is your shiny new AI feature already tangled in a plate of spaghetti code, with helper classes sticking out like rogue meatballs and surprise side effects splattering everywhere? In this session, we follow a short story (i.e., explain our experiment) of a small chatbot named Leo that grows into a full‑blown platform, showing how careless choices turn neat experiments into costly traps. We then flip the script and refactor the same product into a scalable, enterprise-ready architecture using Clean Architecture. Drawing clear lines between domain, application, and infrastructure so that models can change without breaking everything else. By the end, you will see that good structure is not a luxury, but the only way to keep your AI moving fast without regrets.<br><br>What we cover<br><br>- The hidden cost of “just ship it” when models, data pipelines, and prompts keep changing<br>- Where Clean Architecture fits in a modern AI stack: domain, ports, adapters, and model gateways<br>- Demo: Route simple queries to a local LLM and advanced ones to the cloud, in minutes, not days.<br>- Pitfalls we hit in real projects and the patterns that saved us<br><br>What you will learn<br><br>- How to spot early signs of architectural decay in AI projects<br>- A step‑by‑step guide to isolating AI concerns from business rules<br>- Practical tips for introducing structure into an existing “AI spaghetti” codebase<br>", "totalFavourites": 265, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-08T07:30:00Z", "to": "2026-10-08T08:20:00Z", "room": "Room 10", "kind": "Conference", "pause": false, "talk": {"id": 23527, "title": "Project Detroit: From Foreign Libraries to Foreign Language Runtimes", "speakers": [{"fullName": "Maurizio Cimadamore", "company": "Oracle", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-66579526-c2c5-46b5-87ed-6bb6f34121af.jpg"}], "track": {"name": "Java Language & Platform"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=JWFZY0aJTjg", "description": "Interacting with foreign libraries from Java has never been easier, thanks to the Foreign Function & Memory (FFM) API. But interacting with entire foreign language runtimes, like JavaScript or Python, remains hard.<br> <br>Historically, Java tried to solve this by rewriting these runtimes in Java. Nashorn, introduced in JDK 8, successfully brought JavaScript to Java applications. However, due to increasing maintenance costs and compatibility lags, it was deprecated in Java 11 and later removed in Java 15.<br><br>Project Detroit paves a new way forward: instead of implementing bespoke language runtimes from scratch, it leverages FFM to embed industry-standard native runtimes like V8 and CPython in the safety and comfort of your Java application.<br><br>This session is a deep dive into the obscure art of runtime bridging. From juggling two garbage collectors to avoiding virtual thread pinning, we will show what really happens when the JVM rubber meets the foreign road.", "totalFavourites": 107, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-08T07:30:00Z", "to": "2026-10-08T08:20:00Z", "room": "BOF 1", "kind": "Speaker Room", "pause": true, "talk": null}, {"from": "2026-10-08T08:20:00Z", "to": "2026-10-08T08:40:00Z", "room": "Exhibition Hall", "kind": "Break", "pause": true, "talk": null}, {"from": "2026-10-08T08:40:00Z", "to": "2026-10-08T09:30:00Z", "room": "Room 3", "kind": "Conference", "pause": false, "talk": {"id": 52102, "title": "Hey Belfius! Meet our new bank AI assistant—and discover how we’re building and securing AI across Belfius.", "speakers": [{"fullName": "Nicolas Goosse", "company": "Belfius", "imageUrl": null}], "track": {"name": "Development Practices"}, "audienceLevel": "BEGINNER", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=4hXQoN8co80", "description": "Reimagining everyday finances through AI, from answering questions to anticipating needs and taking action. Discover how Hey Belfius is making the customer experience more personal, proactive and seamless.<br><br>Discover how we built our AI Personal Assistant to answer concrete customer questions faster (e.g., \"How much do I spend on restaurants?\") and turn AI into a trusted companion for everyday banking.<br><br>But building innovative AI solutions is only part of the challenge. How do we balance AI innovation at Belfius with security? Join us to find out.<br><br>Meet our AI security approach:<br><br><ul><li>Using AI for security: Mythos and new techniques<\/li><li>Securely using AI for development: dos and don'ts<\/li><li>Handling malicious AI usage<\/li><\/ul><br>", "totalFavourites": 128, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-08T08:40:00Z", "to": "2026-10-08T09:30:00Z", "room": "Room 4", "kind": "Conference", "pause": false, "talk": {"id": 21657, "title": "Reflect, Transform, Accelerate: Bringing GPU Computing to Java", "speakers": [{"fullName": "Juan Fumero", "company": "Java Platform Group - Oracle", "imageUrl": "https://lh3.googleusercontent.com/a-/AOh14Ght9T258iuEoSietb6uF8idCUEZukx0rIGQMYGSWQ=s96-c"}], "track": {"name": "Java Language & Platform"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=0-1IGpVrFLQ", "description": "<p>Java’s code reflection API, developed in OpenJDK Project Babylon, opens up a new path for targeting foreign programming models directly from Java, including GPUs. This talk introduces the Heterogeneous Accelerator Toolkit (HAT), a Java parallel programming framework to accelerate modern workloads on specialised hardware through its three core stages: reflect, transform, and accelerate.<br><p><br><p>The reflect phase introduces the basics of code reflection and its key concepts, making the session accessible to developers new to the API. We then show how HAT reflects Java compute code into an analysable code model, transforms that model into a GPU-friendly representation, and accelerates execution by offloading selected computations to OpenCL or CUDA.<br><p><br><p>Then, this talk shows a set of examples including tensor-core programming and matrix multiplication, fundamental workloads for AI and natural-language processing. The talk also covers performance analysis and tuning of the CUDA backend with NVIDIA Nsight Compute and Nsight Systems, from profiling generated kernels to identifying optimisation opportunities.", "totalFavourites": 132, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-08T08:40:00Z", "to": "2026-10-08T09:30:00Z", "room": "Room 5", "kind": "Conference", "pause": false, "talk": {"id": 14457, "title": "Coder, Coach, Catalyst - using questions to make people grow", "speakers": [{"fullName": "Martin Mazur", "company": "Mazur & Co", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-b8a1d998-1999-4ed9-b607-cf9cef8e59e4.jpg"}], "track": {"name": "People, Practices & Career"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=yhk1qvy6A_4", "description": "Asking the right questions is more powerful than having the right answers. As technologists, we quickly jump into solution mode and try to help by offering solutions and sometimes even taking on other people's problems as our own.<br><br>This is not our fault; we've been trained this way. However, computer problems and people's problems are often very different, and solving or taking on somebody else's problem not only burdens us but also robs them of an opportunity to grow.<br><br>If you feel like every problem in your organization or team constantly gravitates towards you, if you wonder why people just don't \"learn this stuff,\" or if you are looking to become better at helping others grow, this talk is for you!<br><br>In this talk, we will go over basic coaching skills to help you help others - everything from properly listening to asking the right questions. We'll cover different formats from impromptu coaching to more formal coaching and how to use coaching skills to coach up and sideways in your organization.<br><br>Come to this talk if you are interested in making the people around you grow and excel and, in the process, create more time to work on your problems, not theirs.", "totalFavourites": 411, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-08T08:40:00Z", "to": "2026-10-08T09:30:00Z", "room": "Room 6", "kind": "Conference", "pause": false, "talk": {"id": 8169, "title": "How to Architect Green Software", "speakers": [{"fullName": "Ioannis Kolaxis", "company": "Accenture", "imageUrl": "https://lh3.googleusercontent.com/a/ACg8ocJPsPavZKJoz3GJkmJ0SRkTbEPd96EJotlWK3x9Fl082Dw=s96-c"}], "track": {"name": "Architecture & Modernization"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=bqwtnKLU35E", "description": "Every architecture decision carries a sustainability trade-off. A greener data center may sit farther from users, increasing latency. Going serverless eliminates idle compute waste but introduces cold starts and the complexity of maintaining multiple functions.<br><br>This session explores the tension between sustainability and the other \"-ilities\" (maintainability, portability, availability, performance) and presents practical techniques to reduce energy use, carbon footprint, and operating costs.<br><br>You will leave the session with a concrete catalog of trade-offs you can apply to your next project.", "totalFavourites": 213, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-08T08:40:00Z", "to": "2026-10-08T09:30:00Z", "room": "Room 7", "kind": "Conference", "pause": false, "talk": {"id": 22947, "title": "High-Performance Java-Native AI with CUDA and the Vector API", "speakers": [{"fullName": "Zoran Sevarac", "company": "Deep Netts ", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-c08270b6-3020-4fc8-a6aa-395616d4bd0f.jpg"}], "track": {"name": "Java Language & Platform"}, "audienceLevel": "ADVANCED", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=8NURE3I4AJQ", "description": "Historically, high-performance AI workloads have often depended on Python ecosystems, JNI-based bindings, or complex native integrations, leaving Java as a secondary choice. But the Java platform has changed dramatically. With the Foreign Function & Memory (FFM) API, the Vector API, and modern JVM capabilities, Java is becoming a first-class platform for AI development.<br><br>In this session, we'll show how the Foreign Function & Memory API and the Vector API enable a fully Java-native AI stack capable of running efficiently on both GPUs and CPUs. Using the latest release of Deep Netts, we'll demonstrate direct CUDA integration through the FFM API—without JNI or Python—and CPU acceleration using the Vector API for SIMD execution.<br><br>We'll present the architecture behind this approach, explain key implementation decisions, and compare it with traditional JNI- and Python-based solutions. The session also includes a real-world enterprise use case: AI-powered fraud detection, where low-latency inference and predictable performance are critical for banking and payment systems.<br><br>Whether you're interested in modern Java, high-performance computing, or enterprise AI, you'll leave with a practical understanding of how FFM, the Vector API, and GPU acceleration are transforming Java into a first-class platform for building and deploying production AI applications.", "totalFavourites": 132, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-08T08:40:00Z", "to": "2026-10-08T09:30:00Z", "room": "Room 8", "kind": "Conference", "pause": false, "talk": {"id": 9032, "title": "Agents With Seatbelts: Practical Ways to Keep AI Code Gen Under Control", "speakers": [{"fullName": "Jonathan Vila López", "company": "GK Software", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-f359c583-9652-403e-8cf9-20a2e4265cef.jpg"}], "track": {"name": "Development Practices"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=d1SJXp9QeWE&pp=0gcJCT8MAYcqIYzv", "description": "In this session I will share <strong>best practices<\/strong> for using MCP setups and AI <strong>Agents<\/strong> in real development workflows 🤖. The goal is to improve both <strong>quality<\/strong> and <strong>security<\/strong>, since even with all the excitement around these tools, it’s still very easy to create confusing interactions, accidental data exposure, or Agents that trigger actions we never intended.<br><br>I will also present r<strong>eports comparing how different LLM models generate code<\/strong>, showing clear differences in stability, output consistency, and the amount of guidance each model needs to avoid mistakes.<br><br>And last but not least, I will talk about the elephant in the room: <strong>metrics 📏<\/strong>. How do we measure our improvement using AI? Is it something companies are doing right? Spoiler alert ... no 😰<br><br>The talk focuses on helping teams build <strong>more reliable, productive, and secure AI workflows<\/strong>, making AI code generation a real benefit rather than a risky experiment 😅.", "totalFavourites": 675, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-08T08:40:00Z", "to": "2026-10-08T09:30:00Z", "room": "Room 9", "kind": "Conference", "pause": false, "talk": {"id": 22905, "title": "When ORM Becomes OMG: Performance Pitfalls in JPA and Friends", "speakers": [{"fullName": "Jos Roseboom", "company": "EasingYou", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-bc6b28d6-203a-4331-8206-f63ac80f7245.jpg"}], "track": {"name": "Cloud Native, Data & Infrastructure"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=ePBmAdRYl10", "description": "JPA makes database interaction feel almost magical—until your app grinds to a halt. In this talk, we’ll take a tour through the common (and not-so-common) performance pitfalls that turn object-relational mapping into an object-relational mess. From data loading surprises to connection mismanagement, we’ll explore real-world issues using a sample app: the FunFactStore, where fun facts are sold, but bugs are free.<br><br>We’ll dig into how seemingly harmless libraries can sometimes do more harm than good, and how tooling can help you spot trouble before your users do. Whether you’re using Spring Data JPA, navigating tricky transaction boundaries, or just wondering why things suddenly got slow, this session offers practical insights—and maybe a few fun facts.", "totalFavourites": 269, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-08T08:40:00Z", "to": "2026-10-08T09:30:00Z", "room": "Room 10", "kind": "Conference", "pause": false, "talk": {"id": 5541, "title": "Dream Machines & Walled Gardens", "speakers": [{"fullName": "Anders Norås", "company": "Indipendant ", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-a2db74e7-a445-4ab1-b7a8-4598218cf7f4.jpg"}], "track": {"name": "Mind the Geek"}, "audienceLevel": "BEGINNER", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=am8adCMJQzk", "description": "Ted Nelson was a troublemaker. In 1974, frustrated by the closed and bureaucratic world of computing, he wrote Computer Lib/Dream Machines, a book that was part manifesto and part blueprint for a digital future. Nelson saw computers not as tools of control but as portals to personal freedom, creativity and interconnected knowledge. He championed hypertext long before the web, called out the dangers of technical jargon designed to exclude ordinary people and fought for systems that put users in charge.<br><br>This talk tells the story of Computer Lib, the man behind it and the philosophy that shaped it. It explores how Nelson’s ideas could have led to a very different digital world, one built around open, decentralised knowledge rather than the walled gardens and algorithmic control we have today. What if his vision had won? What would the internet look like if computing had followed the path of Computer Lib instead of Big Tech?<br><br>Nelson once wrote that “most authority is malignant.” This is a talk about the man who wanted to dismantle it and the future we lost when the world ignored him.", "totalFavourites": 102, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-08T08:40:00Z", "to": "2026-10-08T09:30:00Z", "room": "BOF 1", "kind": "Speaker Room", "pause": true, "talk": null}, {"from": "2026-10-08T09:30:00Z", "to": "2026-10-08T09:50:00Z", "room": "Exhibition Hall", "kind": "Break", "pause": true, "talk": null}, {"from": "2026-10-08T09:50:00Z", "to": "2026-10-08T10:40:00Z", "room": "Room 3", "kind": "Conference", "pause": false, "talk": {"id": 25671, "title": "State of Agentic Coding", "speakers": [{"fullName": "Daniela Petruzalek", "company": "Google Cloud", "imageUrl": "https://lh3.googleusercontent.com/a/ACg8ocJALSmaAeQ2KPyjkQq0mv6gykwBqgZXif1g3KZyFjCqQDqQZOpEUw=s96-c"}], "track": {"name": "Development Practices"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=nHRSwiFNQ9E", "description": "As AI-assisted coding evolves from simple autocomplete to autonomous agents, developers need new mental models and tools to maintain productivity and trust. In this session, we are going to revisit the major developments in agentic coding from over the past few months, from MCP to skills and beyond; discuss how to improve trust in your agents and take a tour of the new Google Antigravity ecosystem. Every technique discussed will be paired with a live demo using practical examples of day to day development so we can see the coding agent in action. Supporting materials for this session can be found at: <u>https://github.com/danicat/state-of-agentic-coding<\/u><br>", "totalFavourites": 548, "slidesUrl": "https://speakerdeck.com/danicat/devoxx-2026-state-of-agentic-coding", "teamRating": null}}, {"from": "2026-10-08T09:50:00Z", "to": "2026-10-08T10:40:00Z", "room": "Room 4", "kind": "Conference", "pause": false, "talk": {"id": 14452, "title": "Quixotic: Pure Java Inference at Native Speed", "speakers": [{"fullName": "Alfonso² Peterssen", "company": "Quixotic AI", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-f06094d8-3426-4f3c-aaf4-9e8556fdb4da.jpg"}], "track": {"name": "Agentic Engineering & Tooling"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=S7x4DxwRnk4", "description": "<strong>AI for Java, in Java.<\/strong><br><strong>AI sovereignty for the world's most trusted runtime.<\/strong><br><br>What if AI on the JVM were just one Maven dependency away? AI in a jar.<br><br>What if AI on the JVM needed no Python, no Docker containers, no native wrappers, no external processes, no HTTP requests?<br><br>What if AI on the JVM ran at native speed on plain CPUs, and sometimes even outperformed native inference engines?<br><br>What if every component of AI on the JVM, from tokenization to model formats, quantization, inference algorithms and prompt caching, were a pure-Java building block?<br><br>What if AI on the JVM could not only read and write, but also hear and see?<br><br>What if AI on the JVM were completely free, open source and built on open standards?<br><br>This talk shows how inference is built using pure Java and how to make local AI run fast on ordinary CPUs. You'll leave knowing how modern LLMs actually work under the hood, how the Vector API and quantized matrix multiplication kernels close the gap with native engines, and how to add local inference to your own Java application with a single dependency.<br><br>Come for the live demos: Gemma 4, LFM 2.5+, gpt-oss, Qwen 3.5+, Ministral 3, Granite 4.1+ and Nemotron 3+ on a vanilla JVM, at native speed. Text, audio and vision demos included.", "totalFavourites": 80, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-08T09:50:00Z", "to": "2026-10-08T10:40:00Z", "room": "Room 5", "kind": "Conference", "pause": false, "talk": {"id": 23543, "title": "The Yearly Java Performance Update for 2026", "speakers": [{"fullName": "Per-Ake Minborg", "company": "Oracle", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-a388bc3b-5180-411a-a4a7-5631e4341892.jpg"}], "track": {"name": "Java Language & Platform"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=rNOzf12RORI", "description": "Java gets faster every year—often without developers changing a single line of application code. But what actually changed inside the JDK, which improvements matter to real applications, and how do the engineers working on Java know that an optimization is truly an improvement?<br><br>Returning to Devoxx for the yearly Java performance update, we will explore a curated selection of performance work delivered since last year. We will visit the standard libraries, the HotSpot runtime, the JIT compilers, and the garbage collectors to see how improvements at every layer combine to make modern Java applications faster, more scalable, and more resource-efficient.<br>Along the way, we will examine enhancements to startup and warmup, allocation and memory footprint, garbage-collection throughput, virtual-thread scalability, vectorization, and frequently used library operations. For selected optimizations, we will look beneath the API to understand the implementation techniques involved—and see why a seemingly small change can sometimes produce a surprisingly large result.<br><br>Attendees will learn which improvements arrive automatically when upgrading, which require explicit configuration or particular coding patterns, and how to evaluate their impact on real workloads. Expect measurements, implementation details, practical advice, and a glimpse of the performance work already taking shape for future Java releases.<br>Upgrade your JDK, bring your benchmarks—and stay on the fast path.", "totalFavourites": 367, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-08T09:50:00Z", "to": "2026-10-08T10:40:00Z", "room": "Room 6", "kind": "Conference", "pause": false, "talk": {"id": 21671, "title": "The Rise of Agent Enablement: Coding Agents Don't Scale Themselves. Neither Do Your Teams.", "speakers": [{"fullName": "Patrick Debois", "company": "Tessl", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-481871d5-5634-4b17-bee7-759446ce2816.jpg"}], "track": {"name": "People, Practices & Career"}, "audienceLevel": "BEGINNER", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=wxNQRGPnJ24", "description": "In 2009, every big enterprise said \"continuous delivery won't work here.\" In 2026, the same rooms say \"the dark factory won't work here.\" It was never about the technology being ready. It's about the organization being ready. Readiness is a socio-technical problem, not a technical one.<br><br>This talk applies Conway's Law all the way up, through four layers of enablement:<br><br>0. Enable the agent : this is where the tech is standing today (context + harness).<br>1. Enable the team : the new mentality of fixing system instead of the code, the changing role, winning over skeptics, new planning/retro ceremonies, and measuring evolution by human-touches-down and sharing-up.<br>2. Enable the platform: the shared context, harness and infra substrate teams and agents both stand on: model routing, MCP gateways, sandboxes, skill/harness registries, evals, guardrails, paved roads that stay easy paths (not cages), and FinOps that optimizes rather than caps.<br>3. Enable the organization: the VP of Engineering's job: hiring and interviewing for the new roles, defending a maturing ROI, right-sizing teams, keeping humans able to judge in the \"dim factory,\" and building the real moat : capturing knowledge.<br><br>**Target audience**:<br>Engineering leaders, platform/DevEx engineers, and senior ICs driving agentic-coding adoption. It's for anyone past \"we gave them coding tools\" and asking why it isn't scaling across the org.", "totalFavourites": 265, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-08T09:50:00Z", "to": "2026-10-08T10:40:00Z", "room": "Room 7", "kind": "Conference", "pause": false, "talk": {"id": 16443, "title": "Say Goodbye to LLM API keys with Workload Identity Federation", "speakers": [{"fullName": "Siarhei Biarozkin", "company": "IBM / Red Hat", "imageUrl": "https://lh3.googleusercontent.com/a/ACg8ocLvQ2qhKsI3Q0jnu6k2znruJUxHjVZksTRWeG4Tyiwq1-ziqtlY=s96-c"}], "track": {"name": "Security, Trust & Compliance"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=xEAYnXyt3L4", "description": "Using API keys to access LLM models offers an easy and fast way to get started with AI development work. But using API keys in production is an anti-pattern - they do not represent an agent identity, are not cryptographically secure, not easy to refresh while easy enough to leak and can remain active long after someone who allocated them left.<br><br>Workload Identity Federation (WIF) is a mechanism that can help migrate from API keys to short term access tokens that an AI agent can acquire in exchange for its workload identity token. With Anthropic, OpenAI and other LLM providers moving away from API keys and offering top-class Workload Identity Federation integration, it is the right time to learn about WIF.<br><br>In this session we will learn how SPIFFE (Secure Production Identity Framework for Everyone) and Kubernetes service tokens can be used as verifiable workload identifiers for either multi-cluster or single cluster deployments.<br><br>We will finish with a demo that shows a Quarkus LangChain4j application that uses a SPIFFE provisioned JWT workload identity token to integrate with Anthropic Workload Identity Federation for a secure LLM access.", "totalFavourites": 96, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-08T09:50:00Z", "to": "2026-10-08T10:40:00Z", "room": "Room 8", "kind": "Conference", "pause": false, "talk": {"id": 8153, "title": "Taming Microservice Overload: Our Journey to Modular Monoliths", "speakers": [{"fullName": "Mario Klaver", "company": "Port of Rotterdam", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-a786059d-16f2-47f0-912e-4acf8bf85e7b.jpg"}], "track": {"name": "Architecture & Modernization"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=v86SfHA5ISw", "description": "At the Port of Rotterdam, our system had grown into far more microservices than our teams could effectively own. The result: operational overhead, fragmented domain knowledge, and an <strong>overgrown architecture<\/strong> that was hard to maintain and evolve.<br>In this session, I’ll share how we combined <strong>Domain-Driven Design (DDD)<\/strong> with <strong>Spring Modulith<\/strong> to consolidate our microservices into a smaller set of modular monoliths. Each microservice represents a <strong>bounded context<\/strong>, with modules organized around <strong>distinct business capabilities,<\/strong> preserving clear domain boundaries while reducing operational complexity.<br><br>You’ll learn:<br><ul><li>How to define and model business domains and bounded contexts using DDD<\/li><li>How to implement these domains as modular monoliths with Spring Modulith<\/li><li>How Spring Modulith keeps your modules clean and maintainable<\/li><li>Common pitfalls we encountered and how we solved them<\/li><\/ul><br>If your microservices landscape has outgrown your teams, this talk shows how modular monoliths can restore clarity, ownership, and long-term maintainability, without compromising architectural integrity.", "totalFavourites": 517, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-08T09:50:00Z", "to": "2026-10-08T10:40:00Z", "room": "Room 9", "kind": "Conference", "pause": false, "talk": {"id": 24245, "title": "Making sense of vector databases", "speakers": [{"fullName": "Balkrishna Rawool", "company": "ING Bank", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-eec7f3b9-48f4-4efd-8f9b-8e1671c757e2.jpg"}], "track": {"name": "Cloud Native, Data & Infrastructure"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=knE4uy7IYXY", "description": "Vector databases have become very popular in the AI era. Particularly the feature of finding semantically similar objects is quite useful in AI and related applications. But how does a vector database do it? How exactly does a vector database store its data so that it is able to perform a semantic search so fast?<br><br>This talk will introduce vector databases while explaining the fundamental concepts behind it. It will explain what vectors are, how are they stored, what are embedding models, indexing algorithms and similarity/distance metrics. We use Java’s Vector API to implement a simple in-memory vector database and we use Spring AI for integrating with various other vector databases.<br><br>In order to explain these concepts in simple terms, we start with simple use cases that are implemented with vector databases and then slowly increase the complexity to take it to incredibly amazing level!", "totalFavourites": 273, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-08T09:50:00Z", "to": "2026-10-08T10:40:00Z", "room": "Room 10", "kind": "Conference", "pause": false, "talk": {"id": 17556, "title": "SIMD for Java: how Elasticsearch already benefits from the Panama Vector API", "speakers": [{"fullName": "Piotr Przybyl", "company": "Elastic", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-378903c1-6e22-40fd-89cd-46195162ee5a.jpg"}], "track": {"name": "Cloud Native, Data & Infrastructure"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=adFS-_sCTQ4", "description": "Processing large amounts of data efficiently is a common challenge in modern systems. Many workloads spend most of their time performing simple mathematical operations on large arrays of numbers. Modern CPUs can speed this up using SIMD instructions, which allow a single instruction to process multiple values at once. Traditionally, accessing these capabilities from Java has been difficult and often required platform-specific native code.<br><br>The Panama Vector API changes this by allowing Java developers to express these operations directly in Java while the JVM turns them into efficient CPU instructions.<br><br>Elasticsearch provides an interesting real-world example. Modern features such as vector search rely on large numbers of vector calculations, and analytical queries written in ES|QL often process large batches of numeric data. In both cases the system repeatedly performs simple operations over large arrays of values. Elasticsearch and its underlying search engine Lucene use the Vector API to speed up these operations by taking advantage of SIMD instructions available on modern CPUs.<br><br>Using an incubating API in production software is unusual and normally avoided. In this case, however, the potential performance gains are significant enough to make it worthwhile. This talk explores how Elasticsearch integrates the Vector API, how it safely enables and disables SIMD acceleration at runtime, and what this tells us about the future of high-performance computing in Java.", "totalFavourites": 72, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-08T09:50:00Z", "to": "2026-10-08T10:40:00Z", "room": "BOF 1", "kind": "Speaker Room", "pause": true, "talk": null}, {"from": "2026-10-08T10:40:00Z", "to": "2026-10-08T11:50:00Z", "room": "Exhibition Hall", "kind": "Lunch", "pause": true, "talk": null}, {"from": "2026-10-08T10:55:00Z", "to": "2026-10-08T11:35:00Z", "room": "Room 3", "kind": "Lunch Talk", "pause": false, "talk": {"id": 50104, "title": "Engineering Lessons from Working on Software Older Than Me", "speakers": [{"fullName": "Guust Ysebie", "company": "Apryse", "imageUrl": null}], "track": {"name": "Development Practices"}, "audienceLevel": "BEGINNER", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=VaT7DgmVSms", "description": "What do you learn after spending years maintaining and evolving a technology that predates modern programming languages, cloud platforms, and smartphones?<br><br>This session explores real engineering challenges encountered while building PDF technology at scale, from compatibility and performance to security, testing, and interoperability. Through a series of stories and hard-earned lessons, you'll see why mature systems can be some of the best teachers for designing resilient software and why the hardest problems are often the ones users never notice.", "totalFavourites": 117, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-08T10:55:00Z", "to": "2026-10-08T11:35:00Z", "room": "Room 4", "kind": "Lunch Talk", "pause": false, "talk": {"id": 41302, "title": "\"You May Now Optimize the Wedding\": Optimizing the Seating, Bachelor Party, and Honeymoon with Constraint AI", "speakers": [{"fullName": "Geoffrey De Smet", "company": "Timefold", "imageUrl": "https://lh3.googleusercontent.com/a-/AOh14GjnLAEFVLYxmRxddxXV3A1MLXmtDO7GbsZA2gSupw=s96-c"}, {"fullName": "Tom Cools", "company": "Timefold", "imageUrl": "https://lh3.googleusercontent.com/a/ACg8ocLiUjyjM49h8fxM3bZDY_EBsphO-BhswQ2kD7N4rUU3lgNYf2Hs=s96-c"}], "track": {"name": "Agentic Engineering & Tooling"}, "audienceLevel": "BEGINNER", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=lsvVJaigNp8", "description": "Every developer has been there: sitting at a life event, thinking \"could I automate this?\" The answer is yes. And this talk will show you how.<br><br>There is a whole class of problems that AI alone cannot solve: scheduling, routing, and planning challenges where every decision affects every other decision. Timefold tackles these in production every day, across logistics, manufacturing, healthcare, and yes, apparently also weddings.<br><br>We will use the most important weekend of your life as our excuse to explore constraint optimization in practice, from seating charts to pub crawls to honeymoon itineraries, with real code, real constraints, and real solver magic.<br>You will leave knowing how to turn any \"could I automate this?\" moment into a working optimization solution.", "totalFavourites": 140, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-08T10:55:00Z", "to": "2026-10-08T11:35:00Z", "room": "Room 5", "kind": "Lunch Talk", "pause": false, "talk": {"id": 44601, "title": "Agents Shouldn't Control Control Flow", "speakers": [{"fullName": "Jeremy Adams", "company": "Neo4j", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-3277ed72-ce58-4dcf-bfa8-00762b465e5b.jpg"}], "track": {"name": "Agentic Engineering & Tooling"}, "audienceLevel": "BEGINNER", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=oey2TbFvfWE", "description": "<strong>Compiling governed agent workflows from an enterprise context graph<\/strong><br><br>An agent's control flow should be a build artifact, not a runtime decision.<br><br>Most agent talks show how to build an agent. We ask what your architecture review will ask: who decided that this agent is allowed to call the security platform, and what happens when that policy changes?<br><br>Imagine that our goal is to assess our company’s exposure (overall risk) for a customer using an enterprise context graph as the source of truth. Think of it as a semantic CMDB of systems, capabilities, policies, permissions, and MCP tools. Then a deterministic compiler projects a business operation from that graph into LangChain4j code. The generated workflow goes through git, CI, tests, and human review like any production artifact. The process is almost 100% deterministic: the LLM agent just writes the summary report.<br><br>The LLM does not redesign production control flow at runtime. Why add hallucination risk to a workflow designed to estimate risk? <br>The familiar generate, review, ship pattern reacts to authoritative enterprise decisions recorded in the graph. But the changes don’t take effect until they are tested and approved.<br><br>Attendees to this intermediate talk will come away with an intro to knowledge/context graphs and the enterprise knowledge layer, plus a live demo and git repo showing the pattern in Java.", "totalFavourites": 102, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-08T10:55:00Z", "to": "2026-10-08T11:35:00Z", "room": "Room 6", "kind": "Lunch Talk", "pause": false, "talk": {"id": 24244, "title": "Green Maven builds: sustainable CI in practice", "speakers": [{"fullName": "Jan Boonen", "company": "the/experts.", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-83370e03-af8c-4887-818a-857c2813597a.jpg"}], "track": {"name": "Development Practices"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=Mdu5_gndYn0", "description": "Whether you want to reduce your carbon footprint or cut back on machine resource usage, energy-efficient builds matter more than ever. CI systems often waste energy and time because of inefficient build pipelines. In this lunch session I will demonstrate a few tricks that will give you greener and faster Maven builds. We’ll look at practical examples using GitLab CI and GitHub Actions, so you can apply the techniques right away in your own projects.", "totalFavourites": 174, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-08T10:55:00Z", "to": "2026-10-08T11:35:00Z", "room": "Room 7", "kind": "Lunch Talk", "pause": false, "talk": {"id": 50109, "title": "Keeping Spring Applications Secure in the Age of AI", "speakers": [{"fullName": "Neven Cvetkovic", "company": "VMware Tanzu", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-3a22fb4c-0e7d-491c-98ea-b3681d8a81a4.jpg"}], "track": {"name": "Java Language & Platform"}, "audienceLevel": "BEGINNER", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=-LMWT5OCneA", "description": "Spring is the most widely used Java framework in the world, and millions of applications depend on it. Keeping<br>them up to date used to be a matter of discipline. That has changed. In August 2026 alone, 96 security<br>vulnerabilities were published in the Spring ecosystem, driven by AI-assisted research. Models such as<br>Anthropic's Mythos find weaknesses that survived years of manual review, and attackers can use the same<br>capability.<br>In this session, we look at what this means for teams running Spring in production and how to respond. We<br>show how Long Term Support releases for Spring ease the pressure of constant upgrades, how Spring<br>Application Advisor automates patching and upgrades inside your CI pipeline, and how direct access to the<br>Spring team helps when automation is not enough. All of this is part of VMware Tanzu Spring, delivered by the<br>vendor of Spring itself. Customers like SAP rely on exactly this combination to keep their most complex<br>applications secure and current.", "totalFavourites": 170, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-08T10:55:00Z", "to": "2026-10-08T11:35:00Z", "room": "Room 8", "kind": "Lunch Talk", "pause": false, "talk": {"id": 17782, "title": "Is the IDE dead ?", "speakers": [{"fullName": "Martin Lippert", "company": "Broadcom", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-a43eb907-1696-440a-8220-c6e0e225f9e3.jpg"}], "track": {"name": "Agentic Engineering & Tooling"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=jFxR6YYWdmI", "description": "AI has fundamentally changed software development. But in a world of autonomous coding agents and AI-assisted creation, do developers even need a traditional IDE anymore? Is the terminal becoming our primary home once again, or are we moving toward something entirely different?<br>In this session, Martin takes the audience on a journey through the history of developer tools to the present AI inflection point. He will:<br><ul><li>Reflect on what human engineers actually need from their environment in 2026.<\/li><li>Analyze whether the IDE is evolving or being replaced by terminal-based workflows like Claude Code.<\/li><li>Discuss the evolving role of AI agents as the new \"power users\" of development tools.<\/li><li>Summarize the implications for both toolsmiths and software engineers in the years to come.<\/li><\/ul>", "totalFavourites": 434, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-08T10:55:00Z", "to": "2026-10-08T11:35:00Z", "room": "Room 9", "kind": "Lunch Talk", "pause": false, "talk": {"id": 7020, "title": "Who to blame? The AI, The Programmer, or The Prompt?", "speakers": [{"fullName": "Makan Sepehrifar", "company": "Productboard", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-68014c00-8dd0-4467-9ac6-f205258d440d.jpg"}], "track": {"name": "Security, Trust & Compliance"}, "audienceLevel": "BEGINNER", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=VmPMUGImB-M", "description": "This interactive session transforms AI security education into an engaging courtroom style debate. We'll present five critical vulnerabilities affecting modern AI development tools, and after each case study, the audience becomes the jury—voting on who's responsible: the careless user, the negligent developer, or the inadequate service provider.<br><br>We'll dissect real CVEs including GitHub Camo Leak (CVE-2025-59145), Ollama RCE (CVE-2024-37032), AWS MCP Server Shell Injection (CVE-2025-5277), Anthropic MCP Inspector DNS Rebinding (CVE-2025-49596 ) and Microsoft Copilot's zero-click data exfiltration (CVE-2025-32711). Each case reveals technical root causes through collaborative analysis. The List of CVEs will be usually update based on the new related CVEs as well.<br><br>The conclusion challenges the \"blame game\" itself: these vulnerabilities expose fundamental architectural weaknesses in agentic AI systems where traditional security models fail. We will talk about <u>Mental Model Gap<\/u> and how this phenomenon has been seen before in the technological leaps before. We'll establish that securing AI tools demands a shared responsibility framework developers must code defensively, providers must architect securely, and users must understand AI-specific risks.", "totalFavourites": 197, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-08T10:55:00Z", "to": "2026-10-08T11:35:00Z", "room": "Room 10", "kind": "Lunch Talk", "pause": false, "talk": {"id": 52103, "title": "The Devoxx Robot Games", "speakers": [{"fullName": "Stephan Janssen", "company": "Devoxx", "imageUrl": "https://lh3.googleusercontent.com/a/ALm5wu39iQhWBfIgxSMBGJ-tLuCnWERa6Vp5RRnnq4exBw=s96-c"}], "track": {"name": "Mind the Geek"}, "audienceLevel": "BEGINNER", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=NT0wyPM58G8", "description": "For this year's Robot Games challenge, builders were asked to make a playable game starring Devoxx's robots in the Kinepolis venue, using AI as their co-developer. We received nine submissions, and several were so good that we couldn't pick a single winner. So we're handing the stage to all of them.<br><br>In this lunch session, each creator gets four minutes for a live demo and a quick look behind the scenes. What did they build, and how did they direct the AI? Which tools did they use, and what did they have to fix by hand? Expect a mix of technology and styles: 3D worlds in Three.js, hand-built 2D engines, a text-mode BBS door game, procedural chiptune music and AI-generated art. Some builders worked with Claude Code, others with Codex, Copilot or Grok.<br><br>Come to see nine very different games, learn what actually works when you build with AI, and tell us which one deserves your vote.<br><br>You can also play the games online at https://game.devoxx.be/vote.html", "totalFavourites": 180, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-08T11:50:00Z", "to": "2026-10-08T12:40:00Z", "room": "Room 3", "kind": "Conference", "pause": false, "talk": {"id": 50105, "title": "Building, Shipping and Governing AI Agents on Kubernetes", "speakers": [{"fullName": "Tom O'Rourke", "company": "Solo.io", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-68f77b4e-a370-4e43-af9f-efe097ac6679.jpg"}, {"fullName": "Ep Heijting", "company": "Solo.io", "imageUrl": "https://lh3.googleusercontent.com/a/ACg8ocIPE41XoA02i7X2mB7-jUS0ayWC-uVuz0jWIQqHaDeLGRoxt4SH=s96-c"}], "track": {"name": "Agentic Engineering & Tooling"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=OCCOIgkCnjE", "description": "An engineering agent that checks GitHub pull requests sounds simple: find the open PRs, check their status and report which ones are ready to merge. But when I connected one to GitHub's MCP server, it was provided 44 tools, including seventeen that could modify the repository. Checking which open pull requests were ready to merge took nineteen tool calls and moved around 75,000 bytes of raw API responses to produce a nine-line answer.<br><br>In this live demo, we'll build and deploy an agent on Kubernetes using three open source projects (KAgent, AgentGateway, AgentRegistry), then show how to make it safer and more efficient through platform configuration rather than changes to the agent code.<br><br><strong>What you will learn:<\/strong><br><ul><li><strong>Build and ship:<\/strong> Use agentregistry to scaffold an agent from approved components and deploy it with kagent as a managed Kubernetes workload.<\/li><li><strong>Cut the overhead:<\/strong> Use agentgateway to reduce nineteen tool calls to two and keep intermediate API responses out of the model's context.<\/li><li><strong>Control access:<\/strong> Keep credentials at the gateway and apply permissions per agent, so a read-only agent is only given the tools it actually needs.<\/li><\/ul>", "totalFavourites": 135, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-08T11:50:00Z", "to": "2026-10-08T12:40:00Z", "room": "Room 4", "kind": "Conference", "pause": false, "talk": {"id": 5502, "title": "Taming the Chaos: Security and Predictability in LLM-Powered Applications", "speakers": [{"fullName": "Rustam Mehmandarov", "company": "Miles", "imageUrl": "https://lh3.googleusercontent.com/a-/AOh14GhOVnDcmUBbpNyyl7Wj1PvPKq-eiUQbogYBsSyleQ=s96-c"}], "track": {"name": "Security, Trust & Compliance"}, "audienceLevel": "ADVANCED", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=vNeyNkeU4ms", "description": "LLMs are probabilistic by nature. Ask the same question twice, get different answers. Great for creativity, terrible for business logic. How do you build reliable systems on top of something inherently unreliable?<br><br>Let's tackle this together – from security to predictability. We'll look at guardrails that block prompt injection and redact leaked PII before it leaves your system. Then we'll layer on deterministic validation that catches hallucinations with code, not hope. And when the model gets it wrong, we'll feed errors back for self-correction and use multi-model consensus to build confidence. Practical patterns, real code, no magic.<br><br>This isn't about making LLMs perfect – it's about building systems that fail safely and predictably when they're not.<br><br>The examples are in Java and LangChain4J; the concepts – transferable to other languages and frameworks.", "totalFavourites": 172, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-08T11:50:00Z", "to": "2026-10-08T12:40:00Z", "room": "Room 5", "kind": "Conference", "pause": false, "talk": {"id": 19706, "title": "Software engineering in the age of AI agents: who’s in control?", "speakers": [{"fullName": "Bert Jan Schrijver", "company": "OpenValue", "imageUrl": "https://avatars.githubusercontent.com/u/4464854?v=4"}], "track": {"name": "Agentic Engineering & Tooling"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=Z64CjgCO5gk", "description": "An AI deletes a production database, and then says it panicked. Welcome to modern software engineering.<br><br>Agentic coding assistants are writing more code than ever, creating a flood of code that needs review. But are we producing better software faster, or just more software faster? In a 2025 randomised trial, experienced developers were 19% slower with AI while believing they were 20% faster. By 2026, the follow-up had become unreliable: developers increasingly refused to take part if it meant working without AI.<br>The real shift isn't about writing more code faster. It's about moving from writing code to writing specs, from building systems to generating them, and from trusting output to verifying it. The prompt that starts an agent matters less than the condition that stops it. And whoever writes that condition is still in control.<br><br>In this talk I'll share what I learned: some of it the hard way, from real production projects and from talking to engineering leaders. I’ll tell you what happens when an agent gets write access to production, how I got from 45 minutes of specs, spread over three evenings, to a working app for my kids, and what building three small projects in a single hour actually taught me. You'll leave with a practical framework: experiment boldly, codify what \"good\" looks like, and raise the bar on verification. One rule applies no matter what: if you bring it to a review, it's your code.", "totalFavourites": 586, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-08T11:50:00Z", "to": "2026-10-08T12:40:00Z", "room": "Room 6", "kind": "Conference", "pause": false, "talk": {"id": 24218, "title": "Conquest, time travel and explosions using Git", "speakers": [{"fullName": "Alexander Chatzizacharias", "company": "JDriven", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-da804363-5740-431f-acd7-b3a9c4ad99ab.jpg"}], "track": {"name": "Mind the Geek"}, "audienceLevel": "BEGINNER", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=wbzpP0T9w6I&pp=0gcJCT8MAYcqIYzv", "description": "A talk on git? In this day and age?! Yes. Especially in this day and age. AI agents are running increasingly obscure git commands in our terminals, and most of us just nod along, pretending we know what rerere does. If the machines get to have fun with git, so do we.<br><br>So to understand git better, Alexander built an RTS game with git at its core, and in this session you will see it in action! Expect jumps between alternate timelines using branches, time travel back and forth through history, and a front row seat to what happens when a merge conflict occurs between two buildings.<br><br>Somewhere between the conquests and the explosions, the weird parts of git start to make sense. Detached heads, rebases, the plumbing underneath, all of it becomes a lot less mysterious once you have seen it blow up an energy plant. Beginners will leave with a solid feel for how git actually works, veterans with a fresh look at a tool they use every day. Come for the explosions, stay for the fun and giggles!", "totalFavourites": 318, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-08T11:50:00Z", "to": "2026-10-08T12:40:00Z", "room": "Room 7", "kind": "Conference", "pause": false, "talk": {"id": 23536, "title": "Ask the Architects", "speakers": [{"fullName": "Gavin Bierman", "company": "Oracle", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-81f196b1-a89f-4d7a-85d3-5e7e4e171a24.jpg"}, {"fullName": "Maurizio Cimadamore", "company": "Oracle", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-66579526-c2c5-46b5-87ed-6bb6f34121af.jpg"}, {"fullName": "Per-Ake Minborg", "company": "Oracle", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-a388bc3b-5180-411a-a4a7-5631e4341892.jpg"}, {"fullName": "Viktor Klang", "company": "Oracle", "imageUrl": "https://lh3.googleusercontent.com/a/AAcHTtdkY-Lks0gsRcvl05pqpW8-GOpvuVndojO99ZxUsSy0rgo=s96-c"}, {"fullName": "Alan Bateman", "company": "Oracle", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-777f0d6e-3ce7-4670-9962-7f3e5f309f46.jpg"}, {"fullName": "Georges Saab", "company": "Oracle", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-e81f731a-26bb-4e81-803c-4252372b3e61.jpg"}], "track": {"name": "Java Language & Platform"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=ewCPBgOrLAE", "description": "Ask the Oracle engineers anything related to your favourite programming language & runtime!", "totalFavourites": 164, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-08T11:50:00Z", "to": "2026-10-08T12:40:00Z", "room": "Room 8", "kind": "Conference", "pause": false, "talk": {"id": 8186, "title": "The Hexagonal Hangover", "speakers": [{"fullName": "Ties van de Ven", "company": "Alliander", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-0f6945a0-82c6-4715-8549-69f9740c0197.jpg"}], "track": {"name": "Architecture & Modernization"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=m9viRAIRAUQ", "description": "“It depends.” It’s the classic software architect’s answer… but what does it actually depend on? Patterns like Clean and Hexagonal Architecture are great tools, but they are often applied dogmatically. When we automatically wrap simple features in endless layers of abstraction and domain interfaces, we introduce unnecessary distance between related concepts. Those extra layers are intended to decouple, but they can sometimes just make our code harder to navigate, test, and maintain. In this talk, we’ll take a step back from “best practices” and look at the trade-offs behind architectural choices. Using clear Java code samples, we will explore the metrics that help guide these decisions: coupling, cohesion, and distance. Instead of looking for universally “clean” solutions, we’ll discuss how to evaluate what makes sense for your specific context.", "totalFavourites": 516, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-08T11:50:00Z", "to": "2026-10-08T12:40:00Z", "room": "Room 9", "kind": "Conference", "pause": false, "talk": {"id": 22916, "title": "Java and the Next Generation of Programming Models", "speakers": [{"fullName": "Ana-Maria Mihalceanu", "company": "Oracle", "imageUrl": "https://lh3.googleusercontent.com/a-/AOh14Gj1OS6OpAzuwBKwoUuCi9gxvNPvdmVA7nbW8lg3mg=s96-c"}], "track": {"name": "Java Language & Platform"}, "audienceLevel": "ADVANCED", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=kuUeHD_k5fs&pp=0gcJCT8MAYcqIYzv", "description": "Modern software increasingly interacts with AI models, query languages, and other specialized programming models, forcing you to switch contexts, embed foreign code, or write verbose wrappers to bridge the gap. What if you could express logic from outside the JVM directly in Java?<br><br>In this session, we start by looking at how Java enables you to safely interact with runtimes outside of the JVM using the Foreign Function and Memory API and tools like jextract.<br>Then will push further with Project Babylon’s code reflection: express AI models as Java programs that Babylon can analyze, transform and lower to inference engines, thus leveraging hardware accelerator backends while skipping external model files or the need to glue code.<br><br>Along the way, you will learn how to build expressive FFM-based inference today and author pure Java AI-ready models with Code Reflection tomorrow!", "totalFavourites": 255, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-08T11:50:00Z", "to": "2026-10-08T12:40:00Z", "room": "Room 10", "kind": "Conference", "pause": false, "talk": {"id": 23522, "title": "Hardwood: Building a Parquet Parser From Scratch (With a Little Help From AI)", "speakers": [{"fullName": "Gunnar Morling", "company": "Confluent", "imageUrl": "https://lh3.googleusercontent.com/a-/AOh14GihCBYp1plXFDKfAchzpn7tZkBlhGUg3kD7xvlSjw=s96-c"}], "track": {"name": "Cloud Native, Data & Infrastructure"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=6mzvcPr30kg", "description": "Apache Parquet has become the lingua franca of the modern data ecosystem, powering data lakes and table formats like Apache Iceberg—but for Java, the go-to library parquet-java pulls in Hadoop and a truckload of other dependencies, and its reader is single-threaded. This was bugging me enough to start Hardwood, a brand-new Parquet parser written from scratch in modern Java, applying some of the performance lessons learned from the One Billion Row Challenge. Come and join me for this talk, where we'll look at:<br><br>- The internals of the Parquet format and what makes parallelizing its decoding surprisingly tricky<br>- Techniques for achieving high throughput, such as page-level parallelism, adaptive prefetching, and avoiding auto-boxing in hot loops<br>- How to use JDK Flight Recorder for identifying performance bottlenecks<br>- Practical learnings from using AI (specifically, Claude Code) as a coding companion—what works well, where you need to stay sharp, and why \"built with AI\" doesn't mean \"vibe-coded\"<br><br>Whether you're interested in file formats, Java performance, or getting a realistic take on AI-assisted development, there should be something in here for you.", "totalFavourites": 44, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-08T11:50:00Z", "to": "2026-10-08T12:40:00Z", "room": "BOF 1", "kind": "Speaker Room", "pause": true, "talk": null}, {"from": "2026-10-08T12:40:00Z", "to": "2026-10-08T13:00:00Z", "room": "Exhibition Hall", "kind": "Break", "pause": true, "talk": null}, {"from": "2026-10-08T13:00:00Z", "to": "2026-10-08T13:50:00Z", "room": "Room 3", "kind": "Conference", "pause": false, "talk": {"id": 49255, "title": "Modernizing legacy code with AI: hands-on examples & lessons learned", "speakers": [{"fullName": "Koen Vanderkimpen", "company": "Smals", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-3a8f8c33-a595-4df3-b4d0-064456a44f0e.jpg"}, {"fullName": "Wim Lambrecht", "company": "Smals", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-951d4f7a-44c4-4787-9143-888af04bca95.jpg"}], "track": {"name": "Agentic Engineering & Tooling"}, "audienceLevel": "BEGINNER", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=FvVe9J0Abjg", "description": "AI helps developers write new software faster. But can it also help modernize legacy applications?<br><br>In this session, Smals Research shares practical experience from real e-government projects. Through the migration of ageing Java applications from Java EE to Jakarta EE, the speakers explore how AI supports software modernization. Topics include namespace changes, deprecated APIs, outdated dependencies and complex build configurations.<br><br>The session highlights where AI genuinely accelerates migration work, where it falls short, and how teams can keep modernization efforts reliable and verifiable. Drawing on additional experience with other legacy environments, including COBOL, the speakers also share practical approaches for documenting, rewriting and maintaining legacy code with AI assistance.<br><br>Whether you're modernizing an existing application or exploring AI-assisted development, this session offers a realistic view of what AI can and cannot do today.<br><br>", "totalFavourites": 534, "slidesUrl": "https://www.smalsresearch.be/devoxx-2026-ai-and-legacy-code/", "teamRating": null}}, {"from": "2026-10-08T13:00:00Z", "to": "2026-10-08T13:50:00Z", "room": "Room 4", "kind": "Conference", "pause": false, "talk": {"id": 24202, "title": "Beyond the Pod: Architecting and Scaling AI Agents on Kubernetes", "speakers": [{"fullName": "Abdellfetah SGHIOUAR", "company": "Google Cloud", "imageUrl": "https://lh3.googleusercontent.com/a/AEdFTp6g4oRfPAQoq5bJH9DFV4xWnkIek9N3i08DYxe4SQ=s96-c"}], "track": {"name": "Cloud Native, Data & Infrastructure"}, "audienceLevel": "BEGINNER", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=3bIiAoYtAPs", "description": "As we shift from simple LLM wrappers to autonomous AI agents, a critical question emerges: Where and how should they run? On Kubernetes, our instinct is to treat agents like traditional microservices, giving each its own Pod for isolation and identity. But AI agents aren’t microservices.<br><br>Unlike long-running APIs, agents are ephemeral, bursty, and highly stateful. They might spin up for a task, spawn parallel sub-agents, and then sit idle for hours awaiting human approval. Keeping a dedicated Pod alive for every agent is massively wasteful.<br><br>In this talk, we’ll explore <strong>Agent Substrate<\/strong>, an open-source system on Kubernetes that decouples the logical agent (\"Actor\") from the physical execution environment (\"Worker\" Pod).<br><br><strong>What you will learn:<\/strong><br><ul><li><strong>Heavy Multiplexing:<\/strong> Map thousands of stateful, idle AI agents onto a small pool of shared Kubernetes Pods.<\/li><li><strong>Hibernate and Teleport:<\/strong> Look under the hood at how Substrate uses OCI containers and gVisor to achieve sub-second activation, session teleportation, and perfect state persistence across hibernation.<\/li><li><strong>Rethink Identity & Security:<\/strong> Shift network policies and access controls away from the Pod level and attach them dynamically to lightweight execution units.<\/li><\/ul><br>Leave this session with a fresh perspective on how to isolate and scale the next generation of AI applications without abandoning the Kubernetes ecosystem you already know.", "totalFavourites": 124, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-08T13:00:00Z", "to": "2026-10-08T13:50:00Z", "room": "Room 5", "kind": "Conference", "pause": false, "talk": {"id": 5530, "title": "Kill All Mutants! (Intro to Mutation Testing)", "speakers": [{"fullName": "Dave Aronson", "company": "Codosaurus", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-b41d4e91-b171-4224-afa2-c6c806b1d492.jpg"}], "track": {"name": "Development Practices"}, "audienceLevel": "ADVANCED", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=AsVt_dzTmN4", "description": "Would your test suite still pass if the tested code was changed? If so, you probably have gaps in your test suite, redundant or unreachable code, or maybe even both!<br><br>Mutation Testing reveals these cases, and provides some guidance about how to fix them. This talk will tell you what mutation testing is, how it works inside, how to use it, where in your development process to use it, and its benefits, drawbacks, and history. There will be multiple examples, and a list of tools for many popular languages (and some others).<br><br>You will learn a powerful technique for making sure your test suite is strict and your code is meaningful!", "totalFavourites": 294, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-08T13:00:00Z", "to": "2026-10-08T13:50:00Z", "room": "Room 6", "kind": "Conference", "pause": false, "talk": {"id": 27453, "title": "Build a private cluster for the office", "speakers": [{"fullName": "John Davies", "company": "Incept5", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-fbcc8003-58f5-406b-9d2c-d9bbecac2d4d.jpg"}], "track": {"name": "Agentic Engineering & Tooling"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=rv2KpWgb0Mw", "description": "For almost three years now John has been building private (local, shared server, private data room and private cloud) systems for his customers, mostly financial institutions, large banks, but also legal, medical and government work. Most of these organisations simply can't use the frontier models, even if hosted in the EU. It's not just cost, it's the need for long-term support, SLAs, total privacy, ownership, accountability, governance, repeatability, the list goes on... There's Bedrock and Vertex from Amazon and Google, and companies like RunPod with EU instances, but renting 24/7 costs roughly half the hardware's purchase price every month.<br><br>For an office of about 10–50 people, not coders, a small redundant cluster of Mac Minis or Studios, NVIDIA DGX Sparks or even both are perfect for the job, dedicated or shared. John will start with setting up the machines, what needs networking and what doesn't, which models work best, adding tools and access to local data feeds, even private ones. He'll also cover KV-cache loading from SSD for near-instant document access to replace RAG. These models can code but that's not the main goal here, it's for private internal and customer data.<br><br>This will be a technical talk but you will walk away with enough knowledge to start replacing your team's dependence on OpenAI, Anthropic and other frontier models. Open-weight models all the way.<br>", "totalFavourites": 183, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-08T13:00:00Z", "to": "2026-10-08T13:50:00Z", "room": "Room 7", "kind": "Conference", "pause": false, "talk": {"id": 16444, "title": "Faster Development with Java, Python, and Micronaut", "speakers": [{"fullName": "Graeme Rocher", "company": "Oracle", "imageUrl": "https://lh3.googleusercontent.com/a/AATXAJzhbdYUh7mbNrEpoDq6EodpI71GUlmEK-1k0lb_=s96-c"}, {"fullName": "Thomas Wuerthinger", "company": "Oracle", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-4f0ca29a-e775-47ce-be77-6e01a95e9abe.jpg"}], "track": {"name": "Java Language & Platform"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=zo6L7bxn4OY", "description": "The Java platform has always been about performance, reliability, and a rich developer ecosystem. But what if those same capabilities could become the foundation for building modern polyglot applications?<br><br>In this session, we'll unveil a new pre-compiled, pre-optimized Micronaut runtime built on GraalVM that delivers fast startup, low memory footprint, and a consistent programming model across Java, Kotlin, Python, and other Micronaut-supported languages.<br><br>Unlike approaches that require expensive native image builds before you see the benefits, this runtime is pre-compiled ahead of time, keeping the developer feedback loop fast. Make a source change, restart, and you're back in milliseconds—while still taking advantage of GraalVM's performance and native deployment capabilities when you're ready for production.<br><br>You'll see how Micronaut's dependency injection, configuration, testing, observability, and cloud-native features extend naturally across languages, enabling polyglot applications without sacrificing operational consistency. We'll also explore why this architecture is an ideal fit for AI-powered systems, combining Java's production strengths with the flexibility of Python where it makes sense.<br><br>If you're interested in the future of Java, GraalVM, cloud-native runtimes, and the next generation of polyglot application development, this session offers an early look at what's coming next.<br>", "totalFavourites": 112, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-08T13:00:00Z", "to": "2026-10-08T13:50:00Z", "room": "Room 8", "kind": "Conference", "pause": false, "talk": {"id": 10031, "title": "The Dark Secrets of Computer Science", "speakers": [{"fullName": "Fabien Marsaud", "company": "Nonstatic", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-d8cda6a6-3355-41db-9892-3d55de893bed.jpg"}], "track": {"name": "Mind the Geek"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=2Yh7LKt8YNw", "description": "The idea stems from https://xkcd.com/2347/ and Mark Rendle’s talk at Devoxx.be 2024.<br><br>Most people are unaware of the hassles we face (or inflict upon ourselves) regarding legacy systems, technical choices, or our own organizational structures.<br><br>The goal is to have a laugh about our points of contention (Lombok? Reactive? Date formats?), our nemeses (printers, CORS), language quirks—including the fact that you can run *Doom* inside the TypeScript type system—why no one truly understands C++, wacky HTTP status codes, centering `div`s (of course), the Y2K non-event versus the real Y2K38 problem, RGB vs. CMYK, April Fools' RFCs, web page and file encoding issues, consistently botched Excel integrations, business-dictated file naming conventions, the headache of IEEE 754 rounding, the \"ultimate\" email validation regex, hidden (or missing) CPU instructions, the shift toward inclusivity since 2020 (dropping \"master/slave\" terminology...), SOA, the long-awaited WASM, corporate timesheets, and—last but not least—the crucial question: *how do you exit vi?*", "totalFavourites": 581, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-08T13:00:00Z", "to": "2026-10-08T13:50:00Z", "room": "Room 9", "kind": "Conference", "pause": false, "talk": {"id": 22932, "title": "Why Java Is Perfect for AI - Just Not the AI You’re Thinking Of", "speakers": [{"fullName": "Trisha Gee", "company": "Digital Aguacates", "imageUrl": "https://lh3.googleusercontent.com/a/ACg8ocLsMb8CUpH7W48b3uQ9kMWx6uoYjj07hJVCxmz2MT5fbaMVope5ow=s96-c"}, {"fullName": "Andrey Santrosyan", "company": "Redouble AI", "imageUrl": "https://lh3.googleusercontent.com/a/ACg8ocI77jWS_K7xTIgnUWxXFl9RQWFg5uOq1TVsZTVyvbLK_lFI9xU=s96-c"}], "track": {"name": "Agentic Engineering & Tooling"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=hHu3rLsbYog&pp=0gcJCT8MAYcqIYzv", "description": "Do you think AI belongs to Python? Are you worried we’re playing catch-up in the Java world? Don’t panic! Most enterprises aren’t training models or creating innovative AI tools. They’re adding AI capabilities to software they already run and trust. <br><br>Enterprise applications encode business processes, security rules, and decades of operational knowledge. Adding agents that attempt to rediscover a working process on every request is slower, more expensive, and less reliable than using AI where it is genuinely helpful: handling the uncertain and ambiguous parts of the workflow that used to need human intervention.<br><br>Java is especially strong for using AI. Java’s static types, mature APIs, testing tools, and explicit contracts provide structure around probabilistic (i.e. unpredictable) output. Its performance and concurrency model (including virtual threads) mean you can run large numbers of agentic tasks quickly and dependably. If your agentic framework works natively with Java, teams can add AI incrementally without rebuilding their architecture, retraining their engineers, or handing their core processes to an external black box.<br><br>In this talk, we'll look beyond chatbots and prompt engineering to see how AI actually fits inside enterprise applications, and how Java gives you the harness to make agentic systems fast, controlled, observable, and dependable.<br><br>Using AI effectively with Java in the enterprise isn’t some fantasy, it’s good, solid software engineering.", "totalFavourites": 264, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-08T13:00:00Z", "to": "2026-10-08T13:50:00Z", "room": "Room 10", "kind": "Conference", "pause": false, "talk": {"id": 5549, "title": "Underneath the Black Marker: AI Techniques for Detecting and Reversing Redactions", "speakers": [{"fullName": "David vonThenen", "company": "NetApp", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-d587c9f9-77e0-493c-a194-848fe54258c3.jpg"}], "track": {"name": "Security, Trust & Compliance"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=wJ7R4qkVs8Y", "description": "Redaction is often treated like a final step. Add black boxes, blur a name, pixelate a screenshot, export the file, done. But recent headlines have reminded everyone that \"hidden\" is not the same as \"gone.\" In practice, many redactions fail in predictable ways. Sometimes the underlying text remains in the PDF. Sometimes image-based redactions leave enough signal behind to detect what was covered. And sometimes the surrounding sentence context gives away exactly what was meant to stay private. Recent media coverage around heavily redacted files has exposed a hard truth: concealment is not the same thing as data removal.<br><br>This session is a live, technical walk-through of how modern redaction failures happen and how AI can expose them. We will demo detection methods for finding redacted text in documents, show how poorly redacted PDFs can be recovered, and end with examples of recovering information from redacted or pixelated images. More importantly, we will also cover what proper redaction looks like in practice. Along the way, we will connect document analysis, computer vision, and language models to a simple point: privacy controls fail when teams confuse visual hiding with real removal. Bring your curiosity and maybe a little paranoia.", "totalFavourites": 66, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-08T13:00:00Z", "to": "2026-10-08T13:50:00Z", "room": "BOF 2", "kind": "Speaker Room", "pause": true, "talk": null}, {"from": "2026-10-08T13:50:00Z", "to": "2026-10-08T14:30:00Z", "room": "Exhibition Hall", "kind": "Break", "pause": true, "talk": null}, {"from": "2026-10-08T14:30:00Z", "to": "2026-10-08T15:20:00Z", "room": "Room 3", "kind": "Conference", "pause": false, "talk": {"id": 41301, "title": "Owning the inference layer: When and how to run your own models", "speakers": [{"fullName": "Maarten Vandeperre", "company": "Red Hat", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-909df07a-dfbf-40e8-9065-be12fa662faf.jpg"}, {"fullName": "Camille Nigon", "company": "Red Hat", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-64d404b7-9acd-40a7-a8be-4305138ba69b.jpg"}], "track": {"name": "Agentic Engineering & Tooling"}, "audienceLevel": "BEGINNER", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=QbA-rs7XLEk", "description": "Hosted model APIs are the fastest way to start building with Gen AI models, but they are not always the best long-term fit. As workloads grow, teams start running into harder questions around latency, cost, deployment flexibility, data boundaries, and performance tuning. <br><br>This talk looks at what changes when you move from calling a hosted model API to running inference yourself. We’ll break down the practical tradeoffs between hosted and self-hosted approaches, then examine how modern open inference technologies such as vLLM and llm-d are making self-hosted AI more realistic for production systems. <br><br>Rather than treating this as a debate between two camps, the session focuses on decision-making: when self-hosting is worth the added operational complexity, when hosted APIs still win, and what teams take on when they choose to own the inference layer.<br><br>We'll also unpack what sovereignty is actually worth beyond the compliance checkbox: the concrete value of controlling your data boundaries, your model lifecycle, and your independence from a single provider's roadmap and pricing, and where that value is real rather than theoretical. <br><br>You’ll leave with a practical framework for evaluating cost, control, performance, and architectural fit in your own environment.<br><br><br>", "totalFavourites": 170, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-08T14:30:00Z", "to": "2026-10-08T15:20:00Z", "room": "Room 4", "kind": "Conference", "pause": false, "talk": {"id": 12758, "title": "Knocking on the Wrong Door: The Six Developers You’ll Meet in Security", "speakers": [{"fullName": "Enrique Larios Vargas", "company": "OWASP", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-3a74a43d-dc7b-46a1-84da-7840cb0dff8f.jpg"}], "track": {"name": "People, Practices & Career"}, "audienceLevel": "BEGINNER", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=qrtd6svRUnk", "description": "Secure by Design does not fail only because developers lack security awareness. It often fails because teams prescribe the wrong intervention: training when the real blocker is time, tools, motivation, or trust. In this practitioner-focused talk, we introduce SECUR-E, the OWASP Security Culture Project v2.0 framework that uses COM-B to help developers and software teams diagnose what actually blocks secure development behavior.<br><br>Through a relatable story, practical examples, and six memorable developer patterns, Skeptic, Enthusiast, Compliant, Unaware, Resistant, and Embedded, the audience will learn why one-size-fits-all security programs miss, bore, or backfire. We will show how a lightweight self-assessment maps Capability, Opportunity, and Motivation into team insights, then translates those insights into better interventions: evidence for Skeptics, support for Enthusiasts, autonomy for Resistant profiles, foundational help for Unaware developers, and amplification for Embedded security-minded builders.<br><br>Key takeaways: stop asking “why don’t developers care?”; diagnose whether the blocker is skill, environment, or motivation; choose interventions that fit the pattern; protect psychological safety; and use SECUR-E as a practical playbook for building secure software teams without blame. Audience: software developers, tech leads, security champions, and engineering managers with beginner-to-intermediate knowledge.", "totalFavourites": 137, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-08T14:30:00Z", "to": "2026-10-08T15:20:00Z", "room": "Room 5", "kind": "Confe
