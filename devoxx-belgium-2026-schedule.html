<script>const DAYS=[{"name": "Monday", "date": "2026-10-05", "slots": [{"from": "2026-10-05T06:30:00Z", "to": "2026-10-05T07:30:00Z", "room": "Exhibition Hall", "kind": "Registration & Breakfast", "pause": true, "talk": null}, {"from": "2026-10-05T07:30:00Z", "to": "2026-10-05T10:30:00Z", "room": "Room 4", "kind": "Deep Dive", "pause": false, "talk": {"id": 17763, "title": "Solving Multimodal and Long-Context Challenges", "speakers": [{"fullName": "Laurent Picard", "company": "Google Cloud", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-622ef878-3a50-48a0-b1ee-008424a08391.jpg"}], "track": {"name": "Agentic Engineering & Tooling"}, "audienceLevel": "BEGINNER", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=VTxhxCy_2lE", "description": "Large Language Models have radically transformed how we solve problems, but how far can we go with real-world solutions?<br><br>In this deep-dive, we will enhance our problem-solving toolkit by integrating multimodal and long-context capabilities, and unlock an unprecedented range of new solutions. Step by step, we will architect solutions for four complex challenges:<br><br><ol><li><strong>Multimodal Video Transcription: <\/strong>Transcribe videos and identify speakers in a single prompt.<\/li><li><strong>Knowledge Graph Generation:<\/strong> Extract entities and relationships from massive inputs (1M tokens) with a single request.<\/li><li><strong>Image Bank Automation:<\/strong> Set up a pipeline for consistent image generation and bring your visual archives back to life.<\/li><li><strong>Visual Object Detection & Edition:<\/strong> Identify, restore, and transform elements within your images.<\/li><\/ol>", "totalFavourites": 67, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-05T07:30:00Z", "to": "2026-10-05T10:30:00Z", "room": "Room 5", "kind": "Deep Dive", "pause": false, "talk": {"id": 17786, "title": "Agent Loops, Decoded: Fundamentals to Agentic Patterns in Spring AI", "speakers": [{"fullName": "Christian Tzolov", "company": "Spring Team @ Broadcom", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-970401c2-a699-4f02-8855-f855f219221a.jpg"}], "track": {"name": "Agentic Engineering & Tooling"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=Q91obeWeWNQ", "description": "At their core, AI agents are context orchestrators — gathering information, querying models, evaluating outputs, and adapting their approach. This live-coded session takes you from <strong>Spring AI<\/strong> fundamentals to agentic patterns.<br>We start with the fundamentals: ChatClient essentials, context engineering, and session memory. We cover how Advisors extend the LLM execution path, including <strong>Recursive Advisors<\/strong> implementing the <strong>Agent Loop<\/strong> — the loop behind every autonomous agent — then enrich context with <strong>RAG<\/strong> and connect to external services via <strong>Tool Calling<\/strong> and <strong>MCP<\/strong>.<br><br>From there, we build up the agentic patterns Tool Calling and Advisors make possible:<br><ul><li><strong>Tool Search Tool<\/strong> — dynamic tool discovery for agents with hundreds of tools<\/li><li><strong>LLM-as-a-Judge<\/strong> — automated response evaluation in an evaluator-optimizer loop<\/li><li><strong>Explainable Agents<\/strong> — augmenting tool calls with the model's reasoning for debuggability<\/li><li><strong>Agent Skills<\/strong> — LLM-agnostic capabilities, loaded on demand<\/li><li><strong>Todo<\/strong> / structured planning — preventing \"lost in the middle\" failures<\/li><li><strong>AskUserQuestion<\/strong> — gathering requirements before acting<\/li><li><strong>Subagent Orchestration<\/strong> — delegating to specialized agents with isolated context<\/li><li><strong>MCP<\/strong>, <strong>A2A<\/strong>, and <strong>ACP<\/strong> — securing tool access, building rich MCP Apps, and connecting agents to other agents and clients<\/li><\/ul><br>You'll leave understanding how a few building blocks compose into any agentic pattern, with an early preview of what's next: <strong>durable, crash-recoverable agentic workflows in Spring AI 2.1<\/strong>.", "totalFavourites": 216, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-05T07:30:00Z", "to": "2026-10-05T10:30:00Z", "room": "Room 6", "kind": "Deep Dive", "pause": false, "talk": {"id": 10020, "title": "From AI to Agent: A Field Guide to Agentic Patterns in LangChain4j", "speakers": [{"fullName": "Loïc Magnette", "company": "Oniryx", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-cda3ea24-0a68-4fe3-a93c-e199a1d8fedf.jpg"}], "track": {"name": "Agentic Engineering & Tooling"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=IXcQYp51PLM", "description": "You have already built AI features into your Java application. The model is wrapped in a service, RAG feeds it context, tools are wired, calls are flowing. It works. Then requirements evolve. A single prompt-and-response is no longer enough. You need steps that follow each other, branches based on decisions, retries when things fail, sometimes several actions at once. The question shifts from \"how do I call an LLM?\" to \"how do I keep it under control?\".<br><br>That is where agentic systems come in. In three hours we start with a single @Agent doing one job and grow it live into a multi-agent system that can analyze, plan, act, and report back. Each step starts naive. We run it, feel the cracks, then reach for the pattern that holds: sequential, loop, parallel, and conditional workflows. AgenticScope and typed keys keep shared state honest. Goal-oriented agents, an LLM-driven supervisor, and a custom Planner take over when a fixed pipeline stops being enough. We add non-AI agents for deterministic work, human-in-the-loop checkpoints before external actions, and observability with the AgentMonitor, because an agent you cannot see is an agent you cannot debug.<br><br>You will leave able to look at a problem and tell whether it wants a plain workflow or a real agent, and how much autonomy to hand over before you lose the thread. The goal is not smarter prompts. It is agentic systems easier to reason about and evolve, because the pattern you do not adopt is the one you do not have to debug.<br>", "totalFavourites": 118, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-05T07:30:00Z", "to": "2026-10-05T10:30:00Z", "room": "Room 8", "kind": "Deep Dive", "pause": false, "talk": {"id": 23529, "title": "From Autocomplete to Autopilot: How AI Is Changing the Developer Experience", "speakers": [{"fullName": "Tugdual Grall", "company": "GitHub", "imageUrl": "https://lh3.googleusercontent.com/a/ACg8ocId9nAOVVNnr7PqLAezCQ0dDnbc0KMkMVW4oMswd0yW2Iujc1Go=s96-c"}], "track": {"name": "Agentic Engineering & Tooling"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=pMv_39iSXVA", "description": "For most developers, AI assistance started as \"smart autocomplete.\" That story has changed completely. <br><br>Today, GitHub Copilot can take a request in plain language and carry it out for you — in your editor, terminal, desktop application or in the cloud while you focus on something else. We've moved from <em>autocomplete<\/em> to <strong><em>autopilot<\/em><\/strong>.<br><br>This 3-hours deep dive is built around live demos and real projects. Step by step, we'll see the many places where AI can help across your workflow: writing and understanding code in the <strong>IDE<\/strong>, <strong>CLI<\/strong>, and in the <strong>Copilot App<\/strong> — then moving into the software delivery lifecycle with PR <strong>review<\/strong>, feature creation using cloud agents, and <strong>security<\/strong>.<br><br>You'll also learn how to customize Copilot for your own projects and needs, using <strong>Skills<\/strong>, <strong>Agents<\/strong>, and MCP to connect it to your tools, data, and conventions — and how to automate real work with agentic workflows in plain language, across several languages and tools.<br><br>You'll leave with more than a \"wow\": concrete techniques to improve quality, <strong>control cost,<\/strong> and set the right guardrails, administration, and governance. Expect many <strong>demonstrations<\/strong> and plenty of <strong>Q&A<\/strong>.<br><br>What you'll learn:<br><ul><li>Using Copilot across the IDE, CLI, App and cloud<\/li><li>AI in the SDLC: PR review, cloud agents, and security<\/li><li>Customizing with agents, skills, and custom instructions<\/li><li>Automating tasks with agentic workflows<\/li><li>Improving quality and controlling cost<\/li><li>Guardrails, administration, and governance for teams<\/li><\/ul>", "totalFavourites": 388, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-05T07:30:00Z", "to": "2026-10-05T10:30:00Z", "room": "Room 9", "kind": "Deep Dive", "pause": false, "talk": {"id": 7006, "title": "Prompt It Right: Spring Boot Testing in the AI Era", "speakers": [{"fullName": "Philip Riecks", "company": "PragmaTech GmbH", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-bc0996c3-73b4-4bc5-bd2e-3890875cb5d3.jpg"}], "track": {"name": "Development Practices"}, "audienceLevel": "BEGINNER", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=d6D8nef-32c", "description": "AI now writes most of your test code, and that changes the skill you need. The bottleneck is no longer typing tests by hand; it's knowing what good tests look like, where each kind belongs, and how to prompt AI to produce them. Without that understanding, you get tests that pass but verify nothing.<br><br>This 3-hour session gives you the full picture of testing Spring Boot applications, so you can direct AI with confidence instead of trusting it blindly.<br><br>We'll cover the complete testing pyramid: fast unit tests, sliced tests that load only the part of the context you need, and integration tests that exercise the real thing with Testcontainers. For each level, you'll see when to reach for it, what it actually proves, and how to prompt AI to write it well.<br><br>Along the way you'll collect practical patterns and recipes you can apply directly to your own codebase, plus the common pitfalls that produce slow, flaky, or misleading tests. We'll close with quick wins that improve almost any Spring Boot test suite.<br><br>Whether you're newer to Spring Boot testing or want to sharpen how you collaborate with AI tools, you'll leave knowing not just how to write tests, but how to judge whether the ones AI hands you are worth keeping.", "totalFavourites": 170, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-05T07:30:00Z", "to": "2026-10-05T10:30:00Z", "room": "BOF 2", "kind": "Hands-on Lab", "pause": false, "talk": {"id": 17800, "title": "🚀 From Java to AI: Build Your First Intelligent Agent System!", "speakers": [{"fullName": "Emmanuel Hugonnet", "company": "IBM", "imageUrl": "https://lh3.googleusercontent.com/a/ACg8ocI_LNcfEMO7A9N-kuKXYVnc6dpm2KSwRws_s0f4sSklrbdqruzA=s96-c"}, {"fullName": "Antoine Sabot-Durand", "company": "SCIAM", "imageUrl": "https://avatars.githubusercontent.com/u/489817?v=4"}, {"fullName": "yann Blazart", "company": "SCIAM", "imageUrl": "https://lh3.googleusercontent.com/a/AAcHTte0rDSnHTsgef7nTSqwxu70yJKQehjTgrVJ3oSkC7n6hlw=s96-c"}], "track": {"name": "Agentic Engineering & Tooling"}, "audienceLevel": "BEGINNER", "language": null, "youtubeUrl": "", "description": "🎯 Revolutionize the way you see Java development with AI!<br>You know Java? Then you already hold 80% of the keys to building sophisticated AI systems. Don't let Python monopolize innovation: with LangChain4j, Java becomes the go-to language for production-grade AI.<br><br>On the agenda for this hands-on workshop:<br><br>🧱 <strong>Part 1: AI as a Service.<\/strong> Learn to inject intelligence via CDI just like any other Bean. Manage conversational memory with scopes (@SessionScoped) and give your agents \"arms\" through Function Calling.<br><br>🏗️ <strong>Part 2: The Agent Architect.<\/strong> Go beyond simple chat. Design complex declarative workflows (sequential, parallel) and master the Supervisor Pattern: an AI capable of planning and managing other agents autonomously.<br><br>🚀 <strong>Why attend?<\/strong> Walk away with ready-to-use patterns, a solid grasp of the MCP/A2A protocols, and the ability to integrate robust agents into your enterprise architectures.<br>Go from spectator to AI architect! 🚀<br><br><br><br><br>", "totalFavourites": 93, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-05T08:30:00Z", "to": "2026-10-05T10:30:00Z", "room": "BOF 1", "kind": "Hands-on Lab", "pause": false, "talk": {"id": 22914, "title": "Java is for Data Science, Too: Building an End-to-End ML Pipeline Without Leaving the JVM", "speakers": [{"fullName": "Sven Reimers", "company": "Airbus", "imageUrl": "https://lh3.googleusercontent.com/a-/AFdZucoNxDrZRM-rxLR5unTKC2gX_lJcPO2h_HRwBs4pJA=s96-c"}, {"fullName": "Zoran Sevarac", "company": "Deep Netts ", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-c08270b6-3020-4fc8-a6aa-395616d4bd0f.jpg"}], "track": {"name": "Java Language & Platform"}, "audienceLevel": "BEGINNER", "language": null, "youtubeUrl": "", "description": "For years, Python has reigned supreme in the data science and machine learning landscapes, leaving Java developers with a lingering sense of FOMO. But things have changed. With the advent of lightweight data frames, blazing-fast native file parsers, and interactive notebooks, Java has evolved into a formidable environment for data engineering, exploration, and deep learning.<br>In this code-driven, interactive and hands-on session, we will break down the myth that you have to context-switch to Python for data science. We will build a complete predictive machine learning pipeline entirely in Java, utilizing an elite stack of modern JVM tools:<br><br>JTaccuino: For interactive, Jupyter-style exploratory data analysis directly inside a Java notebook environment.<br>Hardwood: The ultra-fast, zero-dependency Apache Parquet reader optimized for modern multi-core JVM performance to ingest large datasets.<br>DFLib:A lightweight, expressive Java DataFrame library to clean, filter, and manipulate our data.<br>DeepNetts: A pure Java based deep learning development toolkit for building, training, and evaluating neural networks, featuring CPU or GPU acceleration.<br>gog4j: An exclusive first look at a highly anticipated, unreleased Java plotting API based on the grammar of graphics to natively visualize data and model metrics right in the notebook.<br><br>Paging all Java Developers interested in doing math, science, AI, QC and more with Java - join us to shape Java's future in scientific computing.", "totalFavourites": 51, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-05T10:30:00Z", "to": "2026-10-05T11:30:00Z", "room": "Exhibition Hall", "kind": "Lunch", "pause": true, "talk": null}, {"from": "2026-10-05T10:40:00Z", "to": "2026-10-05T11:20:00Z", "room": "Room 4", "kind": "Lunch Talk", "pause": false, "talk": {"id": 50108, "title": "Introduction to Spring AI", "speakers": [{"fullName": "Timo Salm", "company": "Broadcom", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-93dfac6b-7673-4fca-81c6-aa9fb4a0c084.jpg"}], "track": {"name": "Agentic Engineering & Tooling"}, "audienceLevel": "BEGINNER", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=JzFelLDiVJQ", "description": "As enterprises race to embed GenAI into their applications, developers need a clear path from concept to<br>production. This session introduces Spring AI, the framework that brings GenAI capabilities natively into your<br>Spring Boot applications.<br>We'll walk through the building blocks of AI-powered applications. From conversational chat interactions to<br>Retrieval-Augmented Generation (RAG), tool calling, testing, and observability, before diving into agentic AI<br>patterns using the Model Context Protocol (MCP).<br>Through hands-on examples, attendees will learn to build production-ready AI applications and agentic systems<br>using Spring AI.", "totalFavourites": 143, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-05T10:40:00Z", "to": "2026-10-05T11:20:00Z", "room": "Room 5", "kind": "Lunch Talk", "pause": false, "talk": {"id": 7012, "title": "Destructoring is the future of Javas Encapsulation", "speakers": [{"fullName": "Richard Gross", "company": "MaibornWolff GmbH", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-7f802c4e-9a8f-467c-99d9-7d96c94b9ebc.jpg"}], "track": {"name": "Java Language & Platform"}, "audienceLevel": "BEGINNER", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=wcghmWdu-HY", "description": "Destructoring—the breakdown of an object into its constituent parts—is key to Java's ability to reliably maintain encapsulation and invariants. We resolve this apparent paradox in the presentation by looking at past and future language and platform features in the JDK.<br><br>Classic Java serialization breaks encapsulation: it directly accesses private fields, thereby bypassing constructors and the checks anchored there. The reason for this is that deconstruction and reconstruction have not been first-class citizens in the JDK until now.<br><br>This is precisely where current work within the JDK Project Amber comes in – under the working title “Derived Record/Class Creation.” This approach allows us to explicitly specify how objects are deconstructed and reconstructed. This will not only make serialization more secure and robust in the future, but we will also gain “withers” (targeted, immutable copies with individual modified components) for records and pattern matching, which will be extended beyond pure record patterns to normal classes.<br><br>Given these circumstances, it is worth taking a closer look: What is already there, what comes next – and what does this mean for our daily Java practice?", "totalFavourites": 184, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-05T10:40:00Z", "to": "2026-10-05T11:20:00Z", "room": "Room 6", "kind": "Lunch Talk", "pause": false, "talk": {"id": 10045, "title": "Java, LEGO & AI: Teaching the Next Generation to Build, Not Just Prompt", "speakers": [{"fullName": "Eddy Vos", "company": "Devoxx4Kids Netherlands", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-9b520e91-967e-42a4-9061-ff04e1ff6682.jpg"}], "track": {"name": "Mind the Geek"}, "audienceLevel": "BEGINNER", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=_VZg6dxlGaM", "description": "Generative AI can write code in seconds. So does it still make sense to teach programming to children?<br>We at Devoxx4Kids think it does.<br><br>In our workshops, we use LEGO SPIKE robots to teach problem-solving, software design and computational thinking. There is just one challenge: LEGO SPIKE does not officially support Java.<br>Rather than accepting that limitation, we explored alternative approaches to bring Java to the platform and make LEGO robots accessible to our next generation Java developers.<br><br>In this session, we'll share our journey, demonstrate how Java can be used to control LEGO SPIKE robots, discuss the technical challenges we encountered, and show real-world examples from educational settings.<br><br>Attendees will learn:<br><ul><li>Why programming fundamentals remain relevant in the AI era<\/li><li>How LEGO SPIKE can be integrated into a Java ecosystem<\/li><li>Technical approaches for controlling SPIKE robots with Java<\/li><li>Lessons learned while teaching children with physical computing platforms<\/li><li><\/li><\/ul>Expect live demos, moving robots, and perhaps a few LEGO bricks on stage.", "totalFavourites": 131, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-05T10:40:00Z", "to": "2026-10-05T11:20:00Z", "room": "Room 8", "kind": "Lunch Talk", "pause": false, "talk": null}, {"from": "2026-10-05T11:30:00Z", "to": "2026-10-05T14:30:00Z", "room": "Room 4", "kind": "Deep Dive", "pause": false, "talk": {"id": 17765, "title": "Can AI Build a Jakarta EE Runtime? The Vidocq Experiment", "speakers": [{"fullName": "Antoine Sabot-Durand", "company": "SCIAM", "imageUrl": "https://avatars.githubusercontent.com/u/489817?v=4"}, {"fullName": "yann Blazart", "company": "SCIAM", "imageUrl": "https://lh3.googleusercontent.com/a/AAcHTte0rDSnHTsgef7nTSqwxu70yJKQehjTgrVJ3oSkC7n6hlw=s96-c"}, {"fullName": "Sebastien Blanc", "company": "SCIAM", "imageUrl": "https://lh3.googleusercontent.com/a-/AOh14GghdlsQf-LeH_np8EgyP0zMkqdtdA3aeHvPYsYOag=s96-c"}], "track": {"name": "Agentic Engineering & Tooling"}, "audienceLevel": "BEGINNER", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=dq5rueVhiIM", "description": "This conference started in 2001 as Javapolis, the same year J2EE's first specs were taking shape. Twenty-five years later, on this stage, we're closing that loop: implementing those specs with a 2026 AI coding agent as co-author, live.<br><strong>Part 1 — Building Vidocq, then building something new, live.<\/strong> We'll walk through how Vidocq, our Jakarta EE Core Profile 11 and MicroProfile 7.1 runtime, came together: the choice to code against formal specifications rather than our own assumptions, and what changed once AI joined that process. Where AI-generated code passed our review but failed spec conformance. Where a spec's edge cases caught something the AI happily hallucinated past. The workflow we landed on to keep AI output honest against TCK-level requirements. Then we'll do it live: implementing a Jakarta EE or MicroProfile spec we haven't built yet, on stage, with an AI agent constrained by the spec text. Real live coding, backup video included in case it goes sideways.<br><strong>Part 2 — Vidocq, from spec to CLI.<\/strong> A fast tour of what defines the runtime: JPMS enforced at unit granularity, Build Compatible Extensions, and the JDK 25 features (virtual threads, structured concurrency, scoped values) behind Vidocq's zero external dependencies. Then straight to the command line: we'll bootstrap and build a small app on Vidocq live, showing how those choices feel to work with, not just how they look in a diagram.<br>Two decades of spec work, one AI model, one CLI. Watch the gap close.<br>", "totalFavourites": 25, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-05T11:30:00Z", "to": "2026-10-05T14:30:00Z", "room": "Room 5", "kind": "Deep Dive", "pause": false, "talk": {"id": 23524, "title": "Modern Java in Practice - The Features That Matter", "speakers": [{"fullName": "Nicolai Parlog", "company": "Oracle", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-acf609a9-0afe-496f-90db-f7bc0e57fa11.jpg"}, {"fullName": "Falk Sippach", "company": "embarc Software Consulting GmbH", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-8e6d0e24-74e5-4fd0-9e2e-6cabe2b98ebe.jpg"}], "track": {"name": "Java Language & Platform"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=zC2tbq7S5UE", "description": "You may be on the latest Java version but are you getting the most out of it? Recent releases have added a lot of features and while some might have flown under the radar, others come together to form more than the sum of their parts. Either way, it is worth looking at the whole corpus of Java changes over the last years:<br><br><ul><li>pattern matching and Data-Oriented Programming<\/li><li>virtual threads and structured concurrency<\/li><li>an on-ramp for beginners and better experiments for experts<\/li><li>new APIs, from stream gatherers to sequenced collections, from lazy constants to HTTP/3<\/li><li>improved performance, like ahead-of-time computation and compact object headers<\/li><li>better security and tooling - most out of the box, some on demand<\/li><\/ul><br>And there’ll even be time to take a peak at the future and look into the current proposals for value types and string templates, deconstructible class and “withers”. After this deep dive, you’ll be ready to get the most out of the latest Java versions - or at least have good arguments to convince your tech lead to update.<br>", "totalFavourites": 365, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-05T11:30:00Z", "to": "2026-10-05T14:30:00Z", "room": "Room 6", "kind": "Deep Dive", "pause": false, "talk": {"id": 25027, "title": "Codepocalypse Now: LangChain4j vs JetBrains Koog", "speakers": [{"fullName": "Viktor Gamov", "company": "Confluent", "imageUrl": "https://lh3.googleusercontent.com/a/AAcHTtd9ZkVQ9giwUn-Tq1GRAjZ3ip6tMZ0Jnr2XMv2ECSYvkwJO=s96-c"}, {"fullName": "Baruch Sadogursky", "company": "Port.io", "imageUrl": "https://lh3.googleusercontent.com/a/ACg8ocKqAphxO-bPI7xrWrgh3Vhn_yJ1H91TCUKCNY_tGTQagjntFox7kA=s96-c"}], "track": {"name": "Agentic Engineering & Tooling"}, "audienceLevel": "BEGINNER", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=GGEmc6eR8c4", "description": "Can Java build a real AI agent — one that manages your calendar, reads your email, orders pizza, and remembers who you are across sessions? OpenClaw, the personal AI agent with 350K GitHub stars, proves the concept. We're going to build it twice, in Java, live on stage.<br><br>Baruch brings JetBrains Koog, Viktor brings LangChain4j. Same features, same LLM, completely different philosophies. We'll run six competitive rounds of coding, from basic agent setup through memory, tool calling, agentic workflows, guardrails, and observability. Each round surfaces a design disagreement: should memory be an Advisor or a Provider? Are agents composed services or first-class citizens? And when your guardrail framework and the model disagree, who wins?<br><br>The frameworks disagree on how AI agents should be built. The audience votes on who's right.", "totalFavourites": 52, "slidesUrl": "https://drive.google.com/file/d/1jpwSxTC2LbaF2zVeYSHXfLgtMB6afoSq/view", "teamRating": null}}, {"from": "2026-10-05T11:30:00Z", "to": "2026-10-05T14:30:00Z", "room": "Room 8", "kind": "Deep Dive", "pause": false, "talk": {"id": 4098, "title": "From Developer to Builder: A Spec-Driven Development Deep Dive", "speakers": [{"fullName": "Simon Martinelli", "company": "Martinelli GmbH", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-8784fd05-8251-4fa9-be7b-35c1216e84b9.jpg"}], "track": {"name": "Agentic Engineering & Tooling"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=z8lal-Yt_04", "description": "Spec-Driven Development is a way of working with AI coding agents where the specification drives the code, not the prompt. I use Spec-Driven Development according to the AI Unified Process (AIUP) in several customer projects, and in this deep dive, I show how it works in practice.<br><br>We will build a business application from scratch, and also learn how to work on brownfield projects. We write specifications, let an AI agent generate the code, run it, and add tests that check the code against the spec. When the requirements change, we update the spec and regenerate the code rather than patching the code by hand.<br><br>We will explore the harness: the rules, context, and tests around the agent that keep its output predictable enough for real work. By the end, you will know what Spec-Driven Development is, where it helps, where it does not, and how to try it on your own stack.<br>", "totalFavourites": 537, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-05T11:30:00Z", "to": "2026-10-05T14:30:00Z", "room": "Room 9", "kind": "Deep Dive", "pause": false, "talk": {"id": 5537, "title": "The Quarkus advantage: Turning build-time metaprogramming into runtime performances", "speakers": [{"fullName": "Mario Fusco", "company": "IBM", "imageUrl": "https://lh3.googleusercontent.com/a-/AOh14GinuLQCwL67BBgfGsiWRl3mu3Ya0TbDffhYFiXX=s96-c"}, {"fullName": "Georgios Andrianakis", "company": "IBM", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-95904645-1695-4adf-b24c-41926050b4b4.jpg"}, {"fullName": "Francesco Nigro", "company": "IBM", "imageUrl": "https://lh3.googleusercontent.com/a/AItbvmlsKs3_saDtZgJ0buTR5LvusOsvlGmdbC7cEeks=s96-c"}], "track": {"name": "Architecture & Modernization"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=SgK0zMNayq0", "description": "Java frameworks have long relied on reflection, classpath scanning and runtime dynamism to deliver flexibility, but at a significant cost in terms of startup time, memory footprint, and raw throughput. The main goal of this talk is demonstrating with a recently introduced practical optimization how the radically different architecture of Quarkus unlocks performance gains that traditional frameworks simply cannot achieve.<br><br>Using the case studies of JSON serialization, REST Client and Quarkus LangChain4j we will walk through how a Quarkus extension can leverage Quarkus's build-time indexing to identify and inspect the application's domain model at build time, and Gizmo to generate optimized bytecode that completely replaces Jackson's reflection-heavy serialization machinery. The result is not just cleaner execution, but measurable performance improvements—demonstrating double-digit throughput gains while reducing latency and runtime overhead.<br><br>Beyond the specific optimization, this talk reveals a deeper insight: many “dynamic” features in Java are only necessary because frameworks lack build-time knowledge. By embracing ahead-of-time metaprogramming, Quarkus redefines what is possible in the JVM ecosystem.<br><br>Attendees will leave with a clear mental model of Quarkus’ architecture, a practical understanding of build-time metaprogramming, and a fresh perspective on how rethinking the boundary between build and runtime can unlock entirely new performance and footprint frontiers.", "totalFavourites": 83, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-05T11:30:00Z", "to": "2026-10-05T14:30:00Z", "room": "BOF 1", "kind": "Hands-on Lab", "pause": false, "talk": {"id": 22920, "title": "Using Structured Concurrency and Scoped Values to Create a Virtual Threads Based Asynchronous Application", "speakers": [{"fullName": "Ana-Maria Mihalceanu", "company": "Oracle", "imageUrl": "https://lh3.googleusercontent.com/a-/AOh14Gj1OS6OpAzuwBKwoUuCi9gxvNPvdmVA7nbW8lg3mg=s96-c"}, {"fullName": "José Paumard", "company": "Oracle", "imageUrl": "https://lh3.googleusercontent.com/a-/AOh14GhsVIUuTR9Onoo-D8UMW5QId2Yw1V_EUvqdWdNQ0RQ=s96-c"}], "track": {"name": "Java Language & Platform"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "", "description": "The Loom project is about making asynchronous programming simpler. The promise is to enable the \"simple thread-per-request style to scale with near-optimal hardware utilization\". Before virtual threads, this was only achievable with callback-based reactive programming. Loom first brought virtual thread in JDK 21 that makes the blocking of threads almost free. Along with it, it published the Scoped Values API in JDK 25, as a replacement of the Thread Local API. The last element is the Structured Concurrency API, which is still a preview feature in JDK 26 and 27. This hands-on lab guides you through writing a virtual thread-based web application that utilizes structured concurrency to parallelize requests, and implements different strategies to process them. Then it shows you how you can use scoped values to pass sensitive information from one module of your application to another one, without relying on method parameters. It also uses the principles of Data Oriented Programming to organize your application in a simple way. You will use StructuredTaskScopes, the implementations of the Joiner interface that the API gives you, and you will create your own implementations as well. In the end, you will see the patterns of code that the Loom project gives you to achieve the same throughput as a classical reactive application, and you will then be able to compare both approaches to choose which one you prefer.", "totalFavourites": 80, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-05T11:30:00Z", "to": "2026-10-05T14:30:00Z", "room": "BOF 2", "kind": "Hands-on Lab", "pause": false, "talk": {"id": 24229, "title": "Building Autonomous AI Agents with Spring", "speakers": [{"fullName": "Timo Salm", "company": "Broadcom", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-93dfac6b-7673-4fca-81c6-aa9fb4a0c084.jpg"}, {"fullName": "Sandra Ahlgrimm", "company": "Microsoft / GitHub", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-055a7a76-5e5c-4ed2-a7af-f624fb91c129.jpg"}], "track": {"name": "Agentic Engineering & Tooling"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "", "description": "<p>Software development has rapidly evolved from explicit, instruction-based programming to integrating the non-deterministic reasoning capabilities of Large Language Models.<br><p>Now, we face the next massive paradigm shift: moving from passive AI tools to Agentic AI. <br><p><br><p>In this workshop, you will learn everything you need to build these autonomous systems using Java, Spring AI, the Model Context Protocol (MCP) and more. We will move beyond basic prompting to master chat memory, RAG, tool integration, and agentic patterns. Most importantly, we address the \"day two\" challenges of production: ensuring your agents are observable, secure, and reliable. By the end of the session, you will have built a multi-agent system capable of solving complex, high-level tasks. <br><p><br><p>Join us and transform your applications from simple interfaces into proactive digital colleagues.", "totalFavourites": 121, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-05T12:00:00Z", "to": "2026-10-05T18:00:00Z", "room": "Exhibition Hall", "kind": "Exhibition Setup", "pause": true, "talk": null}, {"from": "2026-10-05T14:30:00Z", "to": "2026-10-05T14:50:00Z", "room": "Exhibition Hall", "kind": "Coffee Break", "pause": true, "talk": null}, {"from": "2026-10-05T14:50:00Z", "to": "2026-10-05T15:20:00Z", "room": "Room 4", "kind": "Tools-in-Action", "pause": false, "talk": {"id": 24227, "title": "Expanding Vector Search Beyond Similarity", "speakers": [{"fullName": "Alina Yurenko", "company": "Oracle", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-a31c43d1-c596-4e24-af3f-078f54609e6c.jpg"}], "track": {"name": "Agentic Engineering & Tooling"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=EnHPYkSAaCo", "description": "Vector search is not hard to prototype: turn data into embeddings, store them, and return the closest matches. But real-world applications need to consider much more: application data, business logic, and practical constraints.<br><br>In this session, we’ll go through building a travel application with Micronaut, LangChain4j, and GraalVM.<br><br>Some of the topics we’ll cover:<br><br>– The strategy for generating vector embeddings<br>– Combining similarity results with application data and business constraints<br>– Combining semantic and location-aware search<br>– Most helpful features of Micronaut Data and Micronaut LangChain4j<br>– Building and running the application as a Native Image<br><br>We’ll see how these pieces work together to turn basic similarity search into a more intelligent and useful application.", "totalFavourites": 91, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-05T14:50:00Z", "to": "2026-10-05T15:20:00Z", "room": "Room 5", "kind": "Tools-in-Action", "pause": false, "talk": {"id": 21654, "title": "Your AI Agent Trusts Strangers. Let Me Show You.", "speakers": [{"fullName": "Elder Moraes", "company": "IBM", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-ff554094-44a4-4fb1-9326-06efd32e8236.jpg"}], "track": {"name": "Agentic Engineering & Tooling"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=j3aEB0i3Up8", "description": "Your AI agent will follow instructions hidden in the content it reads. And you may not be able to stop it right now.<br>Indirect prompt injection is the vulnerability nobody scoped for. The agent treats a poisoned document or a tampered tool result as trusted input, and with MCP and tools attached, that input can move money, delete data, or leak a key. Most Java teams shipping agents today have never seen the attack, so they have never built the defense.<br>In 30 minutes, you will be able to do three things: reproduce an indirect injection against a Java agent, apply the mitigations that actually hold (least privilege, instruction and data separation, tool allowlists, output validation), and reason about your agent with a real threat model. All live in LangChain4j.<br>Join us and walk out able to attack your own agent before someone else does.<br><br>Key Takeaways<br><ol><li>See how an indirect prompt injection turns a helpful agent into an exfiltration path through the content it reads.<\/li><li>Apply the mitigations that hold: least privilege, instruction and data separation, tool allowlists, output validation.<\/li><li>Reason about a Java agent with a real threat model, treating every tool result as untrusted.<\/li><\/ol><br>Target Audience<br>Developers, Security Engineers, Architects<br>", "totalFavourites": 200, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-05T14:50:00Z", "to": "2026-10-05T15:20:00Z", "room": "Room 6", "kind": "Tools-in-Action", "pause": false, "talk": {"id": 10034, "title": "The day we stopped publishing Kafka event from our API...", "speakers": [{"fullName": "Virginie Zinck", "company": "Decathlon", "imageUrl": "https://lh3.googleusercontent.com/a/ACg8ocKgnGLF_nn-POcnSHYpEhLDcF13X3HOj5n4DRkdD5HlBiWPbiqI=s96-c"}], "track": {"name": "Architecture & Modernization"}, "audienceLevel": "BEGINNER", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=YEy7AgRO7As", "description": "The Day We Stopped Publishing Kafka Events from Our Order API — and Why It Strengthened Our Event-Driven Architecture<br> <br>This talk will present how we addressed the “dual write” issue we had in our Order Management solution between our database and our Kafka cluster, causing data inconsistencies and complicated error handling. <br><br>The answer ? A simplified version of the Outbox pattern—leveraging a Debezium connector to reliably decouple database writes from Kafka event publishing and using our Order table as the outbox table to simplify the solution.<br><br>This architectural shift resulted in a simpler, more robust Order API, eliminating Kafka-specific code and complex error handling. This loosely coupled architecture also offers consumer-driven business logic with easier extensibility.<br><br>Join this talk to learn how this architectural decision strengthened our event-driven architecture and discover the crucial details of configuring Debezium—including heartbeat and monitoring—to ensure stability and avoid database disk space issues.<br>", "totalFavourites": 105, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-05T14:50:00Z", "to": "2026-10-05T15:20:00Z", "room": "Room 8", "kind": "Tools-in-Action", "pause": false, "talk": {"id": 7011, "title": "Secure Your Coding Agent Like It’s Malware", "speakers": [{"fullName": "Richard Gross", "company": "MaibornWolff GmbH", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-7f802c4e-9a8f-467c-99d9-7d96c94b9ebc.jpg"}], "track": {"name": "Security, Trust & Compliance"}, "audienceLevel": "BEGINNER", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=GLJGhkxMdgU", "description": "Coding agents are dangerous: they can write files (including their own permissions or scripts meant to keep them in check), scan the filesystem, read credentials, and make tool calls that modify databases or exfiltrate data. Any content the agent processes (a pull request, an external code library, or online documentation) can trigger these actions and lead to persisted compromise. The 'Comment and Control' attack demonstrated this, as did the mini-Shai-Hulud attack, which copied its loader into Claude's <code>settings.json<\/code>, so it re-executed on every session start.<br><br>Built-in agent sandboxes are inadequate. Agents are very good at escaping them (see SandboxEscapeBench) but often need not, as they can disable the sandbox themselves, as specified in the Claude bash sandbox documentation.<br><br>Can we make coding agents secure? This talk is for developers running coding agents on their machines or in CI/CD. First we map the attack surface: prompt injection variations (e.g. role-play, poem attack) and how to hide them (Unicode smuggling, custom glyphs). Then we cover seven specific threats (supply chain compromise, data exfiltration) and seven defence layers.<br><br>We treat the agent itself as untrusted, clamping it down with externally enforced controls it cannot reach or reconfigure (VMs, network firewalls). Attendees will leave with a sandbox taxonomy to evaluate their own setups, a set of ready-to-use tools that score well against it, and a concrete plan to shrink their agents' blast radius.", "totalFavourites": 336, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-05T14:50:00Z", "to": "2026-10-05T16:50:00Z", "room": "BOF 1", "kind": "Hands-on Lab", "pause": false, "talk": {"id": 5516, "title": "Wiring Up the AI Mesh: Building A2A-Compliant Java Agents", "speakers": [{"fullName": "Emmanuel Hugonnet", "company": "IBM", "imageUrl": "https://lh3.googleusercontent.com/a/ACg8ocI_LNcfEMO7A9N-kuKXYVnc6dpm2KSwRws_s0f4sSklrbdqruzA=s96-c"}, {"fullName": "Mario Fusco", "company": "IBM", "imageUrl": "https://lh3.googleusercontent.com/a-/AOh14GinuLQCwL67BBgfGsiWRl3mu3Ya0TbDffhYFiXX=s96-c"}, {"fullName": "Kevin Dubois", "company": "IBM", "imageUrl": "https://lh3.googleusercontent.com/a/ACg8ocInnMfs42NN14UEEtFboGAF5baXQdsTFdbDo_ZuR1DADFHUONPEfA=s96-c"}], "track": {"name": "Agentic Engineering & Tooling"}, "audienceLevel": "BEGINNER", "language": null, "youtubeUrl": "", "description": "<strong><em>Building Production-Ready A2A Agents with LangChain4j, Quarkus, Spring Boot & Jakarta EE<\/em><\/strong><br>Enterprise AI is shifting from isolated chatbots to multi-agent ecosystems where specialized agents negotiate and delegate tasks. The <strong>Agent-to-Agent (A2A) Protocol<\/strong> is the emerging standard for this interoperability, defining the wire format for seamless cross-language communication.<br>This intensive, hands-on workshop equips Java developers to build, connect, and scale production-grade A2A ecosystems using <strong>LangChain4j<\/strong> and the official<strong> A2A Java SDK<\/strong>.<br><h3><strong>🛠️ What You Will Learn & Build<\/strong><\/h3>The journey begins with the core architecture, where you will decode the A2A specifications and implement an AgentCard for schema discovery alongside an AgentCardExecutor for standardized message delivery.<br>From there, you will transition into a <strong>multi-runtime build,<\/strong> deploying identical agent capability contracts natively across <strong>Spring Boot<\/strong>, JA2A, and <strong>Quarkus<\/strong>.<br>To prove true language independence, you will connect a Python-based agent built with the A2A <strong>Python SDK<\/strong> to achieve seamless, cross-framework interaction.<br>As the network grows, you will dive into orchestration by building a dynamic router agent capable of decomposing complex, multi-turn tasks and dispatching them across your diverse mesh.<br>Finally, you will prepare for <strong>Enterprise Day-2 Operations <\/strong>by mastering production challenges like distributed state management, load balancing for stateful LLM conversations, and tracing complex interactions via <strong>OpenTelemetry (OTel)<\/strong>.", "totalFavourites": 48, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-05T14:50:00Z", "to": "2026-10-05T16:50:00Z", "room": "BOF 2", "kind": "Hands-on Lab", "pause": false, "talk": {"id": 20651, "title": "From Install to Insight: A Hands-On GPU Lab for Java Developers", "speakers": [{"fullName": "Thanos Stratikopoulos", "company": "Beestream.ai | TornadoVM", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-1eb3708e-af15-4778-a560-15ebbea2b133.jpg"}, {"fullName": "Christos Kotselidis", "company": "Beestream.ai, University of Manchester", "imageUrl": "https://lh3.googleusercontent.com/a/ACg8ocJ-pxqHhRG9lMhvBsm7RliPrVLhsyhgaBJQMrzmQZgJ2KKM1RVe=s96-c"}, {"fullName": "Mary Xekalaki", "company": "beestream.ai | TornadoVM", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-a82d2879-53f1-4330-b9cb-64cc383a1b02.jpg"}, {"fullName": "Michalis Papadimitriou", "company": "Neo4j | University of Manchester", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-85f7f25f-5f2c-4526-bed6-489be66ed5e1.jpg"}], "track": {"name": "Java Language & Platform"}, "audienceLevel": "BEGINNER", "language": null, "youtubeUrl": "", "description": "Getting a local LLM running on your GPU from Java used to stall at installation: which SDK, which<br>backend, which JDK flags? Thirteen TornadoVM releases after our last Devoxx, it's a single command.<br><br>This hands-on lab shows what changed, on your own laptop.<br><br>We walk through the new features, each straight to the console:<br>• SDKs on SDKMAN! and Maven Central<br>• one SDK for JDK 21 to 27<br>• a native layer rebuilt on Java's FFM API<br>• Metal, CUDA and OpenCL backends<br>• the new CUDA Tile API<br><br>Short animations explain the programming model. You'll then profile and debug with TornadoVM's<br>tools: TornadoPulse, TornadoViz and the TornadoInsight IDE plugin.<br><br>Finally, you'll run jitLLM (formerly GPULlama3.java), LLM inference in pure Java, and connect it to<br>DevoxxGenie in IntelliJ IDEA as a local, GPU-backed assistant. We close with advanced demos on<br>NVIDIA: cuBLAS in the same task graph as your Java kernels, and a glimpse of GPU-accelerated<br>Apache Flink.<br><br>No GPU programming experience required. You'll leave with a working local GPU-accelerated LLM<br>setup and the tools to inspect it.", "totalFavourites": 32, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-05T15:20:00Z", "to": "2026-10-05T15:35:00Z", "room": "Exhibition Hall", "kind": "Break", "pause": true, "talk": null}, {"from": "2026-10-05T15:35:00Z", "to": "2026-10-05T16:05:00Z", "room": "Room 4", "kind": "Tools-in-Action", "pause": false, "talk": {"id": 25654, "title": "Beyond Code: The Intent-Driven IDE for the Agentic Age", "speakers": [{"fullName": "Bruno Borges", "company": "GitHub", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-fd56814f-d6c5-4009-8f3d-9c9f8d2cd8f2.jpg"}], "track": {"name": "Agentic Engineering & Tooling"}, "audienceLevel": "BEGINNER", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=sexe_tnhAOI", "description": "For decades, IDEs have organized software development around files, editors, plugins, code completion, and automation. But what happens when the developer’s primary input is no longer code, but intent?<br><br>In this live, demo-driven session, we’ll examine the emerging shape of intent-driven development environments: specifications become executable context, agents work concurrently in isolated workspaces, and developers shift from producing every line to directing, reviewing, and integrating work.<br><br>We’ll take a task from specification to pull request, delegate parts of it to specialized agents, and build an extension for a custom workflow the environment did not previously support. We’ll also explore the architectural choices behind these systems, including agent harnesses, model selection, local inference, automation, context management, and human approval boundaries.<br><br>Rather than presenting agents as a replacement for developers, we’ll examine where this model works, where it breaks down, and what skills developers need when intent becomes the starting point for software creation.", "totalFavourites": 90, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-05T15:35:00Z", "to": "2026-10-05T16:05:00Z", "room": "Room 5", "kind": "Tools-in-Action", "pause": false, "talk": {"id": 23533, "title": "Teaching a New Dog Old Tricks: Give the Agent a Debugger", "speakers": [{"fullName": "Anton Arhipov", "company": "JetBrains", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-d4d89f78-d4bb-456f-ab6f-4768b4822745.jpg"}], "track": {"name": "Agentic Engineering & Tooling"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=rk22mStXsGU", "description": "<br>When code misbehaves, coding agents often fall back on an old habit. They add print statements. The method works. It also changes the program before the agent understands the problem.<br><br>The debugger provides a cleaner way to find the evidence. Logpoints inspect application state while the program keeps running. They can write custom messages without changing the source. You can even place them inside compiled third-party libraries. Every output line links back to the code that produced it. This includes logpoints and regular loggers as well as print statements.<br><br>IntelliJ IDEA makes its debugger tools available to coding agents. The debugger skill covers dozens of tools and settings. Few developers keep all of them in their heads. The complete playbook fits into the agent's context.<br><br>The agent combines that debugger knowledge with its understanding of the project code. It can choose useful locations for breakpoints and logpoints. It can start a debug run configuration and read actual values. As the evidence develops, it can move its observation points. The source stays untouched.<br><br>What attendees will learn:<br><br>- How Logpoints capture runtime state without suspending the program or modifying its source<br>- How to investigate behavior inside compiled third-party libraries<br>- How navigable debugger output connects runtime observations to their origin in code<br>- How an agent combines code context with debugger knowledge to place useful breakpoints and logpoints<br>", "totalFavourites": 187, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-05T15:35:00Z", "to": "2026-10-05T16:05:00Z", "room": "Room 6", "kind": "Tools-in-Action", "pause": false, "talk": {"id": 25652, "title": "In the loop, not in the dark: staying in control in the era of dark software factories", "speakers": [{"fullName": "Alex Gavrilescu", "company": "Backlog.md", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-05b8ab40-661f-4685-ba72-9774462ba13b.jpg"}], "track": {"name": "Agentic Engineering & Tooling"}, "audienceLevel": "BEGINNER", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=_dcauZC9ST8", "description": "Last year I built Backlog.md, an open source tool that captures your intent, splits it into small markdown tasks, and lets you follow your agents' progress on a TUI Kanban board. A year and 300,000 agent-written lines later, my projects had quietly turned into a small dark factory: software getting built with nobody really reviewing it. Task tracking told me what the agents did, but not what my system had become. I am no longer the owner of my code.<br><br>Today I am building Groma.md to fix this. Groma keeps a real-time architectural blueprint of your project's domain as the source of truth, and tasks become the means to reach the blueprint's next iteration. Imagine UML without the fear that it goes stale, where you can watch exactly which parts of the system your agents are modifying.<br><br>Whether you are adding an order management system to a brownfield codebase or starting a new project from scratch, you design it in Groma and let the agents write the code, while you keep an eye on the overall architecture and stay in control of the meaningful decisions.<br><br>In this talk I will take a large open source repository and map it into a Groma blueprint live on stage, to show you how to become the owner of your code again.", "totalFavourites": 126, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-05T15:35:00Z", "to": "2026-10-05T16:05:00Z", "room": "Room 8", "kind": "Tools-in-Action", "pause": false, "talk": {"id": 5507, "title": "Stopping AI-Generated Architectural Drift: Deterministic Guardrails for Agentic Coding", "speakers": [{"fullName": "Sasha Podlesniuk", "company": "INSHUR", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-48d9d8c1-f223-44ec-ba3e-6aee8911b78e.jpg"}], "track": {"name": "Architecture & Modernization"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=K3kD89Y1YCk", "description": "Agentic coding generates code faster than any team can review it, and that speed lets a single questionable pattern spread across a codebase before anyone notices. This talk shows how to stop that drift at the source, with layered guardrails that make architectural violations structurally hard to introduce instead of something you catch too late in review.<br><br>Drawn from reviewing hundreds of AI-assisted pull requests: natural-language (NL) repo rules don't hold the line against an LLM. The reliable fix is a deterministic foundation, executable architectural rules acting as fitness functions for AI-generated code, built with ArchUnit, custom linters, and CI gates that fail the build the instant a boundary is crossed. That layer is also what makes NL rules work: once it fences off the cases that must never be wrong, targeted NL rules become precise instead of suggestions an agent ignores. Includes live demos of guardrails catching violations in real time.<br><br>Takeaways: why NL rules fail to stop LLMs propagating bad patterns; how to build a deterministic enforcement layer (ArchUnit, custom linters, CI gates) with instant feedback; how that layer makes your NL rules reliable; a practical model for sorting any rule into the right layer.<br><br>Audience: software architects, tech leads, and senior engineers maintaining architectural consistency on AI-augmented teams.", "totalFavourites": 269, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-05T16:05:00Z", "to": "2026-10-05T16:20:00Z", "room": "Exhibition Hall", "kind": "Break", "pause": true, "talk": null}, {"from": "2026-10-05T16:20:00Z", "to": "2026-10-05T16:50:00Z", "room": "Room 4", "kind": "Tools-in-Action", "pause": false, "talk": {"id": 17783, "title": "Building the Trusted Agent Ecosystem", "speakers": [{"fullName": "Ivan Petrov", "company": "Google DeepMind", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-8874cc9a-8b3f-4c89-98ec-b05f6ea7c89e.jpg"}, {"fullName": "Patrick McGrath", "company": "Google DeepMind", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-cbc5a5a7-dc25-4e46-98e8-4721c606dc4f.jpg"}], "track": {"name": "Security, Trust & Compliance"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=dWF5HMkKiLg", "description": "The industry is rapidly introducing agentic services that are accelerating the arrival of the \"Agentic Web\". Yet adoption is still bottlenecked by the lack of user trust. Users are understandably afraid to grant remote AI agents access to their private data or authorization tokens. To overcome this, we need robust solutions that empower all developers to create agents that users can trust.<br><br>In this session, we introduce a comprehensive framework for building the Trusted Agent Ecosystem. By leveraging Confidential Computing and Binary Transparency, we provide verifiable trust across the entire AI stack: securing MCP tools, model inference and remote agents connected via A2A. We will present our open-source implementation of the framework that leverages verifiable WebAssembly sandboxes and Confidential GPUs to build trusted agentic services.", "totalFavourites": 90, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-05T16:20:00Z", "to": "2026-10-05T16:50:00Z", "room": "Room 5", "kind": "Tools-in-Action", "pause": false, "talk": {"id": 22911, "title": "One tool to rule them all: bash, a tiny LLM, and the birth of a coding agent", "speakers": [{"fullName": "Philippe Charrière", "company": "Docker", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-c958a486-4d64-44ef-bb6d-77de06638b5d.jpg"}], "track": {"name": "Agentic Engineering & Tooling"}, "audienceLevel": "BEGINNER", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=wWfj4AJahlQ", "description": "Coding agents look like magic. Strip away the hype and you find a surprisingly small core: a loop, a language model, and… a shell.<br><br>In this Tools in Action, we will see this core live. We give a small, local LLM (under 10B, running on Docker Model Runner) a single built-in tool (bash) and watch it turn into a coding helper. It lists files, greps the repo, runs the tests, curls an API, pipes into jq… all on its own, because the model already knows these CLIs. And when it doesn't? It runs --help and figures it.<br><br>We'll see the smallest agent loop in action: the model decides which command to run, the agents executes it, feeds the result back, and repeat until it answers. We'll look at what actually goes over the wire (the tool description, the tool_calls the model emits), why writing a good description is really prompt engineering, and why returning errors is what lets the model recover on its own.<br><br>You'll leave understanding how coding agents really work under the hood, why one well-chosen built-in tool often beats a pile of MCP servers, and how far a tiny local model can go. <br><br>Live demos, few slides, code you can run tonight.<br>", "totalFavourites": 161, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-05T16:20:00Z", "to": "2026-10-05T16:50:00Z", "room": "Room 8", "kind": "Tools-in-Action", "pause": false, "talk": {"id": 8196, "title": "Testing Architecture Made Simple", "speakers": [{"fullName": "Gunter Rotsaert", "company": "ICT TriOpSys", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-3ce83e03-89be-4443-a0b5-015cef45aa7e.jpg"}], "track": {"name": "Architecture & Modernization"}, "audienceLevel": "BEGINNER", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=asAxisu6EQ0", "description": "Every software project starts with architectural decisions—principles and patterns meant to guide the system’s evolution. But as codebases grow, how do you ensure those decisions remain intact? That’s where ArchUnit comes in. By expressing architectural rules as tests, ArchUnit lets you verify your architecture automatically with every build. <br><br>Taikai takes this concept further. It builds on ArchUnit by providing a ready-to-use collection of architectural rules for popular technologies, helping teams enforce architectural consistency and best practices effortlessly. In this session, you’ll learn how Taikai can make your architecture more testable, maintainable, and resilient from day one.", "totalFavourites": 175, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-05T16:50:00Z", "to": "2026-10-05T17:00:00Z", "room": "Exhibition Hall", "kind": "Break", "pause": true, "talk": null}, {"from": "2026-10-05T17:00:00Z", "to": "2026-10-05T18:00:00Z", "room": "BOF 1", "kind": "BOF", "pause": false, "talk": {"id": 13753, "title": "Hi, Belgian Java Community, we want to meet you!", "speakers": [{"fullName": "Frank Delporte", "company": "Azul", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-fb7af307-de39-456f-a5d2-879c0f97a2f9.jpg"}, {"fullName": "Tom Cools", "company": "Timefold", "imageUrl": "https://lh3.googleusercontent.com/a/ACg8ocLiUjyjM49h8fxM3bZDY_EBsphO-BhswQ2kD7N4rUU3lgNYf2Hs=s96-c"}], "track": {"name": "People, Practices & Career"}, "audienceLevel": "BEGINNER", "language": null, "youtubeUrl": "", "description": "Are you passionate about Java and curious to meet the people shaping its community here in Belgium? Whether you’re a first-time Devoxx attendee, a seasoned Java veteran, or just someone who enjoys geeking out over JVM minutiae, this is the place to be.<br><br>Join us for an informal and interactive session. We’ll share what the BeJUG is all about: how we connect Java enthusiasts across the country, the kinds of events we organize (from meetups to hands-on sessions), and how you can get involved as an attendee, a speaker, or even a contributor.<br><br>Come say hi, share your ideas, ask questions, or just hang out and network with fellow Java lovers. No slides, no strict agenda, just a room full of like-minded people who care about the Java ecosystem and its vibrant Belgian community. Everyone is welcome, and we’d love to hear what you would like to see from your local Java User Group!", "totalFavourites": 32, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-05T17:00:00Z", "to": "2026-10-05T18:00:00Z", "room": "BOF 2", "kind": "BOF", "pause": false, "talk": {"id": 16435, "title": "LangChain4j Community BOF", "speakers": [{"fullName": "Dimitris Andreadis", "company": "IBM", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-c540ac38-0fdf-40cb-b0fe-8a357abd1f87.jpg"}], "track": {"name": "Agentic Engineering & Tooling"}, "audienceLevel": "BEGINNER", "language": null, "youtubeUrl": "", "description": "Curious about the evolution and future direction of LangChain4j? Join our Birds of a Feather (BOF) session for an open and interactive discussion with members of the LangChain4j community. Since its debut at Devoxx Belgium 2023, LangChain4j has rapidly grown into a key framework for integrating large language models into Java applications. Whether you're already using LangChain4j in production or just starting to explore its capabilities, this session is a great opportunity to connect with fellow developers, contributors, and enthusiasts. We'll discuss the current state of the project, real-world adoption stories, ongoing challenges, and exciting new developments on the roadmap. This is your chance to ask questions, share feedback, exchange ideas, and help shape the future of LangChain4j. Come with curiosity and leave with insights, connections, and inspiration!", "totalFavourites": 26, "slidesUrl": "", "teamRating": null}}]}, {"name": "Tuesday", "date": "2026-10-06", "slots": [{"from": "2026-10-06T06:30:00Z", "to": "2026-10-06T07:30:00Z", "room": "Exhibition Hall", "kind": "Breakfast", "pause": true, "talk": null}, {"from": "2026-10-06T07:30:00Z", "to": "2026-10-06T10:30:00Z", "room": "Room 4", "kind": "Deep Dive", "pause": false, "talk": {"id": 17751, "title": "Cheaper or Better? The Strategic Choice Behind AI Adoption", "speakers": [{"fullName": "Miriam Sasse", "company": "S&N Invent", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-e189329b-6677-4bc7-990c-87b03871e01b.jpg"}], "track": {"name": "Mind the Geek"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=Ycdt7IT7Kdw", "description": "Most organizations adopt AI with an efficiency promise: faster delivery, leaner processes, fewer costs, more automation. That is useful — but it is only one possible game.<br><br>There is a second path: using AI to increase customer value. Better products, smarter services, more relevant experiences, faster learning from real usage, and stronger relationships with users. The problem is that these two paths often require different rules:<br><br>Efficiency asks: How can we deliver the same thing faster and cheaper? <br>Customer value asks: What can we now make possible that was impossible before?<br><br>In this session, we will explore the strategic choice behind AI adoption. Are we using AI to optimize existing processes, or to redesign the value we create? We will look at common traps: automating broken workflows, measuring productivity instead of impact, treating developers as cost factors, and accelerating delivery without improving user outcomes.<br>Participants will learn how to distinguish efficiency-driven AI from value-driven AI, how hidden metrics shape AI adoption, and how teams can ask better questions before introducing new tools, agents, or automation.<br><br>This is not a talk about specific AI tools. It is a conversation about the game we design around AI: the incentives, feedback loops, roles, metrics, and customer value assumptions that determine whether AI makes software merely cheaper — or genuinely better.<br><br>Target audience: anyone involved in AI adoption, software delivery, or product strategy.", "totalFavourites": 131, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-06T07:30:00Z", "to": "2026-10-06T10:30:00Z", "room": "Room 5", "kind": "Deep Dive", "pause": false, "talk": {"id": 9752, "title": "Learning modern Java the playful way", "speakers": [{"fullName": "Marit van Dijk", "company": "JetBrains", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-d8bef2fa-e65f-48a9-94b5-ffe3aba590a7.jpg"}, {"fullName": "Piotr Przybyl", "company": "Elastic", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-378903c1-6e22-40fd-89cd-46195162ee5a.jpg"}], "track": {"name": "Java Language & Platform"}, "audienceLevel": "BEGINNER", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=QBQ11aL2aZc", "description": "Staying up to date with Modern Java can feel overwhelming. If you don’t have any experience with recent Java versions (or at all), features like Structured Concurrency or Stream Gatherers might sound exciting, but also scary: “How do I even get started with that?”<br><br>Fear not! In this deep dive Marit and Piotr will take their time to explain and demo the new exciting things and also show you how to use them in your IDE, so that the next day you can start having fun and profit with modern Java in your favorite tools on your own.<br><br>As a bonus you’ll also see how to improve your IDEA-fu and understand vector search with multi-modal (text & images) models.", "totalFavourites": 190, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-06T07:30:00Z", "to": "2026-10-06T10:30:00Z", "room": "Room 6", "kind": "Deep Dive", "pause": false, "talk": {"id": 24247, "title": "Building AI Agents from First Principles", "speakers": [{"fullName": "Adib Saikali", "company": "Broadcom", "imageUrl": "https://lh3.googleusercontent.com/a/AAcHTtfY6Rruj1Zj96IlogKnZ3KQRWlq0jO9-eEuvaq7QgiQhw=s96-c"}], "track": {"name": "Agentic Engineering & Tooling"}, "audienceLevel": "BEGINNER", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=SC5nO6iadsU", "description": "You’ve probably seen AI agents in action—reasoning through complex problems, orchestrating API calls, recovering from mistakes, and maintaining intent across dozens of interactions. But how do they actually work? This workshop answers that question from first principles. Through a series of progressively more capable examples, we’ll evolve a simple request/response interaction into a complete agentic system with an explicit control loop: <strong>plan → act → observe → decide<\/strong>. Rather than treating agents as black boxes, we’ll expose the architectural patterns that make them reliable, understandable, and testable.<br><br>The examples are implemented with Spring Boot and Spring AI, but this is not a framework tutorial. The focus is on the fundamental patterns that underpin agentic systems, regardless of language, framework, or AI model. Using a dinner planning assistant as our running example, we’ll progressively introduce tool invocation, planning, memory, multi-step execution, evaluation, error handling, and termination conditions, showing how each capability emerges naturally as the agent evolves.<br><br>A central theme of the workshop is that <strong>agents are systems embedded in systems<\/strong>. Building robust agents is less about prompt engineering and more about software architecture. By the end of the session, you’ll have a clear mental model of the agentic loop and a practical set of architectural patterns you can apply to build production-ready agentic systems, regardless of the technologies you use.", "totalFavourites": 121, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-06T07:30:00Z", "to": "2026-10-06T10:30:00Z", "room": "Room 8", "kind": "Deep Dive", "pause": false, "talk": {"id": 22912, "title": "Loop Engineering, beyond prompt, context, and harness engineering", "speakers": [{"fullName": "Guillaume Laforge", "company": "Google", "imageUrl": "https://lh3.googleusercontent.com/a-/AFdZucoQ5lU7oZBBSXSkv4PJE8-JzMxuHatM3ouR8sOOnl8=s96-c"}, {"fullName": "Wietse Venema", "company": "Google Cloud", "imageUrl": "https://lh3.googleusercontent.com/a-/AOh14GhbRZTGa5AfR4sF8hWTueCojns-Au_mYSlkZV7i=s96-c"}], "track": {"name": "Agentic Engineering & Tooling"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=A7ZIf8LkSvE", "description": "<em>\"I don't prompt Claude anymore. I have loops running that prompt Claude... My job is to write loops.\"<\/em> said Boris Cherny, the creator of Claude Code, demonstrating a change in the way developers work with their favorite coding agent. Developers are moving away from <em>manually coding<\/em> and writing isolated prompts, and toward <strong>Loop Engineering<\/strong>: the practice of <strong>designing automated systems that steer coding agents autonomously<\/strong>.<br><br>In this 3-hour deep dive, we’ll look at the concepts, approaches, and architecture behind <em>\"Loop Engineering\"<\/em>. You will learn that the power of AI doesn't (only) lie in the model itself, but in the <strong>harness<\/strong> and <strong>loops<\/strong> built around it. We will explore the core primitives required to build robust loops (<strong>skills<\/strong>, <strong>triggers<\/strong>, <strong>hooks<\/strong>, Git worktrees, sub-agents, state & memory...), how to implement the fundamental loop structures (turn-based, <strong>goal-based<\/strong>, time-based, and <strong>proactive<\/strong>), and how to hopefully prevent these autonomous systems from launching rm -Rf on your codebase!<br><br>You will leave this session with concrete examples, advice, and tips'n tricks, to build <em>your own loops<\/em>, replacing tedious manual tasks with self-driving workflows that investigate, implement, and verify their own code and artifacts.", "totalFavourites": 445, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-06T07:30:00Z", "to": "2026-10-06T10:30:00Z", "room": "Room 9", "kind": "Deep Dive", "pause": false, "talk": {"id": 15354, "title": "Will Valhalla Fix Tony's Billion-Dollar Mistake?", "speakers": [{"fullName": "José Paumard", "company": "Oracle", "imageUrl": "https://lh3.googleusercontent.com/a-/AOh14GhsVIUuTR9Onoo-D8UMW5QId2Yw1V_EUvqdWdNQ0RQ=s96-c"}, {"fullName": "Remi Forax", "company": "University Gustave Eiffel", "imageUrl": "https://lh3.googleusercontent.com/a/ACg8ocK8ScVAfwuF-N0FTBQLG4RDPeS7vzgzVc_VNU0pEJrFPgQ32w=s96-c"}], "track": {"name": "Java Language & Platform"}, "audienceLevel": "INTERMEDIATE", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=vLDbzmiT7Xs", "description": "In March 2027, in JDK 28 (JVM gods willing!), after more than 12 years of effort, the Valhalla project will deliver its first feature: Value Classes (JEP 401) as a preview feature. Value classes are defined as regular classes with a \"value\" keyword in front. They are backward compatible with your code written before Java 28, without you having to recompile it.<br>Value classes bring new optimization opportunities at the JVM level: scalarization on stack and flattening on heap. For that, the Java specification had to be reinterpreted and enhanced, challenging us to reconsider some of the fundamentals on which Java was created 30 years ago. What does == mean? Is a reference always a pointer? Can an instance of a value class be null? Can you observe the transition between the default values and the final values of fields during object construction? And more.<br>This presentation covers all these questions, showing the trade-offs that need to be made in order to bring value classes to the Java platform.<br>You will hear about new code patterns, performance, and type safety. And, as value classes are just the first step, we will cover what Valhalla should bring in the future.", "totalFavourites": 189, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-06T07:30:00Z", "to": "2026-10-06T10:30:00Z", "room": "BOF 1", "kind": "Hands-on Lab", "pause": false, "talk": {"id": 4079, "title": "👩‍💻 Developing with AI: What if it were as simple as adding a library? 🧑‍💻", "speakers": [{"fullName": "Stéphane Philippart", "company": "OVHcloud", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-9d422934-263f-49b6-a07c-fbc56af630a9.jpg"}, {"fullName": "Matthieu Vincent", "company": "Sopra Steria", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-f0a49d53-2c43-4116-b527-51c4054b7af8.jpg"}], "track": {"name": "Agentic Engineering & Tooling"}, "audienceLevel": "BEGINNER", "language": null, "youtubeUrl": "", "description": "Integrating Artificial Intelligence (AI) into our applications can seem much more complex than simply using AI tools in our daily lives.<br>Do I need to learn a new language or adopt an entirely new technology stack?<br>In this workshop, we'll give you everything you need to integrate AI into your applications without leaving your favorite language: Java 😍. It will also be an opportunity to discover some of today's most popular frameworks, including LangChain4j, Quarkus, and more.<br>We'll explore every aspect of building applications with generative AI: customizing prompts, enriching models with your own data (RAG), calling local or remote tools (MCP), and creating agents. <br>By the end of this workshop, you'll leave with a practical toolbox that will enable you to easily integrate the power of AI models into your everyday development projects.<br>And to make things even easier, just bring your laptop and a web browser, we'll take care of the rest and provide a fully configured development environment through EasyLab 😍.", "totalFavourites": 51, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-06T07:30:00Z", "to": "2026-10-06T10:30:00Z", "room": "BOF 2", "kind": "Hands-on Lab", "pause": false, "talk": {"id": 10022, "title": "From code to control: master deployments with Feature Flagging and OpenFeature", "speakers": [{"fullName": "Alexandre Touret", "company": "Magellan", "imageUrl": "https://lh3.googleusercontent.com/a-/AOh14Gi-vA-Ux4ew98kunpGudWlNMR_Olk594JYXJb_I9Q=s96-c"}, {"fullName": "Philippe Duval", "company": "Magellan", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-d9d1d5b7-5289-458c-86fb-22499919dc5f.jpg"}], "track": {"name": "Architecture & Modernization"}, "audienceLevel": "BEGINNER", "language": null, "youtubeUrl": "", "description": "Shipping code is good. Shipping a new feature without breaking the rest of the system is even better!<br><br>Every release today brings the risk of regressions or bad interactions between existing and new functionality. And what about deploying to only a subset of users? That’s even trickier.<br><br>Feature flagging decouples code deployment from feature activation, allowing you to turn blocks on or off at runtime without redeploying.<br><br>Fortunately, this practice has been growing with open‑source tools and solid engineering habits. However, beyond simple if‑then‑else, most available solutions are proprietary, heavy or costly to set up.<br><br>OpenFeature, a CNCF project, offers an open specification for unified feature flagging, usable both server‑ and client‑side regardless of the backing store.<br><br>In this workshop we’ll add a new feature to an existing Java/Angular application and drive its activation through feature flags. Along the way we’ll cover key topics: error handling, A/B testing, progressive rollouts, targeting and observability.<br><br>By the end, you’ll know how to deliver faster, safer and with confidence.", "totalFavourites": 68, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-06T10:30:00Z", "to": "2026-10-06T11:30:00Z", "room": "Exhibition Hall", "kind": "Lunch", "pause": true, "talk": null}, {"from": "2026-10-06T10:40:00Z", "to": "2026-10-06T11:20:00Z", "room": "Room 4", "kind": "Lunch Talk", "pause": false, "talk": {"id": 5526, "title": "From Developer to Story Builder: Engineering a Novel, an ARG, and a Transmedia World with AI", "speakers": [{"fullName": "Raphael Semeteys", "company": "Worldline", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-b486eee1-a8c4-41b6-9825-c2d3c8761c57.jpg"}], "track": {"name": "Mind the Geek"}, "audienceLevel": "BEGINNER", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=496nv8jsWhQ", "description": "<strong>What happens when a software architect treats a novel like a production system?<\/strong><br><br>In this talk, I will share how I built <strong><em>The Human Protocol<\/em><\/strong>, a cyber-realist techno-thriller about AI, using the same engineering principles I apply to software architecture: context engineering, spec-driven development, harness design, versioning, review loops, and automated publishing pipelines.<br><br>The session is not about “asking ChatGPT to write a book.” It is a technical case study in designing a<strong> controlled human-AI creative workflow<\/strong>. I will show how I created a lore-as-code repository, a governance package to prevent context drift, specialized AI roles for design, drafting and review, and a DevOps-style pipeline to produce manuscript formats for publication.<br><br>I will also cover the project’s transmedia extension: an <strong>ARG website<\/strong> where clues hidden in the book unlock in-universe content. This was built through spec-driven development anchored in the same lore repository, turning the manuscript into both a story and an interactive system.<br><br>You will leave with practical patterns for managing long-running AI-assisted projects: how to structure context, debug hallucinations and inconsistencies, separate agent roles, preserve human intent, and ship complex creative artifacts with AI without losing authorship.<br>", "totalFavourites": 65, "slidesUrl": "", "teamRating": null}}, {"from": "2026-10-06T10:40:00Z", "to": "2026-10-06T11:20:00Z", "room": "Room 5", "kind": "Lunch Talk", "pause": false, "talk": {"id": 21152, "title": "Beyond system.out.println: Applying a Debugging Mindset at Scale", "speakers": [{"fullName": "Cees Bos", "company": "OpenValue", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-14d6453f-7d33-4f7a-86e4-3568aac637c9.jpg"}], "track": {"name": "Development Practices"}, "audienceLevel": "BEGINNER", "language": null, "youtubeUrl": "https://www.youtube.com/watch?v=5VjB4t8aFWE", "description": "Debu
