<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Devoxx Belgium 2025 — Full schedule</title>
<style>
:root{--bg:#0b0d12;--panel:#141821;--card:#1b2130;--ink:#f4f7ff;--muted:#9da9bd;--line:#303a4d;--red:#ec294b;--blue:#42c7ff;--hour:120px;--lane:245px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.35 Inter,ui-sans-serif,system-ui,sans-serif}header{padding:34px clamp(18px,4vw,60px) 24px;background:radial-gradient(circle at 85% 0,#46203c 0,transparent 37%),linear-gradient(135deg,#151925,#0b0d12);border-bottom:1px solid var(--line)}h1{font-size:clamp(30px,5vw,58px);line-height:1;margin:0 0 10px;letter-spacing:-.045em}header p{color:var(--muted);font-size:16px;margin:0}.controls{position:sticky;top:0;z-index:20;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px clamp(18px,4vw,60px);background:#0b0d12ed;border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}button,input{border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--ink);padding:9px 12px;font:inherit}button{cursor:pointer}button.active{background:var(--red);border-color:var(--red)}input{min-width:250px;flex:1;max-width:430px}.legend{margin-left:auto;color:var(--muted)}main{padding:24px clamp(8px,2vw,28px) 60px}.day{display:none}.day.active{display:block}.day-head{margin:8px 0 15px clamp(10px,1vw,20px);font-size:22px}.scroller{overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--panel);max-height:calc(100vh - 180px)}.board{position:relative;min-width:max-content}.rooms{display:flex;position:sticky;top:0;z-index:8;margin-left:62px;height:48px;background:#11151e;border-bottom:1px solid var(--line)}.room{width:var(--lane);flex:none;padding:14px 10px;font-weight:700;border-right:1px solid var(--line)}.timegrid{position:relative;margin-left:62px}.lane{position:absolute;top:0;width:var(--lane);border-right:1px solid var(--line);background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--hour)/2 - 1px),#252d3d calc(var(--hour)/2),transparent calc(var(--hour)/2 + 1px),transparent calc(var(--hour) - 1px),#394358 var(--hour))}.tick{position:absolute;left:-62px;width:62px;color:var(--muted);font-size:11px;transform:translateY(-7px);padding-right:10px;text-align:right}.event{position:absolute;width:calc(var(--lane) - 10px);margin-left:5px;padding:8px 9px;border-radius:8px;background:linear-gradient(145deg,#253149,#1b2334);border-left:3px solid var(--blue);overflow:hidden;color:var(--ink);text-decoration:none;box-shadow:0 3px 12px #0005;transition:.15s}.event:hover{transform:translateY(-1px);filter:brightness(1.15);z-index:5}.event:not(.break){cursor:pointer}.event.video{border-left-color:var(--red)}.event.break{background:#171b23;border-left-color:#566075;color:var(--muted);box-shadow:none}.event .title{font-size:12px;font-weight:750;line-height:1.18;padding-right:22px}.event .meta{font-size:10px;color:#afbacb;margin-top:4px}.event .watch{color:#ff7088}.team-rating{display:inline-block;margin-top:5px;padding:2px 5px;border-radius:4px;background:#293246;color:#dbe4f3;font-size:9px;font-weight:800}.team-rating.good{background:#176a47;color:#c8ffe4}.team-rating.great{background:#a46d0b;color:#fff3bd}.event.seen{opacity:.52;filter:saturate(.3)}.event.seen .title{text-decoration:line-through}.seen-toggle{position:absolute;right:5px;top:5px;width:20px;height:20px;padding:0;border-radius:50%;border:1px solid #77839a;background:#101620;color:#b8c3d6;font-size:12px;line-height:18px;z-index:2}.seen-toggle:hover,.event.seen .seen-toggle{background:#38b978;border-color:#38b978;color:#07140d}.empty{padding:60px;text-align:center;color:var(--muted)}dialog{width:min(720px,calc(100% - 28px));max-height:88vh;padding:0;border:1px solid var(--line);border-radius:16px;background:#151a24;color:var(--ink);box-shadow:0 25px 90px #000c}dialog::backdrop{background:#02040ac9;backdrop-filter:blur(4px)}.modal-image{display:block;width:100%;max-height:360px;object-fit:cover;background:#080a0e}.modal-body{padding:24px}.modal-head{display:flex;align-items:flex-start;gap:18px}.modal-head h2{margin:0;font-size:24px;line-height:1.15}.modal-close{flex:none;margin-left:auto;width:34px;height:34px;padding:0;font-size:22px;line-height:30px}.modal-meta{margin:9px 0 20px;color:var(--muted)}.modal-description{font-size:15px;line-height:1.65}.modal-description p{margin:0 0 12px}.modal-description ul{padding-left:22px}.modal-actions{display:flex;gap:10px;margin-top:24px}.youtube-button{display:inline-block;padding:10px 15px;border-radius:9px;background:var(--red);color:#fff;font-weight:750;text-decoration:none}.youtube-button:hover{filter:brightness(1.12)}@media(max-width:700px){:root{--lane:210px}.legend{display:none}.controls{padding:9px}.scroller{max-height:calc(100vh - 160px)}}
</style></head><body>
<header><h1>Devoxx Belgium 2025</h1><p>October 6–10 · Kinepolis Antwerp · complete multi-track timeline</p></header>
<div class="controls"><div id="tabs"></div><input id="search" type="search" placeholder="Filter talks, speakers, rooms…"><button id="videoOnly">▶ Videos only</button><span class="legend"><b style="color:#ec294b">●</b> YouTube recording &nbsp; <b style="color:#42c7ff">●</b> session</span></div>
<main id="app"></main>
<dialog id="talkDialog"><img class="modal-image" id="modalImage" alt="" hidden><div class="modal-body"><div class="modal-head"><h2 id="modalTitle"></h2><button class="modal-close" aria-label="Close">×</button></div><div class="modal-meta" id="modalMeta"></div><div class="modal-description" id="modalDescription"></div><div class="modal-actions" id="modalActions"></div></div></dialog>
<script>const DAYS=/*__DATA__*/;
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let active=0, videos=false;const pxPerMin=2, storageKey='devoxx-belgium-2025-seen';
let seen=new Set;try{seen=new Set(JSON.parse(localStorage.getItem(storageKey)||'[]'))}catch(e){}
function toggleSeen(id,button){seen.has(id)?seen.delete(id):seen.add(id);localStorage.setItem(storageKey,JSON.stringify([...seen]));let event=button.closest('.event'),isSeen=seen.has(id);event.classList.toggle('seen',isSeen);button.textContent=isSeen?'✓':'○';button.title=button.setAttribute('aria-label',isSeen?'Mark as unseen':'Mark as seen')}
function mins(iso){let d=new Date(iso);return d.getUTCHours()*60+d.getUTCMinutes()+120} // October Brussels = UTC+2
function videoId(url){try{return new URL(url).searchParams.get('v')}catch(e){return''}}
function showTalk(t,s){let dialog=$('#talkDialog'),id=videoId(t.youtubeUrl||''),img=$('#modalImage');$('#modalTitle').textContent=t.title||'Talk';$('#modalMeta').textContent=[(t.speakers||[]).map(x=>x.fullName).join(', '),t.track?.name,s.room].filter(Boolean).join(' · ');$('#modalDescription').innerHTML=(t.teamRating?`<p><strong style="color:${t.teamRating.rating>=8?'#ffc94d':t.teamRating.rating>=7?'#6ee7a8':'#c8d1df'}">Team rating: ${t.teamRating.rating}/10</strong> · ${t.teamRating.reviews} ${t.teamRating.reviews===1?'review':'reviews'}</p>`:'')+(t.description||'<p>No speaker description is available for this talk.</p>');img.hidden=!id;if(id){img.src=`https://i.ytimg.com/vi/${id}/hqdefault.jpg`;img.alt=`YouTube thumbnail for ${t.title}`}$('#modalActions').innerHTML=(t.youtubeUrl?`<a class="youtube-button" href="${esc(t.youtubeUrl)}" target="_blank" rel="noopener">▶ Watch on YouTube</a>`:'')+(t.slidesUrl?`<a class="youtube-button" style="background:#3478d4" href="${esc(t.slidesUrl)}" target="_blank" rel="noopener">▣ View slides</a>`:'');dialog.showModal()}
function render(){const q=$('#search').value.toLowerCase().trim();$('#tabs').innerHTML=DAYS.map((d,i)=>`<button class="${i===active?'active':''}" data-i="${i}">${d.name}</button>`).join(' ');let d=DAYS[active], slots=d.slots.filter(s=>{let t=s.talk||{};let hay=[t.title,(t.speakers||[]).map(x=>x.fullName).join(' '),s.room,t.track?.name,s.kind].join(' ').toLowerCase();return(!q||hay.includes(q))&&(!videos||t.youtubeUrl)});let rooms=[...new Set(slots.map(s=>s.room))].sort((a,b)=>{let n=x=>+(x.match(/\d+/)||[999])[0];return n(a)-n(b)||a.localeCompare(b)});let start=Math.min(...d.slots.map(s=>mins(s.from))), end=Math.max(...d.slots.map(s=>mins(s.to))), height=(end-start)*pxPerMin;let ticks='';for(let m=Math.ceil(start/30)*30;m<=end;m+=30)ticks+=`<div class="tick" style="top:${(m-start)*pxPerMin}px">${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}</div>`;let events=slots.map(s=>{let t=s.talk, top=(mins(s.from)-start)*pxPerMin, h=Math.max(28,(mins(s.to)-mins(s.from))*pxPerMin-4), left=rooms.indexOf(s.room)*245;let title=t?.title||s.kind, speakers=(t?.speakers||[]).map(x=>x.fullName).join(', '), url=t?.youtubeUrl||'', id=t?String(t.id):'', isSeen=id&&seen.has(id), cls=t?`${url?'video':''}${isSeen?' seen':''}`:'break';let tag='div';return `<${tag} class="event ${cls}" style="top:${top}px;left:calc(${rooms.indexOf(s.room)} * var(--lane));height:${h}px" ${t?`data-talk-id="${esc(id)}" title="Show talk details"`:''}>${t?`<button class="seen-toggle" data-id="${esc(id)}" title="${isSeen?'Mark as unseen':'Mark as seen'}" aria-label="${isSeen?'Mark as unseen':'Mark as seen'}">${isSeen?'✓':'○'}</button>`:''}<div class="title">${url?'<span class="watch">▶ </span>':''}${esc(title)}</div><div class="meta">${esc(speakers||s.kind)}${t?.track?.name?' · '+esc(t.track.name):''}</div>${t?.teamRating?`<span class="team-rating ${t.teamRating.rating>=8?'great':t.teamRating.rating>=7?'good':''}">★ ${t.teamRating.rating}/10 · ${t.teamRating.reviews} ${t.teamRating.reviews===1?'review':'reviews'}</span>`:''}</${tag}>`}).join('');$('#app').innerHTML=`<section class="day active"><h2 class="day-head">${esc(d.name)} · ${new Date(d.date+'T12:00:00').toLocaleDateString('en',{month:'long',day:'numeric',year:'numeric'})} <small style="color:var(--muted);font-weight:400">— ${slots.length} items</small></h2><div class="scroller"><div class="board"><div class="rooms">${rooms.map(r=>`<div class="room">${esc(r)}</div>`).join('')}</div><div class="timegrid" style="height:${height}px;width:calc(${rooms.length} * var(--lane))">${rooms.map((r,i)=>`<div class="lane" style="left:calc(${i} * var(--lane));height:${height}px"></div>`).join('')}${ticks}${events}</div></div></div></section>`;document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{active=+b.dataset.i;render()});document.querySelectorAll('.seen-toggle').forEach(b=>b.onclick=e=>{e.preventDefault();e.stopPropagation();toggleSeen(b.dataset.id,b)});document.querySelectorAll('.event[data-talk-id]').forEach(el=>el.onclick=()=>{let s=slots.find(x=>String(x.talk?.id)===el.dataset.talkId);if(s)showTalk(s.talk,s)})}
$('#talkDialog .modal-close').onclick=()=>$('#talkDialog').close();$('#talkDialog').onclick=e=>{if(e.target===$('#talkDialog'))$('#talkDialog').close()};$('#search').oninput=render;$('#videoOnly').onclick=()=>{videos=!videos;$('#videoOnly').classList.toggle('active',videos);render()};render();
</script></body></html>
