ame": "Cassandra Chin", "company": "Colorado State University Global", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-a68f4ab2-accd-470d-83f0-a5a854ffcd51.jpg"}], "track": {"name": "People & Culture"}, "audienceLevel": "BEGINNER", "youtubeUrl": "https://www.youtube.com/watch?v=h2XtwJOcdT8", "description": "Teaching kids programming at a young age is really important to improve diversity in the field of computer science. Studies show that after middle school most students have already made up their mind about a career in computers, so having a positive introduction to computers at a young age is really important. I wrote a book on Raising Young Coders published with Apress to teach tech and non-tech parents how they can inspire their kids to love technology. I also teach workshops for underprivileged kids around the world at events like CNCF Kids Day and want programming to be fun and engaging just like how I learned to program. I will share some of the techniques I use to get kids excited about technology, which you can use to teach your own kids or others.<br>", "totalFavourites": 422, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-08T08:10:00Z", "to": "2025-10-08T08:30:00Z", "room": "Room 8", "kind": "Keynote", "pause": false, "talk": {"id": 46053, "title": "Java 25 - “The Next LTS Release”", "speakers": [{"fullName": "Nicolai Parlog", "company": "Oracle", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-7513a9db-6f8e-41a9-827e-848cbd8e3b13.jpg"}, {"fullName": "Georges Saab", "company": "Oracle", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-30d3d557-1e3e-4bd1-a528-cc750318ebb3.jpg"}], "track": {"name": "Java"}, "audienceLevel": "BEGINNER", "youtubeUrl": "https://www.youtube.com/watch?v=EJ9q8hQXV8I", "description": "Java 25, the next long-term support release, introduces numerous enhancements across language features, APIs, and runtime—from unnamed patterns and flexible constructors to improved garbage collection, quantum-resistant encryption, and streamlined program launching. This talk reviews the most impactful new, improved, and finalized features developers should know about.", "totalFavourites": 188, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-08T08:30:00Z", "to": "2025-10-08T08:50:00Z", "room": "Room 8", "kind": "Keynote", "pause": false, "talk": {"id": 44654, "title": "Java and AI", "speakers": [{"fullName": "Paul Sandoz", "company": "Oracle", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-a9d7514d-9cd5-4f47-9f24-476cfc30a4e1.jpg"}], "track": {"name": "Java"}, "audienceLevel": "BEGINNER", "youtubeUrl": "https://www.youtube.com/watch?v=0z3i-_fKsVc", "description": "Java is commonly found where AI needs to be. We shall describe how Java features can and will meet the needs of AI. Existing features include the Foreign Function and Memory API of Project Panama. Future features include those proposed by Project Babylon. We shall present how such features combine and empower developers to meet the needs of AI.", "totalFavourites": 475, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-08T08:50:00Z", "to": "2025-10-08T09:10:00Z", "room": "Room 8", "kind": "Keynote", "pause": false, "talk": {"id": 46052, "title": "Why You Should Build Agents on the JVM", "speakers": [{"fullName": "Rod Johnson", "company": "Embabel", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-75114ae0-c77b-4c3e-9eeb-d87da765c471.jpg"}], "track": {"name": "GenAI & Beyond"}, "audienceLevel": "BEGINNER", "youtubeUrl": "https://www.youtube.com/watch?v=dbx1_P7W1DM", "description": "This keynote explores the rise of Java AI Agents, with a focus on <strong>Embabel<\/strong> - an innovative JVM-based agent framework designed for Java and Kotlin developers. Seamlessly integrated with Spring, Embabel empowers developers to build safe, manageable, and type-safe AI agents while leveraging advanced planning capabilities.", "totalFavourites": 461, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-08T09:10:00Z", "to": "2025-10-08T09:30:00Z", "room": "Room 8", "kind": "Keynote", "pause": false, "talk": {"id": 46056, "title": "Agent Orchestration with LangChain4J", "speakers": [{"fullName": "Lize Raes", "company": "Oracle", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-b0334cda-79ec-4532-80ed-7a01c1eb117b.png"}], "track": {"name": "GenAI & Beyond"}, "audienceLevel": "BEGINNER", "youtubeUrl": "https://www.youtube.com/watch?v=HiiTsNziamg", "description": "The agents are coming for you, Java developers! With langchain4j-agentic, you can combine AI (and non-AI) agents into powerful but controlled workflows. We’ll explore the core patterns: sequential, looping, conditional, and parallel, plus the supervisor pattern where agents decide for themselves which tasks to run. You’ll also see human validation strategies that keep your agent army in check.<br>Compound agents can wrap entire workflows into a single building block, while AgenticScope gives you control over context and a clear view of the call chain.<br>Live on stage, we’ll demo playful agent systems that scale from small tasks to complex automation. You’ll leave with a sense of what’s possible today, how to keep it under control, and how Java developers can shape the next rise of the agents.", "totalFavourites": 437, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-08T09:30:00Z", "to": "2025-10-08T10:00:00Z", "room": "Exhibition Hall", "kind": "Coffee Break", "pause": true, "talk": null}, {"from": "2025-10-08T10:00:00Z", "to": "2025-10-08T10:50:00Z", "room": "Room 3", "kind": "Conference", "pause": false, "talk": {"id": 24594, "title": "A Decade of DevOps at ING : The Roaring Shift from Agile Roots to Scalable Platform Engineering", "speakers": [{"fullName": "Shivasheesh Tripathi", "company": "ING", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-071e6356-80bb-48e5-af07-eda7327b869d.jpg"}, {"fullName": "Iliass Ziani", "company": "ING", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-ad49537f-cb0d-491c-af7f-a61bfe0a90b1.jpg"}], "track": {"name": "Development Practices"}, "audienceLevel": "BEGINNER", "youtubeUrl": "https://www.youtube.com/watch?v=kRgGrrlXShg", "description": "Join us as we reflect on over a decade of ING’s DevOps transformation journey—starting from our early Agile adoption to building scalable, secure, and resilient engineering practices. This session will walk through our evolution from foundational DevOps, tooling, and automation to modern platform engineering, end-to-end journey automation, DevSecOps at scale, and Site Reliability Engineering (SRE).<br>We’ll share key milestones, cultural shifts, and global collaboration efforts that shaped our transformation. Expect practical insights into how we tackled challenges, drove productivity, and delivered measurable organizational impact. We’ll highlight initiatives like “toil-hunting,” data-driven decision-making, and the importance of fast feedback loops in enabling continuous improvement.<br>Whether you're starting your DevOps journey or scaling your practices, this talk offers real-world lessons, best practices, and inspiration from one of the largest financial institutions in Europe.<br>", "totalFavourites": 187, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-08T10:00:00Z", "to": "2025-10-08T10:50:00Z", "room": "Room 4", "kind": "Conference", "pause": false, "talk": {"id": 7011, "title": "Tornado Cash, the World's Biggest Cyber Crimes and Modern Privacy", "speakers": [{"fullName": "James Birnie", "company": "McBirnie Ltd", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-c69ab493-ed6c-4984-ae96-8d9c7195d1f0.jpg"}], "track": {"name": "Security"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=iP1qqq5Uoag", "description": "Have you heard of Axie Infinity? Its a computer game with an in game economy based on the Ethereum blockchain. So what? You might ask... Well, it became popular, very popular, some say the most popular game in existence. In game economies have always spawned grey IRL economies despite, in many cases, the best efforts of game developers to prevent them. But the in-game economy, based on real crypto-assets, of Axie Infinity grew so big that it became a target for what has been called the biggest robbery of all time - the Sky Mavis hack.<br><br>How did this robbery happen? What was the (both sophisticated and age-old) kill chain that enabled it?<br><br>After the robbery the story gets even more interesting. Any detective will always tell you, \"follow the money!\". Crime only pays if you can convert those ill gotten gains into a currency you spend to buy real things. So how do you launder the proceeds from the biggest robbery ever? The answer might be surprising, it winds through a crypto mixer set up to operate as a DAO (Decentralised Autonomous Organisation), following the funds, US Government sanctions (recently ruled illegal by an appeal court), an activist campaign and potentially far reaching privacy consequences for all of us.<br><br>In this talk we'll analyse the kill chain of the initial attack, where the money led and how this could affect all of us. I'll go through the main takeaways that everybody should be interested in.", "totalFavourites": 304, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-08T10:00:00Z", "to": "2025-10-08T10:50:00Z", "room": "Room 5", "kind": "Conference", "pause": false, "talk": {"id": 7718, "title": "Code, burnout and depression: an engineering perspective of mental health in IT", "speakers": [{"fullName": "Manuel Bernhardt", "company": "manuel.bernhardt.io", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-4f7da9ae-0f83-463a-ba71-8160a451519c.jpg"}], "track": {"name": "People & Culture"}, "audienceLevel": "BEGINNER", "youtubeUrl": "https://www.youtube.com/watch?v=pYuzgGzslHY", "description": "In comparison to other professions, software engineering doesn't really have that many immediate risks to health. The first idea that comes into mind when talking about developer health are ergonomic chairs and appropriate editor font sizes (as well as monospaced fonts flavours), yet by far the highest health-related risks of the software engineering profession are burnout, anxiety and depression. Many of us know of or directly know at least one developer who had to battle with these mental health issues.<br><br>This talk is a real-world account of going through burnout and major depression and walking the way back from it. It is intended for anyone who cares to know more about these mental health issues and about the latest research in the field, interleaved with some advice that might have helped me had I known about it earlier. If you have the inkling that you're headed towards burnout, this talk will likely not help you avoid it, but you might just learn one or two things about which pitfalls to avoid during the ride.<br><br>Disclaimer: even though the contents of this talk are highly subjective, they are sprinkled with a healthy dose of references to mental health research.", "totalFavourites": 387, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-08T10:00:00Z", "to": "2025-10-08T10:50:00Z", "room": "Room 6", "kind": "Conference", "pause": false, "talk": {"id": 25280, "title": "Testing Challenges in the Age of AI", "speakers": [{"fullName": "Konstantin Pavlov", "company": "JetBrains", "imageUrl": "https://lh3.googleusercontent.com/a/ACg8ocIGCFoBOao2dct9YnYhrUGkcpr2yLHXZg_Pazvc9QGvsli2_sSX=s96-c"}], "track": {"name": "Development Practices"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=IwAsq3EfaC0", "description": "AI apps break QA: non‑determinism, latency, rate limits and schema violations make assertion tests flaky, turning CIs red and eroding confidence. Security/privacy add complexity: data must be anonymized, prompts sanitized, leaks prevented—areas beyond standard scans. Real users submit jailbreaks, informal queries and RAG patterns vary between staging and production. Agent workflows worsen this: multi‑step tool orchestration with retries, approvals and inter‑agent coordination exceed unit or integration scopes.<br>This session presents a layered testing strategy: fast, mock‑based tests with (mokksy.dev); behavioral tests validating tool calls and security; and live‑model sanity checks with LLMs as evaluation and assertion mechanisms (promptfoo). Examples using JetBrains Koog agentic framework demonstrate these patterns i practice.<br>Attendees will gain a clear map of AI testing pitfalls and actionable techniques to balance development speed with quality in unpredictable environments.<br><br>", "totalFavourites": 353, "slidesUrl": "https://speakerdeck.com/kpavlov/testing-challenges-in-the-age-of-ai-devoxx-belgium-2025", "teamRating": null}}, {"from": "2025-10-08T10:00:00Z", "to": "2025-10-08T10:50:00Z", "room": "Room 7", "kind": "Conference", "pause": false, "talk": {"id": 16284, "title": "Unveiling the simple math that powers AI", "speakers": [{"fullName": "Marianne Hoornenborg", "company": "Dutch Chamber of Commerce", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-4526a494-e218-4fde-9135-ccab6b822cf1.jpg"}], "track": {"name": "GenAI & Beyond"}, "audienceLevel": "BEGINNER", "youtubeUrl": "https://www.youtube.com/watch?v=wY2JEeRZSI8", "description": "Don't let math intimidate you — simple math powers complex systems.<br>As a Java developer without a formal math background, I became curious about the mathematical foundations behind AI and computation. What I discovered was that intelligent systems are often rooted in surprisingly simple mathematical concepts.<br>In this beginner-friendly talk, we’ll explore how boolean logic drives agent decision trees, why floating-point precision impacts confidence scores, and how vector geometry underlies recommendation systems. And yes, we’ll even revisit the basics of machine-level binary and hexadecimal number representations.<br>Whether you're new to the field or brushing off old knowledge, this session offers hands-on Java examples that demystify key mathematical concepts. You’ll see that the math behind AI is more relatable than you might think!", "totalFavourites": 267, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-08T10:00:00Z", "to": "2025-10-08T10:50:00Z", "room": "Room 8", "kind": "Conference", "pause": false, "talk": {"id": 23186, "title": "Weather the Storm: How Value Classes Will Enhance Java Performance", "speakers": [{"fullName": "Clément de Tastes", "company": "SCIAM", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-3bfbcd88-76fe-4af7-9e6d-2de1bc3acada.jpeg"}, {"fullName": "Remi Forax", "company": "University Gustave Eiffel", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-6a77f40f-f9f0-4d95-8460-bebdae5c1410.jpg"}], "track": {"name": "Java"}, "audienceLevel": "BEGINNER", "youtubeUrl": "https://www.youtube.com/watch?v=VOPK9RHWqRk", "description": "Project Valhalla's value classes represent Java's most significant evolution since Java 8. In this beginner-friendly session, we will explore how value classes will enhance the way we write Java code by providing lightweight, immutable objects that are both performant and memory-efficient.<br><br>Using weather data as example, we will start with the fundamentals: what are value classes, why do we need them, and how they differ from identity (regular) classes. Through practical examples and live coding, you will discover how value classes eliminate the overhead of boxing, reduce memory allocation, and enable new optimization opportunities for the JVM.<br><br>You will learn how value classes integrate with existing Java features like records, generics and collections, and the migration strategies for incorporating value classes into an existing codebase.", "totalFavourites": 524, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-08T10:00:00Z", "to": "2025-10-08T10:50:00Z", "room": "Room 9", "kind": "Conference", "pause": false, "talk": {"id": 23161, "title": "Fixing time zones for fun - twenty programming puzzles to master internationalization.", "speakers": [{"fullName": "Martijn van Iersel", "company": "TOPdesk", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-d818ac85-4928-4dba-a611-6c65ab4f401a.jpg"}], "track": {"name": "Mind the geek"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=XJMrMxlt-BQ", "description": "Time zone and encoding problems are often seen as annoying or frustrating. To make this topic fun & interesting, I created i18n-puzzles.com, inspired by the famous Advent of Code. After all, which programmer can resist a good puzzle?<br><br>During an online event in March 2025, I published twenty puzzles day after day. The puzzles start easy, but quickly dive into more advanced topics that will challenge even experienced programmers. Find treasure with a UTF-8 validator, fix a financial scam by parsing right-to-left text, or install parallel versions of the time zone database to solve a science problem.<br><br>Over 300 programmers from around the world competed. Now it’s time to look back and analyze the code they wrote. What are the best solutions? Are there any differences between programming languages in how they tackle internationalization?<br><br>During this talk, I will talk through advanced topics related to Time Zones and Unicode, using code examples in Java, JavaScript, and other programming languages.", "totalFavourites": 243, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-08T10:00:00Z", "to": "2025-10-08T10:50:00Z", "room": "Room 10", "kind": "Conference", "pause": false, "talk": {"id": 6239, "title": "Understanding Kubernetes in a visual way", "speakers": [{"fullName": "Aurélie Vache", "company": "OVHcloud", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-93454669-3089-4397-9b93-9fd45f2e3e66.jpg"}], "track": {"name": "Architecture"}, "audienceLevel": "BEGINNER", "youtubeUrl": "https://www.youtube.com/watch?v=1pCfP2XAgNg", "description": "Kubernetes has become the de-facto standard to deploy and operate containerized applications. But understanding Kubernetes can be difficult or time-consuming.<br><br>Several years ago I asked myself how I imagined the concepts of Kubernetes: a pod, a deployment, a service, a secret, a configmap, a cronjob… and then I created a new way of explaining Cloud technologies.<br><br>In the first part of the talk, I will tell you a story, I will tell you my story. How, during more than two years, I worked every evening/nights/wee-end to explaining Kubernetes in sketchnotes, in blog posts, videos and finally published everything (and more) in an illustrated book of more than 270 pages (with all the concepts included Debugging / Troubleshooting and Tips) and why I continue to do it.<br><br>And in the second part, I will explain Kubernetes to you ... in a visual way :-).", "totalFavourites": 358, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-08T10:00:00Z", "to": "2025-10-08T10:50:00Z", "room": "BOF 1", "kind": "Speaker Room", "pause": true, "talk": null}, {"from": "2025-10-08T10:00:00Z", "to": "2025-10-08T10:50:00Z", "room": "BOF 2", "kind": "Conference", "pause": false, "talk": {"id": 6231, "title": "Visualizing social networks at planetary scale, one billion pixels at a time", "speakers": [{"fullName": "Mathis Hammel", "company": "Agoratlas", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-f7b19d62-e788-4cf1-b682-08d22cbf2d8c.jpg"}], "track": {"name": "Mind the geek"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "", "description": "Social media has completely transformed how humans interact and how information spreads.<br><br>In order to understand social dynamics and expose large-scale manipulation campaigns, graph theory provides amazing tools to analyze and visualize huge networks. However, any scale beyond 10 million nodes comes with a set of fascinating technical challenges that are very hard to overcome.<br><br>If you're curious about images that can't fit in 200GB of memory, or how to run an algorithm on GPU because CPU isn't fast enough, you will enjoy this! In this talk, you'll discover the creative solutions we're developing to progressively break the barrier and explore a scale of graph visualization nobody has seen before.", "totalFavourites": 64, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-08T10:50:00Z", "to": "2025-10-08T12:00:00Z", "room": "Exhibition Hall", "kind": "Lunch", "pause": true, "talk": null}, {"from": "2025-10-08T11:05:00Z", "to": "2025-10-08T11:45:00Z", "room": "Room 3", "kind": "Lunch Talk", "pause": false, "talk": {"id": 47110, "title": "Pull, Push, and Merge: Lessons from a Journey of Growth Through Acquisitions", "speakers": [{"fullName": "April Schuppel", "company": "Apryse", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-cc4bf30e-61f9-4cf4-908e-a8f5fa6a18b7.jpg"}], "track": {"name": "People & Culture"}, "audienceLevel": "BEGINNER", "youtubeUrl": "https://www.youtube.com/watch?v=YoaG2gr9aAU", "description": "Apryse, formerly PDFTron, has grown rapidly through a series of strategic acquisitions in the document processing space. But growth isn’t just about the technology, it’s about the people, processes, and culture behind it. In this talk, we’ll explore lessons learned from integrating companies like iText, LEADTOOLS, and Scanbot SDK and how navigating differences in engineering practices, team dynamics, and security approaches can spark innovation. Whether you're scaling through acquisition or adapting to change within your own org, this session offers practical insights into building resilient, collaborative, and technically sound teams that can bring your product to new heights.<br>", "totalFavourites": 57, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-08T11:05:00Z", "to": "2025-10-08T11:45:00Z", "room": "Room 4", "kind": "Lunch Talk", "pause": false, "talk": {"id": 24559, "title": "You Don’t Need a PhD to Try Quantum Computing", "speakers": [{"fullName": "Matteo Di Pirro", "company": "Kynetics Inc", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-5170443b-4232-4e6a-a235-1daab5ded767.png"}], "track": {"name": "Mind the geek"}, "audienceLevel": "BEGINNER", "youtubeUrl": "https://www.youtube.com/watch?v=5Y370b8iTq0", "description": "Quantum computing is no longer just for physicists. With tools like Qiskit and Cirq, as well as domain-specific languages like Q#, developers now have a growing number of ways to experiment with quantum circuits.<br><br>This talk offers a beginner-friendly, practical overview of where quantum computing stands today for developers. We’ll look at the current tools, languages, and simulators, including Qiskit, Cirq, and Strange, and how they fit into familiar programming environments. No physics background required, just curiosity.", "totalFavourites": 220, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-08T11:05:00Z", "to": "2025-10-08T11:45:00Z", "room": "Room 5", "kind": "Lunch Talk", "pause": false, "talk": {"id": 5905, "title": "Wat? That’s possible in Java?", "speakers": [{"fullName": "Michael Vitz", "company": "innoQ Deutschland GmbH", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-a3074ac4-d3be-4382-93c4-3f8cdb0ca5b4.jpeg"}], "track": {"name": "Java"}, "audienceLevel": "BEGINNER", "youtubeUrl": "https://www.youtube.com/watch?v=DfeCGn0cqyM", "description": "Over ten years ago, Gary Bernhardt gave a lightning talk called “Wat.” Gary gave Ruby and JavaScript examples that were funny and surprising for most of the audience. As everyone has strong feelings about/regarding their favourite language, this quirky stuff can only be found in other languages and not yours, right? Wrong! In this session, we will look at Java examples that surprised me the first time I saw them. And we will discover why and how they work. You will learn something useful and new even though this talk is not completely serious.", "totalFavourites": 440, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-08T11:05:00Z", "to": "2025-10-08T11:45:00Z", "room": "Room 6", "kind": "Lunch Talk", "pause": false, "talk": {"id": 12491, "title": "Creating effective and objective architectural decision records (ADRs)", "speakers": [{"fullName": "Piet van Dongen", "company": "OpenValue", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-043135e5-6241-4c01-b1cb-e41d797d7c04.jpg"}], "track": {"name": "Architecture"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=DSRQ-90eDBw", "description": "Documenting decisions is like eating your veggies as a kid: they keep telling you it’s good for you, but you just hate doing it. Architectural Decision Records (ADRs) to the rescue! ADRs are perfect for just-in-time, just-enough documentation for engineering teams and organizations.<br><br>During this session, you will learn how to make architectural decisions effectively and objectively by:<br><br><ul><li>Learning the structure of a good ADR (no more walls of text that nobody reads anyway!)<\/li><li>Practicing how to turn subjective choices into objective ones (no more pros and cons lists and tribal conflicts!)<\/li><li>Creating editable diagrams, fast (no more spending hours wrestling tools that your collaborators don’t know how to use!)<\/li><li>Collaborating quickly with technical and non-technical stakeholders (no more hours of Tower of Babel meetings!)<\/li><li>Reporting the decision using effective language and fit-for-audience diagrams (no more writing reports that end up unread in drawers!)<\/li><\/ul><br>Do you want to learn how to facilitate good decision making without spending weeks looking for consent?<br><br>Then join this session and you will walk away a better software architecture decision facilitator.", "totalFavourites": 407, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-08T11:05:00Z", "to": "2025-10-08T11:45:00Z", "room": "Room 7", "kind": "Lunch Talk", "pause": false, "talk": {"id": 8907, "title": "AI-Powered Form Wizards: Chat, Click, Done", "speakers": [{"fullName": "Loïc Magnette", "company": "Oniryx", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-df59856c-239a-4702-bb00-aac9d1f6a121.jpg"}], "track": {"name": "Build Different"}, "audienceLevel": "BEGINNER", "youtubeUrl": "https://www.youtube.com/watch?v=f_5b_qanhzg", "description": "Forms are everywhere—tax declarations, job applications, or even signing up for a new service. Although some forms are simple, many include ambiguous fields, complicated logic, or subpar design, which frustrates users and makes them more likely to make mistakes. Completing paperwork shouldn't be like solving a puzzle. What if consumers could just chat with an AI that walks them through each step instead of having to struggle?<br><br>In this session, I'll discuss my experience developing an AI-powered form-filling helper with LangChain4j, Quarkus and other useful Java libraries. We'll go over the challenges faced and how to overcome them, such as transforming text into form data with validations, assisting users based on their input, and the role of RAG in all of that. This talk will use examples to demonstrate how AI can assist users in their daily interactions with your software.<br><br>After this session, you will have the ideas and techniques to create more intelligent and user-friendly forms. Learn how to make forms enjoyable rather than tedious by using AI to assist your users, reduce errors, and eliminate hassle.", "totalFavourites": 122, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-08T11:05:00Z", "to": "2025-10-08T11:45:00Z", "room": "Room 8", "kind": "Lunch Talk", "pause": false, "talk": {"id": 7007, "title": "The Imperfect Architect", "speakers": [{"fullName": "Robin Custers", "company": "Cegeka", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-478fa8f3-d8b8-4e79-9d76-fdc5315a816d.jpeg"}], "track": {"name": "Architecture"}, "audienceLevel": "ADVANCED", "youtubeUrl": "https://www.youtube.com/watch?v=TQWWkaSEmVo", "description": "Software architects often have to navigate a complex environment, wrestling with legacy systems, battling organizational politics, explaining technical choices to management, dealing with team dynamics and - above all - chasing the perfect architecture. We've learned that building trust is paramount, and that the \"last responsible moment\" is the best time to make a decision but apparently also just one letter away from the “least responsible moment”. But we should have no fear as AI Agents are here to fix all this - right… right?<br><br>Join this talk as we explore how to thrive as an architect in this difficult environment. From leveraging political capital to navigating organizational resistance, to effectively communicating architecture decisions. We'll discuss how to build trust, learn to lead with a situational mindset, adapt your toolkit, and accept that the most resilient architectures are often perfectly flawed. Because for the imperfect architect, nurturing collective intelligence and continuous learning isn't just a goal - it's the only way forward.<br><br>Target audience: anyone taking up the role of architect - either explicit or implicit.", "totalFavourites": 618, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-08T11:05:00Z", "to": "2025-10-08T11:45:00Z", "room": "Room 9", "kind": "Lunch Talk", "pause": false, "talk": {"id": 25292, "title": "Vaadin: Modern Web UIs in Pure Java—A Live-Coding Tour", "speakers": [{"fullName": "Sebastian Kuehnau", "company": "Vaadin", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-b6c59bc5-4804-4a50-9c03-924f317de033.jpg"}], "track": {"name": "Java"}, "audienceLevel": "BEGINNER", "youtubeUrl": "https://www.youtube.com/watch?v=zxqrentybmA", "description": "JavaScript pasta, web toolchains, endless build steps and an ever-shifting front-end landscape slows down even qualified Java teams. <strong>Vaadin<\/strong> shows there is another way: an intuitive Java API, type-safe client-server communication and +50 accessible web components deliver a productive UI—without a single line of JavaScript, CSS or HTML. It enables full-stack Java web application development and, when needed, integrates seamlessly with modern front-end technologies like React.<br>In this talk we will<br><ul><li>position Vaadin in today’s web stack,<\/li><li>sketch the architecture, state-handling and browser-server-communication,<\/li><li>demonstrate how the open-source framework fits cleanly into Web- and Java development,<\/li><li>and build a full-stack application live: data binding, routing, theming and deployment — in under 23 minutes.<\/li><\/ul><br><strong>Key Takeaways<\/strong><br><ol><li>Create a Vaadin project in seconds and start coding right away.<\/li><li>Java-only full-stack cuts the communication- and integration-friction between front- and back-end.<\/li><li>Open Source & Extensibility: full access to well-documented source code lets you adapt or extend components to match any domain demand.<\/li><\/ol><br><strong>Target Audience<\/strong><br>Java developers and architects who need web UIs but have no time for the “framework jungle”; teams migrating from JSF, Swing, Oracle Forms, Thymeleaf or pure JS stacks; anyone seeking maximum full-stack productivity on the JVM.", "totalFavourites": 114, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-08T11:05:00Z", "to": "2025-10-08T11:45:00Z", "room": "Room 10", "kind": "Lunch Talk", "pause": false, "talk": {"id": 22121, "title": "From Sticky Notes to Strategic Boundaries: Real-World EventStorming at the Port of Rotterdam", "speakers": [{"fullName": "Mario Klaver", "company": "Port of Rotterdam", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-ad8a78cc-4d44-4377-9a0b-1b3238505548.jpg"}], "track": {"name": "Development Practices"}, "audienceLevel": "BEGINNER", "youtubeUrl": "https://www.youtube.com/watch?v=b2EnKGFSGc8", "description": "EventStorming is more than just a colorful workshop — it’s a powerful way to uncover domain knowledge, align teams, and design better software. In this talk, we’ll share how we used EventStorming during our architecture modernization traject in a complex, mission-critical environment at the Port of Rotterdam to identify domains, subdomains, and meaningful boundaries.<br>You’ll learn:<br><ul><li>How we approached EventStorming in a real, operational setting<\/li><li>What worked well — and what didn’t<\/li><li>Common pitfalls and how to avoid them<\/li><li>How EventStorming helped guide both architecture and team structure<\/li><\/ul><br>Whether you're new to EventStorming or looking to make it work in practice, this session offers <strong>hands-on insights and hard-won lessons<\/strong> from the field.", "totalFavourites": 120, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-08T11:05:00Z", "to": "2025-10-08T11:45:00Z", "room": "BOF 1", "kind": "Lunch Talk", "pause": false, "talk": {"id": 22114, "title": "Tulips to Turmeric: Lessons Learned from a Global Team", "speakers": [{"fullName": "Rijo Sam", "company": "ABN AMRO Bank", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-1a4892c1-bdd5-4749-8b50-ab33fe99a4b0.jpeg"}], "track": {"name": "People & Culture"}, "audienceLevel": "BEGINNER", "youtubeUrl": "", "description": "Ever wondered why working in global teams feels like unravelling a mystery? You're not alone! The reality of working within such a team can differ from expectations. Often, the greatest challenge for developers isn't the actual work, but rather navigating the distance, understanding cultural disparities, and maintaining meaningful connections with team members.<br><br>Today, whether we work in Brussels or New York, Amsterdam or New Delhi, we are all part of a global network where success requires traversing vastly different cultural realities. But how do you deliver constructive feedback to colleagues from Asia, America, or Europe? And why does your Indian team really need an hour for lunch? Also, do you know the secret that a ‘NO’ can come in many disguises?<br><br>In this session, I will share personal stories and practical strategies from my years of working with multicultural teams. These strategies aim to enhance communication, bridge cultural gaps, and foster strong collaboration across continents. Join me as we embark on a journey filled with laughter, learning, and limitless possibilities.", "totalFavourites": 40, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-08T12:00:00Z", "to": "2025-10-08T12:50:00Z", "room": "Room 3", "kind": "Conference", "pause": false, "talk": {"id": 46054, "title": "Fault-tolerant AI Agents on the JVM with Koog framework", "speakers": [{"fullName": "Vadim Briliantov", "company": "JetBrains", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-0aec6060-627b-4afb-b86f-8b8029e4a890.jpg"}], "track": {"name": "GenAI & Beyond"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=2l1GBp80CbY", "description": "AI agents are no longer just experiments. Once they leave the lab, new challenges emerge: ensuring they can recover from failures, behave predictably, and remain resilient in production.<br><br>At JetBrains, we've been solving these problems while deploying AI agents <strong>in real products<\/strong>. Koog is the open-source Kotlin / <strong>JVM<\/strong> framework that grew out of this work. It helps you design agents as modular, reusable pipelines—so you can precisely control their behavior instead of treating them like black boxes.<br><br>Koog's key strength is <strong>fault tolerance<\/strong>. Agents can <strong>checkpoint<\/strong> and restore their entire state machine, not just chat history. That means you can safely resume long-running processes, <strong>recover after crashes<\/strong>, or move execution between machines without losing progress.<br><br>In this talk you'll learn:<br><br> - How to model agents as <strong>predictable<\/strong> graphs of operations.<br> - How persistence and <strong>restoration<\/strong> from checkpoints make agents resilient in production.<br> - <strong>Lessons from JetBrains<\/strong>' own use of Koog<strong> in real products.<\/strong><br><br>Together, we'll look at how AI agents on the JVM can move beyond experiments and into reliable, production-ready systems.", "totalFavourites": 111, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-08T12:00:00Z", "to": "2025-10-08T12:50:00Z", "room": "Room 4", "kind": "Conference", "pause": false, "talk": {"id": 47103, "title": "Akka: an enterprise runtime for resilient agentic AI", "speakers": [{"fullName": "Renato Guerra Cavalcanti", "company": "Akka", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-b2715647-7f52-4254-9908-c980ce613a77.png"}], "track": {"name": "Architecture"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=PrIh_9HomfI", "description": "Building sophisticated AI systems often means coordinating multiple agents — each with its own capabilities, memory, and goals. But for enterprises moving from a prototype to a mission-critical application, chaining simple LLM calls together is a fragile and costly gamble. These long-running, non-deterministic workflows collapse under complexity, wasting tokens, time, and developer effort.<br><br>In this talk, we'll explore why production-grade agentic software demands a battle-tested runtime with built-in resilience and durability, enabling it to recover seamlessly from crashes, interruptions, and network failures. This is where Akka comes in, a proven architecture that has powered complex, distributed systems for over a decade.<br><br>We'll demonstrate how Akka's workflows ensure durable execution, guaranteeing that an agent's work within a long-running flow is executed only once, saving on token consumption and recovery time. Coupled with built-in session memory, this allows you to move beyond simple prompts and build truly autonomous systems that can reason, remember, and act with the certainty and reliability required for enterprise-scale deployments.", "totalFavourites": 70, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-08T12:00:00Z", "to": "2025-10-08T12:50:00Z", "room": "Room 5", "kind": "Conference", "pause": false, "talk": {"id": 26290, "title": "Making significant Software Architecture decisions", "speakers": [{"fullName": "Bert Jan Schrijver", "company": "OpenValue", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-2636b8a5-0209-4a75-9422-6e1c2662b04a.jpg"}], "track": {"name": "Architecture"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=uoV7d2Af2tM", "description": "Software architecture represents the significant design decisions that shape a system, where significant is measured by the cost of change. At its core, architectural decision-making is about balancing trade-offs to align technical solutions with broader requirements.<br>But how do you approach a trade-off analysis? How do you choose between different solutions, frameworks, tools, languages, or cloud providers? Which factors should guide your decisions beyond just technical fit? And how do you make sure you’re not overlooking non-technical aspects like team expertise, long-term supportability, and hiring feasibility?<br>In this session, I’ll share a structured approach to making informed, high-impact architecture decisions. We’ll break down technical, organizational, financial and other trade-offs and explore how to evaluate and balance competing concerns. You’ll walk away with practical strategies to make better architectural decisions in real-world projects.", "totalFavourites": 722, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-08T12:00:00Z", "to": "2025-10-08T12:50:00Z", "room": "Room 6", "kind": "Conference", "pause": false, "talk": {"id": 3802, "title": "From OpenAI to Opensource AI: Navigating Between Commercial Ownership and Collaborative Openness", "speakers": [{"fullName": "Raphaël Semeteys", "company": "Worldline", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-4612beb6-635e-40f9-b1dc-2a6c0915a860.jpg"}], "track": {"name": "GenAI & Beyond"}, "audienceLevel": "BEGINNER", "youtubeUrl": "https://www.youtube.com/watch?v=Bgsln75ogMU", "description": "This presentation explores the evolution of generative AI, highlighting the trajectories of various models such as GPT-4, and examining the dynamics between commercial interests and the ethics of open collaboration. <br><br>We offer an in-depth analysis of the <strong>levels of openness<\/strong> of different language models, assessing various components and aspects, and exploring how the (de)centralization of computing power and technology could shape the future of AI research and development.<br><br>Additionally, we explore concrete examples like LLaMA and its descendants, as well as other open and collaborative projects, which illustrate the diversity and creativity in the field, while navigating the complex waters of intellectual property and licensing.", "totalFavourites": 97, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-08T12:00:00Z", "to": "2025-10-08T12:50:00Z", "room": "Room 7", "kind": "Conference", "pause": false, "talk": {"id": 3263, "title": "Thirty years of Java development: keeping it all together", "speakers": [{"fullName": "Cristian Schuszter", "company": "CERN", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-63f3bbaa-b0a5-4644-8746-a337a482c118.jpeg"}], "track": {"name": "Development Practices"}, "audienceLevel": "BEGINNER", "youtubeUrl": "https://www.youtube.com/watch?v=D-MyhXkBx70", "description": "At CERN, Java has been at the core of business applications for almost three decades, its first production Java system being released in 1998. The system still lives on to the present day. This long history means dealing with everything from aging monoliths to modern microservices — all coexisting and evolving under one roof. How do we keep it all working, consistent, and productive for 80+ developers across many teams?<br><br>This talk analyses the strategies we use to streamline and improve the developer experience: from standardizing development environments with templates and documentation, to making onboarding painless through easy bootstrapping. You'll also hear how we’ve been using Gradle to boost productivity — with centralized build logic, build caching, custom repositories, and internal plugins — all developed to address real-world issues in a codebase that spans generations.<br><br>Whether you're maintaining a legacy beast or building something new, this talk offers a behind-the-scenes look at what it takes to keep 30 years of Java running smoothly.", "totalFavourites": 275, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-08T12:00:00Z", "to": "2025-10-08T12:50:00Z", "room": "Room 8", "kind": "Conference", "pause": false, "talk": {"id": 7729, "title": "Top 10 Event-Driven Architecture Pitfalls", "speakers": [{"fullName": "Victor Rentea", "company": "Freelance", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-8c32e503-fe48-4c4d-a536-0d484f580374.jpg"}], "track": {"name": "Architecture"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=0SnuppAHOlQ", "description": "You send a message instead of calling a REST API. What can possibly go wrong? Welcome to the Event-Driven Adventure Park 🎢 — where every message is a rollercoaster ride! Hold tight as we race through the wild loops of duplicate deliveries, swerve through out-of-order twists, dodge race condition traps, and scream through the request-reply haunted tunnel. Survive the dual-write drop, escape the consumer error maze, and mind the privacy pirates lurking in the shadows. We’ll explore 10 thrilling rides — all real war stories from 150 companies Victor has trained at. Whether you’re the architect, coder, or ops hero, get ready for the wildest tour through the quirks, bugs, and best practices of messaging systems. No REST, just ride! 🎪", "totalFavourites": 964, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-08T12:00:00Z", "to": "2025-10-08T12:50:00Z", "room": "Room 9", "kind": "Conference", "pause": false, "talk": {"id": 22133, "title": "The Ultimate Showdown of Database Migration Tools", "speakers": [{"fullName": "Pasha Finkelshteyn", "company": "BellSoft", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-9e056dea-b455-432f-8b40-91c861b254da.jpg"}, {"fullName": "Mikhail Polivakha", "company": "Spring Айо", "imageUrl": "https://lh3.googleusercontent.com/a/ACg8ocJGuc1OvSYFK1Pun_EVnYh_Jtc6f8uWF9K6_VF8J9vJLWEhPlRE=s96-c"}], "track": {"name": "Server Side Java"}, "audienceLevel": "BEGINNER", "youtubeUrl": "https://www.youtube.com/watch?v=Ro-zZPkizas", "description": "When it comes to database migration in the Spring ecosystem, two heavyweights dominate: Liquibase and Flyway. While both tools bring unique strengths to the table, only one can claim victory in this exciting technical showdown.<br><ul><li>Which languages support migrations, and how do the costs compare?<\/li><li>What features do the rollbacks offer?<\/li><li>What versioning schemes and strategies do they utilize?<\/li><li>How do their runtimes operate?<\/li><\/ul>No stone left unturned! Which migration tool will reign supreme in your Spring project? Join us to learn the differences between tools and cast your vote to make the ultimate decision!", "totalFavourites": 166, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-08T12:00:00Z", "to": "2025-10-08T12:50:00Z", "room": "Room 10", "kind": "Conference", "pause": false, "talk": {"id": 14101, "title": "Cryptography in a post-quantum world: why our encryption now has a use-by date, and what we need to do about it.", "speakers": [{"fullName": "Jules May", "company": "22 Consulting Ltd", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-259ce13f-8d25-4a8c-a1a2-14e42e5b2ed7.jpeg"}], "track": {"name": "Security"}, "audienceLevel": "BEGINNER", "youtubeUrl": "https://www.youtube.com/watch?v=emJ5Fyboy-4", "description": "Quantum computers are already a reality. Among their other capabilities, they have demonstrated their ability to efficiently crack encrypted messages. Their power is currently increasing exponentially, with no end in sight; within the foreseeable future they will be able to crack virtually all of the world’s current encryption algorithms. Intelligence agencies around the world are already hoovering-up encrypted messages because, even though they're uncrackable today, soon they will all be readable with ease. Cryptography as we know it is, officially, deprecated.<br><br>This talk will explore what privacy looks like in a post-quantum world. It will:<br><ul><li>describe the capabilities of current quantum machines, explain why they’re so good at codebreaking, and predict when our current algorithms are likely to fall;<\/li><li>describe the impact of quantum computation on our current encrypted communications, cryptocurrencies, and authentication systems;<\/li><li>explore some of the developments in “post-quantum classical cryptography”, and why you should be preparing to deploy them today;<\/li><li>discuss some of the developments in quantum communication which will enable planet-scale, absolutely uncrackable messaging.<\/li><\/ul>", "totalFavourites": 236, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-08T12:00:00Z", "to": "2025-10-08T12:50:00Z", "room": "BOF 1", "kind": "Conference", "pause": false, "talk": {"id": 8904, "title": "When ORM Becomes OMG: Performance Pitfalls in JPA and Friends", "speakers": [{"fullName": "Jos Roseboom", "company": "EasingYou", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-f4545fc7-4731-47f4-9a11-a145e83ae9b2.png"}], "track": {"name": "Server Side Java"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "", "description": "JPA makes database interaction feel almost magical—until your app grinds to a halt. In this talk, we’ll take a tour through the common (and not-so-common) performance pitfalls that turn object-relational mapping into an object-relational mess. From data loading surprises to connection mismanagement, we’ll explore real-world issues using a sample app: the FunFactStore, where fun facts are sold, but bugs are free.<br><br>We’ll dig into how seemingly harmless libraries can sometimes do more harm than good, and how tooling can help you spot trouble before your users do. Whether you’re using Spring Data JPA, navigating tricky transaction boundaries, or just wondering why things suddenly got slow, this session offers practical insights—and maybe a few fun facts.", "totalFavourites": 260, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-08T12:50:00Z", "to": "2025-10-08T13:10:00Z", "room": "Exhibition Hall", "kind": "Break", "pause": true, "talk": null}, {"from": "2025-10-08T13:10:00Z", "to": "2025-10-08T14:00:00Z", "room": "Room 3", "kind": "Conference", "pause": false, "talk": {"id": 47105, "title": "What's new in the Gemini universe?", "speakers": [{"fullName": "Guillaume Vernade", "company": "Google Deepmind", "imageUrl": "https://lh3.googleusercontent.com/a/ACg8ocKTueIY6DSPEB-s9PniBppj2a3qAIi4gkmT8V01Yy-O3V1ocw=s96-c"}], "track": {"name": "GenAI & Beyond"}, "audienceLevel": "BEGINNER", "youtubeUrl": "https://www.youtube.com/watch?v=cOp5rklR3jI", "description": "The Gemini ecosystem is expanding at an unprecedented rate, introducing a torrent of updates and new capabilities that can be challenging even for seasoned developers to track. This session aims to provide a clear and consolidated overview of the most significant recent advancements, ensuring the developer community can keep pace with this rapid innovation.<br><br>We will explore the dawn of a new, agentic era powered by Gemini. This paradigm shift is creating a world of possibilities, led by powerful new assistants designed to understand, reason, and act on your behalf. We will dive into practical examples of these agents, such as the open-source <strong>Gemini CLI<\/strong> that brings AI directly into your terminal, and Jules, an asynchronous coding agent that can autonomously write, test, and improve code.<br><br>Furthermore, the talk will delve into the latest breakthroughs in <strong>vibe coding.<\/strong> We'll demonstrate how Gemini is revolutionizing the development workflow, from the generation of assets to the creation of complex code and entire applications based on high-level descriptions.<br><br>A special focus will be placed on <strong>Google AI Studio<\/strong>, showcasing how it serves as a powerful environment to experiment with and harness these new capabilities for your own projects.<br><br>Join us to navigate this new frontier and understand how to leverage the latest tools in the Gemini galaxy.", "totalFavourites": 219, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-08T13:10:00Z", "to": "2025-10-08T14:00:00Z", "room": "Room 4", "kind": "Conference", "pause": false, "talk": {"id": 23191, "title": "A Long Spring: 19 Years of Living with Your Past Mistakes", "speakers": [{"fullName": "Arjen Poutsma", "company": "Poutsma Principles", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-2aacd4e5-ffb4-4c7c-b48b-41896a74cfd4.jpeg"}], "track": {"name": "Development Practices"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=0OtngsVzOno", "description": "How do you evolve a framework over nearly two decades without losing the trust of millions of developers? In this talk, I will reflect on 19 years of working on Spring, the Java application framework—from the early days of XML configuration, through the rise of annotations, to the advent of functional programming.<br><br>I will share the lessons that come not just from designing APIs and writing code, but from practicing open source stewardship over time. That includes how to innovate under constraints, how to evolve APIs responsibly, how to serve a growing community, and why empathy and restraint are essentials skills when it comes to maintaining open source.<br><br>This talk is for anyone willing to learn from my past mistakes, so they can make entirely new ones.<br>", "totalFavourites": 269, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-08T13:10:00Z", "to": "2025-10-08T14:00:00Z", "room": "Room 5", "kind": "Conference", "pause": false, "talk": {"id": 14125, "title": "30 Years of Java - How Did We Get Here?", "speakers": [{"fullName": "Simon Ritter", "company": "Azul", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-e61ddaf7-5954-4220-a9f9-e27f365467cf.jpg"}], "track": {"name": "Java"}, "audienceLevel": "BEGINNER", "youtubeUrl": "https://www.youtube.com/watch?v=991TTtoPm54", "description": "May 23rd, 1995, saw the launch of not just a new programming language but an entire development and deployment platform. Initially targeted at the brand-new world of browsers and the World Wide Web, it quickly became the de facto standard for internet-scale enterprise applications.<br><br>Remarkably, thirty years later, it is still always in the top three most popular languages in use by developers.<br><br>How did this happen?<br><br>In this session, we’ll take a whirlwind tour of the history of Java, recalling many of the milestones along the way.<br><br>I started working for Sun Microsystems in February 1996, roughly the same week JDK 1.0 was launched. Through fourteen years at Sun, five at Oracle and nearly ten at Azul, I’ll bring plenty of anecdotes about Java’s history (and some souvenirs). Be prepared for some serious developer nostalgia!", "totalFavourites": 279, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-08T13:10:00Z", "to": "2025-10-08T14:00:00Z", "room": "Room 6", "kind": "Conference", "pause": false, "talk": {"id": 16272, "title": "How to build your own fun and absurd pair programmer", "speakers": [{"fullName": "Alexander Chatzizacharias", "company": "JDriven", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-12fc9c14-4162-4238-983b-66f8991c0d06.jpg"}], "track": {"name": "GenAI & Beyond"}, "audienceLevel": "BEGINNER", "youtubeUrl": "https://www.youtube.com/watch?v=JD159YnGoPw", "description": "Tired of AI assistants that are always so boring and soulless? Alexander was. So, he decided to build his own. An AI assistant with personality, flair, and a healthy dose of sarcasm. Imagine a pair programmer that offers sarcastic feedback, makes absurd suggestions, and threatens to blow up your code when it disagrees with your changes. And when things get too quiet, it might even challenge you to a game of tic-tac-toe.<br><br>This session is for anyone who believes the best way to learn new technologies is by playfully breaking them. If you’re curious about LLMs and agents beyond the typical use cases, this talk is for you. You’ll leave with practical insights into building your own agentic LLM workflows using Spring Boot, the basis of our IDP.", "totalFavourites": 284, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-08T13:10:00Z", "to": "2025-10-08T14:00:00Z", "room": "Room 8", "kind": "Conference", "pause": false, "talk": {"id": 3261, "title": "Bootiful Spring AI", "speakers": [{"fullName": "Josh Long", "company": "the Spring team", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-5c074f46-dfb5-4caf-872c-c8f7d216345a.jpg"}, {"fullName": "Christian Tzolov", "company": "Broadcom", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-f95fd57e-acf9-4791-9a68-7096de8eb4f4.png"}, {"fullName": "James Ward", "company": "AWS", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-252a44f3-49db-43fa-8435-60a439b4bdb9.jpg"}, {"fullName": "Mark Pollack", "company": "Broadcom", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-dba9d452-7a5c-40c4-9181-60a1b49ee117.jpg"}], "track": {"name": "GenAI & Beyond"}, "audienceLevel": "BEGINNER", "youtubeUrl": "https://www.youtube.com/watch?v=Sw3PlFXfWj4", "description": "The age of artificial intelligence (because the search for regular intelligence hasn't gone well..) is nearly at hand, and it's <em>everywhere<\/em>! But is it in your application? It should be. AI is about integration, and here the Java and Spring communities come second to nothing. In this talk, we'll demystify the concepts of modern day Artificial Intelligence, and look at its integration with the white hot new Spring AI project, a framework that builds on the richness of Spring Boot to extend them to the wide world of AI engineering. We'll dive into agentic patterns, integration opportunities with MCP, and so much more. <br><br>Tentatively: this talk will include Dr. Mark Pollack, Christian Tsolov, and AWS' James Ward", "totalFavourites": 658, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-08T13:10:00Z", "to": "2025-10-08T14:00:00Z", "room": "Room 9", "kind": "Conference", "pause": false, "talk": {"id": 3252, "title": "Vibe-coding your way into a security nightmare", "speakers": [{"fullName": "Arjen Wiersma", "company": "Scyon", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-58d6d176-0490-47d5-82d2-642fd0d4f79d.jpeg"}], "track": {"name": "Security"}, "audienceLevel": "BEGINNER", "youtubeUrl": "https://www.youtube.com/watch?v=AQqZUzeTFOc", "description": "In this talks, I explore the concept of \"vibe coding\" and addresses the potential pitfalls of unguided AI-generated code. I stand for a balanced approach, advocating for AI as a powerful tool that, when wielded with enough knowledge and background, can accelerate innovation. I focus on equipping developers with practical rules and insights to prevent \"security nightmares,\" ensuring that the dream of rapid AI-assisted development is built on best practices. I show you how things can go wrong with real case studies and will help you understand AI's limitations, the critical need for code review, adherence to established software development standards, and continuous learning in the fast-evolving landscape of AI security.<br><br>Key take-aways:<br><br>In the talk I introduce my 7 rules for secure coding in the age of AI, and with a little bit of humor show you where things can go horribly wrong, so that you do not make the same mistakes!<br><br>Target audience:<br><br>Developers wanting to use AI to generate code, AI enthousiasts who want to build secure systems.", "totalFavourites": 300, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-08T13:10:00Z", "to": "2025-10-08T14:00:00Z", "room": "Room 10", "kind": "Conference", "pause": false, "talk": {"id": 7031, "title": "Braving the Change: Recalibrating to new realities", "speakers": [{"fullName": "Tom Cools", "company": "Timefold", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-41f9c32f-de59-4677-aa11-e1bd88fcd3c8.jpeg"}], "track": {"name": "People & Culture"}, "audienceLevel": "BEGINNER", "youtubeUrl": "https://www.youtube.com/watch?v=qjTxFjW0_n8", "description": "‘Change is the only constant in our industry’… but they never told us it would go this fast. With the recent evolutions in AI, ‘change’ has shifted from a ‘constant’ to something better described as ’exponential,’ sparking excitement for some and existential dread for others.<br><br><strong>In this session, we’ll discuss some insights into dealing with change inspired by the real big changes in our lives. We’ll explore the emotional aspects of change, contextualize our relation to change and discuss the 3 essential skills needed to deal with evolving landscapes.<\/strong><br><br>After leaving this session, you’ll be better prepared for whatever change might come on your path, whatever shape that change might be.", "totalFavourites": 123, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-08T13:10:00Z", "to": "2025-10-08T14:00:00Z", "room": "BOF 1", "kind": "Conference", "pause": false, "talk": {"id": 16256, "title": "Secure by Culture: Building a Developer-Driven Security Mindset", "speakers": [{"fullName": "Enrique Larios Vargas", "company": "Adyen", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-6d637b33-1a9a-4e1a-99fe-3b1bab1721a8.jpeg"}], "track": {"name": "People & Culture"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "", "description": "What if secure development were more about behavior than just policies and tools? In this talk, we’ll explore how software developers can influence security culture through their daily decisions, team habits, and shared norms. By drawing on behavioral science and real-world engineering challenges, we'll discuss why traditional approaches—focused primarily on tools and compliance—often fall short in integrating secure practices into the development process.<br><br>You’ll learn how capability, opportunity, and motivation drive secure behavior, based on the COM-B model. We will also explore practical strategies for cultivating a security mindset through team rituals, peer modeling, and developer-centered interventions. Whether you consider yourself a skeptical coder or a security enthusiast, this talk aims to help you view security not as an obstacle, but as a valuable craft.<br><br>Key Takeaways:<br>- Understand security culture from a developer’s perspective.<br>- Identify behavior-based blockers to secure coding.<br>- Learn how to embed secure practices into your daily workflow.<br>- Discover developer personas and nudges that shape secure behavior.<br><br>Target Audience:<br>Software developers, tech leads, security champions, and engineering managers interested in building security practices that stick without slowing down delivery.", "totalFavourites": 159, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-08T13:10:00Z", "to": "2025-10-08T14:00:00Z", "room": "BOF 2", "kind": "Conference", "pause": false, "talk": {"id": 22105, "title": "Quiet on Set: Building an On-Air Sign with Open Source Technologies", "speakers": [{"fullName": "Danica Fine", "company": "Snowflake", "imageUrl": "https://lh3.googleusercontent.com/a/ACg8ocL1K7AlfR7FmQD7EVU-pqESZiantUCCJHQr7oTYK7C_sfE1suM_=s96-c"}], "track": {"name": "Mind the geek"}, "audienceLevel": "BEGINNER", "youtubeUrl": "", "description": "While many of us have adapted to work from home life, one major problem remains: finding an easy way to keep folks in your home away from your workspace when you’re on an important call. Dust off your Raspberry Pi––let’s build a custom on-air sign with Apache Kafka®, Apache Flink®, and Apache Iceberg™!<br><br>We’ll begin by writing Python scripts to capture key events––such as when a Zoom meeting is running and when a camera is being used––and produce it into Kafka. The live data are then consumed by a Raspberry Pi script to drive the operation of a custom designed on-air sign. From there, you’ll be introduced to the ins and outs of FlinkSQL for stream processing as we wrangle the data into a better format for downstream use. And, finally, we’ll see Iceberg in action and learn how to use query engines to analyze meeting and recording trends.<br><br>By the end of the session, you’ll be well-acquainted with this powerful trio of open source technologies and know how you could use the same scaffolding and scale out a simple, at-home project to millions of users and simultaneous events.<br>", "totalFavourites": 49, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-08T14:00:00Z", "to": "2025-10-08T14:40:00Z", "room": "Exhibition Hall", "kind": "Break", "pause": true, "talk": null}, {"from": "2025-10-08T14:40:00Z", "to": "2025-10-08T15:30:00Z", "room": "Room 3", "kind": "Conference", "pause": false, "talk": {"id": 10364, "title": "The Road Not Taken: A Developer's Guide to Life Beyond Spring Boot", "speakers": [{"fullName": "Frederik Pietzko", "company": "iits-consulting", "imageUrl": "https://avatars.githubusercontent.com/u/25300094?v=4"}], "track": {"name": "Server Side Java"}, "audienceLevel": "BEGINNER", "youtubeUrl": "https://www.youtube.com/watch?v=1K1EElv6QNc", "description": "Beyond Spring Boot lies a world of possibilities waiting to be explored. Join me as we chart a course from heavyweight champions Quarkus and Micronaut, through the versatile terrain of Helidon, to the surprisingly capable micro-frameworks Javalin and Ktor. We'll compare approaches, analyze performance, and uncover the unique strengths each brings to your development arsenal. The journey from enterprise to lightweight might just change how you choose your next framework.", "totalFavourites": 172, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-08T14:40:00Z", "to": "2025-10-08T15:30:00Z", "room": "Room 4", "kind": "Conference", "pause": false, "talk": {"id": 6203, "title": "Shifting the trajectory: Undoing the damage of working in front of a computer screen", "speakers": [{"fullName": "Georgios Diamantopoulos", "company": "Zero to MVP", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-4834386d-c533-4d36-9d4a-71afe8de7c9f.jpg"}], "track": {"name": "People & Culture"}, "audienceLevel": "BEGINNER", "youtubeUrl": "https://www.youtube.com/watch?v=yitHp0k2CI0", "description": "We're an industry that solves impossible technical challenges, builds systems serving billions, and automates the world - yet we haven't figured out how to sit at a desk without destroying our bodies. I learned this the hard way: active engineer → COVID couch potato → 41-year-old developer with chronic pain. The research reveals I was just one predictable data point in a massive pattern.<br><br>This isn't about being \"out of shape.\" Within hours of sitting, arteries lose elasticity and blood pressure spikes. After one day, insulin dysfunction kicks in. Days later, 4,500+ genes rewire themselves and fat-burning enzymes shut down by 90%. Structural adaptations create \"tech neck,\" and spinal damage now appears in children as young as 9. We're systematically breaking our bodies while building the digital world.<br><br>The shocking truth: exercise can't save us. You can't out-train 8 hours of sitting damage. The solution isn't better ergonomics - it's a complete mental reframe of how we work and live as developers. I'll share the latest research and specific strategies that can shift your trajectory from inevitable decline to sustainable vitality. Because the alternative isn't just pain - it's a future where we can't move freely through life at all.", "totalFavourites": 201, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-08T14:40:00Z", "to": "2025-10-08T15:30:00Z", "room": "Room 5", "kind": "Conference", "pause": false, "talk": {"id": 7728, "title": "The ⁠Psychology of Code", "speakers": [{"fullName": "Victor Rentea", "company": "Freelance", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-8c32e503-fe48-4c4d-a536-0d484f580374.jpg"}], "track": {"name": "People & Culture"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=TZl1gYomyH0", "description": "<p>What if your worst bugs aren’t in the code, but in your head?<br><p><br><p>Cognitive biases, emotional traps, and mental load silently shape every line we write and every design we argue over. From Impostor Syndrome to the Shiny Object Effect, our psychology impacts team dynamics, architecture decisions, and even how we debug.<br><p><br><p>In this keynote, we’ll unpack the hidden forces behind technical work—why smart teams make irrational choices and how to build awareness into your engineering culture. Learn to outsmart your own brain and ship better software, together.<br>", "totalFavourites": 759, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-08T14:40:00Z", "to": "2025-10-08T15:30:00Z", "room": "Room 6", "kind": "Conference", "pause": false, "talk": {"id": 26844, "title": "Docker Compose your Dev Toolkit for AI and Cloud workflows", "speakers": [{"fullName": "Guillaume Lours", "company": "Docker", "imageUrl": "https://lh3.googleusercontent.com/a-/AOh14Gi6k2N2uyqFn8HjBBUGPXeQwyLVwKVqMQ7T_Ie-=s96-c"}], "track": {"name": "Development Practices"}, "audienceLevel": "BEGINNER", "youtubeUrl": "https://www.youtube.com/watch?v=u5XAjauwPEI", "description": "Docker Compose has always been a developer favorite for orchestrating local environments, but it just got a major upgrade for the AI era.<br>In this fully live demo session (no fluff, almost no slides), I’ll showcase how the latest features in Docker Compose like the new <code>models<\/code> attribute and provider services, make it possible to declaratively define and run LLM-powered applications with ease.<br><br>You'll see how to plug an AI model into your app using the <code>models<\/code> section, connect to a remote by using a Telepresence provider service, and when your laptop can’t keep up? Docker Offload will seamlessly run your heavy workloads remotely, without changing your dev flow.<br>What you’ll see live:<br><ul><li>Defining an LLM (like <code>llama3<\/code>, <code>qwen<\/code>, etc.) in a Compose file using the <code>models<\/code> key<\/li><li>How you can easily access to those LLM from your service containers<\/li><li>The power of <strong>provider services<\/strong> to prepare or connect to Compose external resources <\/li><li>Running GPU-heavy tasks remotely via <strong>Docker Offload<\/strong>, when local compute isn’t enough<\/li><li>Using Compose as the single source of truth to orchestrate everything from code to context<\/li><\/ul>This session is fast, practical, and built for developers working with AI, agents, or modern multi-service stacks. <br>You’ll walk away with a concrete understanding of how Docker Compose’s latest features help you develop AI applications", "totalFavourites": 115, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-08T14:40:00Z", "to": "2025-10-08T15:30:00Z", "room": "Room 7", "kind": "Conference", "pause": false, "talk": {"id": 12488, "title": "From Vulnerability to Victory: Mastering the CVE Lifecycle for Java Developers", "speakers": [{"fullName": "Anthony Dahanne", "company": "HeroDevs", "imageUrl": "https://avatars.githubusercontent.com/u/60938?v=4"}], "track": {"name": "Security"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=EDNmUpE32aM", "description": "This session demystifies the CVE lifecycle for Java developers. <br>We'll explore how vulnerabilities are discovered, scored via CVSS, and disclosed through responsible processes. <br>You'll learn about major vulnerability databases (NVD, GitHub Advisory, OSS Index), their differences, and which security tools rely on each source.<br>The practical half equips you with remediation strategies using automated tools like Dependabot, Renovate, and IDE integrations.<br>We'll tackle the challenge of transitive dependencies in Maven and Gradle with hands-on techniques for resolving conflicts.<br>Finally, we'll discuss framework (Spring, Quarkus, etc) End-of-Life situations with the different options available.<br>Walk away understanding the entire vulnerability ecosystem, implementing automated dependency updates in CI/CD pipelines, handling dependency conflict resolution, and developing pragmatic approaches to framework EOL scenarios. <br>This talk transforms security from a burden to a competitive advantage for intermediate developers, DevOps engineers, and technical leads working with Java applications.", "totalFavourites": 178, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-08T14:40:00Z", "to": "2025-10-08T15:30:00Z", "room": "Room 8", "kind": "Conference", "pause": false, "talk": {"id": 24577, "title": "The New Java Best Practices", "speakers": [{"fullName": "Stephen Colebourne", "company": "Engine by Starling", "imageUrl": "https://avatars.githubusercontent.com/u/213212?v=4"}], "track": {"name": "Java"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=4sjJmKXLnuY", "description": "Java evolves. And so must our Best Practices. Because it is not enough to simply learn the new features, we must learn how to use them well. In this session I'll examine how Java has moved on since 8, and propose how we should adapt, including records vs beans, pattern matching, optional vs null, and data-oriented programming. Be warned - this will be an opinionated session!", "totalFavourites": 852, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-08T14:40:00Z", "to": "2025-10-08T15:30:00Z", "room": "Room 9", "kind": "Conference", "pause": false, "talk": {"id": 27358, "title": "AI Agents, the New Frontier for LLMs", "speakers": [{"fullName": "Guillaume Laforge", "company": "Google", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-22955cd1-9c41-4d6e-a7f2-b0f415794a7f.jpg"}], "track": {"name": "GenAI & Beyond"}, "audienceLevel": "BEGINNER", "youtubeUrl": "https://www.youtube.com/watch?v=F8p4PPx5nSo", "description": "Know Large Language Models at your fingertips? <br>Mastering Retrieval Augmented Generation to help an LLM search your documents? <br><br>It's time to dive into the wonderful world of intelligent agents, the next frontier for LLMs! In this session, we will first define what agents are, or at least what makes a system \"agentic\". We will explain the limitations of LLMs, key agent characteristics and patterns. Then, through concrete examples, we will implement various agents in Java, using the LangChain4j and ADK frameworks, to illustrate some typical agent patterns and to understand how to go beyond a simple LLM call to obtain responses that meet the needs of your users, or even to trigger actions with the surrounding system. But it’s not all we’ll learn about! An agent doesn’t live alone on a desert tropical island. Indeed it can communicate with other agents via tools that can be invoked thanks to the Model Context Protocol (MCP). <br><br>They can also interact with other remote agents from other platforms and ecosystems, thanks to the Agent To Agent protocol (A2A). Are you ready for the next hype on agents? <br>Come and discover it in this session!", "totalFavourites": 305, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-08T14:40:00Z", "to": "2025-10-08T15:30:00Z", "room": "Room 10", "kind": "Conference", "pause": false, "talk": {"id": 23196, "title": "Scaling AI Adoption: From 30 Engineers to Tech-Wide Transformation - Lessons from Doctolib's Journey", "speakers": [{"fullName": "Thomas Bentkowski", "company": "Doctolib", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-3198e8c0-4496-4d83-abd8-9773f0477c4d.png"}, {"fullName": "Julien Tanay", "company": "Doctolib", "imageUrl": "https://lh3.googleusercontent.com/a/ACg8ocKuBgRjh5T0hub3lgXQri_IaGo1HdFS0ZByrbYKYp20HVLGOMq9=s96-c"}], "track": {"name": "GenAI & Beyond"}, "audienceLevel": "BEGINNER", "youtubeUrl": "https://www.youtube.com/watch?v=2h3NWZdhuYw", "description": "Join us for an honest, practical talk about implementing AI tools at scale in a 600+ engineer organization. As a Platform Product Manager and Staff SRE at Doctolib, we'll share our 6-month journey from a 30-engineer pilot to tech-wide adoption of AI coding assistants.<br>We'll reveal the real challenges we faced - from quality concerns and engineer skepticism to cost management and environmental considerations. More importantly, we'll show you what actually worked: our AI Champions program, the AI Summer Camp that changed mindsets, and the metrics that matter.<br>You'll learn:<br>- How we selected and deployed multiple AI tools to cater to different preferences<br>- The 5 key friction points that almost derailed our initiative and how we addressed each one<br>- Our practical AI Starter Kit with concrete use cases every developer should leverage<br>- The innovative LLMs.md approach for repository-specific context<br>- Real KPIs and adoption trends - including the plateau we hit and how we're overcoming it<br>We'll be transparent about costs, share our monitoring strategies, and discuss the evolving role of platform teams in driving AI adoption. Whether you're starting your AI journey or looking to accelerate existing initiatives, you'll leave with actionable insights and proven strategies.<br>No hype, no hand-waving - just real experiences from the trenches of organizational change.", "totalFavourites": 74, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-08T14:40:00Z", "to": "2025-10-08T15:40:00Z", "room": "BOF 1", "kind": "BOF", "pause": false, "talk": {"id": 22104, "title": "What’s new with the JCP?", "speakers": [{"fullName": "Heather VanCura", "company": "Oracle", "imageUrl": "https://lh3.googleusercontent.com/a-/AOh14GjY1aQ9s1FVCmHPzWw4Uxq6B7HAJphB46X_yOrBxg=s96-c"}, {"fullName": "Stuart Marks", "company": "Oracle", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-7c2d7f17-7947-4be2-8b42-8d0f17a541d1.jpg"}], "track": {"name": "Java"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "", "description": "Learn about how to participate in the evolution of Java technology through the JCP and how to grow and build the next generation of Java developers, through Java in Education, how we are working open source library, tools, and maintainers to advance of adoption of new versions of Java through the Java ecosystem working group. Also learn how we are evolving Java to be the platform of choice for AI workloads.", "totalFavourites": 55, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-08T14:40:00Z", "to": "2025-10-08T16:40:00Z", "room": "BOF 2", "kind": "Hands-on Lab", "pause": false, "talk": {"id": 48551, "title": "Developing an Asynchronous Application with Virtual Threads and Structured Concurrency", "speakers": [{"fullName": "Ana-Maria Mihalceanu", "company": "Oracle", "imageUrl": "https://lh3.googleusercontent.com/a-/AOh14Gj1OS6OpAzuwBKwoUuCi9gxvNPvdmVA7nbW8lg3mg=s96-c"}, {"fullName": "José Paumard", "company": "Oracle", "imageUrl": "https://lh3.googleusercontent.com/a-/AOh14GhsVIUuTR9Onoo-D8UMW5QId2Yw1V_EUvqdWdNQ0RQ=s96-c"}], "track": {"name": "Java"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "", "description": "One of the most exciting features delivered by JDK 21 are Virtual Threads, developed by the Loom project. They promise to enable the \"simple thread-per-request style to scale with near-optimal hardware utilization\". Before Virtual Threads, this could only be achieved with reactive programming, which provides excellent throughput, but with patterns that are difficult to write, read, debug, and profile. It offers outstanding performance, but at the expense of maintainability. This hands-on lab guides you through writing a virtual thread-based application that utilizes structured concurrency to parallelize requests and scoped values to pass sensitive information without relying on method parameters. You
