 emerging as an alternative approach.<br><br>However, the challenge still lies in effectively splitting it without falling into the pitfall of a tightly coupled and rigid system. How to modularize it right while dealing with the growing complexity of your system? How to survive beyond our modeling debt and take control back?<br><br>Discover the Hive architecture style which decouples your deployment strategy - modular monolith or microservices - from the design of your software, embracing the “Build once, Deploy as you wish” principle. The Hive pattern will bring you a supple and scalable design that stands resilient in the face of evolving challenges for brown or greenfield products.", "totalFavourites": 212, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-10T08:40:00Z", "to": "2025-10-10T09:30:00Z", "room": "BOF 1", "kind": "Speaker Room", "pause": true, "talk": null}, {"from": "2025-10-10T09:30:00Z", "to": "2025-10-10T09:50:00Z", "room": "Exhibition Hall", "kind": "Break", "pause": true, "talk": null}, {"from": "2025-10-10T09:50:00Z", "to": "2025-10-10T10:40:00Z", "room": "Room 4", "kind": "Conference", "pause": false, "talk": {"id": 20659, "title": "Not just code. (Ab)using Claude Code to do just about anything but coding", "speakers": [{"fullName": "Barry van Someren", "company": "CoffeeSprout", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-6a72bd72-b25f-44bc-bb2f-8351a7dbb39b.jpeg"}], "track": {"name": "Build Different"}, "audienceLevel": "BEGINNER", "youtubeUrl": "https://www.youtube.com/watch?v=nPoC6m3axeU", "description": "Claude Code is an excellent coding assistant, but that’s not what this talk is about.<br>This talk is about using a frontier LLM, strapped to your terminal, to do things its creators probably never imagined… and living to tell the tale.<br><br>You’ll see real examples where I gave Claude vague, high-level instructions like:<br><ul><li>“Set up a dev cluster”<\/li><li>“Debug this broken networking setup”<\/li><li>“Run these scripts for each user in this Excel sheet, but skip the management types”<\/li><li>“Figure out how to comply with a government-mandated power-saving law and prove it”<\/li><\/ul><br>That last one? It generated config scripts, created audit reports, and helped cut our power bill by 15%.<br>No prompt engineering. No debates about hallucinations. Not even a mention of MCP.<br>Just practical, repeatable use cases from someone who wanted to spend less time clicking around and more time shipping (or avoiding tickets entirely).<br><br>You’ll walk away with:<br><ul><li>Tips for using Claude on the <em>Ops<\/em> side of DevOps (and how to avoid Oops)<\/li><li>Ideas and prompts that go beyond code, like compliance and reporting<\/li><li>A few hard boundaries I hit when pushing it too far<\/li><li>Some questionable decisions I don’t fully endorse… but hey, they worked<\/li><li>A glimpse of what’s possible as open models like Mistral become more capable<\/li><\/ul><br>If you’ve ever wished your terminal could just figure it out, this talk is for you.", "totalFavourites": 343, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-10T09:50:00Z", "to": "2025-10-10T10:40:00Z", "room": "Room 5", "kind": "Conference", "pause": false, "talk": {"id": 12467, "title": "The Future of Refactoring: Test-Driven Navigation", "speakers": [{"fullName": "Alex Bunardzic", "company": "Service Points", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-051a2343-3bbd-430e-b0b1-ccbb5000d09c.jpg"}], "track": {"name": "Development Practices"}, "audienceLevel": "ADVANCED", "youtubeUrl": "https://www.youtube.com/watch?v=tH8aqbHWgIM", "description": "AI promised to solve the endless chore of refactoring, but its tendency to deliver massive, uncontrolled changes often creates more problems than it solves. This talk introduces Test-Driven Navigation (TDN), a practical workflow to tame your AI assistant. By providing failing tests as hyper-specific instructions, we can force AI to work in safe, incremental steps. Learn how to combine principles from Extreme Programming (the 3 C's) with the power of modern AI to keep your code continuously working, transform your refactoring process, and elevate your role from a hands-on coder to a strategic system architect.<br><br><strong>What You Will Learn:<\/strong><br><ul><li>Why \"prompt-driven development\" often fails and leads to the much dreaded \"Big Bang\" delivery model.<\/li><li>How to apply the \"Permaculture by Succession\" philosophy to evolve software design safely.<\/li><li>A live-coded demonstration of the Test-Driven Navigation (Red-Green-Refactor) cycle with an AI partner.<\/li><li>How this approach transforms code review: \"writing the next test <em>is<\/em> the code review.\"<\/li><li>The future role of the developer is not obsolete; it's being elevated from a mechanic to a race engineer, from a coder to an architect.<\/li><\/ul><br>The talk is targeted to advanced software professionals.", "totalFavourites": 305, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-10T09:50:00Z", "to": "2025-10-10T10:40:00Z", "room": "Room 6", "kind": "Conference", "pause": false, "talk": {"id": 20674, "title": "Robotics and GraalVM native libraries", "speakers": [{"fullName": "Florian Enner", "company": "HEBI Robotics", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-33ddfb75-2635-4089-8aee-9a04df1a65de.jpg"}], "track": {"name": "Mind the geek"}, "audienceLevel": "ADVANCED", "youtubeUrl": "https://www.youtube.com/watch?v=md2JFgegN7U", "description": "Our company creates custom robotic solutions for a wide range of applications, from performing real-world industrial inspection tasks to providing robust platforms for building intelligent autonomous systems.<br><br>This presentation provides a rare behind-the-scenes look into how we use Java for real-time control, and why we are considering replacing parts of our C++ codebase with GraalVM’s native shared libraries.<br><br>This is a talk for geeks living at the edge, and for people who want to hear something new while watching videos of cool robots.", "totalFavourites": 88, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-10T09:50:00Z", "to": "2025-10-10T10:40:00Z", "room": "Room 8", "kind": "Conference", "pause": false, "talk": {"id": 15460, "title": "Virtual Threads, Structured Concurrency and Scoped Values: Putting it all together", "speakers": [{"fullName": "Balkrishna Rawool", "company": "ING Bank", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-a5b077a5-aefb-4860-94b4-d9b0234511ac.png"}], "track": {"name": "Java"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=iO79VR0zAhQ", "description": "Project Loom brings lightweight concurrency to Java with Virtual Threads, Structured Concurrency, and Scoped Values. But how do these features work together in a real-world application?<br><br>In this talk, we’ll build a Spring Boot application from scratch, progressively incorporating each feature of Project Loom to showcase its full potential. We’ll explore: Virtual Threads - lightweight, high-throughput threads that scale effortlessly. Structured Concurrency - a streamlined approach to managing concurrent tasks as a single unit of work. Scoped Values - a modern alternative to ThreadLocal, designed for virtual threads.<br><br>By the end of this session, you’ll have a clear understanding of how to apply Project Loom in your own applications - writing concurrent code that is simpler, more scalable, and easier to maintain.", "totalFavourites": 368, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-10T09:50:00Z", "to": "2025-10-10T10:40:00Z", "room": "Room 9", "kind": "Conference", "pause": false, "talk": {"id": 14126, "title": "Level Up Your LangChain4j Apps for Production", "speakers": [{"fullName": "Lize Raes", "company": "Oracle", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-b0334cda-79ec-4532-80ed-7a01c1eb117b.png"}], "track": {"name": "GenAI & Beyond"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=jvRSSsP26Z8", "description": "Join the maintainers of LangChain4j for a fast-paced tour of its latest features and how to use them in real-world apps. We’ll demo an AI researcher agent for drug discovery while covering concepts like guardrails, observability, multi-LLM orchestration, agents, and testing for non-deterministic systems. We’ll also explore advanced RAG, basic RAG’s less clumsy big brother, to give your models access to data from documents, databases, and the web. By the end of this talk, you'll be ready to take your AI-powered proof-of-concept to production.", "totalFavourites": 261, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-10T10:40:00Z", "to": "2025-10-10T16:40:00Z", "room": "Exhibition Hall", "kind": "Safe travels home", "pause": true, "talk": null}]}];

function videoId(url){try{return new URL(url).searchParams.get('v')}catch(e){return''}}
function showTalk(t,s){let dialog=$('#talkDialog'),id=videoId(t.youtubeUrl||''),img=$('#modalImage');$('#modalTitle').textContent=t.title||'Talk';$('#modalMeta').textContent=[(t.speakers||[]).map(x=>x.fullName).join(', '),t.track?.name,s.room].filter(Boolean).join(' · ');$('#modalDescription').innerHTML=`<p><strong>Devoxx popularity:</strong> ${Number(t.totalFavourites||0).toLocaleString()} attendee favourites</p>`+(t.teamRating?`<p><strong style="color:${t.teamRating.rating>=8?'#ffc94d':t.teamRating.rating>=7?'#6ee7a8':'#c8d1df'}">Team rating: ${t.teamRating.rating}/10</strong> · ${t.teamRating.reviews} ${t.teamRating.reviews===1?'review':'reviews'}</p>`:'')+(t.description||'<p>No speaker description is available for this talk.</p>');img.hidden=!id;if(id){img.src=`https://i.ytimg.com/vi/${id}/hqdefault.jpg`;img.alt=`YouTube thumbnail for ${t.title}`}$('#modalActions').innerHTML=(t.youtubeUrl?`<a class="youtube-button" href="${esc(t.youtubeUrl)}" target="_blank" rel="noopener">▶ Watch on YouTube</a>`:'')+(t.slidesUrl?`<a class="youtube-button" style="background:#3478d4" href="${esc(t.slidesUrl)}" target="_blank" rel="noopener">▣ View slides</a>`:'');dialog.showModal()}
function render(){const q=$('#search').value.toLowerCase().trim();$('#tabs').innerHTML=DAYS.map((d,i)=>`<button class="${i===active?'active':''}" data-i="${i}">${d.name}</button>`).join(' ');let d=DAYS[active], slots=d.slots.filter(s=>{let t=s.talk||{};let hay=[t.title,(t.speakers||[]).map(x=>x.fullName).join(' '),s.room,t.track?.name,s.kind].join(' ').toLowerCase();return(!q||hay.includes(q))&&(!videos||t.youtubeUrl)});let rooms=[...new Set(slots.map(s=>s.room))].sort((a,b)=>{let n=x=>+(x.match(/\d+/)||[999])[0];return n(a)-n(b)||a.localeCompare(b)});let start=Math.min(...d.slots.map(s=>mins(s.from))), end=Math.max(...d.slots.map(s=>mins(s.to))), height=(end-start)*pxPerMin;let ticks='';for(let m=Math.ceil(start/30)*30;m<=end;m+=30)ticks+=`<div class="tick" style="top:${(m-start)*pxPerMin}px">${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}</div>`;let events=slots.map(s=>{let t=s.talk, top=(mins(s.from)-start)*pxPerMin, h=Math.max(28,(mins(s.to)-mins(s.from))*pxPerMin-4), left=rooms.indexOf(s.room)*245;let title=t?.title||s.kind, duration=mins(s.to)-mins(s.from), speakers=(t?.speakers||[]).map(x=>x.fullName).join(', '), url=t?.youtubeUrl||'', id=t?String(t.id):'', isSeen=id&&seen.has(id), cls=t?`${url?'video':''}${isSeen?' seen':''}${duration<60?' compact':''}`:'break';let tag='div';return `<${tag} class="event ${cls}" style="top:${top}px;left:calc(${rooms.indexOf(s.room)} * var(--lane));height:${h}px" ${t?`data-talk-id="${esc(id)}" title="Show talk details"`:''}>${t?`<button class="seen-toggle" data-id="${esc(id)}" title="${isSeen?'Mark as unseen':'Mark as seen'}" aria-label="${isSeen?'Mark as unseen':'Mark as seen'}">${isSeen?'✓':'○'}</button>`:''}<div class="title">${url?'<span class="watch">▶ </span>':''}${esc(title)}</div><div class="meta">${esc(speakers||s.kind)}${t?.track?.name?' · '+esc(t.track.name):''}</div>${t?`<div class="popularity" title="Attendee favourites in the Devoxx schedule app"><span>♥ ${compact.format(t.totalFavourites||0)}<span class="metric-label"> favourites</span></span></div>`:''}${t?.teamRating?`<span class="team-rating ${t.teamRating.rating>=8?'great':t.teamRating.rating>=7?'good':''}">★ ${t.teamRating.rating}/10 · ${t.teamRating.reviews} ${t.teamRating.reviews===1?'review':'reviews'}</span>`:''}</${tag}>`}).join('');$('#app').innerHTML=`<section class="day active"><h2 class="day-head">${esc(d.name)} · ${new Date(d.date+'T12:00:00').toLocaleDateString('en',{month:'long',day:'numeric',year:'numeric'})} <small style="color:var(--muted);font-weight:400">— ${slots.length} items</small></h2><div class="scroller"><div class="board"><div class="rooms">${rooms.map(r=>`<div class="room">${esc(r)}</div>`).join('')}</div><div class="timegrid" style="height:${height}px;width:calc(${rooms.length} * var(--lane))">${rooms.map((r,i)=>`<div class="lane" style="left:calc(${i} * var(--lane));height:${height}px"></div>`).join('')}${ticks}${events}</div></div></div></section>`;document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{active=+b.dataset.i;render()});document.querySelectorAll('.seen-toggle').forEach(b=>b.onclick=e=>{e.preventDefault();e.stopPropagation();toggleSeen(b.dataset.id,b)});document.querySelectorAll('.event[data-talk-id]').forEach(el=>el.onclick=()=>{let s=slots.find(x=>String(x.talk?.id)===el.dataset.talkId);if(s)showTalk(s.talk,s)})}
$('#talkDialog .modal-close').onclick=()=>$('#talkDialog').close();$('#talkDialog').onclick=e=>{if(e.target===$('#talkDialog'))$('#talkDialog').close()};$('#search').oninput=render;$('#videoOnly').onclick=()=>{videos=!videos;$('#videoOnly').classList.toggle('active',videos);render()};render();
</script></body></html>
