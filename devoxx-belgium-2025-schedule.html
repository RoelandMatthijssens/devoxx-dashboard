<script>const DAYS=[{"name": "Monday", "date": "2025-10-06", "slots": [{"from": "2025-10-06T06:30:00Z", "to": "2025-10-06T07:30:00Z", "room": "Exhibition Hall", "kind": "Registration & Breakfast", "pause": true, "talk": null}, {"from": "2025-10-06T07:30:00Z", "to": "2025-10-06T10:30:00Z", "room": "Room 4", "kind": "Deep Dive", "pause": false, "talk": {"id": 26833, "title": "Compose and Dragons", "speakers": [{"fullName": "Guillaume Lours", "company": "Docker", "imageUrl": "https://lh3.googleusercontent.com/a-/AOh14Gi6k2N2uyqFn8HjBBUGPXeQwyLVwKVqMQ7T_Ie-=s96-c"}, {"fullName": "Philippe Charrière", "company": "Docker", "imageUrl": "https://lh3.googleusercontent.com/a/ACg8ocLQGEAI-WrKfK0GcZQeaE_1faVjy9IugtbGNdeBBXjMya3rZD0=s96-c"}], "track": {"name": "GenAI & Beyond"}, "audienceLevel": "BEGINNER", "youtubeUrl": "https://www.youtube.com/watch?v=EvF99CRz1Ds", "description": "What if we could create an entire role-playing game universe populated entirely by “intelligent” AI agents, each running in their own Docker container?<br>In this session, we’ll show you how to turn Docker Desktop into a full-fledged RPG simulation platform 🏰.<br>Using <strong>Docker Model Runner<\/strong>, <strong>Docker MCP Toolkit<\/strong>, <strong>MCP Gateway and Compose<\/strong>, we’ll deploy a full ecosystem where every character in the game becomes an autonomous AI agent:<br><ul><li><strong>NPCs (Non-Player Characters)<\/strong>: Every villager, merchant, or ally comes with their own personality and memory.<\/li><li><strong>Dungeon Monsters<\/strong>: Adversaries with adaptive behavior and tactical intelligence (well… not <em>this<\/em> time, they’ll just roll dice).<\/li><li><strong>Game Master (GM)<\/strong>: An agent with a global view of the game, managing movement (and thus the dungeon map), battles, HP, and game rules (all thanks to <strong>MCP<\/strong>).<\/li><\/ul>Through the <strong>Model Context Protocol (MCP)<\/strong> and <strong>RAG (Retrieval-Augmented Generation)<\/strong> techniques, agents will share a collective memory, and <strong>A2A (Agent-to-Agent)<\/strong> protocol will enable character interactions.<br>We’ll show how <strong>Docker Compose<\/strong> orchestrates this swarm of agents, enabling simple and scalable deployment, e.g., spawn 5 young werewolves in the Whispering Hall.<br>A fun excuse to introduce attendees to:<br><ul><li>Multi-container architectures for AI agents using multiple LLMs<\/li><li>Integrating Docker Model Runner with MCP (and especially the MCP Toolkit)<\/li><li>Inter-agent communication patterns<\/li><li>Show how a MCP gateway manages interaction between agents<\/li><li>Managing persistence and shared memory with RAG<\/li><\/ul>", "totalFavourites": 174, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-06T07:30:00Z", "to": "2025-10-06T10:30:00Z", "room": "Room 5", "kind": "Deep Dive", "pause": false, "talk": {"id": 41951, "title": "The Three Amigos in Java", "speakers": [{"fullName": "Venkat Subramaniam", "company": null, "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-bf6e6f9f-f295-47a6-bae9-acbabd7e1eb9.jpg"}], "track": {"name": "Java"}, "audienceLevel": "BEGINNER", "youtubeUrl": "https://www.youtube.com/watch?v=00BoeRkumG8", "description": "The meticulous, yet fast-paced, evolution of Java has brought us three separate features, Records, Sealed classes/interfaces, and The Pattern Matching facility. What's truly exciting is not just the sheer power of each one of these, but how these three come together to bring out the capability to implement Data Oriented Programming. In this comprehensive presentation we will start by looking at each one of these features, then see how these interplay with each other, and make a case for Data Oriented Programming and if and when we should choose that over the traditional Object Oriented Programming.", "totalFavourites": 342, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-06T07:30:00Z", "to": "2025-10-06T10:30:00Z", "room": "Room 6", "kind": "Deep Dive", "pause": false, "talk": {"id": 12492, "title": "Unlocking AI Coding Assistants: Real-World Use Cases", "speakers": [{"fullName": "Gunter Rotsaert", "company": "ICT TriOpSys", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-b20ced02-e1b6-4a64-b126-fda554aed532.jpg"}], "track": {"name": "GenAI & Beyond"}, "audienceLevel": "BEGINNER", "youtubeUrl": "https://www.youtube.com/watch?v=LtAe8EB72OI", "description": "Have you struggled with AI coding assistants, finding their outputs inaccurate, non-compilable, or inconsistent with your coding standards? This was my experience too, until I discovered how to harness their true potential. By learning to interpret their responses, refine prompts, and recognize their limitations, I transformed AI coding assistants into invaluable tools for writing production-grade software.<br>In this talk, I will share real-world examples from my own projects, highlighting how AI coding assistants can significantly enhance your development workflow. Through practical tips and tricks, you will learn how to maximize the benefits of these tools, ensuring they become an integral part of your coding process. Then, take it a step further and uncover the capabilities of agentic coding.", "totalFavourites": 208, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-06T07:30:00Z", "to": "2025-10-06T10:30:00Z", "room": "Room 8", "kind": "Deep Dive", "pause": false, "talk": {"id": 4717, "title": "Java 21 to 25 - Better Language, Better APIs, Better Runtime", "speakers": [{"fullName": "Nicolai Parlog", "company": "Oracle", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-7513a9db-6f8e-41a9-827e-848cbd8e3b13.jpg"}], "track": {"name": "Java"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=lCprbhmX4II", "description": "Java 25 will be the next release with long-term support and a lot has happened since the last one:<br><br><ul><li>from unnamed patterns and flexible constructors to module imports<\/li><li>from the foreign-function and memory API to stream gatherers and the class-file API<\/li><li>from a simpler <em>main<\/em> to launching multi-source-file programs<\/li><li>from Markdown in JavaDoc to quantum-resistend encryption<\/li><li>from faster launch times to improved garbage collection<\/li><\/ul><br>There are plenty of features in the language, API, and runtime to discuss - whether new, improved, or finalized. So let's go over them!", "totalFavourites": 454, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-06T07:30:00Z", "to": "2025-10-06T10:30:00Z", "room": "Room 9", "kind": "Deep Dive", "pause": false, "talk": {"id": 3265, "title": "Bootiful Spring Boot: the Deep-Dive", "speakers": [{"fullName": "Josh Long", "company": "the Spring team", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-5c074f46-dfb5-4caf-872c-c8f7d216345a.jpg"}], "track": {"name": "Server Side Java"}, "audienceLevel": "BEGINNER", "youtubeUrl": "https://www.youtube.com/watch?v=nzDpu4qh0jA", "description": "Hi, Spring fans! Developers today are being asked to deliver more with less time and build ever more efficient services, and Spring is ready to help you meet the demands. In this workshop, we'll take a roving tour of all things Spring, looking at fundamentals of the Spring component model, look at Spring Boot, and then see how to apply Spring in the context of batch processing, security, data processing, modular architecture, miroservices, messaging, AI, and so much more.<br><br>Here's a rough outline whose contents we may, or may not, get to assuming enough time (a day or two):<br><br><h3>Development Desk Check<\/h3><ul><li>the Spring JavaFormat Plugin<ul><li>Python, <code>gofmt<\/code>, your favorite IDE<\/li><\/ul><\/li><li>the power of environment variables<\/li><li>IDEs<\/li><li>SDKMAN<ul><li><code>.sdkman<\/code><\/li><\/ul><\/li><li>direnv<ul><li><code>.envrc<\/code><\/li><\/ul><\/li><li>a good password manager for secrets<\/li><\/ul><h3><\/h3><h3>Beans<\/h3><ul><li>dependency injection from first principles<\/li><li>bean configuration<\/li><li>lifecycles <\/li><\/ul><h3>Data<\/h3><ul><li>JdbcClient, ORMs, etc.<\/li><\/ul><h3>Web Programming<\/h3><ul><li>clients: <code>RestTemplate<\/code>, <code>RestClient<\/code>, declarative interface clients<\/li><li>REST<\/li><li>GraphQL<\/li><li>gRPC<\/li><\/ul><h3>Architecting for Modularity<\/h3><ul><li>Privacy<\/li><li>Spring Modulith<\/li><li>Externalized messages<\/li><li>Testing<\/li><\/ul><h3>Microservices<\/h3><ul><li>centralized configuration<\/li><li>API gateways<\/li><li>service registration and discovery<\/li><\/ul><h3>Messaging and Integration<\/h3><ul><li>\"What do you mean by Event Driven?\"<\/li><li>Spring Integration<\/li><\/ul><h3>Security<\/h3><ul><li>adding form login to an application<\/li><li>authentication<\/li><li>authorization<\/li><li>passkeys<\/li><li>one time tokens<\/li><li>OAuth<ul><li>the Spring Authorizatinm Server<\/li><li>OAuth clients<\/li><li>OAuth resource servers<\/li><li>protecting messaging code<\/li><\/ul><\/li><\/ul><br><br>", "totalFavourites": 195, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-06T07:30:00Z", "to": "2025-10-06T10:30:00Z", "room": "BOF 1", "kind": "Hands-on Lab", "pause": false, "talk": {"id": 26837, "title": "Modernizing your Java codebase with AI", "speakers": [{"fullName": "Kevin Azijn", "company": "Amazon Web Services", "imageUrl": "https://lh3.googleusercontent.com/a-/AOh14GhjhbjLgr8SztEFS2XZ6gHrw4BbVPKR7inn3F6cROw=s96-c"}, {"fullName": "Adriaan de Jonge", "company": "AWS", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-73af641c-37a9-4b26-a24a-e9417e520158.jpg"}], "track": {"name": "GenAI & Beyond"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "", "description": "Join us for an intensive, practical workshop exploring Amazon & AWS's proven strategies for modernizing Java applications at scale. Drawing from real-world experience migrating thousands of Java applications, this session will demonstrate how organizations can successfully transition from JDK 8 to modern Java versions and also more advanced migrations and modernization challenges.<br><br>You will transform a Java 8 to Java 21 using step-by-step migration and full automated agent transformation and also optional hands-on lab for frameworks migration and paradigm shift creating MCP tools for existing codebases.<br><br><strong>Key Learning Outcomes:<\/strong><br><ul><li>Understand the business case for Java modernization, including concrete examples of 40% memory reduction and 90% improvement in cold start times<\/li><li>Prepare your codebase creating lacking documentation, dependency mapping and leadership reports using AI<\/li><li>Master different migration approaches, from simple runtime switches to frameworks migration and paradigm shifts like REST to MCP<\/li><li>Learn to leverage opensource and AI-powered tools for code transformation<\/li><li>Gain hands-on experience with practical modernization tools including OpenRewrite, Amazon Q CLI and AI transformation agents<\/li><\/ul><strong>Workshop Highlights:<\/strong><br><ul><li>Live demonstrations of legacy code analysis and transformation<\/li><li>Practical guidance on monolith refactoring and dependency management<\/li><li>Best practices for future-proofing Java applications<\/li><\/ul><br><em>\"Friends don't let friends to run JDK8!\"<\/em>", "totalFavourites": 80, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-06T07:30:00Z", "to": "2025-10-06T10:30:00Z", "room": "BOF 2", "kind": "Hands-on Lab", "pause": false, "talk": {"id": 25270, "title": "Building Private, Scalable AI Applications with Self-Hosted LLMs", "speakers": [{"fullName": "Timo Salm", "company": "Broadcom", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-ffe915c7-7810-4a67-986d-83f2b890a08c.jpg"}, {"fullName": "Sandra Ahlgrimm", "company": "Microsoft", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-69fdde05-58df-4547-95bc-6701e979fabd.jpg"}], "track": {"name": "Architecture"}, "audienceLevel": "BEGINNER", "youtubeUrl": "", "description": "Tools like ChatGPT, Claude, and Copilot are powerful, but relying on them means giving up control of your data to third-party providers.<br><br>For organizations bound by confidentiality or regulatory requirements, self-hosted models such as Llama, Mistral, Phi, and Qwen provide a secure alternative, running locally or on Kubernetes clusters. Often, the small language models naturally fit well into Domain-Driven Design architectures.<br><br>In this tutorial, you’ll learn how to:<br>- Build a sample AI application using Java and Spring AI<br>- Integrate the application with a self-hosted LLM<br>- Deploy and scale both the application and the LLM on Kubernetes<br>- Implement an asynchronous architecture using message queues<br>- Ensure production readiness with resource requests, autoscaling, and real-time metrics<br>- Dive deeper into AI capabilities, create an MCP Server and a Client consuming<br><br>While the example application uses Java, all concepts around LLM deployment and scaling are fully language-agnostic, making this workshop valuable for developers of all backgrounds.<br><br>Join us to build secure, scalable AI solutions that keep your data under control.", "totalFavourites": 137, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-06T10:30:00Z", "to": "2025-10-06T11:30:00Z", "room": "Exhibition Hall", "kind": "Lunch", "pause": true, "talk": null}, {"from": "2025-10-06T10:40:00Z", "to": "2025-10-06T11:20:00Z", "room": "Room 5", "kind": "Lunch Talk", "pause": false, "talk": {"id": 25293, "title": "How I Solved Production Issues with OpenTelemetry (And How You Can Too)", "speakers": [{"fullName": "Cees Bos", "company": "OpenValue", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-87d315e6-a148-4b2d-8118-f4c4b0b32aad.jpg"}], "track": {"name": "Development Practices"}, "audienceLevel": "BEGINNER", "youtubeUrl": "https://www.youtube.com/watch?v=T5SEnaUKABw", "description": "Ensuring the reliability of your Java applications is critical in today's fast-paced world. But how do you identify and fix production issues before they get worse? With cloud-native applications, it can be even more difficult because you can't log into the system to get some of the data you need. The answer lies in observability - and in particular, OpenTelemetry.<br><br>In this session, I'll show you how I used OpenTelemetry to solve several production problems. You'll learn how I uncovered critical issues that were invisible without the right telemetry data - and how you can do the same. OpenTelemetry provides the tools you need to understand what's happening in your application in real time, from tracking down hidden bugs to uncovering system bottlenecks. These solutions have significantly improved our applications' performance and reliability.<br><br>A key concept we will use is traces. Architecture diagrams often don't tell the whole story, especially in microservices landscapes. I'll show you how traces can help you build a service graph and save you hours in a crisis. A service graph gives you an overview and helps to find problems.<br><br>Whether you're new to observability or a seasoned professional, this session will give you practical insights and tools to improve your application's observability and change the way how you handle production issues. Solving problems is much easier with the right data at your fingertips.", "totalFavourites": 270, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-06T10:40:00Z", "to": "2025-10-06T11:20:00Z", "room": "Room 6", "kind": "Lunch Talk", "pause": false, "talk": {"id": 26284, "title": "Stop Scheduling Like It’s 1999 – Green Software Needs Better Timing", "speakers": [{"fullName": "Ted Vinke", "company": "First8 Conclusion", "imageUrl": "https://lh3.googleusercontent.com/a/ACg8ocKibl_CYYxRM6yjZqKPL8QS4a4Gahe9CPdRq7rz-0lUF9XQUfYDGg=s96-c"}], "track": {"name": "People & Culture"}, "audienceLevel": "BEGINNER", "youtubeUrl": "https://www.youtube.com/watch?v=na7yitK39kY", "description": "Software, like dinner, is often prepared at night—automated jobs ticking away silently while the team sleeps. But not all kilowatt-hours are created equal. Some are green and clean. Others… well, let’s just say your 2 a.m. batch job might be dirtier than you think.<br>In this talk, I’ll show how we turned that awkward insight into an actual Java library: <em>GreenScheduled<\/em>. With one Spring annotation, your jobs can now wait patiently for a greener moment to run—based on real-time carbon intensity data from the electricity grid.<br><br>You’ll get a glimpse into:<br><ul><li>Why timing matters for sustainability (yes, even in software)<\/li><li>How we calculate the “least dirty” execution window<\/li><li>What went wrong while building it (spoiler: time zones are evil)<\/li><li>And what’s coming next (hint: Quarkus wants in too)<\/li><\/ul><br>Expect real use cases, some mild shaming of legacy cron setups—and a hopeful look at how developers can make a difference, one job at a time.<br><br><h3>👥 <strong>Target Audience<\/strong><\/h3>Java developers, tech leads, DevOps engineers, and anyone who's ever written a cron job and never thought about what the power grid was doing at that moment.", "totalFavourites": 100, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-06T10:40:00Z", "to": "2025-10-06T11:20:00Z", "room": "Room 9", "kind": "Lunch Talk", "pause": false, "talk": {"id": 16260, "title": "Protect your AI applications with the help of the OWASP GenAI Security Project", "speakers": [{"fullName": "Nicolas Humblot", "company": "Siteflow", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-d1d2bc6e-75cf-4904-a43e-480ccee88f96.jpg"}], "track": {"name": "Security"}, "audienceLevel": "BEGINNER", "youtubeUrl": "https://www.youtube.com/watch?v=7Loz3HRRdzI", "description": "Excited about AI, you create your first application using an LLM. You would like to share your product with the world, but you wonder what you should look for to ensure it is secure before releasing it. The OWASP community has been producing documentation, tools, and technologies in the field of application security for more than two decades. Let's discover together how it can help us secure our AI apps!<br><br>In this talk, we will see the different initiatives launched by the OWASP GenAI Security Project and the populations they are targeting. We will then look at a typical agentic AI application architecture so we can have an overview of the different threats each component may face. To get some tools to be able to adjust to our own specific use cases, we will look at a list of questions we can ask ourselves to adapt our risk perception in different environments. To conclude, we will see how we can improve our applications to protect them.<br><br>When leaving this talk, you will be provided references to deepen your knowledge and invited to join a passionate community aiming to improve software security.", "totalFavourites": 101, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-06T11:30:00Z", "to": "2025-10-06T14:30:00Z", "room": "Room 4", "kind": "Deep Dive", "pause": false, "talk": {"id": 22120, "title": "TornadoVM Deep Dive: Empowering Java Developers with GPU Acceleration", "speakers": [{"fullName": "Michalis Papadimitriou", "company": "University of Manchester", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-12efd8ad-2284-4e62-95d6-fd64fd8a95a8.jpeg"}, {"fullName": "Thanos Stratikopoulos", "company": "The University of Manchester", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-5e223ddc-5b3d-47e1-8531-5e90ebf396c0.jpeg"}, {"fullName": "Christos Kotselidis", "company": "University of Mancheter/Pierer Innovation", "imageUrl": "https://avatars.githubusercontent.com/u/17125884?v=4"}, {"fullName": "Maria Xekalaki", "company": "The University of Manchester", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-c2b861bf-3535-44a5-9b08-1693e0b97617.jpg"}], "track": {"name": "Java"}, "audienceLevel": "BEGINNER", "youtubeUrl": "https://www.youtube.com/watch?v=WNQ5ylMs4Ok", "description": "<p>TornadoVM is an open-source technology that enables Java developers to tap into the power of GPUs and other hardware accelerators - without needing deep expertise in GPU programming. Designed for seamless integration, TornadoVM works with most major JDK distributions, including Amazon Corretto, GraalVM, OpenJDK, Red Hat Mandrel, Microsoft JDK, and Azul Zulu. Under the hood, it extends the Graal compiler with GPU code generation and introduces powerful runtime features, such as dynamic reconfiguration and multi-device execution.<br><p><br><p>This deep dive session will guide the audience through the TornadoVM ecosystem, showing how it complements and enhances the Java tooling landscape:<br><ol><li><strong>Crash Intro to GPU Programming<\/strong> - A quick overview of the GPU programming model and data parallelism.<\/li><li><strong>TornadoVM API Overview<\/strong> – Learn how to annotate and structure Java code to express parallelism and enable transparent offloading to accelerators.<\/li><li><strong>Tool Ecosystem<\/strong> – Discover the TornadoInsight IntelliJ plugin for profiling and debugging, and explore the TornadoVM Bytecode Visualizer to understand how Java code is transformed for heterogeneous targets.<\/li><li><strong>Live Demo: LLM Optimization<\/strong> – Integration with a separate Java project that will explain various optimizations applied at a large language model (LLM) pipeline, showcasing real-world GPU acceleration and performance insights. At this point we will see various attributes that can affect performance including data movements and code generation.<\/li><\/ol><br>", "totalFavourites": 78, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-06T11:30:00Z", "to": "2025-10-06T14:30:00Z", "room": "Room 5", "kind": "Deep Dive", "pause": false, "talk": {"id": 23159, "title": "Why Haven’t They Fixed This?", "speakers": [{"fullName": "Stuart Marks", "company": "Oracle", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-7c2d7f17-7947-4be2-8b42-8d0f17a541d1.jpg"}, {"fullName": "Maurice  Naftalin", "company": "Morningside Light Ltd", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-739686fa-b74a-47e6-a57b-06100a67d7c1.jpg"}], "track": {"name": "Java"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=dwcNiEEuV_Y", "description": "We’ve just celebrated Java’s 30th birthday. While relishing all the great features built up over three decades, you might have asked yourself about some of the not-so-great problems with the language and the platform. When you see these problems, including some that are a quarter of a century old, you’ve probably wondered: why couldn’t they have just fixed it? For example:<br><br><ul><li>Why does type inference sometimes fail in really obvious cases?<\/li><li>Why don’t we have iterators that can handle concurrent modification promptly and consistently?<\/li><li>Why does comparing two sets for equality sometimes produce such strange results?<\/li><li>If immutability is such a great idea, why doesn’t Java support it?<\/li><li>Modifying a set element often breaks the set. Why can't the collections framework handle this better?<\/li><\/ul><br>These look like they should be easy to fix! In this talk, we’ll see whether that’s true, we’ll argue over the different possible solutions, and we’ll see whether we can outthink the Java designers with a good solution, or a better one than they chose. You’ll come away from this talk with a deeper understanding of the problems of language and API design, and of how to use the solutions that Java provides. And ready, perhaps, to start supplying your own solutions!", "totalFavourites": 332, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-06T11:30:00Z", "to": "2025-10-06T14:30:00Z", "room": "Room 6", "kind": "Deep Dive", "pause": false, "talk": {"id": 7704, "title": "RoboCoders: Judgment Day – AI IDEs Face Off", "speakers": [{"fullName": "Viktor Gamov", "company": "Confluent", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-14c7e7e4-7c85-43d8-b222-5d81b5b34dfd.jpeg"}, {"fullName": "Baruch Sadogursky", "company": "TuxCare", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-69d1c432-22d7-43b0-8db6-9ad03ecabb11.png"}], "track": {"name": "GenAI & Beyond"}, "audienceLevel": "BEGINNER", "youtubeUrl": "https://www.youtube.com/watch?v=V_73mdDxplQ", "description": "Can AI-powered IDEs take software development to the next level? Unlike traditional code assistants that provide suggestions or guidance, AI-driven IDEs like Cursor and Windsurf promise to act as full-fledged agents capable of handling entire workflows. In this live showdown, we’re putting that promise to the test by challenging these tools to build a smart light bulb controller—something we’ve never developed before.<br><br>From setting up the project and implementing features to testing, debugging, and optimizing, the AI will take the reins. This isn’t about helping—it’s about doing. The audience will decide the winner based on how well the tools perform and, of course, whether the demo actually works.<br><br>Join us to see if AI IDEs can deliver on their bold promise of transforming development, or if they’re just another stepping stone on the path to something bigger.", "totalFavourites": 180, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-06T11:30:00Z", "to": "2025-10-06T14:30:00Z", "room": "Room 8", "kind": "Deep Dive", "pause": false, "talk": {"id": 41952, "title": "Extending Functional Pipeline with Gatherers", "speakers": [{"fullName": "Venkat Subramaniam", "company": null, "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-bf6e6f9f-f295-47a6-bae9-acbabd7e1eb9.jpg"}], "track": {"name": "Java"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=qgGIIpsF050", "description": "We've had the ability to extend the terminal operation of a functional pipeline from the day one, thanks to the Collectors interface and the collect method. However, until recently we had no way to extend the intermediate steps of the functional pipeline. Why would we want to do that anyways, one may wonder. Aren't the built-in functions that make up the pipeline sufficient, one may ask. In this deep dive we will first explore the need to extend the functional pipeline. Then we will discuss what the new gatherer method and the Gatherers interface bring along. We will discuss the different types of Gatherers, when to use the different options, and provide recommendations as to which flavor to choose.<br><br>", "totalFavourites": 397, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-06T11:30:00Z", "to": "2025-10-06T14:30:00Z", "room": "Room 9", "kind": "Deep Dive", "pause": false, "talk": {"id": 20677, "title": "Large Scale Distributed LLM Inference with LLM-D and Kubernetes", "speakers": [{"fullName": "Abdel Sghiouar", "company": "Google Cloud", "imageUrl": "https://lh3.googleusercontent.com/a/AEdFTp6g4oRfPAQoq5bJH9DFV4xWnkIek9N3i08DYxe4SQ=s96-c"}], "track": {"name": "Architecture"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=ZcpD1M0Wa8Q", "description": "Running Large Language Models (LLMs) locally for experimentation is easy but running them in large scale architectures is not. It requires businesses looking to intergate LLMs into their critical paths to deal with the high costs and scarcity of GPU/TPU accelerators present a significant challenge. Striking the balance between performance, availability, scalability, and cost-efficiency is a must.<br><br>While Kubernetes is a ubiquitous runtime for modern workloads, deploying LLM inference effectively demands a specialized approach. Enter <strong>LLM-D<\/strong> a Cloud Native Kubernetes based high-performance distributed LLM inference framework. It's architecture centers around a well-lit path for anyone looking to serve at scale, with the fastest time-to-value and competitive performance per dollar, for most models across a diverse and comprehensive set of hardware accelerators.<br><br>In this deep dive we will start with a gentle introduction to the topic of Inference on Kubernetes and slowly work our way to why LLM-D and what kind of challenges it solves. LLM-D is a set of components and an opinionated architecture. Building on top of existing projects like vLLM, Prometheus, the Kubernetes Gateway API. It's optimized KV-cache aware routing and disaggregated serving are designed to operationalize GenAI deployments. The project was designed by the creators of vLLM (Redhat, Google, Bytedance) and it's licensed under the Apache 2 License.", "totalFavourites": 67, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-06T11:30:00Z", "to": "2025-10-06T14:30:00Z", "room": "BOF 1", "kind": "Hands-on Lab", "pause": false, "talk": {"id": 3255, "title": "Build your AI assistant with Ollama, LLM and Spring", "speakers": [{"fullName": "Ivan St. Ivanov", "company": "VIDA Software LTD", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-975b6b31-67b8-454c-9a08-7887bf7d6dc9.jpg"}, {"fullName": "Valentin Vasilev", "company": "Vida Software LTD", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-1cbe59d6-84e6-4a1c-a463-accc27755da9.jpg"}], "track": {"name": "GenAI & Beyond"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "", "description": "AI models are evolving rapidly, and as developers, we need to adapt to this new era where AI can enhance our applications in ways we never imagined. With modern APIs, we can offload computations and decision-making to powerful language models, making our applications smarter, more responsive, and highly personalized. Imagine building a smarter smart home—where an AI decides which devices should turn on or off based on real-time scenarios. Or creating a health assistant that analyzes a user’s medication list, flags potential interactions, and even considers allergies and medical history. How about a nutrition tracker that not only logs meals but also offers real-time dietary advice based on the user's body metrics? The possibilities are endless. In this hands-on lab, you’ll build a REST API application that takes user data, generates dynamic AI-powered responses, and processes the results logically. We'll be running a local LLM using Ollama API and integrating it into a Spring application, creating a seamless AI-powered assistant. <br><br>⚠ Note: This will be a more advanced session, requiring some prior experience with backend development. Make sure to also bring a beefier laptop with 16 GB of RAM as minimum.", "totalFavourites": 124, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-06T11:30:00Z", "to": "2025-10-06T14:30:00Z", "room": "BOF 2", "kind": "Hands-on Lab", "pause": false, "talk": {"id": 12462, "title": "Hands-On: Building Agents with Spring AI, MCP, Java, and Amazon Bedrock", "speakers": [{"fullName": "Josh Long", "company": "the Spring team", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-5c074f46-dfb5-4caf-872c-c8f7d216345a.jpg"}, {"fullName": "James Ward", "company": "AWS", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-252a44f3-49db-43fa-8435-60a439b4bdb9.jpg"}, {"fullName": "Maximilian Schellhorn", "company": "AWS", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-5ef5213a-25d1-428a-97bc-61459042b5a0.jpeg"}, {"fullName": "Matthew Meckes", "company": "AWS", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-7f1e2e38-1ee6-49db-8e58-eceb98633f59.jpg"}], "track": {"name": "GenAI & Beyond"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "", "description": "In this hands-on workshop you will learn how to build & deploy production-ready AI Agents. You will use Spring AI, MCP, Java, and Amazon Bedrock and learn how to deal with production concerns like observability and security. We will start with basic prompting then expand with chat memory, RAG, and integration through MCP. In the end we will have a multi-agent system where agents interact with other agents to accomplish high-level tasks.", "totalFavourites": 171, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-06T12:00:00Z", "to": "2025-10-06T18:00:00Z", "room": "Exhibition Hall", "kind": "Exhibition Setup", "pause": true, "talk": null}, {"from": "2025-10-06T14:30:00Z", "to": "2025-10-06T14:50:00Z", "room": "Exhibition Hall", "kind": "Coffee Break", "pause": true, "talk": null}, {"from": "2025-10-06T14:50:00Z", "to": "2025-10-06T15:20:00Z", "room": "Room 4", "kind": "Tools-in-Action", "pause": false, "talk": {"id": 20679, "title": "Pod Right-sizing in the Second Decade of Kubernetes", "speakers": [{"fullName": "Abdel Sghiouar", "company": "Google Cloud", "imageUrl": "https://lh3.googleusercontent.com/a/AEdFTp6g4oRfPAQoq5bJH9DFV4xWnkIek9N3i08DYxe4SQ=s96-c"}], "track": {"name": "Development Practices"}, "audienceLevel": "BEGINNER", "youtubeUrl": "https://www.youtube.com/watch?v=60EoWj2gYdI", "description": "Historically, optimizing resource allocation for Kubernetes workloads was a painful trial-and-error process, forcing developers to choose between high startup costs or lengthy delays. This constant struggle to find the \"just right\" balance for pod resources diverted valuable time from feature development.<br><br>But with In-Place Pod Resize (IPPR) in Kubernetes, those days are over. IPPR streamlines resource management by allowing you to dynamically resize pods without a restart, opening the door to true right-sizing and vastly improved bin packing. This is especially important for Java developers who have to deal with startup time and optimized resource utilization inside the JVM<br><br>This talk will explore the benefits of IPPR, demonstrate how to leverage it for optimal resource allocation, and show its integration with Vertical Pod Autoscaler (VPA) to provide startup boosts for your applications.", "totalFavourites": 165, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-06T14:50:00Z", "to": "2025-10-06T15:20:00Z", "room": "Room 5", "kind": "Tools-in-Action", "pause": false, "talk": {"id": 3253, "title": "From Space to Code: Using NASA's Open Data APIs with Kepler", "speakers": [{"fullName": "Ko Turk", "company": "Codelab", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-06caa425-af89-4758-b8bd-c421d264a4d3.jpg"}], "track": {"name": "Mind the geek"}, "audienceLevel": "BEGINNER", "youtubeUrl": "https://www.youtube.com/watch?v=LmUsHagNp28", "description": "Do you know that NASA has a wealth of open APIs where you can access fascinating data from across our solar system and beyond?<br>In this talk we will discuss the:<br><ul><li>Astronomy Picture of the Day (APOD) - Get a glimpse into the beauty and mysteries of our universe through stunning space photography.<\/li><li>Mars Exploration - Can we live on the Red Planet? What are NASA’s plans for future missions?<\/li><li>Exoplanet Exploration - Is the possible life on other planets?<\/li><li>Earth Observation - Analyse the data of our own earth to make discoveries if we look into the climate, environmental health, and ecosystems.<\/li><\/ul><br>With these rich datasets, we'll demonstrate how to build applications that not only educate and inspire users, but also empower them to make more sustainable choices. We’re looking into measuring our own application with Kepler, not to be confused with the first satelite to discover exoplanets, but with the Kubernetes Efficient Power Level Exporter everyone can use. Kepler is a tool that is used to measure the power efficiency of applications running on Kubernetes.<br><br>Let’s unlock the power of Kepler together with NASA's open data to forge a path towards a more environmentally-friendly future.", "totalFavourites": 167, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-06T14:50:00Z", "to": "2025-10-06T15:20:00Z", "room": "Room 6", "kind": "Tools-in-Action", "pause": false, "talk": {"id": 20691, "title": "Hands-on: Backlog.md - Plan Tasks with AI", "speakers": [{"fullName": "Alex Gavrilescu", "company": "Funstage GmbH", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-d0170ec1-298a-453d-b656-cc7d3f0bed5a.jpg"}], "track": {"name": "Build Different"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=FIZbQbkgRG0", "description": "<strong>Overview<\/strong><br>Backlog.md is a CLI tool for managing project collaboration between humans and AI Agents in a git ecosystem - 100% offline tasks in your repo, optimized for AI Agents using Markdown files. Think Kanban but in your terminal. No MCP, no database, no hosting needed. Works on Mac, Windows and Linux!<br><br><strong>Description<\/strong><br>Backlog.md began as a way to tackle side projects with AI Agents like <strong>Claude‑Code<\/strong>, <strong>OpenAI Codex<\/strong>, and <strong>Google Jules<\/strong>. Today it’s a lightweight project‑management tool for solo devs and small teams.<br>Because each task is just a Markdown file in the repo, an agent can ingest the spec, understand full project context, and start implementing without any extra APIs or MCP servers required.<br>Key features:<br><ul><li><strong>Git‑native storage<\/strong> - tasks travel with your branches; merges keep boards in sync between local and remote branches.<\/li><li><code><strong>backlog board<\/strong><\/code> - a TUI that shows To Do • In Progress • Done, plus requirements and implementation plans.<\/li><li><code><strong>backlog browser<\/strong><\/code> - fires up a local web server so you can drag‑and‑drop cards in a slick offline UI; all changes are still plain Markdown.<\/li><\/ul>The talk targets developers and “vibe coders” who want the structure of Linear or Jira without the overhead—or the internet connection.<br><br><strong>Agenda<\/strong><br>1) Backlog.md Presentation<br>2) Vibe code <s>an app<\/s> app requirements -> Voice to PRD", "totalFavourites": 153, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-06T14:50:00Z", "to": "2025-10-06T15:20:00Z", "room": "Room 8", "kind": "Tools-in-Action", "pause": false, "talk": {"id": 19146, "title": "Practical API Testing with OpenAPI and Citrus Framework", "speakers": [{"fullName": "Timon Borter", "company": "PostFinance AG", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-a89b33ea-29bd-4e83-83f3-0b13d222be03.jpg"}], "track": {"name": "Development Practices"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=cvEd8PHXY3U", "description": "In this fast-paced tooling session, I'll show you how the Citrus Framework and Citrus Simulator can take your OpenAPI-based testing to the next level. Within the juicy 30-minute mark, I'll demonstrate how to generate Citrus actions from an OpenAPI specification. These actions can be used to test your system under test (SUT) in a black-box scenario. On the flip side, we'll use the same specification to create simulations of third-party systems - allowing you to isolate your SUT with confidence.<br><br>We'll cover how to:<br><ul><li>Generate test clients directly from your OpenAPI spec<\/li><li>Build simulations that return realistic, randomized data<\/li><li>Automatically validate schema conformity on both the client and simulation sides<\/li><\/ul><br>This setup not only improves test quality but also enhances collaboration between teams. Issues can be caught early in the specification phase, and by the time integration arrives, much of it has already been tested. It's also a promising first step toward contract testing with tools like Pact.<br><br>At PostFinance, one of Switzerland's leading banking companies, we use the Citrus Framework with OpenAPI testing every day to ensure seamless continuous integration across our services.", "totalFavourites": 264, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-06T14:50:00Z", "to": "2025-10-06T15:20:00Z", "room": "Room 9", "kind": "Tools-in-Action", "pause": false, "talk": {"id": 23160, "title": "Java Adventures - JTaccuino, Java 25 and AI", "speakers": [{"fullName": "Sven Reimers", "company": "Airbus ", "imageUrl": "https://lh3.googleusercontent.com/a-/AFdZucoNxDrZRM-rxLR5unTKC2gX_lJcPO2h_HRwBs4pJA=s96-c"}], "track": {"name": "Java"}, "audienceLevel": "BEGINNER", "youtubeUrl": "https://www.youtube.com/watch?v=HJIst2dXKEA", "description": "A demo packed session awaits you showing you the latest Java 25 features using JTacccuino notebooks.<br><br>JTaccuino is a pure Java and JavaFX notebook solution, which allows for easy exploration in Java by leveraging JShell, dependency resolution, custom extensions and more. The aim is to reduce typical existing ceremony in API's for simpler and more scripting style interaction.<br><br>From new language features in Java 25 (JEP 502, 507, 508) to more infrastructure related innovations (JEP 520) and enhancements in former Java versions - buckle up for a roller coaster ride through the Java world of innovation.<br><br>As a companion on this ride JTaccuino will support you with interactive experimenting and AI augmented Java feature discovery - using local and open LLM's by leveraging LangChain4j and Ollama.", "totalFavourites": 72, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-06T14:50:00Z", "to": "2025-10-06T16:50:00Z", "room": "BOF 1", "kind": "Hands-on Lab", "pause": false, "talk": {"id": 8902, "title": "Building secure AI agents with Quarkus LangChain4j", "speakers": [{"fullName": "Willem Jan Glerum", "company": "Lunatech", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-1410d99c-df14-4331-ac61-79c4cff650ef.jpg"}, {"fullName": "Radek Kargul", "company": "Lunatech", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-95717222-0896-47a2-9ea1-64a15e47b0db.jpg"}], "track": {"name": "Security"}, "audienceLevel": "BEGINNER", "youtubeUrl": "", "description": "In this hands-on workshop, participants will learn how to create and secure AI agents leveraging Quarkus LangChain4j. As AI agents are used more and more within enterprise applications, securing them has become a critical concern. You for example don't want your agent to drop your database, execute privileged actions or leak your sensitive customer data by accident.<br><br>Workshop participants will:<br>- Set up a Quarkus project with LangChain4j extension<br>- Build a basic AI agent that can interact with business applications<br>- Implement security measures to prevent prompt injection attacks<br>- Configure authentication and authorization for AI agent actions<br>- Structure the application for maintainability and security<br>- Add appropriate monitoring and audit logging<br><br>Each participant should bring their own laptop with JDK 21, Maven, Ollama and Podman Desktop installed. The workshop will include step-by-step instructions, code examples, and exercises to reinforce learning.<br><br>This workshop is suitable for developers new to AI and more experienced engineers who want to learn how to include and secure AI agents in their projects. Some basic knowledge of Java and Quarkus is helpful but not required.", "totalFavourites": 66, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-06T14:50:00Z", "to": "2025-10-06T16:50:00Z", "room": "BOF 2", "kind": "Hands-on Lab", "pause": false, "talk": {"id": 23163, "title": "Fast-Track JDK Tools for the Modern Software Developer", "speakers": [{"fullName": "Ana-Maria Mihalceanu", "company": "Oracle", "imageUrl": "https://lh3.googleusercontent.com/a-/AOh14Gj1OS6OpAzuwBKwoUuCi9gxvNPvdmVA7nbW8lg3mg=s96-c"}, {"fullName": "José Paumard", "company": "Oracle", "imageUrl": "https://lh3.googleusercontent.com/a-/AOh14GhsVIUuTR9Onoo-D8UMW5QId2Yw1V_EUvqdWdNQ0RQ=s96-c"}], "track": {"name": "Java"}, "audienceLevel": "BEGINNER", "youtubeUrl": "", "description": "As Java continues to evolve, the tools shipped with the JDK are enhanced to help your development activities. Join this hands-on lab to explore the latest features of the Java Launcher, working with javadoc, snippets, and Markdown documentation comments, as well as how to use the lightweight jwebserver for web development testing. You will also learn how to generate efficient custom runtime images with jlink and leverage JDK Flight Recorder for low-overhead performance monitoring. By the end of this interactive experience, you will gain practical knowledge on how to use these tools to improve your Java development workflow, optimize runtime environments, and inspect your application performance.", "totalFavourites": 140, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-06T15:20:00Z", "to": "2025-10-06T15:35:00Z", "room": "Exhibition Hall", "kind": "Break", "pause": true, "talk": null}, {"from": "2025-10-06T15:35:00Z", "to": "2025-10-06T16:05:00Z", "room": "Room 4", "kind": "Tools-in-Action", "pause": false, "talk": {"id": 25256, "title": "Spec-Driven Development with Kiro: Vibe-Coding with Guardrails", "speakers": [{"fullName": "Kevin Azijn", "company": "Amazon Web Services", "imageUrl": "https://lh3.googleusercontent.com/a-/AOh14GhjhbjLgr8SztEFS2XZ6gHrw4BbVPKR7inn3F6cROw=s96-c"}, {"fullName": "Adriaan de Jonge", "company": "AWS", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-73af641c-37a9-4b26-a24a-e9417e520158.jpg"}], "track": {"name": "Build Different"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=z4zAKNLmrIw", "description": "Kiro is a new AI-powered IDE that empowers developers to work in the way that best suits their preferences. While it supports the organic \"vibe-coding\" approach, Kiro also enables a more rigorous workflow. Developers can leverage Kiro to generate detailed specifications, which the IDE then uses to power its coding assistant functionality, within the guardrails defined by the specifications.<br>In this demo, you'll witness Kiro's agents transforming prompts into comprehensive specifications, followed by the automatic generation of corresponding working code, documentation, and tests. Kiro's Hooks feature further streamlines development tasks, from updating documentation to running tests, based on user-defined IDE events.<br>Discover how Kiro's flexible, AI-driven approach can simplify your workflows and keep you in control throughout the development lifecycle.<br>", "totalFavourites": 86, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-06T15:35:00Z", "to": "2025-10-06T16:05:00Z", "room": "Room 5", "kind": "Tools-in-Action", "pause": false, "talk": {"id": 12470, "title": "Spring Boot Testing in Practice: What Changes (and What Doesn’t) with GenAI integrations", "speakers": [{"fullName": "Andrei Shakirin", "company": "AWS (former Pivotal Labs Engineer)", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-8dd80733-5267-400f-a2bc-b9a796227c82.png"}], "track": {"name": "Development Practices"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=721WMRwnPuM", "description": "Testing is an essential part of modern software development—it ensures confidence, improves feedback loops, and supports better design. However, it can become increasingly complex, especially with the rise of generative AI integrations. Large Language Models (LLMs) introduce non-deterministic behavior, making quality assurance more challenging—particularly when models invoke external tools or access contextual memory.<br>This session offers a comprehensive overview of testing strategies at all levels in a Spring Boot application: from unit and slice tests to integration, system, and load testing. It also addresses the unique testing challenges posed by GenAI features such as Retrieval-Augmented Generation (RAG) and the Model Context Protocol (MCP).<br>Attendees will learn:<br><ul><li>How to write efficient slice tests in Spring Boot without restarting the entire application context<\/li><li>How to use Testcontainers to provide external services and databases during testing<\/li><li>What additional considerations arise when testing GenAI-enabled applications<\/li><li>How to test scalability, concurrency, and throughput constraints<\/li><li>How well-structured tests can drive better application design<\/li><li>How to test multi-threaded applications and manage race conditions effectively<\/li><\/ul>Based on real-world experience, this talk demonstrates how thoughtful, layered testing leads to more robust systems and faster development—whether you're building traditional microservices or GenAI-enhanced applications.", "totalFavourites": 144, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-06T15:35:00Z", "to": "2025-10-06T16:05:00Z", "room": "Room 6", "kind": "Tools-in-Action", "pause": false, "talk": {"id": 6232, "title": "Spring Debugger: Behind The Scenes of Spring Boot", "speakers": [{"fullName": "Marco Behler", "company": "JetBrains", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-3eac4f3a-113f-46a2-ba9d-6ec31b8823e7.jpg"}], "track": {"name": "Server Side Java"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=N_b72RO2tG4", "description": "Throughout history, the term “magic” has described things we don’t fully understand. But magic isn’t real - it’s just a gap in knowledge.<br><br>So, when someone says, \"Spring Boot is magic\", the IntelliJ IDEA team hears, \"We should make the IDE reveal what’s really happening behind the scenes\".<br><br>With the new Spring Debugger available in IntelliJ IDEA, you’ll get simple, clear & actionable insights into common Spring Boot questions such as:<br><br>* Where does a specific property value come from? Why does it hold an unexpected value?<br>* Is there an active transaction? Who started it, and when?<br>* What database is my application currently connected to? Can I get 1-click access to it?<br>* What bean implementations are being used and why?<br>* What objects are being cached by my @Cacheable method?<br>* And many more…<br><br>Join this talk to see how Spring Debugger helps you replace “magic” with understanding for your own Spring Boot applications — so you can diagnose and resolve issues faster than ever.", "totalFavourites": 209, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-06T15:35:00Z", "to": "2025-10-06T16:05:00Z", "room": "Room 8", "kind": "Tools-in-Action", "pause": false, "talk": {"id": 23194, "title": "30 minutes to understand MCP (Model Context Protocol)", "speakers": [{"fullName": "Sébastien Blanc", "company": "Port", "imageUrl": "https://lh3.googleusercontent.com/a-/AOh14GghdlsQf-LeH_np8EgyP0zMkqdtdA3aeHvPYsYOag=s96-c"}], "track": {"name": "GenAI & Beyond"}, "audienceLevel": "BEGINNER", "youtubeUrl": "https://www.youtube.com/watch?v=khRkbvTuPX4", "description": "2023 was the year of LLMs, 2024 was the year of RAG, 2025 will be the year of MCP ! From the official documentation you can read : “The Model Context Protocol (MCP) is an open protocol that enables seamless integration between LLM applications and external data sources and tools.” But does that really help you to understand what this means ? <br>Join me in this Tools-in-action to understand concretely what MCP is and you will see that the concepts behind it are not really new things but more a normalization of existing ones. You will learn how to consume from a MCP server but also how to write one, using the Quarkus implementation and its wonderful developer experience. <br><br>Expect a few slides and a lot of live coding ! By the end of the session you will have a complete understanding of this new buzzword of 2025 !", "totalFavourites": 326, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-06T15:35:00Z", "to": "2025-10-06T16:05:00Z", "room": "Room 9", "kind": "Tools-in-Action", "pause": false, "talk": {"id": 19122, "title": "Smart API sandboxes: why? what? how?", "speakers": [{"fullName": "Laurent Broudoux", "company": "Microcks", "imageUrl": "https://pbs.twimg.com/profile_images/893039638071320577/4YP9KXnZ_normal.jpg"}], "track": {"name": "Development Practices"}, "audienceLevel": "BEGINNER", "youtubeUrl": "https://www.youtube.com/watch?v=MrIyUJQjbeM", "description": "Traditional API sandboxes promise freedom for developers, testers, and partners to safely experiment with your APIs — but too often they fall short. They become outdated, are expensive to run and maintain, and fail to reflect real-world behavior.<br><br>In this session, you’ll learn how to build <em>smart<\/em>, cost-effective API sandboxes using Microcks — a CNCF project designed for mocking and testing API and event-driven architectures. We’ll explore what makes a “smart” sandbox different. Next, we’ll show you how Microcks uses your existing API specs and examples to generate realistic mocks and conformance tests - thanks to AI but not only ;-) <br><br>Through live demos and practical examples, we’ll demonstrate how to integrate these sandboxes with developers’ local environments, CI/CD pipelines, and Kubernetes clusters — and how to plug them into your observability stack for better insights. By the end, you’ll know how to deliver always up-to-date, lightweight, on-demand sandboxes that boost developer experience and reduce maintenance headaches<br><br><strong>Takeaways:<\/strong><br><ul><li>Understand the limitations of traditional API sandboxes and how to overcome them<\/li><li>Get practical steps to design, deploy, and scale smart sandboxes with Microcks<\/li><li>See how to integrate sandboxes into modern DevOps workflows<\/li><\/ul><br><strong>Audience:<\/strong><br>This talk is designed for <strong>API and Events developers, architects, and DevOps engineers <\/strong>- more broadly, anyone interested in improving API quality, speed and collaboration", "totalFavourites": 59, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-06T16:05:00Z", "to": "2025-10-06T16:20:00Z", "room": "Exhibition Hall", "kind": "Break", "pause": true, "talk": null}, {"from": "2025-10-06T16:20:00Z", "to": "2025-10-06T16:50:00Z", "room": "Room 5", "kind": "Tools-in-Action", "pause": false, "talk": {"id": 25254, "title": "Gemini CLI in Action", "speakers": [{"fullName": "Wietse Venema", "company": "Google", "imageUrl": "https://lh3.googleusercontent.com/a-/AOh14GhbRZTGa5AfR4sF8hWTueCojns-Au_mYSlkZV7i=s96-c"}], "track": {"name": "Development Practices"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=jBQ0WdiNbdA", "description": "This session takes a practical look at Gemini CLI, a command-line tool for querying and editing codebases of any size. It can use tools like your shell, filesystem, Google Search, and has the ability to fetch websites and connect to remote services. <br>The focus of this talk is on showing repeatable workflows that developers can apply to their day-to-day work. Expect a sequence of real-world, live demos (I mean what can possibly go wrong). It will <em>not<\/em> be a walkthrough of the documentation. I’ll cover the following themes: <br><br><ul><li><strong>Codebase Onboarding:<\/strong> How to use the tool to quickly understand the architecture of an unfamiliar project. <\/li><li><strong>Structured Feature Development:<\/strong> A walkthrough of the \"Explore, Plan, Code, Commit\" workflow with Gemini CLI. <\/li><li><strong>CI/CD Integration: <\/strong>How to use Gemini CLI's non-interactive mode in build scripts and pipelines.<\/li><li><strong>Automating Repetitive Tasks: <\/strong>Creating custom tools for reusable workflows. <\/li><li><strong>Interactive Data Exploration: <\/strong>A demonstration of generating and executing Python scripts to analyze data and produce visualizations. <\/li><li><strong>Extending Capabilities: <\/strong>Tools are what makes this tool valuable. I’ll show examples of connecting to external services.<\/li><\/ul><br>Attendees will see how providing clear, structured context and using iterative, verifiable steps can produce great results. My goal is for attendees to walk away with a clear understanding of how to apply Gemini CLI to their day-to-day software engineering tasks.", "totalFavourites": 133, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-06T16:20:00Z", "to": "2025-10-06T16:50:00Z", "room": "Room 6", "kind": "Tools-in-Action", "pause": false, "talk": {"id": 6208, "title": "Picocli: put some Java in your terminal 💻!", "speakers": [{"fullName": "Stéphane Philippart", "company": "OVHcloud", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-f96fcc9e-d201-4af1-9fcb-7199e39b1940.jpg"}], "track": {"name": "Java"}, "audienceLevel": "BEGINNER", "youtubeUrl": "https://www.youtube.com/watch?v=usTiNoSNdlw", "description": "Everyone uses CLIs (Command Line Interfaces), and they've been around since the dawn of time.<br>Often synonymous with productivity gains, their creation is sometimes obscure and can seem complex.<br><br>This was the case a few decades ago, but in recent years, languages and frameworks have made it possible to write them simply in your favorite language.<br>I propose to use a language which, at first glance, may not seem the most intuitive for creating a CLI: Java!<br><br>Thanks to Picocli and Quarkus, your CLI will have all the bells and whistles of a great CLI, yet be simple to develop!<br>And the icing on the cake: we'll create a \"real\" executable thanks to Graal VM.<br><br>Come and join me for a live coding session that will show you how to create a Java CLI with Picocli and Quarkus from scratch!", "totalFavourites": 91, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-06T16:20:00Z", "to": "2025-10-06T16:50:00Z", "room": "Room 8", "kind": "Tools-in-Action", "pause": false, "talk": {"id": 23164, "title": "Wirespec - API design, actually spec first, in your ecosystem", "speakers": [{"fullName": "Jerre van Veluw", "company": "Flock.", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-3fd9865c-6414-4470-8685-7acf0ec4de17.jpeg"}], "track": {"name": "Development Practices"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=wL5f2Gw08Y0", "description": "Do you see the potential of API specification first design, and agree that OpenAPI has some big drawbacks? We think so too, which is why we created Wirespec as a human readable API specification language. In this talk we will explore what Wirespec can do for you in the context of what OpenAPI already brings. Even if you already use OpenAPI. All from the comfort of your choice in ecosystem (Maven, Gradle, npm, native)!", "totalFavourites": 123, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-06T16:20:00Z", "to": "2025-10-06T16:50:00Z", "room": "Room 9", "kind": "Tools-in-Action", "pause": false, "talk": {"id": 14112, "title": "Securing Your CI/CD Pipelines: Best Practices and Strategies", "speakers": [{"fullName": "Adrien Pessu", "company": "GitHub", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-0e6b3709-06a6-48d9-8874-93721fd63130.jpg"}], "track": {"name": "Security"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=sw-G9F4RJV4", "description": "In a world where software supply chain attacks are increasingly common, securing your CI/CD pipelines has become a top priority. This presentation will focus on best practices and advanced strategies for securing your CI/CD pipelines using GitHub Actions as an example. We will explore common vulnerabilities, potential threats, and concrete solutions to mitigate them.", "totalFavourites": 192, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-06T16:50:00Z", "to": "2025-10-06T17:00:00Z", "room": "Exhibition Hall", "kind": "Break", "pause": true, "talk": null}, {"from": "2025-10-06T17:00:00Z", "to": "2025-10-06T18:00:00Z", "room": "BOF 1", "kind": "BOF", "pause": false, "talk": {"id": 20653, "title": "Teachers BOF", "speakers": [{"fullName": "Hanno Embregts", "company": "Info Support", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-415cb58c-75c1-422c-8d3e-411135394ca5.jpeg"}, {"fullName": "Pim Tegelaar", "company": "Picnic", "imageUrl": "https://lh3.googleusercontent.com/a/ACg8ocKpa2pHqoixqHCiH6tnzzm2GEkSztSmvNpMrUtQbPjEVOnpjZg=s96-c"}], "track": {"name": "People & Culture"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "", "description": "Are you involved in teaching Java (or software development in general) to your co-workers and/or the next generation? Then let’s share our experiences in order to learn from them! Hanno & Pim (both professional teachers) will host this BOF session to provide an opportunity to learn from both their experiences and those of the attendees. You don't have to be a super experienced teacher to gain something from this session. In fact, just bring your own teaching questions and Hanno & Pim will make sure everyone learns from them.<br><br>Possible topics:<br><ul><li>How to break the ice at the start of the course?<\/li><li>How to teach hybrid courses? (half of class remote, half in-person)<\/li><li>How to keep everyone equally involved?<\/li><li>How to deal with very different learning needs in the same class?<\/li><li>What is a good balance between theory and practice?<\/li><li>How important is it to keep everyone in your class happy?<\/li><li>…your own!<\/li><\/ul>", "totalFavourites": 27, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-06T17:00:00Z", "to": "2025-10-06T18:00:00Z", "room": "BOF 2", "kind": "BOF", "pause": false, "talk": {"id": 20686, "title": "DevOps: State of the Union (One Decade Later)", "speakers": [{"fullName": "Michael Hüttermann", "company": "huettermann.net", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-e1d5ebf1-def9-4da5-aa12-39dedde9c595.jpg"}], "track": {"name": "Development Practices"}, "audienceLevel": "BEGINNER", "youtubeUrl": "", "description": "This interactive session discusses what DevOps in 2025 really is. We explore why and how to leverage DevOps, and relate it to other concepts, e.g. SRE and digitalization. While the host offers both, 20 years of DevOps experience as well as an academic background in research on DevOps, everybody is called to actively participate in this session. The community can engage to bring up specific questions, and share good practices and pitfalls. Warning: The last time this BOF was delivered at Devoxx was 2017. Expect both: some shocking news and parallels!", "totalFavourites": 70, "slidesUrl": "", "teamRating": null}}]}, {"name": "Tuesday", "date": "2025-10-07", "slots": [{"from": "2025-10-07T06:30:00Z", "to": "2025-10-07T07:30:00Z", "room": "Exhibition Hall", "kind": "Breakfast", "pause": true, "talk": null}, {"from": "2025-10-07T07:30:00Z", "to": "2025-10-07T10:30:00Z", "room": "Room 4", "kind": "Deep Dive", "pause": false, "talk": {"id": 6211, "title": "From LLM orchestration to autonomous agents: Agentic AI patterns with LangChain4j", "speakers": [{"fullName": "Georgios Andrianakis", "company": "IBM", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-c2227ba4-1c50-44fc-8569-7a2636770dba.jpg"}, {"fullName": "Mario Fusco", "company": "IBM", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-5909dee1-b4ae-4597-8ba5-878d30a68aec.jpg"}, {"fullName": "Clement Escoffier", "company": "Red Hat", "imageUrl": "https://lh3.googleusercontent.com/a/ACg8ocJhc8P2VmQ2i-ph6hlXtxVsFaGwNRle1AYzIQOarwRrG3-xuTUQ=s96-c"}, {"fullName": "Stefano Maestri", "company": "IBM", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-6ea4e61a-c0de-4d57-8b66-be9b54ef9713.jpg"}], "track": {"name": "GenAI & Beyond"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=SrFXsjeGc6Q", "description": "The late few months have seen the rapid evolution of LLMs from passive completion engines, only good for generic chatbots, to components of a more complex, programmatically defined, workflow and finally into active and autonomous elements capable of reasoning, planning, and taking actions.<br><br>But moving from basic prompt engineering to truly autonomous systems requires a new class of design patterns and possibly a framework allowing to implement those patterns and put them at work in a convenient and effortless way.<br><br>In this deep dive, we will explore the architecture and implementation of agentic AI using LangChain4j, a Java-native framework for building LLM-powered applications. You’ll learn how to move beyond the plain usage of a standalone LLM to design intelligent, modular agents capable of dynamic decision-making, memory retention, tool usage, RAG, MCP and A2A integration and multi-step goal execution.<br><br>After having covered the core concepts of agentic AI, we will guide you in incrementally building and testing an agentic system from scratch using LangChain4j and Quarkus, backed by real-world examples and live coding. Whether you're exploring agentic AI for task automation, intelligent assistants, or decision-support systems, this session will give you the practical tools and architectural understanding to build robust and maintainable autonomous agents in Java.", "totalFavourites": 243, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-07T07:30:00Z", "to": "2025-10-07T10:30:00Z", "room": "Room 5", "kind": "Deep Dive", "pause": false, "talk": {"id": 26253, "title": "Spring Boot in the Cloud: Advanced Optimization Deep Dive", "speakers": [{"fullName": "Patrick Baumgartner", "company": "42talents", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-8eb3bc0c-544a-4cb0-b5c3-55c76fa32642.jpg"}], "track": {"name": "Java"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=cbs4BQ0BwmA", "description": "Spring Boot makes it easy to launch cloud-ready applications, but building truly lean and efficient cloud services requires going beyond the basics. In this three-hour deep dive, you’ll immerse yourself in advanced Spring Boot techniques to optimize your applications for the cloud.<br><br>We will examine in depth how to reduce memory usage, improve startup times, and streamline your Spring Boot apps for modern cloud environments. Topics include Spring AOT, classpath exclusions, lazy beans, actuator configuration, custom JVM options, and additional state-of-the-art tools.<br><br>This session combines short presentations, live coding, and practical hands-on exercises. You will experiment with advanced configurations, observe real-time results, and troubleshoot performance challenges alongside the instructor. Real-world scenarios and best practices will help you immediately apply these techniques to your own projects.<br><br>Whether you want to fine-tune your CI/CD pipeline or push Spring Boot to its limits in production, you will leave with actionable skills, a collection of code samples, and a deeper understanding of cloud-native application optimization. Get ready for an in-depth, practical exploration of building lean Spring Boot applications for the cloud.", "totalFavourites": 210, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-07T07:30:00Z", "to": "2025-10-07T10:30:00Z", "room": "Room 6", "kind": "Deep Dive", "pause": false, "talk": {"id": 24552, "title": "Build an MCP Server with Java", "speakers": [{"fullName": "Sergio  del Amo Caballero", "company": "Oracle", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-7f5d819a-023d-4f3e-b6e8-6660525777bb.jpg"}], "track": {"name": "GenAI & Beyond"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=Ne9CGoHwACY", "description": "This session shows how to build an MCP (Model Context Protocol) Server in Java.<br>We first discuss how to build an MCP Server with Java without any framework, and then compare what frameworks (Spring Boot, Micronaut, and Quarkus) offer.<br>We will implement an MCP Server with each framework. The MCP Server will expose custom tools that can be accessed by MCP clients.<br>You will learn how to test your implementation using the MCP Inspector tool and connect to your MCP server with Claude as a client.<br><h2><\/h2><h2>Target Audience<\/h2>Developers interested in creating an MCP (Model Context Protocol) Server in Java.", "totalFavourites": 194, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-07T07:30:00Z", "to": "2025-10-07T10:30:00Z", "room": "Room 8", "kind": "Deep Dive", "pause": false, "talk": {"id": 41955, "title": "Java Memory Leaks", "speakers": [{"fullName": "Victor Rentea", "company": "Freelance", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-8c32e503-fe48-4c4d-a536-0d484f580374.jpg"}], "track": {"name": "Java"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=-0vkHxlGlOU", "description": "Let's dive deep into memory leaks and memory inefficiency patterns in Java backend systems. You'll understand the Java Memory Model, discover JVM memory flags you #musthave in production, and learn to analyze a heapdump. Then we'll trace 10 common memory leak types, collected with ❤️ from 150+ companies over a decade of consultancy. You'll hear about ThreadLocal, inner classes, hidden links, cache/hash keys, thread and class loader leaks. After the talk you'll get access to all the heapdumps we study for self-study. And a bounty for any new leak you describe to me after the talk :)", "totalFavourites": 524, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-07T07:30:00Z", "to": "2025-10-07T10:30:00Z", "room": "Room 9", "kind": "Deep Dive", "pause": false, "talk": {"id": 26292, "title": "Going serverless with Quarkus, GraalVM native images and AWS Lambda", "speakers": [{"fullName": "Bert Jan Schrijver", "company": "OpenValue", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-2636b8a5-0209-4a75-9422-6e1c2662b04a.jpg"}], "track": {"name": "Server Side Java"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=Kv61d6A8xm8", "description": "Short version: In this talk, I'll show how I migrated the backend for the NLJUG conference app (used for J-Fall, J-Spring and more events) from Spring running on Linux virtual machines to Quarkus running as GraalVM native image on AWS lambda.<br><br>Long(er) version:<br><br>A conference app backend makes the ideal candidate for a serverless architecture: almost no traffic during the year, and peak traffic during conference days.<br><br>In this talk, I'll show how I migrated the backend for the NLJUG conference app (used to rate talks for conferences with 1500+ attendees) from a traditional approach with Java and Spring running on Linux VM's to a fully serverless architecture with Quarkus, GraalVM native images, AWS lambda, API gateway and DynamoDB.<br><br>I'll talk about (and demo) the Quarkus development experience, migrating code to Quarkus, creating native images and the caveats involved, testing, deploying to AWS with the SAM CLI, monitoring, costs and more.<br><br>After this talk, you'll know enough to get started with building and deploying Quarkus native images on AWS Lambda yourself!", "totalFavourites": 91, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-07T07:30:00Z", "to": "2025-10-07T10:30:00Z", "room": "BOF 1", "kind": "Hands-on Lab", "pause": false, "talk": {"id": 19124, "title": "From Scratch to Scalable: Building Smarter AI Agents with Frameworks", "speakers": [{"fullName": "Jettro Coenradie", "company": "Luminis", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-e226b01e-5e33-49a8-b035-f6872115c03c.jpeg"}, {"fullName": "Daniël Spee", "company": "Luminis", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-f853a0f5-78a9-48cc-ada0-06eb6b19b1f2.jpg"}], "track": {"name": "GenAI & Beyond"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "", "description": "<strong>Detailed Description<\/strong><br><br>It doesn’t take much to build a simple AI agent — with just basic programming skills, you can create one from scratch without using any frameworks. But moving from a working prototype to a production-ready agent introduces a whole new level of complexity.<br><br>In this hands-on workshop, you’ll start by building your own AI agent in Java. You’ll implement LLM integration, tool calling, and manage conversational history — all from the ground up. This gives you a deep understanding of how agents operate under the hood.<br><br>With that foundation, you’ll then transition to using an agent framework. You’ll learn how frameworks simplify the development process by handling complexity like multi-LLM support, observability, memory, and deployment. By the end, you’ll have transformed your home-grown agent into one that’s framework-ready and production-capable.<br><br><strong>Key Takeaways<\/strong>:<br><br><ul><li>Understand the core components of an AI agent by building one manually.<\/li><li>Learn how to integrate LLMs, tools, and memory in Java.<\/li><li>Gain experience with agent frameworks to support scalability and production use.<\/li><\/ul><br><strong>Target Audience<\/strong>:<br>Java developers who are curious about AI agents and want hands-on experience creating, understanding, and scaling them for real-world applications.<br><br><strong>Joining the workshop<\/strong><br>Follow the link to the repository to prepare for the workshop.", "totalFavourites": 50, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-07T07:30:00Z", "to": "2025-10-07T10:30:00Z", "room": "BOF 2", "kind": "Hands-on Lab", "pause": false, "talk": {"id": 23166, "title": "Developing an Asynchronous Application with Virtual Threads and Structured Concurrency", "speakers": [{"fullName": "Ana-Maria Mihalceanu", "company": "Oracle", "imageUrl": "https://lh3.googleusercontent.com/a-/AOh14Gj1OS6OpAzuwBKwoUuCi9gxvNPvdmVA7nbW8lg3mg=s96-c"}, {"fullName": "José Paumard", "company": "Oracle", "imageUrl": "https://lh3.googleusercontent.com/a-/AOh14GhsVIUuTR9Onoo-D8UMW5QId2Yw1V_EUvqdWdNQ0RQ=s96-c"}], "track": {"name": "Java"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "", "description": "One of the most exciting features delivered by JDK 21 are Virtual Threads, developed by the Loom project. They promise to enable the \"simple thread-per-request style to scale with near-optimal hardware utilization\". Before Virtual Threads, this could only be achieved with reactive programming, which provides excellent throughput, but with patterns that are difficult to write, read, debug, and profile. It offers outstanding performance, but at the expense of maintainability. This hands-on lab guides you through writing a virtual thread-based application that utilizes structured concurrency to parallelize requests and scoped values to pass sensitive information without relying on method parameters. You will see the patterns of code that the Loom project gives you to achieve the same throughput as a classical reactive application. You will then be able to compare the code patterns of both approaches to choose which one you prefer.", "totalFavourites": 239, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-07T10:30:00Z", "to": "2025-10-07T11:30:00Z", "room": "Exhibition Hall", "kind": "Lunch", "pause": true, "talk": null}, {"from": "2025-10-07T10:40:00Z", "to": "2025-10-07T11:20:00Z", "room": "Room 4", "kind": "Lunch Talk", "pause": false, "talk": {"id": 6212, "title": "The Invisible Monster: The Carbon Footprint of AI", "speakers": [{"fullName": "Olivier Bierlaire", "company": "Rebase.Green", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-4b3cfeda-ecef-4da1-9ee3-a07d30e26f4e.jpeg"}], "track": {"name": "GenAI & Beyond"}, "audienceLevel": "BEGINNER", "youtubeUrl": "https://www.youtube.com/watch?v=DagPSLimU04", "description": "What is silent, colossal, and terrifying? No, it's not the monster under your bed, it's much worse: the carbon emissions of AI! To confront this monster, we must first understand it: what is the impact of generative AI and LLMs?<br><br>We estimate that training GPT-3.5 generated CO2 emissions equivalent to 800 Paris-New York flights. But what about the queries? Should I avoid using it to limit my carbon footprint? If I use an AI assistant for coding, like GitHub Copilot or CodeWhisperer, does it emit a lot of CO2?<br><br>Moreover, everyone wants to create their own LLM or generative AI. What is the impact of training, fine-tuning, and using these models? Many companies are concerned about their carbon footprint, and the development as well as the use of AI have an impact that needs to be measured and reduced.<br><br>With good hosting practices, GreenOps, and available tools, we can shed light on this issue and help reduce our carbon footprint while benefiting from AI advancements. Finally, I will tell you a dark curtain story that might help us.<br><br>Let's discover how to confront this invisible monster together!", "totalFavourites": 112, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-07T10:40:00Z", "to": "2025-10-07T11:20:00Z", "room": "Room 5", "kind": "Lunch Talk", "pause": false, "talk": {"id": 7040, "title": "What the Duck?🦆 The Hidden Crisis in Tech", "speakers": [{"fullName": "Aicha Laafia", "company": "havana Group", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-969b7a01-abdb-47e4-be65-38ccb39c6ce0.jpg"}], "track": {"name": "People & Culture"}, "audienceLevel": "BEGINNER", "youtubeUrl": "https://www.youtube.com/watch?v=aemFEi5N8Ho", "description": "We smile in meetings 😊, ship features 🚀, post wins ✨.<br><br> But under the surface? Most of us are paddling like hell 🫠.<br><br>This talk unpacks the Duck Syndrome in tech 🧠. Calm on the outside, burnout underneath 🔥.<br>It’s not about code. It’s about the silence we keep, the pressure to look perfect, and why so many of us are barely holding it together.<br><br>If you’ve ever felt like you’re the only one struggling, you’re not.<br>Come for the honesty 🤍. Stay for the relief of not pretending.<br>", "totalFavourites": 155, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-07T10:40:00Z", "to": "2025-10-07T11:20:00Z", "room": "Room 6", "kind": "Lunch Talk", "pause": false, "talk": {"id": 6241, "title": "Your Survival Guide to AI in Software Development", "speakers": [{"fullName": "Rafik FERROUKH", "company": "Harvest Groupe", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-265e0883-ba94-4bfa-9c7d-e17eacccc33c.jpeg"}], "track": {"name": "GenAI & Beyond"}, "audienceLevel": "BEGINNER", "youtubeUrl": "https://www.youtube.com/watch?v=fDPJtzuWLFg", "description": "AI is flooding the developer toolbox. Chatbots, coding assistants, agents, local LLMs... it’s a mess.<br><br>This talk is your survival guide. <br>We’ll cut through the noise and get real: what do developers actually need? Reading code? Generating it? Automating tasks? Staying private? For each case, I’ll show the right kind of tools, with demos, hard truths, and guidance on prompt engineeri
