will see the patterns of code that the Loom project gives you to achieve the same throughput as a classical reactive application. You will then be able to compare the code patterns of both approaches to choose which one you prefer.", "totalFavourites": 107, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-08T15:30:00Z", "to": "2025-10-08T15:50:00Z", "room": "Exhibition Hall", "kind": "Break", "pause": true, "talk": null}, {"from": "2025-10-08T15:45:00Z", "to": "2025-10-08T16:45:00Z", "room": "BOF 1", "kind": "BOF", "pause": false, "talk": {"id": 14124, "title": "Modern Java Puzzlers", "speakers": [{"fullName": "Simon Ritter", "company": "Azul", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-e61ddaf7-5954-4220-a9f9-e27f365467cf.jpg"}], "track": {"name": "Java"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "", "description": "Since JDK 9, Java, as a language, has evolved faster than at any point in its 30-year history. For developers, this is great as it means we get more new features to make our code more concise, yet hopefully, easier to read and understand.<br><br>All new language features also bring their quirks and possibly unseen consequences.<br><br>In this interactive session, we’ll examine a range of recent language features and pose questions to the audience about how the code works and what it does.<br><br>We’ll cover many of the new language features from recent releases, including records, switch expressions, sealed classes, and pattern matching. We’ll even delve into JShell and statements before super.<br><br>The answers will most definitely not always be as you expect.", "totalFavourites": 163, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-08T15:50:00Z", "to": "2025-10-08T16:40:00Z", "room": "Room 3", "kind": "Conference", "pause": false, "talk": {"id": 7041, "title": "How we scaled Continuous Delivery across 1000s of Developers and 100s of applications", "speakers": [{"fullName": "Christopher Batey", "company": "Core Engineering Consulting Group ", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-9b933d03-8a32-4a73-9a08-9b03a23466eb.jpg"}], "track": {"name": "Development Practices"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=7ZmPgQ21pnY", "description": "Many organisations attempt to standardise their path to production. Most fall short. What starts as a push for consistency often results in brittle pipelines, increasing exceptions, and developers working around the platform rather than with it.<br><br>This talk shares a practical and proven approach that has enabled Continuous Delivery adoption at scale across thousands of developers and hundreds of services in environments with a wide range of technologies and constraints.<br><br>We will explore how treating the <strong>Path to Production as a Contract<\/strong> between developers, operations, security, and change creates alignment and accountability. We will also walk through five common <strong>anti-patterns<\/strong> that quietly undermine adoption, and how to avoid them before they become systemic.<br><br>On the technical side, we will cover:<br><ul><li>Why <strong>DIVAs<\/strong> (Deployable, Immutable, Versioned Artifacts) are foundational for Continuous Delivery<\/li><li>How the right <strong>delivery unit<\/strong> design reduces blast radius and improves autonomy<\/li><li>The difference between <strong>CI validation and promotion<\/strong>, and how separating them improves flow<\/li><li>How to match the <strong>testing strategy<\/strong> to delivery goals without adding delay<\/li><li>What <strong>application architecture<\/strong> needs to provide to support reliable and scalable delivery<\/li><\/ul><br>If you are building a platform for software delivery, this talk will offer patterns, pitfalls, and principles that work in practice.", "totalFavourites": 186, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-08T15:50:00Z", "to": "2025-10-08T16:40:00Z", "room": "Room 4", "kind": "Conference", "pause": false, "talk": {"id": 16252, "title": "Build your own keyboard from A to Z(erty)", "speakers": [{"fullName": "Bruce Bujon", "company": "Datadog", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-5e915f17-a3e1-4ac1-a94f-5fd81eb4d509.jpg"}], "track": {"name": "Mind the geek"}, "audienceLevel": "BEGINNER", "youtubeUrl": "https://www.youtube.com/watch?v=NLBXwosKU6U", "description": "Let’s get one thing out of the way: we won’t be talking about keycap aesthetics or the satisfying (or irritating) sounds mechanical keyboards can make. Instead, we’ll dive into electronics, ergonomics, and DIY.<br><br>Fifteen years ago, I started experiencing pain in my hands and wrists. That led me to explore keyboard ergonomics, first by switching to the bépo layout, then moving on to so-called ergonomic keyboards. But more recently, I decided to go a step further: to design and build a keyboard tailored precisely to my needs.<br><br>In this talk, we’ll walk through how to build a custom keyboard from scratch, from the USB connector all the way to your fingertips. We’ll cover HID class protocol, microcontrollers and firmware, key matrix wiring, layout and layer design, and even the fun stuff like LEDs, rotary encoders, or screens. There are no limits!<br><br>And what if I told you it costs barely a third of a commercial keyboard? Come discover one of the most rewarding DIY projects I’ve ever taken on!", "totalFavourites": 134, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-08T15:50:00Z", "to": "2025-10-08T16:40:00Z", "room": "Room 5", "kind": "Conference", "pause": false, "talk": {"id": 3260, "title": "Bootiful Spring Boot", "speakers": [{"fullName": "Josh Long", "company": "the Spring team", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-5c074f46-dfb5-4caf-872c-c8f7d216345a.jpg"}], "track": {"name": "Server Side Java"}, "audienceLevel": "BEGINNER", "youtubeUrl": "", "description": "Hi, Spring fans! There's never been a better time to be a JVM / Spring developer! It's 2025 and Spring Boot 4 and Spring Framework 7 are (almost) here! Spring brings the worlds of security, batch processing, NoSQL and SQL data access, enterprise application integration, web and microservices, gRPC, GraphQL, observability, AI, agentic systems, and so much more to your doorstep. In this talk we're going to look at some of the amazing opportunities that lay before the Spring Boot developer in 2025!<br><br>", "totalFavourites": 421, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-08T15:50:00Z", "to": "2025-10-08T16:40:00Z", "room": "Room 6", "kind": "Conference", "pause": false, "talk": {"id": 15464, "title": "Agentic GraphRAG: AI’s Logical Edge", "speakers": [{"fullName": "Stephen Chin", "company": "Neo4j", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-f0bac480-6382-49a7-a206-38ed339b34da.jpg"}], "track": {"name": "GenAI & Beyond"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=k7NrmGmNnig", "description": "AI models are getting tasked to do increasingly complex and industry specific tasks where different retrieval approaches provide distinct advantages in accuracy, explainability, and cost to execute. GraphRAG retrieval models have become a powerful tool to solve domain specific problems where answers require logical reasoning and correlation that can be aided by graph relationships and proximity algorithms. We will demonstrate how an agent architecture combining RAG and GraphRAG retrieval patterns can bridge the gap in data analysis, strategic planning, and retrieval to solve complex domain specific problems.", "totalFavourites": 119, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-08T15:50:00Z", "to": "2025-10-08T16:40:00Z", "room": "Room 7", "kind": "Conference", "pause": false, "talk": {"id": 26270, "title": "Yes, We Put AI Agents for Healthcare in Production. No, Don't Try This at Home", "speakers": [{"fullName": "Marie-Alice Blete", "company": "Komodo Health", "imageUrl": "https://lh3.googleusercontent.com/a/ALm5wu0uRJ1wn2_qN62PaG__BbpRnog2NucPvwnBwE8JzLU=s96-c"}], "track": {"name": "GenAI & Beyond"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=dQIpU-X4QvU", "description": "... or at least come to this talk before to learn more about our wins and our face-palms.<br><br>At Komodo Health, we provide the most complete and unbiased map of the US patient journey. In this talk, I'll explain how our approach to agentic systems allows us to deliver in-depth patient insights and answer complex analytical questions that were previously impossible.<br><br>You'll get a real look at what a production project actually looks like - not another Hello World tutorial. We'll walk through the product vision, technical implementation, and user feedback, and by the end of this talk you'll have a clear 360 view of what you need to build your own agentic system. What would you bet on being the hardest part: the hallucinations, the immature frameworks, or the constantly evolving tech?<br>Spoiler alert: it is none of those... maybe.<br><br>But honestly, what happens when you combine agentic AI with healthcare data? Magic!", "totalFavourites": 206, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-08T15:50:00Z", "to": "2025-10-08T16:40:00Z", "room": "Room 8", "kind": "Conference", "pause": false, "talk": {"id": 24571, "title": "Java Performance Update 2025: From JDK 21 to JDK 25", "speakers": [{"fullName": "Per Minborg", "company": "Oracle", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-0a47a774-c8f9-4a3c-941c-7dcc09f228b7.jpeg"}], "track": {"name": "Java"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=sQ3xn3F6Q5c", "description": "JDK 25 has just been released and is packed with performance improvements compared to JDK 21, allowing your unchanged application code to run even faster.<br><br>In this talk, we will take a closer look at 13 concrete performance improvements made between JDK 21 and JDK 25 involving both the standard Java libraries, the JIT compiler, and the garbage collectors. Among these improvements is the newly introduced \"Stable Value\" preview feature, which allows a field to share the benefits of both mutable and immutable fields simultaneously. We will learn how this new feature works, how much performance can be improved, and how your code can take advantage of it already today.<br><br>We will also explore some of the design considerations made, the importance of developer feedback, and how the JDK engineers evaluate performance in a world of conflicting optimization criteria and varying platform properties.", "totalFavourites": 414, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-08T15:50:00Z", "to": "2025-10-08T16:40:00Z", "room": "Room 9", "kind": "Conference", "pause": false, "talk": {"id": 14142, "title": "Writing GPU-Ready AI Models in Pure Java with Babylon", "speakers": [{"fullName": "Ana-Maria Mihalceanu", "company": "Oracle", "imageUrl": "https://lh3.googleusercontent.com/a-/AOh14Gj1OS6OpAzuwBKwoUuCi9gxvNPvdmVA7nbW8lg3mg=s96-c"}, {"fullName": "Lize Raes", "company": "Oracle", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-b0334cda-79ec-4532-80ed-7a01c1eb117b.png"}], "track": {"name": "Java"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=WkEbrin6jkk", "description": "Imagine building AI models like LLMs, image classifiers, or speech recognizers, directly in Java, and running them fast on your GPU.<br>Project Babylon introduces the experimental Code Reflection technology that lets you define machine learning logic in plain Java code, without needing Python or external model files. It then uses Foreign Function and Memory (FFM) API to connect your code to native runtimes like ONNX Runtime for fast inference, including GPU acceleration. Furthermore, the Heterogeneous Accelerator Toolkit (HAT) provides a developer-facing programming model for writing and composing compute kernels, which can be more broadly applied-allowing Java libraries to seamlessly harness GPU power for high-performance computing tasks.<br>In this session, we’ll introduce you to Babylon’s upcoming features, and how they bridge the worlds of Java and modern AI workloads. Whether you’re curious about new Java features or looking for practical ways to bring AI into your Java stack, join us for a first look at Babylon’s vision for Java and machine learning.", "totalFavourites": 148, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-08T15:50:00Z", "to": "2025-10-08T16:40:00Z", "room": "Room 10", "kind": "Conference", "pause": false, "talk": {"id": 14123, "title": "From AI-Infused to Agentic: Building an Enterprise Agentic Framework", "speakers": [{"fullName": "Georgios Andrianakis", "company": "IBM", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-c2227ba4-1c50-44fc-8569-7a2636770dba.jpg"}, {"fullName": "Mario Fusco", "company": "IBM", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-5909dee1-b4ae-4597-8ba5-878d30a68aec.jpg"}, {"fullName": "Clement Escoffier", "company": "Red Hat", "imageUrl": "https://lh3.googleusercontent.com/a/ACg8ocJhc8P2VmQ2i-ph6hlXtxVsFaGwNRle1AYzIQOarwRrG3-xuTUQ=s96-c"}], "track": {"name": "GenAI & Beyond"}, "audienceLevel": "BEGINNER", "youtubeUrl": "https://www.youtube.com/watch?v=mtWHfYTLeKE", "description": "Over the past year, the rise of <em>agentic<\/em> architectures has pushed the boundaries of how we design AI-infused applications. What began as simple wrappers around large language models has evolved into more autonomous, stateful, and interactive systems, agents capable of planning, invoking tools, and collaborating.<br><br>In this talk, we’ll share our journey from building traditional AI-enhanced services to designing a full-fledged agentic framework. Along the way, we faced new design challenges: How should we model local and long-term memory? How do we represent multi-turn exchanges while preserving context and state? What protocols are needed for interoperability, such as the Model Context Protocol (MCP) or Agent-to-Agent communication, and how do they fit together? What about observability, security, auditing, and developer experience?<br><br>We’ll walk through the core concepts and patterns we explored, including function calling, memory management, supervision, planning, and workflow orchestration. We’ll discuss the architectural trade-offs we encountered and the lessons we learned along the way. Whether you’re building your own agent framework or just curious about what makes agents different, this talk will offer practical insights from the trenches.", "totalFavourites": 179, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-08T16:30:00Z", "to": "2025-10-08T18:30:00Z", "room": "Exhibition Hall", "kind": "Meet and Greet (until 19h30)", "pause": true, "talk": null}, {"from": "2025-10-08T16:50:00Z", "to": "2025-10-08T17:50:00Z", "room": "BOF 1", "kind": "BOF", "pause": false, "talk": {"id": 8911, "title": "GraalVM Community BOF", "speakers": [{"fullName": "Thomas Wuerthinger", "company": "Oracle", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-31b7694d-df8b-454f-8189-5accad4c3e37.jpg"}, {"fullName": "Fabio Niephaus", "company": "Oracle Labs", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-a5b5aad8-fc1e-4d70-bae8-06dad3b01fa3.jpg"}, {"fullName": "Shaun Smith", "company": "Oracle Labs", "imageUrl": "https://lh3.googleusercontent.com/a-/AOh14Gg7tXYweTrurtD78ur4Bxpi26W_xZe6Gnb4ySk4PKw=s96-c"}, {"fullName": "Alina Yurenko", "company": "Oracle", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-7e0f9e8c-84b1-4373-8074-d88eca399811.jpg"}, {"fullName": "Tim Felgentreff", "company": "Oracle Labs", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-b8a7a255-c210-40ba-ab8a-78a6175734b0.jpg"}], "track": {"name": "Java"}, "audienceLevel": "ADVANCED", "youtubeUrl": "", "description": "GraalVM thrives thanks to its awesome users and early adopters who follow the improvements and give valuable feedback.<br><br>We will share details about major upcoming projects, such as Native Image Layers, Project Crema, Native Image developer experience, and Web Image (WebAssembly), as well as our work on GraalPy, GraalWasm, and other Graal Languages.<br><br>Bring your questions about future developments as well as suggestions for future directions of the project to this BOF and discuss with core members of the GraalVM team!", "totalFavourites": 56, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-08T16:50:00Z", "to": "2025-10-08T17:50:00Z", "room": "BOF 2", "kind": "BOF", "pause": false, "talk": {"id": 22116, "title": "Quarkus Community BOF", "speakers": [{"fullName": "Georgios Andrianakis", "company": "IBM", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-c2227ba4-1c50-44fc-8569-7a2636770dba.jpg"}, {"fullName": "Dimitris Andreadis", "company": "Red Hat", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-aa62a276-fe45-44bb-b279-b48eb1550190.jpeg"}, {"fullName": "Clement Escoffier", "company": "Red Hat", "imageUrl": "https://lh3.googleusercontent.com/a/ACg8ocJhc8P2VmQ2i-ph6hlXtxVsFaGwNRle1AYzIQOarwRrG3-xuTUQ=s96-c"}, {"fullName": "Guillaume Smet", "company": "IBM", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-5943ab1b-64b8-4d60-ae78-6005c32ffe3d.jpg"}], "track": {"name": "Server Side Java"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "", "description": "Quarkus keeps growing and evolving while maintaining its focus on an efficient runtime and developer productivity. It offers a vibrant and ever-expanding ecosystem of 700+ publicly available extensions (the Quarkus universe or Quarkiverse), and is maintained by a community of 1000+ contributors. It is also now part of the CommonHaus Foundation, bolstering our commitment to open-source development and inspiring greater community participation.<br><br>Members of the Quarkus core team and extensions contributors will be present at Devoxx, and will be happy to discuss anything around the Quarkus ecosystem.<br><br>Bring your questions, share your challenges, and contribute your ideas to shape the future of Quarkus. Discover how you can become an active part of this vibrant community and take advantage of this unique opportunity to Ask Us Anything. Don’t miss out on being part of the conversation that’s setting the direction for Java’s next big leap, including all the work the Quarkus team has been doing around Agentic AI.<br><br>See you there!", "totalFavourites": 58, "slidesUrl": "", "teamRating": null}}]}, {"name": "Thursday", "date": "2025-10-09", "slots": [{"from": "2025-10-09T06:30:00Z", "to": "2025-10-09T07:30:00Z", "room": "Exhibition Hall", "kind": "Breakfast", "pause": true, "talk": null}, {"from": "2025-10-09T07:30:00Z", "to": "2025-10-09T08:20:00Z", "room": "Room 3", "kind": "Conference", "pause": false, "talk": {"id": 47109, "title": "Unleashing Vector Search with Spring AI, LangChain4J, Hibernate Vector, and the Oracle Database 23ai", "speakers": [{"fullName": "Juarez Barbosa Junior", "company": "Oracle", "imageUrl": "https://devoxx.be/wp-content/uploads/2025/09/Barbosa.jpg"}], "track": {"name": "Server Side Java"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=hVd8iUnLp8A", "description": "This session introduces how to build GenAI applications with Java, leveraging Oracle AI Vector Search with Oracle Database 23ai, integrating Oracle-specific extensions such as Hibernate Vector, Spring AI, and LangChain4J to build powerful vector search capabilities into your Java applications.<br> <br>We'll introduce the VECTOR data type and demonstrate how to store, query, and retrieve vector embeddings in an easy yet efficient way. Attendees will learn how to implement similarity searches and leverage vector search for various AI-driven applications within the familiar Java frameworks.<br> <br>By the end of the session, participants will have a deep understanding of how to harness Oracle AI Vector Search, the Oracle Database 23ai, and several Java frameworks to create GenAI applications with Java.", "totalFavourites": 152, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-09T07:30:00Z", "to": "2025-10-09T08:20:00Z", "room": "Room 4", "kind": "Conference", "pause": false, "talk": {"id": 7035, "title": "Bootiful GraalVM", "speakers": [{"fullName": "Josh Long", "company": "the Spring team", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-5c074f46-dfb5-4caf-872c-c8f7d216345a.jpg"}, {"fullName": "Thomas Wuerthinger", "company": "Oracle", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-31b7694d-df8b-454f-8189-5accad4c3e37.jpg"}], "track": {"name": "Java"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=YlMinrvdkT4", "description": "It's that time of the year gain! Devoxx time! And we love being here. But you know which place we love even more? Production. And we don't know anything that makes it easier to survive and thrive in production than Spring and GraalVM!<br><br>In this session, join us - Oracle Vice President and GraalVM benevolent dictator for life Thomas Wuerthinger and his trusty sidekick, Spring Developer Advocate Josh Long - and we’ll look at some of the amazing ways that Spring and GraalVM are an insurmountable win for your JVM applications in 2025. Experience blazingly fast startup, better security, and lower footprint for greener and cheaper production deployments!", "totalFavourites": 312, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-09T07:30:00Z", "to": "2025-10-09T08:20:00Z", "room": "Room 5", "kind": "Conference", "pause": false, "talk": {"id": 22141, "title": "Java for AI", "speakers": [{"fullName": "Paul Sandoz", "company": "Oracle", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-a9d7514d-9cd5-4f47-9f24-476cfc30a4e1.jpg"}], "track": {"name": "Java"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=CjPPJFcUCl8", "description": "Many Java features, existing and future, can meet the demands of AI. Existing features include the Foreign Function and Memory API and the Vector API. Future features include those proposed by Project Valhalla and Project Babylon. This presentation will discuss these features and how they might be used by Java libraries and applications to build competitive AI solutions.", "totalFavourites": 279, "slidesUrl": "https://cr.openjdk.org/~psandoz/conferences/2025-Devoxx-Belgium/Devoxx-Belgium-25-Java-For-AI.pdf", "teamRating": null}}, {"from": "2025-10-09T07:30:00Z", "to": "2025-10-09T08:20:00Z", "room": "Room 6", "kind": "Conference", "pause": false, "talk": {"id": 15453, "title": "The Bold, the Broken, and the Burned: Hard won lessons in the 6 years of developing Quarkus", "speakers": [{"fullName": "Georgios Andrianakis", "company": "IBM", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-c2227ba4-1c50-44fc-8569-7a2636770dba.jpg"}, {"fullName": "Guillaume Smet", "company": "IBM", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-5943ab1b-64b8-4d60-ae78-6005c32ffe3d.jpg"}], "track": {"name": "Architecture"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=IYkm5sUie3s", "description": "As software engineers, we are faced with lots of choices. Additionally, when developing libraries or frameworks that are used by lots of other software engineers to build their products, then even small decisions can have unforeseeable and unintended consequences down the line.<br>From timeless classics like the importance of naming in software and the proper reuse of existing components, to the unknowns of build time optimization and all the way to bold decisions like rewriting the entire I/O layer and everything in between, this session will give you valuable insights into how and why important decisions were made when developing Quarkus, with the hope of helping you avoid our mistakes and leverage what we got right.<br>Although the story focuses on decisions made in the context of Quarkus, no actual knowledge of Quarkus itself is necessary to follow along this talk.", "totalFavourites": 197, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-09T07:30:00Z", "to": "2025-10-09T08:20:00Z", "room": "Room 7", "kind": "Conference", "pause": false, "talk": {"id": 16253, "title": "A Developer's Search for Meaning: Thriving as AI Transforms Our World", "speakers": [{"fullName": "Markus Westergren", "company": "Umecon AB", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-2831a380-fd6c-402c-bf6d-a823febdd561.jpeg"}, {"fullName": "Elma Westergren", "company": "", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-4c31bcf6-7ee8-447b-87aa-95cad09a83ba.jpeg"}], "track": {"name": "People & Culture"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=Jo5mOBRr2b4", "description": "This presentation explores how Java developers and IT professionals are reconstructing their occupational identity as AI agents transform our field.<br><br>As AI agents increasingly handle tasks we once considered core to our professional identity, many experienced developers face an existential question: \"What makes me valuable as a programmer if AI can code?\"<br><br>Using occupational science concepts as well as drawing inspiration from Viktor Frankl's seminal work, we'll examine three critical phases developers experience: identity construction (actively rebuilding professional self-concept), identity discrepancy (the gap between past and present roles), and identity disruption (acute crisis of professional worth). Through real developer stories and research insights, we'll reveal how those thriving in this transition find meaning not in circumstances, but in their chosen response to change.<br><br>This unique collaboration between a software architect and occupational therapist offers both technical depth and humanistic insight. We'll provide practical strategies for evolving from \"code writer\" to \"AI shepherd,\" transforming existential anxiety into purposeful occupation.", "totalFavourites": 309, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-09T07:30:00Z", "to": "2025-10-09T08:20:00Z", "room": "Room 8", "kind": "Conference", "pause": false, "talk": {"id": 24593, "title": "Accelerating Maven Builds: From Snail's Pace 🐌 to Rocket Speed 🚀", "speakers": [{"fullName": "Maarten Mulders", "company": "Info Support", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-511fa63f-2dc6-4547-ace6-1daf1a86f79e.jpg"}], "track": {"name": "Development Practices"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=sCkJURhQZUM", "description": "Are you tired of watching Maven builds crawl at a snail's pace, wasting precious development time? Spending too much time at the coffee machine, or fighting battles with wooden swords under the excuse \"my code is compiling\"?<br><br>Join me to learn how to supercharge your Maven build! We’ll cover three main steps to start speeding up your project build. Learn how each speeds up your build, when they provide the biggest gains, and what pitfalls await.<br><br>Take the next step in boosting your developer productivity by learning practical tips to decrease context switching and increase development speed and feedback cycle. Your journey from snail's pace to rocket speed begins today!", "totalFavourites": 516, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-09T07:30:00Z", "to": "2025-10-09T08:20:00Z", "room": "Room 9", "kind": "Conference", "pause": false, "talk": {"id": 20700, "title": "Backlog.md - Reaching 95 % Task success rate with AI Agents", "speakers": [{"fullName": "Alex Gavrilescu", "company": "Funstage GmbH", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-d0170ec1-298a-453d-b656-cc7d3f0bed5a.jpg"}], "track": {"name": "GenAI & Beyond"}, "audienceLevel": "BEGINNER", "youtubeUrl": "https://www.youtube.com/watch?v=LSoDQU_9MMA", "description": "<h3>Abstract<\/h3>I started by throwing Claude at my codebase and spent more time fixing its “help” than shipping features. Few months later I perfected the process and built Backlog.md. Now tasks are markdown files in my repo and Agents are using them effectively and I can finally build all the side projects that I have been accumulated as dormant domains.<br>This talk will take the audience from what would a complete beginner do with AI Coding assistants to a master level and achieve close to 100% success rate with their tasks.<br><br><strong>The deck will be refreshed with best practices right up until October 2025.<\/strong><br><br><strong>Outline (35 min)<\/strong><br><strong>Why the first attempts flopped<\/strong> – “naked” prompts and repo chaos (5 min)<br><ol><li><strong>50 % → 75 % → 95 %<\/strong> – adding just enough context files (15 min)<\/li><li><strong>Backlog.md CLI demo<\/strong> – turning a sentence into parallelizable tasks (5 min)<\/li><li><strong>Claude vs. Codex vs Jules: <\/strong>strengths, weaknesses, peace treaty (5 min)<\/li><li><strong>Phone‑only workflow & live merge<\/strong> (5 min)<\/li><\/ol><h3>Audience take‑aways<\/h3><ul><li>A drop‑in folder structure that makes LLM code contributions safe.<\/li><li>A repeatable loop to churn through features on autopilot.<\/li><li>A checklist to decide which agent should plan, implement, or review.<\/li><\/ul>(And yes, the checklist will grow as the tools do—see you in October.)", "totalFavourites": 400, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-09T07:30:00Z", "to": "2025-10-09T08:20:00Z", "room": "Room 10", "kind": "Conference", "pause": false, "talk": {"id": 22135, "title": "Discover the Agent Development Kit for Java for building AI agents", "speakers": [{"fullName": "Guillaume Laforge", "company": "Google", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-22955cd1-9c41-4d6e-a7f2-b0f415794a7f.jpg"}], "track": {"name": "GenAI & Beyond"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=L6V6aQixOZU", "description": "Buzzword of 2025, AI agents are becoming mainstream. You don’t even need to use Python to create agents, you can develop them using Java! In this presentation, we’ll focus in particular on one framework: ADK, the Agent Development Kit released by Google.<br><br>AI Agents perceive, decide, and act to achieve goals using LLMs and tools. We’ll explore the various tools at our disposal, including built-in ones like Google Search or sandboxed code execution, as well as custom Java code, or MCP servers.<br><br>Multi-agent systems can be built by delegating tasks to more specialized sub-agents. We’ll see the various patterns at play to organize agents to work together, using sequential, parallel, or loop flows.<br><br>That’s not all, we’ll also look into how callbacks allow you to plug into the AI agent workflow, or how state can be shared and manipulated, and how events flow in our agentic systems or how they are persisted in memory.<br><br>At the end of this presentation, you’ll know everything about ADK for Java, and you’ll be able to build your first AI agents in no time!<br>", "totalFavourites": 257, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-09T07:30:00Z", "to": "2025-10-09T08:20:00Z", "room": "BOF 1", "kind": "Speaker Room", "pause": true, "talk": null}, {"from": "2025-10-09T07:30:00Z", "to": "2025-10-09T08:20:00Z", "room": "BOF 2", "kind": "Conference", "pause": false, "talk": {"id": 26808, "title": "Empowering Agentic AI with Industrial and Scientific JavaFX Desktop Applications via MCP", "speakers": [{"fullName": "Michael Hoffer", "company": "Hamilton Freiburg GmbH", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-3286db22-df7a-4972-baf7-768971296027.jpg"}], "track": {"name": "Java"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "", "description": "Most companies, research groups and development temas have established, high-quality desktop tools that are cut off from the benefits of Agentic AI. This talk will show how to integrate these existing JavaFX applications with AI using the Model Context Protocol (MCP), unlocking sophisticated new automation workflows.<br><br>We will explore applications that enable AI to:<br><br>- Interpret complex datasets through visualization and image processing tools.<br>- Test control strategies and learn from feedback in interactive simulation systems.<br>- Understand and optimize algorithms using specialized coding environments for cache optimization in simplified C code.<br>- Visually communicate and perform tasks through augmented and specialized user interfaces with advanced AI/human collaboration features.<br><br>This session will demonstrate these integrations with real-world examples, address the challenges involved, and discuss local inference options like LM-Studio. You will leave with actionable insights on how to transform your existing desktop applications into powerful assets for agentic AI.<br><br>This talk is targeted at developers and decision makers who want to understand how to leverage their existing applications, tools and domain knowledge to bringing AI into their workflows.", "totalFavourites": 26, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-09T08:20:00Z", "to": "2025-10-09T08:40:00Z", "room": "Exhibition Hall", "kind": "Break", "pause": true, "talk": null}, {"from": "2025-10-09T08:40:00Z", "to": "2025-10-09T09:30:00Z", "room": "Room 3", "kind": "Conference", "pause": false, "talk": {"id": 47102, "title": "Beyond local tools: Deep dive into the Model Context Protocol (MCP)", "speakers": [{"fullName": "James Ward", "company": "AWS", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-252a44f3-49db-43fa-8435-60a439b4bdb9.jpg"}, {"fullName": "Maximilian Schellhorn", "company": "AWS", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-5ef5213a-25d1-428a-97bc-61459042b5a0.jpeg"}], "track": {"name": "GenAI & Beyond"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=EgKsRsx1-HM", "description": "The Model Context Protocol (MCP) standardizes how AI applications connect to external data and tools. Moving beyond local experiments, this talk explores advanced MCP architectures: local vs. remote server deployments, hosting and scaling strategies for remote MCP servers, and MCP gateways for unifying access and proxying to existing systems.<br>We'll also examine authorization patterns and features such as resources, prompts, sampling, and elicitation. Attendees will gain practical insights into implementations, architectural trade-offs, and infrastructure considerations for building MCP-enabled AI systems.", "totalFavourites": 480, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-09T08:40:00Z", "to": "2025-10-09T09:30:00Z", "room": "Room 4", "kind": "Conference", "pause": false, "talk": {"id": 7023, "title": "GraalVM meets WebAssembly", "speakers": [{"fullName": "Fabio Niephaus", "company": "Oracle Labs", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-a5b5aad8-fc1e-4d70-bae8-06dad3b01fa3.jpg"}], "track": {"name": "Java"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=uefc2t9AmQI", "description": "WebAssembly (Wasm) has escaped the browser! It is on its way to becoming a standard for portable libraries and applications with near-native performance, but what does this mean for Java—both compiling to Wasm and running Wasm?<br><br>In this talk, we’ll introduce Web Image, a new preview feature of GraalVM that allows Java developers to compile applications into efficient Wasm modules. We explain how this works, outline possible use cases, and show live demos. We also discuss current limitations and provide an overview of what to expect next.<br><br>In part two of the talk, we focus on GraalWasm, a new embeddable WebAssembly runtime for Java. GraalWasm makes it possible to load Rust, C, C++, Go, and other languages compiled to Wasm and run them with native speed thanks to the optimizing Graal JIT compiler. To demo GraalWasm, we'll show an image processing library written in Rust, compiled to Wasm, and running within a Spring Boot microservice.<br><br>If you’re interested in the future of GraalVM and WebAssembly, this talk is for you!", "totalFavourites": 102, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-09T08:40:00Z", "to": "2025-10-09T09:30:00Z", "room": "Room 5", "kind": "Conference", "pause": false, "talk": {"id": 8903, "title": "How package encapsulation with Spring Modulith simplified our code", "speakers": [{"fullName": "Jos Roseboom", "company": "EasingYou", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-f4545fc7-4731-47f4-9a11-a145e83ae9b2.png"}], "track": {"name": "Architecture"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=05x0_1y9l_8", "description": "Have you ever felt there is too much relevant code for your current task to fit into your brain? Resulting in some StackOverflow in your head: a brain explosion.<br><br>Multiple factors contribute to this, one of them being the package structure of the code. In this talk I will explain why we wanted to refactor our package structure from horizontal (grouped by technical role like ‘controller’, ‘service’) to vertical (grouped by subject like ‘order’, ‘product’). I will show you how Spring Modulith can restrict access between packages and how you can gradually introduce it. On top of that, I will show some refactorings that we often used to break dependencies.<br><br>After this talk you will know why vertically slicing your packages might be a good idea and how you can use Spring Modulith to help you with that.", "totalFavourites": 473, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-09T08:40:00Z", "to": "2025-10-09T09:30:00Z", "room": "Room 6", "kind": "Conference", "pause": false, "talk": {"id": 4740, "title": "There may not be intelligent life in our Universe after all.", "speakers": [{"fullName": "Robert Pabst", "company": "Cinematic Laboratory", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-e939ec24-7e62-4447-b58c-125f1bb8a5e8.jpg"}], "track": {"name": "Build Different"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=2QkhBvgqR8c", "description": "I’ve been a programmer for over 40 years. Ran a business. Retired early. These days, I make music, but programming is still in my blood. However, I could not keep up with the Wiz Kids. Recently I wanted to build something new — a custom 'cinematic lab' audio visualizer — and decided to see what AI could do. What followed surprised me.<br><br>I documented the process of 'Hour One' until I had something worth sharing (that would be Day Four). One can't just start at the end and work your way back to Beginning. My audience is all web programmers, young, old, skilled and newbies.<br><br>I wanted a 3D ocean floor and got ugly SLOP. It changed to mediocre all by itself, and I had very limited control. With the information I have now, I should have stopped it in its tracks, to revert and retry. But I still suck at time travel. I thought AI would assist. Instead, it insisted. It rewrote things I didn’t ask for, deleted valuable features, broke working code, ignored instructions, and took detours I never authorized. It could actually ruin the app and report success. I spent more time correcting than creating. And yet, the result is something I never could’ve made alone.<br><br>I love the results, but It left me wondering: Did I make this? Or did the AI? There's no clear answer for this. This video is about that strange creative tug-of-war between decades of experience and a tool that’s autonomously rewriting the rules while 'understanding what you mean' and 'apologizing later'.<br>", "totalFavourites": 208, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-09T08:40:00Z", "to": "2025-10-09T09:30:00Z", "room": "Room 7", "kind": "Conference", "pause": false, "talk": {"id": 22122, "title": "The Wait is Over: Foreign Function & Memory (FFM) API brings modern Java to the Raspberry Pi", "speakers": [{"fullName": "Frank Delporte", "company": "Azul", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-99dab1f1-9a67-4dd6-9fb6-5056f94551cc.jpg"}], "track": {"name": "Mind the geek"}, "audienceLevel": "BEGINNER", "youtubeUrl": "https://www.youtube.com/watch?v=2BcWWWkb8ac", "description": "Since 2012, Pi4J has enabled Java to control electronic components connected to the Raspberry Pi's GPIO pins. However, both Java and the Raspberry Pi have evolved significantly since then. Supporting new hardware has been a challenge, requiring multiple implementations in the Pi4J library with complex code based on the Java Native Interface (JNI) and Java Native Access (JNA). <br><br>The Foreign Function & Memory (FFM) API, finalized in Java 22, promised to make such integrations with native code a lot easier. With Java reaching a new Long Term Support version, it’s time to bump the Pi4J project to Java 25 and make full use of FFM! <br><br>In this talk, you’ll learn how this FFM implementation is much easier to support and achieves high performance due to less memory copying and less interop code. It will also help improve the Pi4J project: fewer dependencies, a smaller JAR footprint, support for more protocols, and compatibility with more SoCs, among other benefits. <br><br>Through live demos, you will learn how to control LEDs, read buttons, interface with LCD displays, and gather sensor data using JBang single-file example applications. You'll see how FFM makes hardware interaction as natural as regular Java programming, and you will be ready to start your own experiments as soon as you arrive home. <br><br>Target audience: Java developers interested in IoT, embedded systems, and hardware programming. Basic Java knowledge is required, but no prior experience with Pi4J or electronics is needed. <br>", "totalFavourites": 143, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-09T08:40:00Z", "to": "2025-10-09T09:30:00Z", "room": "Room 8", "kind": "Conference", "pause": false, "talk": {"id": 6210, "title": "Agentic AI Patterns", "speakers": [{"fullName": "Mario Fusco", "company": "IBM", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-5909dee1-b4ae-4597-8ba5-878d30a68aec.jpg"}, {"fullName": "Kevin Dubois", "company": "IBM", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-2a25ea66-b643-4651-ba8a-a52a5afb4294.jpeg"}], "track": {"name": "GenAI & Beyond"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=X9baI7RBhqk", "description": "There is no universally agreed definition of what an AI agent is. In practice though, several patterns are emerging. These patterns demonstrate the coordination and integration of multiple AI services to build sophisticated Agentic AI systems capable of handling intricate tasks.<br><br>These Agentic Systems architectures can be grouped in 2 main categories: <strong>workflows<\/strong>, where LLMs and tools are orchestrated through predefined code paths, and <strong>agents<\/strong>, where LLMs dynamically direct their own processes and tool usage, maintaining control over how they execute tasks.<br><br>Testing these Agentic Systems architectures is a big challenge for the adoption in mission critical scenarios. This is mainly due to their not completely deterministic nature.<br><br>The goal of this talk is to give a theoretical overview of Agentic AI in general and these patterns in particular. We will discuss their differences and range of applicability and show with practical examples how they can be easily implemented and tested. We’ll use Quarkus and its LangChain4j extension, but the concepts are universal.<br>", "totalFavourites": 585, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-09T08:40:00Z", "to": "2025-10-09T09:30:00Z", "room": "Room 9", "kind": "Conference", "pause": false, "talk": {"id": 44652, "title": "Ask the architects", "speakers": [{"fullName": "Angelos Bimpoudis", "company": "Oracle", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-56210cf4-8334-4f63-90a2-5cb22e920575.png"}, {"fullName": "Paul Sandoz", "company": "Oracle", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-a9d7514d-9cd5-4f47-9f24-476cfc30a4e1.jpg"}, {"fullName": "Stuart Marks", "company": "Oracle", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-7c2d7f17-7947-4be2-8b42-8d0f17a541d1.jpg"}, {"fullName": "Per Minborg", "company": "Oracle", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-0a47a774-c8f9-4a3c-941c-7dcc09f228b7.jpeg"}, {"fullName": "Viktor Klang", "company": "Oracle", "imageUrl": "https://lh3.googleusercontent.com/a/AAcHTtdkY-Lks0gsRcvl05pqpW8-GOpvuVndojO99ZxUsSy0rgo=s96-c"}], "track": {"name": "Java"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=JeWMFlUzp94", "description": "Ask them anything related to the Java language with the Oracle engineers making it happen!", "totalFavourites": 253, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-09T08:40:00Z", "to": "2025-10-09T09:30:00Z", "room": "Room 10", "kind": "Conference", "pause": false, "talk": {"id": 41956, "title": "The Awareness Layer", "speakers": [{"fullName": "Robert  Ranson", "company": "Human Race: An Agentic Engineering Firm", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-b135854e-98ad-408f-a745-816a56225a90.jpg"}], "track": {"name": "People & Culture"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=cFAD9TEzB8w", "description": "AI Coding agents are reducing time to ship. Faster code opens a <strong>creativity gap<\/strong>: shipping is no longer scarce—<strong>deciding what to ship next<\/strong> is. <br><br>Now lag, backlog or latency debt shifts <strong>outside engineering<\/strong>. Marketing approvals, brand, legal, pricing, sales enablement and R&D become the real time constraints—<strong>iteration bottlenecks move across the organization<\/strong>. <br><br>This talk frames the <strong>Awareness Layer<\/strong> as the fix: outward-sensing scouts (CI/BI, people/network, sentiment & trends, policy/regulatory, procurement/arbitrage, CRM 3.0) convert live signals into ranked <strong>hypothesis queues<\/strong>; ingestion spines keeps data clean; <strong>experimental fabric<\/strong> run guardrailed trials (flags, canaries, instant rollback); and <strong>policy-as-code<\/strong> lets non-technical teams act at ship speed. <br><br>We’ll show what happens to the slowest step in the chain—and how to enclose more functions inside safe, measured loops. Expect clear patterns and artifacts you can put in production or carry into the board room.", "totalFavourites": 97, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-09T08:40:00Z", "to": "2025-10-09T09:30:00Z", "room": "BOF 1", "kind": "Speaker Room", "pause": true, "talk": null}, {"from": "2025-10-09T08:40:00Z", "to": "2025-10-09T09:30:00Z", "room": "BOF 2", "kind": "Conference", "pause": false, "talk": {"id": 6225, "title": "YOLO - moving straight to production", "speakers": [{"fullName": "Adam Michalik", "company": "Rabobank", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-dfadcd72-efc4-4aaf-8b57-66135ee4723b.jpg"}], "track": {"name": "Development Practices"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "", "description": "Guns blazing, bullets flying - a cowboy attitude is a sure-fire way to blow up your production. In the classic approach we use multiple test environments and separate QA engineers to keep the cowboys at bay. This however requires a complex setup of test data with high coupling between systems and teams, causes constant handovers and a long feedback cycle. The result is often a misguided feeling of confidence when going live.<br><br>Alternatively, you can choose the path of a ninja - one that better fits modern software development which relies on autonomous teams, devops skill set and decoupled microservice architecture. At Rabobank hundreds of squads apply various tools and techniques to successfully go straight to production multiple times a day. Based on this experience, I’ll demonstrate ways in which you can shorten your testing chain, reduce the delivery time, enhance the reliability of your system, and go live with confidence while still developing a high-quality product.", "totalFavourites": 183, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-09T09:30:00Z", "to": "2025-10-09T09:50:00Z", "room": "Exhibition Hall", "kind": "Break", "pause": true, "talk": null}, {"from": "2025-10-09T09:50:00Z", "to": "2025-10-09T10:40:00Z", "room": "Room 3", "kind": "Conference", "pause": false, "talk": {"id": 46057, "title": "Crypto Agility - Prepare for the unexpected!", "speakers": [{"fullName": "Kristof Verslype", "company": "Smals", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-a778abb2-410b-4b88-889e-7e170cfc70b7.jpg"}], "track": {"name": "Security"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=4uHmNzANdUw", "description": "Public key cryptography is essential in our society. We use it constantly, for instance to secure digital communication. Powerful quantum computers could break this in the long term and are already a risk today. Someone who intercepts secure communication today may indeed be able to decipher it in the future with a powerful quantum computer.<br>We need to replace our cryptography. History has taught us that such a migration path is cumbersome and can take many years. Multiple new migrations may be ahead of us, not only due to the threat of cryptographically relevant quantum computers.<br>Cryptographic agility promises to drastically smoothen such migrations. But what does it mean in practice? <br>This talks dives into the topic, inspired by concrete cases from the public sector.", "totalFavourites": 112, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-09T09:50:00Z", "to": "2025-10-09T10:40:00Z", "room": "Room 4", "kind": "Conference", "pause": false, "talk": {"id": 12493, "title": "The Diabolical Developer: Rise of the Rogue Agents", "speakers": [{"fullName": "Martijn Verburg", "company": "Microsoft", "imageUrl": "https://lh3.googleusercontent.com/a-/AOh14GjsKcIXAdvTXHyxMNxrIzNm0fgtH2wbkEKacpYONg=s96-c"}], "track": {"name": "GenAI & Beyond"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=VDzEhTB23zE", "description": "<h3><em>“First, we ignored AI. Then we enabled it in our IDEs, then we let it take over our IDEs, then we piped it into our CLI. Now it’s spawning autonomous agents in our pipelines, pair programming our bugs, and refusing to write unit tests. We have truly arrived.”<\/em><\/h3><br>In this latest instalment of the Diabolical Developer series, we go deep into the brave new world of agentic workflows. Armed with the latest Java 25, the wild-west of AI libraries, $$$ agentic hosting services, defacto protocols with no security built in, and LLMs that hallucinate with confidence, your diabolical protagonist returns – with a vengeance.<br><br>Key takeaways will be how to:<br><br><ul><li>Misuse Model Context Protocol (MCP) and Agent 2 Agent (A2A) to build agents that argue with each other.<\/li><li>Create agent swarms that autonomously refactor your codebase – into oblivion.<\/li><li>Be a Maniacal Manager of the swarms of agentic employees that never tire!<\/li><\/ul><br>This talk is part cautionary tale, and part wake-up call for those who still think agentic AI isn't a complete reshaping of your future world. If you want a brutally honest, technically grounded, and entertaining look at where the Java ecosystem meets the AI agent revolution today, then this is the talk for you.", "totalFavourites": 303, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-09T09:50:00Z", "to": "2025-10-09T10:40:00Z", "room": "Room 5", "kind": "Conference", "pause": false, "talk": {"id": 4750, "title": "Coding, Rewritten: What 10.000+ AI-Generated Code Completions Taught Me About the Future of Software Development", "speakers": [{"fullName": "Jeroen Egelmeers", "company": "Sogeti Netherlands", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-8d4441e7-6420-4407-84fb-58a5c18ea047.jpg"}], "track": {"name": "Build Different"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=KXwPJvdWFJQ", "description": "What if coding wasn't just about writing code anymore? After a year-long deep dive into over 30 AI coding tools — including ChatGPT, Claude, Google Gemini, DeepSeek, Grok, GitHub Copilot, Cursor, Windsurf, Lovable, V0, and many... more — I’ve learned how radically the developer experience is evolving.<br><br>As a former full-stack (Java) engineer turned Prompt Engineering Advocate, I stepped away from the keyboard and let AI agents take the lead. But I also coded together with AI. With more than 5,000 AI-generated code completions only on Windsurf, I’ve seen what works, what doesn’t, and what’s coming next.<br><br>In this talk, I’ll reveal what happens when AI agents don’t just complete your code — they challenge your logic, suggest UX improvements, plan, and autonomously refactor your functions. You’ll learn how responsibilities shift in agent-amplified workflows, how to manage memory and context windows, what Flush Coding is, what rule and planning files are, why our refactoring mindset makes it hard to adapt, and why not VibeCoding but AmpCoding might just be your next paradigm.<br><br>We’ll walk through real examples, transforming a screenshot into a working application and debugging with agents that <em>understand<\/em> your enterprise codebase. You’ll leave with practical insights, clear takeaways, and a vision of how to stay in control — even when you’re not the one coding. You will receive a report out with community-driven insights.<br><br>It’s still your name on the commit. Let’s make it count.", "totalFavourites": 553, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-09T09:50:00Z", "to": "2025-10-09T10:40:00Z", "room": "Room 6", "kind": "Conference", "pause": false, "talk": {"id": 7019, "title": "Supercharge your JVM performance with Project Leyden and Spring Boot", "speakers": [{"fullName": "Ana-Maria Mihalceanu", "company": "Oracle", "imageUrl": "https://lh3.googleusercontent.com/a-/AOh14Gj1OS6OpAzuwBKwoUuCi9gxvNPvdmVA7nbW8lg3mg=s96-c"}, {"fullName": "Moritz Halbritter", "company": "Spring Team @ Broadcom", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-c200bb79-80fa-4729-a2a3-3b4a0e583e72.jpg"}], "track": {"name": "Java"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=h16ngaxx0zo", "description": "Many modern applications and tools rely on Java. Yet, their startup time and time-to-peak performance remain challenging, especially for microservices and Kubernetes workloads that require fast scaling and responsiveness. Project Leyden, an ambitious OpenJDK initiative, aims to overcome these performance bottlenecks.<br><br>In this session, Ana and Moritz will show how you can take advantage of Leyden’s optimizations using Java 25 and Spring Boot. You will also get practical techniques you can apply today, along with a peek into the ongoing work inside Leyden and what that means for the performance of your Java application.", "totalFavourites": 316, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-09T09:50:00Z", "to": "2025-10-09T10:40:00Z", "room": "Room 7", "kind": "Conference", "pause": false, "talk": {"id": 6227, "title": "Passkeys, one-time tokens: passwordless Spring Security", "speakers": [{"fullName": "Daniel Garnier-Moiroux", "company": "Spring", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-aba4300d-289f-4c87-8dfa-6917abeac329.jpg"}], "track": {"name": "Security"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=AEuOdJu9K9A", "description": "Passwords. They're everywhere, they get leaked... A security nightmare! A work-around is to a delegate authentication to a third party, for example using OpenID Connect. But sometimes you can't or don't want to do that - can you go password-less, with user-friendly flows?<br><br>Since version 6.4, Spring Security now offers two options: one-time tokens and passkeys. One-time tokens allows for user login without any additional account setup, for example by generating magic links that can be shared via e-mail. Passkeys allow for seamless authentication, using your device's authentication mechanisms, such as Windows Hello, Apple's FaceID and their Android equivalents.<br><br>In this presentation, we will shortly go over the theory behind passkeys. Then we will show demo how to integrate one-time tokens and passkey support to an existing application, while discussing the specific challenges of those approaches.", "totalFavourites": 436, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-09T09:50:00Z", "to": "2025-10-09T10:40:00Z", "room": "Room 8", "kind": "Conference", "pause": false, "talk": {"id": 23195, "title": "Pattern Matching, Under the Microscope", "speakers": [{"fullName": "Angelos Bimpoudis", "company": "Oracle", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-56210cf4-8334-4f63-90a2-5cb22e920575.png"}], "track": {"name": "Java"}, "audienceLevel": "ADVANCED", "youtubeUrl": "https://www.youtube.com/watch?v=N-Mm9XQM_t0", "description": "Project Amber has introduced pattern matching into the Java language, improving both safety and expressiveness of our programs. With JEP 507 set to lift restrictions on primitive types in instanceof and switch, pattern matching is positioned as the foundation of safe cast conversions across all Java types. But what does this mean for the language, its safety guarantees, and how we test runtime conditions? This session takes an in-depth look at the fundamental concepts of <em>exhaustiveness<\/em>, <em>unconditionality<\/em>, <em>applicability<\/em>, <em>remainder<\/em>, and examine the distinction between <em>exact<\/em> and <em>inexact<\/em> conversions as introduced by JEP 507. With practical code comparisons and visual explanations, we will see how these patterns drive safer code and enable innovative language features on the horizon.", "totalFavourites": 395, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-09T09:50:00Z", "to": "2025-10-09T10:40:00Z", "room": "Room 9", "kind": "Conference", "pause": false, "talk": {"id": 7044, "title": "What Can You Do with an Apache Kafka \"Queue?\"", "speakers": [{"fullName": "Sandon Jacobs", "company": "Confluent", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-5595012b-c0dc-494b-8f19-b9f5a248807a.jpg"}], "track": {"name": "Architecture"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=Fsf-ModpE20", "description": "Introducing KIP-932, the long-awaited “Queues for Kafka” functionality. With typical consumer group coordination in Apache Kafka, each partition of a topic is assigned to a member of a consumer group. But this constrains parallel processing to the number of partitions of the target topic.<br><br>KIP-932 addresses those use cases where ordering is not the priority, and our events represent individual units of work. Also of note: it's not actually a \"queue\" at all, rather a different consumer group model. And yet every time I speak to developers about this functionality, I get the same questions: “When do I use it? Can you share a use case?” <br><br>So let’s take some time to identify and explore a couple of use cases. Our talk will start with how shared consumer groups work. Then we’ll walk through code samples of how and when we would use this consumption model. This is much more than just a JMS substitute or replacement. We'll discuss what queues “the Kafka way” gives us above and beyond transitional messaging systems.<br><br>When we wrap up, you’ll have a better idea of how and where to get started with queues the Kafka way.<br>", "totalFavourites": 284, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-09T09:50:00Z", "to": "2025-10-09T10:40:00Z", "room": "Room 10", "kind": "Conference", "pause": false, "talk": {"id": 14114, "title": "Unifying AI integration with Model Context Protocol", "speakers": [{"fullName": "Christian Tzolov", "company": "Broadcom", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-f95fd57e-acf9-4791-9a68-7096de8eb4f4.png"}, {"fullName": "Dariusz Jędrzejczyk", "company": "Spring Team @ Broadcom", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-c8d112b7-65fb-4baf-88b8-2faeb655bfe9.jpg"}], "track": {"name": "GenAI & Beyond"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=PJOthBhLbao", "description": "Modern AI applications require more than simple API calls - they need to interact meaningfully with real-world systems. <br>The Model Context Protocol (MCP) standardizes how AI models interact with external tools and resources through a structured client-server architecture, facilitating robust AI application development. <br>The AI community worldwide keeps sharing MCP servers that enable client interactions that open truly remarkable and innovative applications.<br><br>This talk explores MCP's core capabilities and demonstrates how the MCP Java SDK with Spring AI MCP integrates AI into your existing applications. You'll learn to build server features (tools, resources, prompts) and use client capabilities (sampling, elicitation). We'll cover local, SSE, and streamable-HTTP transports, plus common utilities for progress tracking and logging.<br><br>Today's intelligent AI applications can understand context, guide decisions, and integrate seamlessly with external services. Through live coding and practical examples, we will illustrate how to implement both client and server components. <br>By attending this session, you will gain a practical understanding of MCP's standardized interfaces and architectural best practices. MCP enables you to build and extend AI-powered applications with agent-like capabilities.<br><br>Whether you're developing new AI-driven solutions or enhancing existing systems, this talk will equip you with the tools and strategies needed to leverage MCP effectively.<br>", "totalFavourites": 159, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-09T09:50:00Z", "to": "2025-10-09T10:40:00Z", "room": "BOF 1", "kind": "Speaker Room", "pause": true, "talk": null}, {"from": "2025-10-09T09:50:00Z", "to": "2025-10-09T10:40:00Z", "room": "BOF 2", "kind": "Conference", "pause": false, "talk": {"id": 19116, "title": "Simplifying Cloud Native App Testing across Environments with Dapr and Microcks", "speakers": [{"fullName": "Laurent Broudoux", "company": "Microcks", "imageUrl": "https://pbs.twimg.com/profile_images/893039638071320577/4YP9KXnZ_normal.jpg"}, {"fullName": "Mauricio Salatino", "company": "Diagrid", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-b1ed545f-95e3-4af7-bbfa-f273d371b426.jpg"}], "track": {"name": "Development Practices"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "", "description": "Running cloud native applications locally is challenging — especially when your app depends on multiple APIs, databases, or cloud services. Starting a new Spring Boot application is exciting, but ensuring it behaves the same on your laptop, in CI, and on Kubernetes can quickly become frustrating and time-consuming.<br><br>In this talk, we’ll show how to simplify testing complex Spring applications across environments using tools like <strong>Dapr<\/strong> and <strong>Microcks<\/strong>. <br><br>We’ll cover how to:<br><ul><li>Use <strong>Testcontainers<\/strong> to run real dependencies locally in containers.<\/li><li>Mock and test API behaviors with <strong>Microcks<\/strong> to decouple teams and speed up integration testing.<\/li><li>Leverage <strong>Dapr<\/strong> to abstract and standardize service-to-service communication, so your app runs the same way on your machine as it does in production, without needing a full Kubernetes cluster locally.<\/li><\/ul><br>Through live demos, you’ll see how these tools work together to streamline local development, enable repeatable tests, and reduce environment drift.<br><br><strong>Takeaways:<\/strong><br><ul><li>Strategies to run cloud native apps locally without heavyweight clusters.<\/li><li>How Dapr helps you write portable, environment-agnostic services.<\/li><li>Using Microcks to easily mock and validate API contracts.<\/li><li>Practical patterns for Java developers building and testing microservices.<\/li><\/ul><br><strong>Audience:<\/strong><br> This talk is designed for <strong>Java developers, cloud architects, and DevOps engineers<\/strong> working with Spring Boot and Kubernetes who want to improve productivity and testing confidence while reducing infrastructure overhead.<br>", "totalFavourites": 41, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-09T10:40:00Z", "to": "2025-10-09T11:50:00Z", "room": "Exhibition Hall", "kind": "Lunch", "pause": true, "talk": null}, {"from": "2025-10-09T10:45:00Z", "to": "2025-10-09T11:35:00Z", "room": "BOF 1", "kind": "Conference", "pause": false, "talk": null}, {"from": "2025-10-09T10:55:00Z", "to": "2025-10-09T11:35:00Z", "room": "Room 3", "kind": "Lunch Talk", "pause": false, "talk": {"id": 46051, "title": "It (only) starts with a container", "speakers": [{"fullName": "Patrik Duditš", "company": "Payara", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-e65502da-edeb-43bf-bcb9-8acde46f23a6.jpg"}], "track": {"name": "Development Practices"}, "audienceLevel": "BEGINNER", "youtubeUrl": "https://www.youtube.com/watch?v=q0_KPLHOnCg", "description": "So you've got your application bundled up in the container, great! The fun is not over though, getting it to production is where more choices and complexity are waiting! Should I use Helm? ArgoCD? Terraform? Anything else?<br> <br>This talk explores the deployment abstraction spectrum from handcrafted YAML and Helm templates, over GitOps and Infrastructure as Code approaches up to developer portals. Each of those give different levels of control and development comfort and we'll compare those to give you a pros and cons and help you choose the right deployment approach for your needs.", "totalFavourites": 149, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-09T10:55:00Z", "to": "2025-10-09T11:35:00Z", "room": "Room 4", "kind": "Lunch Talk", "pause": false, "talk": {"id": 47106, "title": "When auto-scaling isn't fast enough: Handling high volume live event traffic", "speakers": [{"fullName": "Ivan Schwarz", "company": "DoubleVerify", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-30b4f2c6-be66-4c1e-9d6a-d00f5847d3aa.jpg"}], "track": {"name": "Development Practices"}, "audienceLevel": "BEGINNER", "youtubeUrl": "https://www.youtube.com/watch?v=TqeSofn5_HA", "description": "In recent years, viewership is rapidly moving from linear TV (traditional broadcasting) to digital mediums (connected TVs, phones, laptops..). Popular live events such as the Olympics are watched on internet-connected devices by millions of concurrent users, and the number is constantly growing. The content stream is occasionally interrupted by a commercial break. Without strict length or timing these breaks introduce a source of unpredictable, short, massive traffic spikes for the services involved in the advertisement delivery chain.<br><br>In this talk, I’ll show you how the live event traffic patterns look like, why they are dangerous, and what you as an engineer can do about it. Based on our first-hand experience, I will shed some light on the common pitfalls and then walk you through the thinking process and techniques we have employed to successfully operate a service at this scale.<br><br>This high level technical talk is suitable for every engineer interested in high-scale environments.", "totalFavourites": 171, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-09T10:55:00Z", "to": "2025-10-09T11:35:00Z", "room": "Room 5", "kind": "Lunch Talk", "pause": false, "talk": {"id": 14108, "title": "Legal JVM dopes for your apps", "speakers": [{"fullName": "Dmitry Chuyko", "company": "BellSoft", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-e336e659-3568-4bd5-8bbe-9c083335a21c.jpg"}], "track": {"name": "Java"}, "audienceLevel": "ADVANCED", "youtubeUrl": "https://www.youtube.com/watch?v=ylkzIScNSpA", "description": "One reasonable desire is to speed up existing deployments without affecting code and diagnostic tools. Too many resources are spent on profiling, optimizing, and updating applications. At the same time, we need to improve hardware utilization, and frameworks and runtimes are reaching the end of their lifespan.<br><br>There are several JDK pills that help further improve existing applications without immediate re-development. Examples are OpenJDK Leyden, CRaC and Lilliput projects; Graal JIT, client VM, native images, buildpacks, virtual threads and fused JDKs. Let's study what aspects can be improved with their help, how and under what circumstances it makes sense to use them. For each one there are measurable profits and trade-offs.<br><br>With free development resources and budget savings after doping, teams will be ready for more complex optimizations and migrations without tearing the flesh.", "totalFavourites": 182, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-09T10:55:00Z", "to": "2025-10-09T11:35:00Z", "room": "Room 6", "kind": "Lunch Talk", "pause": false, "talk": {"id": 26265, "title": "The New AI-Native Dev Coding Workflow", "speakers": [{"fullName": "Patrick Debois", "company": "AI Native Dev", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-14a95e13-4174-4121-b3eb-e6507b06d397.jpg"}], "track": {"name": "GenAI & Beyond"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=gzKdHe_ywW8", "description": "<em>From intent to review — rethinking the full development cycle with AI agents<\/em><br><br>We’ve moved beyond autocomplete. Today’s AI-native development isn’t about prompting harder — it’s about redesigning the entire workflow to work <em>with<\/em> agents, not just around them.<br><br>In this fast-paced session, we’ll show (lots !) of tools and ideas that support this new modern dev loop built for AI from the ground up:<br><ul><li>How to <strong>specify intent<\/strong> to align AI with your architectural goals<\/li><li>Breaking down changes into tasks using better planning for agents<\/li><li>Running agents <strong>asynchronously<\/strong> (and even in parallel) to unlock real productivity gains<\/li><li>Scale reviews and how test-based <strong>guardrails<\/strong> ensure code quality<\/li><li>Building a learning feedback loop through <strong>knowledge management<\/strong><\/li><\/ul><br>If your AI workflow still revolves around a single Copilot window, it’s time to upgrade your architecture — and your mindset.<br><br>Inspired by https://ainativedev.io/news/how-to-parallelize-ai-coding-agents", "totalFavourites": 210, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-09T10:55:00Z", "to": "2025-10-09T11:35:00Z", "room": "Room 7", "kind": "Lunch Talk", "pause": false, "talk": {"id": 24561, "title": "Delay the AI Overlords: How OAuth and OpenFGA Can Keep Your AI Agents from Going Rogue", "speakers": [{"fullName": "Deepu Sasidharan", "company": "Okta", "imageUrl": "https://lh3.googleusercontent.com/a-/AOh14GhZMlQ0PlzZ8UHAiCGcGKzBISUqlZ9LudeRqVwphuk=s96-c"}], "track": {"name": "GenAI & Beyond"}, "audienceLevel": "BEGINNER", "youtubeUrl": "https://www.youtube.com/watch?v=-V251N-pYYI", "description": "While we make every effort to delay our future robot overlords, the presenter accepts no liability for AI rebellions, unauthorized tool executions, or RAG-induced hallucinations. All auth patterns discussed assume your implementation doesn't contain 'allow-all' policies (we've all been there). OAuth2 and OpenFGA configurations may vary by environment. Please secure your agents responsibly - the machines are watching.<br><br>What happens when your AI agents bypass controls, abuse tool permissions, or hallucinate sensitive data from RAG pipelines? The path to an “AI Overlord” starts with one unguarded API call.<br><br>In this talk, you’ll learn how to weaponize OAuth2, OpenFGA, and battle-tested authorization strategies to keep AI agents in check. We’ll cover:<br><br>✅ Role-Based Shackles: Enforce least privilege for AI toolchains using RBAC and Fine-Grained Authorization (FGA).<br>✅ Credential-Free Tool Calls: Fortify API integrations with OAuth2 token exchange, letting agents act on behalf of users without ever touching raw credentials.<br>✅ RAG Jailbreaking Fixes: Embed FGA directly into retrieval workflows to prevent agents from leaking confidential data<br>✅ Human Guardrails: Leverage asynchronous authorization workflows to audit high-stakes actions.<br><br>Forget sci-fi doomsday scenarios—we’re tackling today’s threats. Walk away with knowledge to armor your AI agents against rogue behavior and security nightmares.", "totalFavourites": 73, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-09T10:55:00Z", "to": "2025-10-09T11:35:00Z", "room": "Room 8", "kind": "Lunch Talk", "pause": false, "talk": {"id": 19113, "title": "Code Review Remarks: Lessons Learned", "speakers": [{"fullName": "Blagoj Jovanov", "company": "G+D Netcetera", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-3f80475f-67da-4b31-ad6b-0906d9b137f4.jpg"}], "track": {"name": "People & Culture"}, "audienceLevel": "BEGINNER", "youtubeUrl": "https://www.youtube.com/watch?v=1SdrnPtzBh4", "description": "It appears that one consequence of being a tech lead is that team members consider you the default reviewer for all their pull requests. Though the process seems straightforward, there are many aspects that need to be considered. Effectively being one form of feedback, I would like to share my observations and give advice to future leaders about making this process as smooth as possible.<br><br>Code review is essential link in improving the code quality. It helps developers grow, opens space for constructive criticism and discussions. This talk will give general guidance about how to approach reviewing PRs based on size and complexity. After that the main focus will be the soft skills aspect, targeting the following questions: Do I need to tailor review per team member? How will the written feedback be interpreted? How detailed should a feedback be? What actions to take in attempt to decrease the amount of remarks in a PR? Many of these situations are based on personal experience from making code review for more than 8 years.", "totalFavourites": 456, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-09T10:55:00Z", "to": "2025-10-09T11:35:00Z", "room": "Room 9", "kind": "Lunch Talk", "pause": false, "talk": {"id": 24557, "title": "Augmented Development, the successes, surprises and pitfalls", "speakers": [{"fullName": "Andy Bailey", "company": "VEDA GmbH", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-e171ec9a-befd-4006-b977-3aaf59871b76.jpg"}], "track": {"name": "GenAI & Beyond"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=kjyXQdrgAi0", "description": "My talk will be based on a real world project called FastDecimal: https://github.com/threadlocalrandom/FastDecimal<br>The original aim was to create a performance optimised replacement for BigDecimal with a scaling of 4 and using Long as the scaledValue. Although this limits the numerical range of values that can be represented by the type these restrictions on range and scale would be suitable for financial calculations providing acceptable accuracy of operations are achieved.<br>In addition, the use of Long/long opens up scaling through the use of SIMD operations to parallelize computation.<br>I decided it would be fun and educational to see how far I could take things using AI Agents like ChatGPT, Claude Sonnet, Gemini and Junie in developing FastDecimal.<br>The project is small enough in scope to mean not too much time would be wasted if things didn't work and that I would be able to compare existing examples from BigDecimal to confirm correctness through code review and JUnit Tests. In addition I was going to supply JMH Benchmarks to compare BigDecimal and FastDecimal performance.<br>I will be presenting both my methodology, the things things that worked, the things that really surprised me and those that didn't work at all. If time permits I will also be working on the project \"live coding\" or \"live prompting\" as well as answering questions from the audience.", "totalFavourites": 4, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-09T10:55:00Z", "to": "2025-10-09T11:35:00Z", "room": "Room 10", "kind": "Lunch Talk", "pause": false, "talk": {"id": 7008, "title": "Enable Digital sovereignty by tech stack liquidity", "speakers": [{"fullName": "Merlin Bögershausen", "company": "Moderne Inc", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-fa2d0fcf-4b11-405b-9d55-bca0c75ddaa4.jpg"}], "track": {"name": "Architecture"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=bDpsuMKfC60", "description": "Digital sovereignty is key for modern organizations to build resilience against political and economic disruptions. To achieve real sovereignty, organizations have to take back control of their stack and gain liquidity. Often the needed changes are avoided due to missing resources and knowledge.<br><br>OpenRewrite recipes enable organizations to execute predictable and efficient migrations of large code bases. This predictability allows for secure migrations across frameworks to reverse past decisions. Moderne scales this ability with parallel execution through multiple repositories, allowing enterprises to scale migrations and utilize source code as a knowledge base. <br><br>In this session, we explore how OpenRewrite and Moderne can help you to gather information, and ground plans and execute large-scale migrations across your whole organization. This knowledge and plan will help you to archive tech stack liquidity and digital sovereignty.", "totalFavourites": 72, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-09T11:50:
