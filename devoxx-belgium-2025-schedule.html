ng, privacy trade-offs, and flexibility (self-hosted vs. SaaS). <br><br>You’ll see strengths, limits, and a simple decision grid to help you choose (or say no) in your own context. <br><br>Because surviving the AI jungle is about knowing where you want to go.", "totalFavourites": 257, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-07T10:40:00Z", "to": "2025-10-07T11:20:00Z", "room": "Room 8", "kind": "Lunch Talk", "pause": false, "talk": {"id": 44651, "title": "MCP in the Wild: Real-Time Agentic Systems with Live A/B Testing", "speakers": [{"fullName": "Arun Gupta", "company": "", "imageUrl": "https://lh3.googleusercontent.com/a-/AFdZucrE4tNpH64Twsj7vtuH6tUMrvkFyJmgkkhAC0cB1F8=s96-c"}], "track": {"name": "Architecture"}, "audienceLevel": "BEGINNER", "youtubeUrl": "https://www.youtube.com/watch?v=T0JbiPZZKCY", "description": "Ever built a game where AI agents make decisions in real time—and talk to each other in a structured way? With the Multi-Context Protocol (MCP), you can do precisely that.<br>In this session, we’ll walk through how MCP enables you to split agent behavior into modular contexts, such as planning, reasoning, and execution, then wire them up into a real-time multiplayer game using Python, CrewAI, and FastAPI. Each agent runs its logic, and here’s the kicker: the underlying LLMs are hot-swappable. Swap in GPT-4, Claude, Mixtral—you’ll see the differences instantly, without touching your core code.<br>We’ll also demonstrate how to run A/B tests across agents by swapping models mid-game and capturing structured MCP metrics, including the time agents spend planning, the frequency of replanning, and the impact of context-switching on outcomes. These insights help you benchmark LLM performance beyond just token count or latency—and tune your architecture accordingly.<br><br>We’ll go hands-on with the open source repository, break down the architecture, and demonstrate how this protocol-based design can enhance not just games, but any multi-agent system. If you’re building with LLMs and tired of spaghetti orchestration, this talk is for you.", "totalFavourites": 95, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-07T10:40:00Z", "to": "2025-10-07T11:20:00Z", "room": "Room 9", "kind": "Lunch Talk", "pause": false, "talk": {"id": 9806, "title": "Your offspring is our Future, so let us help you!", "speakers": [{"fullName": "Daniel De Luca", "company": "Devoxx4Kids Foundation", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-a0941dbe-67b0-43d3-9f1f-d676cc305243.jpg"}, {"fullName": "Eddy Vos", "company": "Devoxx4Kids Netherlands", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-6b39cfbe-e71d-43cf-b779-480f3ac5fa97.jpg"}], "track": {"name": "Mind the geek"}, "audienceLevel": "BEGINNER", "youtubeUrl": "https://www.youtube.com/watch?v=SCV2AKUZS9A", "description": "Looks we got your attention and that's great since with Devoxx4Kids we have a lot of news to tell you what we do in Belgium and in The Netherlands!<br><br>In 2025 we started with the Devoxx4Kids Foundation in Belgium that will bridge the digital divide for tomorrow's innovators.<br>What does this mean? The world of technology is constantly evolving, driving demand for skilled professionals. However, financial barriers often prevent talented students from pursuing higher education in IT fields. The Devoxx4Kids Foundation was established to address this critical challenge. Let us tell you how we can help!<br><br>In 2025 the Devoxx4Kids Netherlands are starting with Devoxx4Kids days at local community centers. With help of a big sponsor we are able to kill two birds with one stone. We teach children in that neighborhood in a fun way how to code and we support the community by hiring their local community center and hire their staff for the catering. So interested to organize a Devoxx4Kids event at your local community center without any cost involved? Come join our session and get the latest info how to do this!<br><br>", "totalFavourites": 40, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-07T11:30:00Z", "to": "2025-10-07T14:30:00Z", "room": "Room 4", "kind": "Deep Dive", "pause": false, "talk": {"id": 24587, "title": "On standards and AI agents: a walkthrough of MCP, A2A, ADK and more", "speakers": [{"fullName": "Guillaume Laforge", "company": "Google", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-22955cd1-9c41-4d6e-a7f2-b0f415794a7f.jpg"}, {"fullName": "Mete Atamel", "company": "Google", "imageUrl": "https://lh3.googleusercontent.com/a-/AOh14GgP86vaofFSorOriu75qJE_ElrozxZuZC6Vw7ACdMU=s96-c"}, {"fullName": "Emmanuel Bernard", "company": "Red Hat", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-d7a50c6f-1b13-4de9-9e21-85a7a2caa8cd.png"}], "track": {"name": "GenAI & Beyond"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=DiZs--ODXVM", "description": "AI agent foundations are built over a handful of common protocols that you need to master, to make the best out of your LLM and agent framework. That’s why it’s important to understand them. But some are catching up, others are not.<br><br>In this deep dive, we will explore the ecosystem showing you these standards and focusing on the important ones. Knowing some of the frameworks is useful too to get started faster. Welcome MCP, A2A, ACP protocols, and ADK, Arc, Quarkus, LangChain4j frameworks!<br><br>After giving you an overview of the main standards and protocols, their merit and their popularity, we will start by building an agent using Agent Development Kit (ADK) and walk through making a tool call. From there, zooming on MCP, we’ll see how to standardize that tool via a local MCP server and then deploy it as a remote MCP server to share it with others.<br><br>Next, we’ll dive into the A2A protocol and enable our agent to participate in multi-agent conversations. And to do that, we will use another framework, Quarkus and LangChain4j, showing how different stacks interact seamlessly through A2A.<br><br>You’ll learn not just what these protocols do and how they work, but why they matter, with detailed walkthroughs and live demos throughout.<br><br>If you’re struggling to understand all the protocol details around AI agents, this session is for you!<br>", "totalFavourites": 251, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-07T11:30:00Z", "to": "2025-10-07T14:30:00Z", "room": "Room 5", "kind": "Deep Dive", "pause": false, "talk": {"id": 6228, "title": "Authorization in Spring Security: permissions, roles and beyond", "speakers": [{"fullName": "Daniel Garnier-Moiroux", "company": "Spring", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-aba4300d-289f-4c87-8dfa-6917abeac329.jpg"}], "track": {"name": "Security"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=LGlyLmxjutI", "description": "When creating Spring Boot apps, Spring Security is the go-to choice for all your security use-cases. It offers protections against exploits, authentication (who is the user?) and authorization (are they allowed to do X?) capabilities. Basic authorization features, such as hasRole(...), are easy to implement, but things quickly become complicated when you have more advanced use-cases.<br><br>Many operations must be architected correctly to provide secure and robust authorization, in multiple phases. During the initial login phase, the relevant information about the user is extracted, transformed and stored, for example user data from OpenID claims. Then, for authorization, “policy decision” and “policy enforcement” are defined within the context of an operation: where are the authorization decisions made? Lastly, strategies are implemented in code to produce those authorization decisions.<br><br>This talk is a follow-up of the (2022 Deep Dive on Spring Security)[https://www.youtube.com/watch?v=iJ2muJniikY]. Through live-coded examples, you will build a solid, foundational understanding for all your authorization architecture. You will get an overview of all the access control patterns you can apply with Spring Security. And you will get practical advice on different authorization mechanisms available, and their tradeoffs.<br>", "totalFavourites": 323, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-07T11:30:00Z", "to": "2025-10-07T14:30:00Z", "room": "Room 6", "kind": "Deep Dive", "pause": false, "talk": {"id": 14113, "title": "Deep Dive: GraalVM in Practice", "speakers": [{"fullName": "Alina Yurenko", "company": "Oracle", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-7e0f9e8c-84b1-4373-8074-d88eca399811.jpg"}], "track": {"name": "Java"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=1J6mbMReOnI", "description": "GraalVM is now well recognized as the best way to run Java applications faster, with lower memory overhead, and great startup times. Yet developers still often wonder about the best strategies go from a regular Java application to a native executable, and what are the steps to be taken to ensure great performance, easy migration, and smooth developer experience.<br><br>In this session, we’ll go beyond the intro and look at building and running production-ready native applications with GraalVM.<br><br>What you'll take away from this session:<br>– Migrating existing apps to GraalVM<br>– Working with popular libraries and creating configuration<br>– Measuring and optimizing performance<br>– Packaging and deployment options (linking, compact containers)<br>– Security considerations (obfuscation, vulnerability scanning, SBOMs)<br>– Monitoring native apps (Micrometer, JFR, jvmstat, and more)<br>– Tooling, build reports, and automation (GitHub Actions, Buildpacks)<br><br>We’ll also look at some experimental and advanced topics like Native Image Layers, ML-based profile inference, Project Crema, and embedding guest languages, as well as the key features of the newly released GraalVM for JDK 25 (September 2025).<br><br>If you're curious about GraalVM and would like to make the most of it, this deep dive is for you.", "totalFavourites": 132, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-07T11:30:00Z", "to": "2025-10-07T14:30:00Z", "room": "Room 8", "kind": "Deep Dive", "pause": false, "talk": {"id": 22144, "title": "Loom in JDK 25: Virtual Threads, Structured Concurrency, and Scoped Values", "speakers": [{"fullName": "José Paumard", "company": "Oracle", "imageUrl": "https://lh3.googleusercontent.com/a-/AOh14GhsVIUuTR9Onoo-D8UMW5QId2Yw1V_EUvqdWdNQ0RQ=s96-c"}, {"fullName": "Remi Forax", "company": "University Gustave Eiffel", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-6a77f40f-f9f0-4d95-8460-bebdae5c1410.jpg"}], "track": {"name": "Java"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=962JVfxyuTk", "description": "The Loom project is about making asynchronous programming simpler by allowing IO calls to block your threads, without hurting the performance of your application. To do that, it first redefined what a thread is by introducing the concept of virtual thread. Virtual threads are lightweight threads that are separated from OS threads. Virtual threads were made final in JDK 21, but with a performance hiccup when they execute an IO call inside a synchronized block. Along with Virtual Threads, JDK 21 came with two preview features: the Scoped Value API as a replacement of the old crufty ThreadLocal API, and the Structured Concurrency API as a way to organize concurrent asynchronous tasks. In JDK 25, Virtual Threads work well with synchronized blocks, the Scope Value API is final, and the Structured Concurrency API, still in preview, has been revamped to be more flexible. This presentation covers these three aspects of the Loom project, with in depth details about how things are working under the hood, patterns, and non-trivial examples that you will be able to use in your applications.", "totalFavourites": 322, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-07T11:30:00Z", "to": "2025-10-07T14:30:00Z", "room": "Room 9", "kind": "Deep Dive", "pause": false, "talk": {"id": 6236, "title": "Tactical Domain-Driven Design with Java and Spring", "speakers": [{"fullName": "Oliver Drotbohm", "company": null, "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-5b15135f-1fa5-40e8-bf56-7ea3f9ea0a05.jpg"}], "track": {"name": "Server Side Java"}, "audienceLevel": "EXPERT", "youtubeUrl": "https://www.youtube.com/watch?v=k3o1nSh3g2Q", "description": "The building blocks of tactical Domain-Driven Design (DDD) define atomic design concepts for domain models. They define semantics, rules, and guide developers on how to structure code to develop complex business logic. However, the implementation of those in Java usually leads to some technical challenges.<br><br>In this workshop, we look at different approaches and tools that support developers building rich domain models in Java: the jMolecules library, that allows expressing DDD concepts in code and that provides integration with many ubiquitous technologies like Spring, Jackson and various persistence technologies. For Spring Boot applications, the Spring Modulith project supports developers to implement business modules, the interaction among them using events, their testability and documenting them.", "totalFavourites": 354, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-07T11:30:00Z", "to": "2025-10-07T14:30:00Z", "room": "BOF 1", "kind": "Hands-on Lab", "pause": false, "talk": {"id": 25274, "title": "Building your AI agent with Agent Development Kit (ADK) and Postgres", "speakers": [{"fullName": "Miguel Toscano", "company": "Google", "imageUrl": "https://lh3.googleusercontent.com/a/ACg8ocImkkSjIYfsW689OMjuz7bI0rmyYz_lj6bqt3aUzf88F5-ZYTk=s96-c"}, {"fullName": "Ahmad Adel", "company": "Google", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-60caf42b-0a93-4b35-9d3f-475d2e5678b7.jpg"}], "track": {"name": "GenAI & Beyond"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "", "description": "In this<strong> hands-on workshop,<\/strong> you'll build a conversational AI agent from scratch and transform how you interact with your users.<br>You'll use <strong>Agent Development Kit (ADK)<\/strong> to orchestrate agent behavior and manage conversational flows, like handling complex customer queries about product features or stock. Then, we'll dive into powering your agent with the <strong>Postgres Vector Database<\/strong> and its <strong>pgvector extension<\/strong>. You'll gain practical experience with setup, vector embedding management, and advanced querying. This includes <strong>Vector Similarity Search<\/strong> for intelligent product recommendations (e.g., similar sportswear, complementary items for RAG), <strong>Full-Text Search<\/strong> for keyword-based discovery (e.g., product descriptions, reviews), and <strong>Location-Aware Insights<\/strong> for geo-spatial data (e.g., nearest store branches, in-store item location).<br>We'll seamlessly connect these data capabilities to your ADK agent using the <strong>MCP ToolBox<\/strong>. Through <strong>extensive live coding<\/strong>, you'll build and deploy a functional, data-driven conversational AI.<br><strong>Key Takeaways:<\/strong> Understand core AI agent architecture with Google ADK, master pgvector for advanced multi-modal search in Postgres, and gain hands-on experience integrating a robust data backend with an AI agent to build your own working solution.<br><strong>Target Audience:<\/strong> Developers and data engineers familiar with SQL and basic Python. Prior AI/ML experience is beneficial but not required.", "totalFavourites": 72, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-07T11:30:00Z", "to": "2025-10-07T14:30:00Z", "room": "BOF 2", "kind": "Hands-on Lab", "pause": false, "talk": {"id": 7034, "title": "Build your own Java-powered Agentic Apps", "speakers": [{"fullName": "Georgios Andrianakis", "company": "IBM", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-c2227ba4-1c50-44fc-8569-7a2636770dba.jpg"}, {"fullName": "Mario Fusco", "company": "IBM", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-5909dee1-b4ae-4597-8ba5-878d30a68aec.jpg"}, {"fullName": "Kevin Dubois", "company": "IBM", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-2a25ea66-b643-4651-ba8a-a52a5afb4294.jpeg"}, {"fullName": "Clement Escoffier", "company": "Red Hat", "imageUrl": "https://lh3.googleusercontent.com/a/ACg8ocJhc8P2VmQ2i-ph6hlXtxVsFaGwNRle1AYzIQOarwRrG3-xuTUQ=s96-c"}, {"fullName": "Guillaume Smet", "company": "IBM", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-5943ab1b-64b8-4d60-ae78-6005c32ffe3d.jpg"}], "track": {"name": "GenAI & Beyond"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "", "description": "You’ve likely heard it everywhere lately: “This is the year of Agentic AI”!! Well, then why not roll up your sleeves and try creating your own Java-based Agentic AI app? <br><br>Thanks to the ease of use and superb developer experience of Quarkus and the nice AI integration capabilities that the LangChain4j libraries offer, it becomes trivial to start working with Agentic AI. <br>In this session, you’ll explore a variety of Agentic AI capabilities. We’ll start by creating a simple AI client to interact with an LLM. We’ll then explore how we can make this app “agentic” by adding a variety of agentic capabilities, such as local function calling, MCP, Agent2Agent, and more.<br><br>In addition, we’ll also try out different techniques and patterns to get your LLM leveled up to leverage these Agentic capabilities. We’ll also attempt to show that agents are in fact <em>not<\/em> always needed, and show alternative patterns to accomplish AI tasks. <br><br>Come to this session to learn how to build Agentic AI applications in Java from the experts and engineers actively working on Quarkus AI and LangChain4j. This is also an opportunity to provide feedback to the maintainers of these projects and contribute back to the community.<br>", "totalFavourites": 100, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-07T14:30:00Z", "to": "2025-10-07T14:50:00Z", "room": "Exhibition Hall", "kind": "Coffee Break", "pause": true, "talk": null}, {"from": "2025-10-07T14:50:00Z", "to": "2025-10-07T15:20:00Z", "room": "Room 4", "kind": "Tools-in-Action", "pause": false, "talk": {"id": 4708, "title": "101 Cursor AI, Learning to use for Java Enterprise projects", "speakers": [{"fullName": "Juan Antonio Breña Moral", "company": null, "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-50c2d933-3a42-41c9-902e-ba0ef4294167.jpeg"}], "track": {"name": "GenAI & Beyond"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=UJPWIz8eobc", "description": "For almost 3 decades, Java Enterprise software has been implemented by hand by Software Engineers. In 2023, a new generation of tools with AI features has burst onto the market, and recently **Cursor AI** has received great attention from the global developer community.<br><br>The session aims to move away from the term 'Vibe coding' and delves into:<br><br>- How Cursor AI improves the daily experience of the Java Software Engineer (DX), explaining its added value for the SDLC.<br>- The different features for adopting Cursor AI in large organizations, emphasizing security aspects.<br>- The advantages of using Java MCP servers in daily work.<br>- The possible concerns and limitations of these new tools.<br><br>The talk explains the main concepts of Cursor through examples based on Spring Boot or Quarkus.", "totalFavourites": 190, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-07T14:50:00Z", "to": "2025-10-07T15:20:00Z", "room": "Room 5", "kind": "Tools-in-Action", "pause": false, "talk": null}, {"from": "2025-10-07T14:50:00Z", "to": "2025-10-07T15:20:00Z", "room": "Room 6", "kind": "Tools-in-Action", "pause": false, "talk": {"id": 3805, "title": "The Yoga of Image Generation with Stable Diffusion & ComfyUI", "speakers": [{"fullName": "Raphaël Semeteys", "company": "Worldline", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-4612beb6-635e-40f9-b1dc-2a6c0915a860.jpg"}], "track": {"name": "GenAI & Beyond"}, "audienceLevel": "BEGINNER", "youtubeUrl": "https://www.youtube.com/watch?v=qn3BluLhYd8", "description": "Unlock the potential of <strong>Stable Diffusion<\/strong> for controlled image generation through an engaging, hands-on session. We'll demonstrate how generative AI can craft accurate, diverse, and inclusive images of yoga poses—ideal for scenarios where stock photos or internet-sourced images are inadequate. <br>Using <strong>ComfyUI<\/strong>’s modular workflows, embeddings, inpainting, ControlNets, LoRA, and FaceID for style and pose control, you'll learn how to generate precise images with ease. From text-to-image to hybrid image-to-image workflows, we’ll explore solutions to key challenges like ensuring pose consistency and preserving identity. <br>The Tools-in-Action features <strong>live demonstrations<\/strong>, practical tips, and insights drawn from the development of YogĀrkana, a dedicated yoga website. <br>By the end, you'll have actionable knowledge on customizing Stable Diffusion workflows and running them <strong>locally<\/strong> to fulfill your creative, commercial, or inclusive design objectives.", "totalFavourites": 90, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-07T14:50:00Z", "to": "2025-10-07T15:20:00Z", "room": "Room 8", "kind": "Tools-in-Action", "pause": false, "talk": {"id": 11002, "title": "I Lost Weight on Kubernetes with **SlimFaas**", "speakers": [{"fullName": "Guillaume CHERVET", "company": "AXA France", "imageUrl": "https://avatars.githubusercontent.com/u/52236059?v=4"}], "track": {"name": "Architecture"}, "audienceLevel": "ADVANCED", "youtubeUrl": "https://www.youtube.com/watch?v=Yq8yvWnZB7Q", "description": "Have you heard of <strong>SlimFaas<\/strong>? It's the slimmest and simplest way to build Function-as-a-Service (FaaS) on <strong>Kubernetes<\/strong>. Among its features:<br><br>• Scale to 0 (then back to 1 via HTTP trigger)<br>• Asynchronous and synchronous calls<br>• Job management<br>• And much more...<br><br>With SlimFaas, there's no magic—it's just a single pod you add to your scripts that acts as a proxy, with no dependency on other components. SlimFaas creates no coupling with your Kubernetes scripts or your application code. SlimFaas is Open Source and has been accepted into the <strong>CNCF<\/strong> (Cloud Native Computing Foundation) under the Linux Foundation.<br><br>In this presentation, we’ll explain:<br><br>• What is SlimFaas for? Why does it exist? And why not just use OpenFaas, Knative, or even KEDA?<br>• What does its architecture look like?<br>• How can you try it out in less than 5 minutes?<br><br>We’ve cut our infrastructure costs by more than 60%. Be the next to share your own Kubernetes weight-loss story!", "totalFavourites": 113, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-07T14:50:00Z", "to": "2025-10-07T15:20:00Z", "room": "Room 9", "kind": "Tools-in-Action", "pause": false, "talk": {"id": 6215, "title": "Coding challenge: AI-test vs PI-test", "speakers": [{"fullName": "Frederieke Scheper", "company": "Sopra Steria Nederland", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-e2a13dd1-0c51-4e8e-9c9e-0e239010c01a.jpg"}, {"fullName": "Laurens van der Kooi", "company": "Sopra Steria", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-cfcafb22-b219-4d61-8a0c-84da066ad2a1.png"}], "track": {"name": "Development Practices"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=QWDV6r0F6fs", "description": "Let's be honest: every developer loves writing tests, right? Meaning that we're all diligently practicing Test-Driven Development (TDD), not just preaching it. Or... are we? Maybe that's why we keep asking our AI coding assistants to write tests for us. Just prompt ChatGPT to generate a test for your latest class and voilà: \"Of course I can help you write your tests. Here's a complete test suite that achieves 100% line and branch coverage.\"<br><br>But does that really mean the tests are any good?<br><br>In this session, Laurens and Frederieke will push AI-generated tests to their limits using mutation testing and the PI-Test framework. Together, we'll explore whether these tests truly hold up under scrutiny, or if they just look good on paper.<br><br>By the end, you'll know when to say to your coding assistant, \"Thanks, ChatGPT, that was helpful,\" and when to say, \"Thanks, but no thanks. I'll write my own test this time.\"", "totalFavourites": 163, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-07T14:50:00Z", "to": "2025-10-07T16:50:00Z", "room": "BOF 1", "kind": "Hands-on Lab", "pause": false, "talk": {"id": 6235, "title": "Breaking your testing habits", "speakers": [{"fullName": "Rick Ossendrijver", "company": "Picnic Technologies", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-f3ca8b98-20c5-46ad-b322-fa1b91846f20.jpg"}, {"fullName": "Tim te Beek", "company": "Moderne", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-13ea6c24-3d45-4476-a946-c1de3619af22.png"}], "track": {"name": "Development Practices"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "", "description": "Old habits are hard to break; did you know starting JUnit test methods with `test` was last needed in 2006? With JUnit 6 and AssertJ 4 around the corner it’s high time to (un)learn and phase out lingering test patterns. Join us as we take you through the patterns and libraries of decades past, and help you into the new in this interactive workshop.<br><br>With two experts in automation on hand, each with their own experience and tool suites, upgrading becomes a breeze. Say goodbye to Hamcrest, TestNG, JUnit 3/4/5, and adopt AssertJ and other best practices. Bring your projects and a will to change, and be ready to walk out with a fresh new test suite for the decade to come.", "totalFavourites": 187, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-07T14:50:00Z", "to": "2025-10-07T16:50:00Z", "room": "BOF 2", "kind": "Hands-on Lab", "pause": false, "talk": {"id": 19145, "title": "Hands-On: Building AI Agents with Embabel", "speakers": [{"fullName": "John Davies", "company": "Incept5", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-84d39eec-0366-4490-8ae1-fee79515e09f.jpg"}, {"fullName": "James Ward", "company": "AWS", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-252a44f3-49db-43fa-8435-60a439b4bdb9.jpg"}, {"fullName": "Rod Johnson", "company": "Embabel", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-75114ae0-c77b-4c3e-9eeb-d87da765c471.jpg"}], "track": {"name": "GenAI & Beyond"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "", "description": "In this hands-on lab you will build an AI Agent using the Embabel Agent Framework and Kotlin or Java (you pick). The Agent will use Amazon Bedrock and local models for LLM inference and features deterministic planning, domain-driven orchestration, and MCP tools. We will use multiple AI models to show how reliability of Agents can be improved when catering each Agent action to the best suited model. Embabel is built on Spring AI but prior experience with Spring is unnecessary.", "totalFavourites": 69, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-07T15:20:00Z", "to": "2025-10-07T15:35:00Z", "room": "Exhibition Hall", "kind": "Break", "pause": true, "talk": null}, {"from": "2025-10-07T15:35:00Z", "to": "2025-10-07T16:05:00Z", "room": "Room 4", "kind": "Tools-in-Action", "pause": false, "talk": {"id": 25266, "title": "Amazon Q Developer: Your AI Pair Programmer for Java Modernization and Development", "speakers": [{"fullName": "Pal Magnus Slatto", "company": "Amazon Web Services", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-76d7340a-3e6d-44a7-9ebd-9c511e3dc81f.jpg"}], "track": {"name": "Build Different"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=7oEICZ3fp3I", "description": "Deep dive into Amazon Q Developer's revolutionary approach to Java development. This session showcases Q Developer's intelligent code completion, conversational programming interface, and automated code transformation capabilities specifically designed for Java developers.<br><br>See Q Developer's powerful features:<br><ul><li>Conversational coding: Chat with Q to generate complex Java implementations<\/li><li>Automated code transformation: Migrate entire codebases to Java 21 with one command<\/li><li>Intelligent suggestions for Stable Values and Structured Concurrency patterns<\/li><li>Real-time security scanning with automatic vulnerability fixes<\/li><li>Context-aware refactoring across large Java projects<\/li><li>Integration with IDEs for seamless development workflows<\/li><\/ul><br>In this session you will see a live demo of transforming legacy Java 8 to Java 21, implementing agentic patterns with Q, and using Q chat to solve complex architectural challenges. Learn how Q Developer understands your entire codebase context to provide accurate, project-specific recommendations.<br><br>After attending this session you will:<br><ul><li>Master Q Developer's chat interface for conversational programming<\/li><li>Leverage automated code transformation for Java modernization<\/li><li>Implement modern Java features efficiently with AI guidance<\/li><li>Accelerate development through intelligent code assistance<\/li><\/ul><br>This session is tailored for Java developers, software architects, and engineering teams seeking to maximize productivity with Amazon Q Developer's AI-powered development capabilities", "totalFavourites": 90, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-07T15:35:00Z", "to": "2025-10-07T16:05:00Z", "room": "Room 5", "kind": "Tools-in-Action", "pause": false, "talk": {"id": 23176, "title": "Hands-on refactoring session with the CodeLaser MCP server", "speakers": [{"fullName": "Piet van Remortel", "company": "CodeLaser.io", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-a61810e4-e3b4-4520-aa1d-10d6153660e8.jpg"}, {"fullName": "Bart Naudts", "company": "CodeLaser.io", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-be4dcad4-d84d-48e9-aeb5-692786d30034.jpg"}], "track": {"name": "GenAI & Beyond"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=n30uo20p6YI", "description": "This hands-on session demonstrates the CodeLaser MCP Server in action on a real-world codebase to perform deterministic refactoring. Starting with installation and setup, we'll demonstrate how to connect it to your own codebase and get started. We will cover how the coding agent uses the MCP server to get an overview of the codebase and identify refactoring opportunities. We'll walk through the complete workflow: discussing architectural issues with the AI, using the rich UI to inspect and edit refactoring plans, and executing transformations with deterministic guarantees. The demonstration covers practical examples of codebase insights, interface extraction, package reorganization, and large-scale renaming operations. You'll see how the analysis engine can guide refactoring decisions, how clustering algorithms identify architectural patterns, and how the system integrates with version control and branch management throughout the refactoring process. Participants will gain practical insights into AI-guided refactoring approaches with the CodeLaser MCP server, and be ready to apply this tool to their own codebases.<br>", "totalFavourites": 70, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-07T15:35:00Z", "to": "2025-10-07T16:05:00Z", "room": "Room 6", "kind": "Tools-in-Action", "pause": false, "talk": {"id": 12454, "title": "Integrating OpenAPI Generator into CERN React Apps: Pitfalls and Best Practices from the Frontlines", "speakers": [{"fullName": "Stefano Marzo", "company": "CERN", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-66ffa673-e1d2-4cdc-8dbe-bb503a0dbfca.jpeg"}], "track": {"name": "Development Practices"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=2jLC3RbOh6s", "description": "At CERN’s Business Computing Group, we're developing a large-scale React UI for one of CERN’s biggest business applications.<br>Integrating OpenAPI Generator into React brings clear benefits, but the process isn’t always straightforward.<br>With no official guidelines or common patterns, developers often create their own strategies to integrate OpenApi Generator into React apps, which can lead to common pitfalls like excessive boilerplate and inefficient memory usage.<br>To address this, we built an open source React library that wraps and optimizes OpenAPI-generated clients using a custom hook, making a better use of memory and streamlining API calls.<br>In this talk, we’ll share the challenges we faced, the mistakes we learned from, and how our open source solution helps making OpenAPI Generator work better in React applications, improving performance, maintainability, and the developer experience.", "totalFavourites": 101, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-07T15:35:00Z", "to": "2025-10-07T16:05:00Z", "room": "Room 8", "kind": "Tools-in-Action", "pause": false, "talk": {"id": 16283, "title": "A2A in 30 Minutes: Building Interoperable AI Agents", "speakers": [{"fullName": "Loïc Magnette", "company": "Oniryx", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-df59856c-239a-4702-bb00-aac9d1f6a121.jpg"}], "track": {"name": "GenAI & Beyond"}, "audienceLevel": "BEGINNER", "youtubeUrl": "https://www.youtube.com/watch?v=BOpzs5AGU50", "description": "Until recently, AI agents were advancing in intelligence but remained isolated. Developers attempted to make them collaborate by repurposing protocols like MCP, which connects language models to external tools and data. However, MCP was never intended for agent-to-agent communication. This gap became clear as agents grew more complex and collaboration became essential. In April, Google and its partners announced the A2A protocol, an open standard specifically designed to let agents discover each other, communicate, and collaborate across ecosystems.<br><br>This talk introduces the A2A protocol and shows how it enables agents to work together in multi-agent, multi-modal, and even long-running scenarios. We will explain its core principles, such as open standards, secure communication, and capability discovery through Agent Cards. You will also see how agents negotiate tasks, exchange context and artifacts, and coordinate their user experiences. We will highlight how A2A complements protocols like MCP by enabling agents to orchestrate one another while still using MCP internally to access tools and data.<br><br>By the end of this session, you will understand what problems A2A solves, how it fits into the broader agent ecosystem, and how it improves on previous approaches. You will leave with a clear understanding of how to design agents that can truly interoperate and contribute to the emerging Internet of Agents.", "totalFavourites": 145, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-07T15:35:00Z", "to": "2025-10-07T16:05:00Z", "room": "Room 9", "kind": "Tools-in-Action", "pause": false, "talk": {"id": 24578, "title": "Joda-Beans, POJO code generation and beyond", "speakers": [{"fullName": "Stephen Colebourne", "company": "Engine by Starling", "imageUrl": "https://avatars.githubusercontent.com/u/213212?v=4"}], "track": {"name": "Java"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=Z15X-0eSo50", "description": "Joda-Beans is the Joda project you've never heard of. An alternative to Lombok or Immutables, using an inline code generation approach closer to a language change than a library. A tool that generates POJOs - getters, setters, equals, hashCode, toString, builders, serialization (without Jackson), and more. If you've ever been frustrated by Lombok or annotation processors like Immutables, maybe Joda-Beans is the POJO tool you are looking for!<br>", "totalFavourites": 117, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-07T16:05:00Z", "to": "2025-10-07T16:20:00Z", "room": "Exhibition Hall", "kind": "Break", "pause": true, "talk": null}, {"from": "2025-10-07T16:20:00Z", "to": "2025-10-07T16:50:00Z", "room": "Room 4", "kind": "Tools-in-Action", "pause": false, "talk": {"id": 4715, "title": "The power of Cursor rules in Java Enterprise development", "speakers": [{"fullName": "Juan Antonio Breña Moral", "company": null, "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-50c2d933-3a42-41c9-902e-ba0ef4294167.jpeg"}], "track": {"name": "GenAI & Beyond"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=-OSYyY17VzE", "description": "Cursor AI is transforming software development for engineers and organizations alike. One of its most powerful features is Cursor Rules, which provide an intelligent way to leverage system prompts and enhance the developer experience when interacting with AI models during programming tasks. <br><br>The talk will explain in detail the Cursor Rules feature and how it is useful for any Java Software engineer tackling issues in different areas such as build systems, design, coding, testing, code refactoring with modern Java features, and profiling to detect and resolve runtime issues like memory leaks and performance bottlenecks.<br><br>The talk will cover in detail:<br><br>- Conversational and non-conversational Cursor rules<br>- How to modularize Cursor rules<br>- How to chain Cursor rules<br><br>The session will demonstrate these concepts through practical examples using Spring Boot and Quarkus frameworks.", "totalFavourites": 76, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-07T16:20:00Z", "to": "2025-10-07T16:50:00Z", "room": "Room 5", "kind": "Tools-in-Action", "pause": false, "talk": {"id": 12465, "title": "Paketo Buildpacks: the best way to build Java container images?", "speakers": [{"fullName": "Anthony Dahanne", "company": "HeroDevs", "imageUrl": "https://avatars.githubusercontent.com/u/60938?v=4"}], "track": {"name": "Development Practices"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=RX9zwgHuNmA", "description": "Buildpacks have been around for more than 15 years!<br>First they were used to detect and build an app before deploying it to a couple of PaaS.<br>Then we could create Docker (OCI) images with their latest generation, Cloud Native Buildpacks (CNCF incubating).<br>Are they a good alternative to the Dockerfile?<br>What are Paketo buildpacks? Which community is supporting them and how?<br>Come and find out during this session that will feature demos along the way!", "totalFavourites": 80, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-07T16:20:00Z", "to": "2025-10-07T16:50:00Z", "room": "Room 8", "kind": "Tools-in-Action", "pause": false, "talk": {"id": 7720, "title": "Be more productive with IntelliJ IDEA", "speakers": [{"fullName": "Marit van Dijk", "company": "JetBrains", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-c085796a-79e7-46a5-ad10-77c1ed9cf79e.png"}], "track": {"name": "Development Practices"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=ZWec2QyAl_k", "description": "IntelliJ IDEA is designed to help developers stay in the flow while working. It has a powerful editor, refactorings, navigation, and all kinds of smart features to help you write and read code. At the same time, it is jam packed with tools professional developers need, like Maven, Gradle, Spring, Git, Databases, Test tools and more. And did I mention a fantastic debugger?<br>In this talk, you will see how IntelliJ IDEA supports your workflow without having to leave the IDE, and learn how you can be a happier and more productive developer.", "totalFavourites": 402, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-07T16:20:00Z", "to": "2025-10-07T16:50:00Z", "room": "Room 9", "kind": "Tools-in-Action", "pause": false, "talk": {"id": 6214, "title": "Think with your hands: introduction to Lego Serious Play", "speakers": [{"fullName": "Annabelle Buffart", "company": "Llama Corp", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-72e5a458-9482-4bb3-a561-1a3163885899.jpg"}], "track": {"name": "People & Culture"}, "audienceLevel": "BEGINNER", "youtubeUrl": "https://www.youtube.com/watch?v=zjlMw_hy0mg", "description": "What if you could solve complex problems, unlock creativity, and foster real dialogue—using Lego bricks?<br>In this interactive workshop, we introduce participants to LEGO® SERIOUS PLAY®, a hands-on methodology designed to boost engagement, deepen reflection, and facilitate team alignment. No buzzwords—just bricks, stories, and shared meaning.<br>You’ll experience it firsthand: from the playful “Duck Challenge” to a deeper exercise where you build a model of your role, you’ll explore how thinking with your hands unlocks new insights and makes abstract ideas tangible.<br><br>Along the way, we’ll explore:<br><ul><li>The science behind “thinking with your hands”<\/li><li>How LSP bypasses cognitive filters to trigger honest, creative conversations<\/li><li>Real-world use cases from teams in HR, design, leadership and transformation<\/li><\/ul><br>Whether you’re curious about facilitation, coaching, or team dynamics—come ready to build, reflect, and share!<br>Key Takeaways<br><ul><li>Discover what LEGO® SERIOUS PLAY® really is (and what it’s not)<\/li><li>Learn how LSP supports creative thinking, team alignment, and problem-solving<\/li><li>Experience two LSP mini-workshops: the Duck Challenge + Job Representation<\/li><li>Leave with ideas to apply it in your own team, meetings, or workshops<\/li><\/ul><br>Target audience<br><ul><li>Designers, developers, and product owners interested in innovative facilitation tools<\/li><li>Team leaders, Scrum Masters, and Agile coaches looking to boost team engagement<\/li><li>Anyone curious about play-based methods to foster meaningful collaboration and insight<\/li><\/ul>", "totalFavourites": 75, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-07T16:50:00Z", "to": "2025-10-07T17:00:00Z", "room": "Exhibition Hall", "kind": "Break", "pause": true, "talk": null}, {"from": "2025-10-07T17:00:00Z", "to": "2025-10-07T19:00:00Z", "room": "BOF 1", "kind": "Meetup", "pause": false, "talk": {"id": 47104, "title": "Spec-Driven Development BOF", "speakers": [{"fullName": "Massimo Re Ferre'", "company": "Amazon Web Services", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-a365b743-33b7-4d20-b470-58b6754b0632.jpg"}, {"fullName": "Simon Maple", "company": "Tessl", "imageUrl": "https://lh3.googleusercontent.com/a-/AOh14GiJVAK5_CgDbPdH3ZLvku71QXe3agF9CSXWv1cIoA=s96-c"}, {"fullName": "Patrick Debois", "company": "AI Native Dev", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-14a95e13-4174-4121-b3eb-e6507b06d397.jpg"}], "track": {"name": "GenAI & Beyond"}, "audienceLevel": "BEGINNER", "youtubeUrl": "", "description": "​AI is changing software development, and we’re really excited and intrigued by the future of it:<br><ul><li>​Maybe you’re building software with AI?<\/li><li>​Or building tools that build software with AI?<\/li><\/ul><br>​Then this meetup is for you. No product pitches, just real experiences from the trenches. And it’s becoming a tradition now: if you’re attending Devoxx Belgium, this is the perfect community event!<br><br>​Spec-Driven Development (SDD) is gaining traction as teams look for ways to align faster, reduce rework, and ship with confidence. But what does it reallylook like in practice?<br><br>​This Birds of a Feather session is your chance to share stories, trade tips, and ask questions with others exploring or already working in a spec-first world. No slides. No formal talks. Just an open, informal discussion on the challenges, benefits, and practicalities of building from specs before writing code.<br><br>​We’ll have a few AI Native Dev community hosts on hand, including Patrick Debois, Simon Maple, Massimo Re Ferrè and Dru Knox to help spark ideas, share insights, and keep the conversation flowing.<br><br>​Whether you’re a curious newcomer or a seasoned SDD advocate, come join the conversation and leave with fresh insights, war stories, and maybe even a few new friends.", "totalFavourites": 41, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-07T17:00:00Z", "to": "2025-10-07T18:00:00Z", "room": "BOF 2", "kind": "BOF", "pause": false, "talk": {"id": 26291, "title": "Getting started with speaking", "speakers": [{"fullName": "Bert Jan Schrijver", "company": "OpenValue", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-2636b8a5-0209-4a75-9422-6e1c2662b04a.jpg"}], "track": {"name": "People & Culture"}, "audienceLevel": "BEGINNER", "youtubeUrl": "", "description": "Have you wondere
