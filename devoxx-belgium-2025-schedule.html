00Z", "to": "2025-10-09T12:40:00Z", "room": "Room 3", "kind": "Conference", "pause": false, "talk": {"id": 11006, "title": "MCP in Action: Connecting AI to Enterprise Systems", "speakers": [{"fullName": "Zineb BENDHIBA", "company": "Red Hat / IBM", "imageUrl": "https://lh3.googleusercontent.com/a-/AOh14GjiBUfiMv5eIhsd9a0qIX3j-zGc4hv5zN5owTEd4w=s96-c"}], "track": {"name": "GenAI & Beyond"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=H82o1OcrZGg", "description": "Artificial intelligence is evolving rapidly, but one challenge remains: efficiently connecting AI agents to the systems where data resides. Each new data source requires a specific integration, limiting the scalability and relevance of models.<br><br>The <strong>Model Context Protocol (MCP)<\/strong> addresses this issue by defining an open standard to link AI assistants to enterprise systems: from databases to business tools and development environments.<br><br>In this talk, we will introduce <strong>MCP<\/strong> through <strong>Wanaku<\/strong>, an open-source MCP server based on Quarkus and Apache Camel, developed by our team to simplify these integrations. We will share our experience building it, the challenges we faced, and the lessons we learned. You’ll also see how <strong>MCP<\/strong>, combined with modern Java technologies, enables seamless and secure connections between AI and enterprise data.<br><br>Join us to explore how this protocol is paving the way for more connected and intelligent AI systems!", "totalFavourites": 266, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-09T11:50:00Z", "to": "2025-10-09T12:40:00Z", "room": "Room 4", "kind": "Conference", "pause": false, "talk": {"id": 6226, "title": "Securing MCP Servers", "speakers": [{"fullName": "Daniel Garnier-Moiroux", "company": "Spring", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-aba4300d-289f-4c87-8dfa-6917abeac329.jpg"}], "track": {"name": "GenAI & Beyond"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=O6G6ufT03fk", "description": "Model Context Protocol is the de-facto standard for enhancing your LLM applications, providing resources and access to tools. When they are exposed to the public internet, you cannot leave them with open access: you need some level of access control. For that, MCP leverages the popular, but sometimes misunderstood, OAuth2 framework.<br><br>Most frameworks and languages have some support for OAuth2. But merely having the tools is not enough for implementing a full end-to-end flow, and you need to get the details right. What type of OAuth2 grant should you use? Can you initialize an MCP Client on app startup, when no user is present? How do you restrict access to certain features for admin only?<br><br>In this presentation, you'll learn what the MCP spec has to say about authorization and what it means in practice for your applications, both server and client. We'll work through an actual implementation, using Spring AI and the MCP Java SDK.", "totalFavourites": 254, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-09T11:50:00Z", "to": "2025-10-09T12:40:00Z", "room": "Room 5", "kind": "Conference", "pause": false, "talk": {"id": 6238, "title": "What’s new in Spring Modulith?", "speakers": [{"fullName": "Oliver Drotbohm", "company": null, "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-5b15135f-1fa5-40e8-bf56-7ea3f9ea0a05.jpg"}], "track": {"name": "Server Side Java"}, "audienceLevel": "ADVANCED", "youtubeUrl": "", "description": "Spring Modulith is a relatively recent addition to the Spring ecosystem that assists developers in structuring their applications to create more maintainable software.<br><br>The talk gives a brief overview of the project's ideas and highlights the features of the most recent releases, especially the upcoming 2.0 major version in November. Highlights include the revamped event publication registry, advanced C4 model integration, and significantly overhauled observability and actuator support.<br>", "totalFavourites": 381, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-09T11:50:00Z", "to": "2025-10-09T12:40:00Z", "room": "Room 6", "kind": "Conference", "pause": false, "talk": {"id": 7716, "title": "Building AI agents with Structured Outputs, Function Calling, and MCP", "speakers": [{"fullName": "Julien Dubois", "company": "Microsoft", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-61de7e4d-c8e9-429e-a76b-e73747f9174d.jpg"}], "track": {"name": "GenAI & Beyond"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=HmneQx1maCI", "description": "AI agents are programs that can act autonomously: to do this, they must be able to communicate programmatically with an LLM and perform actions.<br><br>In this session, we will explore:<br><ul><li>The new \"agentic\" module from LangChain4j: how to build AI agents in Java and orchestrate them with a nice API<\/li><li>Structured Outputs: how to require an LLM to respond following a JSON schema, allowing to map the result to Java objects<\/li><li>Function Calling: how to define and call Java functions from within an AI model<\/li><li>MCP: the new protocol that standardizes how LLMs communicate with different data sources and tools<\/li><\/ul><br>We will use the code, demos, and documentation I created to implement these features in LangChain4j using OpenAI’s brand-new Java SDK.", "totalFavourites": 185, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-09T11:50:00Z", "to": "2025-10-09T12:40:00Z", "room": "Room 7", "kind": "Conference", "pause": false, "talk": {"id": 7703, "title": "It’s Fine Actually: Doing Better in Legacy Java", "speakers": [{"fullName": "Baruch Sadogursky", "company": "TuxCare", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-69d1c432-22d7-43b0-8db6-9ad03ecabb11.png"}, {"fullName": "Pasha Finkelshteyn", "company": "BellSoft", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-9e056dea-b455-432f-8b40-91c861b254da.jpg"}], "track": {"name": "Java"}, "audienceLevel": "BEGINNER", "youtubeUrl": "https://www.youtube.com/watch?v=-S1n8VVfao8", "description": "Still on Java 8 or 11? No judgment, most of us are. Maybe the rewrite isn’t coming. Maybe the upgrade to Java 17 or 21 is always six months away. Maybe that old system just… works.<br><br>This talk is about what to do when you're not moving on. Because staying doesn’t have to mean suffering, and it definitely doesn’t mean giving up on good engineering.<br><br>We’ll walk through four practical ways to make life in legacy Java better:<br><br>Code: How to write cleaner, more modern-feeling Java even when older language versions limit you.<br><br>Architecture & Testing: How to add structure, testability, and confidence without needing a complete rewrite.<br><br>Performance: How to get speed and efficiency gains while sticking to your current runtime.<br><br>Security: How to stay protected without constantly firefighting vulnerabilities or risking instability from rushed upgrades.<br><br>Legacy isn’t going away. But you can live in it with confidence, and you don’t have to let it get in the way of your love of software engineering.", "totalFavourites": 200, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-09T11:50:00Z", "to": "2025-10-09T12:40:00Z", "room": "Room 8", "kind": "Conference", "pause": false, "talk": {"id": 12471, "title": "What comes after Git?", "speakers": [{"fullName": "Christian Schabetsberger", "company": "Finxit IT Solutions", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-563d01c9-391e-407a-8627-8a3644f9c418.webp"}], "track": {"name": "Development Practices"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=eIVEqy7Zp6A", "description": "Are the version control system wars over? It mostly looks like that, as Git has been the default contender for more than the past 10 years. But how did that even happen? And what will it take to dethrone the most dominating piece of software our industry has ever seen? New version control systems are rising on the horizon, with promising new features to simplify development workflows and improve developer experience, that are often inherently complex, or even outright impossible, to do with Git. In this talk, we are going to take a look at the history of version control systems, how new rising young stars like Jujutsu, Sapling or GitButler are innovating in that space today and how to use and integrate them into your existing Git-based project.", "totalFavourites": 461, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-09T11:50:00Z", "to": "2025-10-09T12:40:00Z", "room": "Room 9", "kind": "Conference", "pause": false, "talk": {"id": 22112, "title": "ONNX-Based Generative AI LLMs in Java with Project Babylon", "speakers": [{"fullName": "Adam Sotona", "company": "Oracle", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-ad69e5fd-ae0c-4195-b68d-732a1b507b25.jpg"}], "track": {"name": "Java"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=fJwKvE2AxIo", "description": "The Open Neural Network Exchange (ONNX) serves as an universal format for representing machine learning models, facilitating their deployment across diverse platforms. <br><br>Traditionally, Large Language Models (LLMs) are developed in Python using frameworks like PyTorch, TensorFlow, or scikit-learn, and then exported to ONNX for execution. <br><br>In this presentation, we will demonstrate how Java, a language not traditionally associated with AI modeling, can be utilized to produce ONNX models. We will explore the concept of ONNX-based Generative AI LLMs in Java, leveraging Project Babylon's code reflection capabilities. The presentation will showcase a practical Java example of an LLM, detailing its transformation into the ONNX format and subsequent execution.", "totalFavourites": 69, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-09T11:50:00Z", "to": "2025-10-09T12:40:00Z", "room": "Room 10", "kind": "Conference", "pause": false, "talk": {"id": 20660, "title": "Things You Thought You Didn’t Need To Care About That Have a Big Impact On Your Job", "speakers": [{"fullName": "Holly Cummins", "company": "IBM", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-ad86bc9d-af00-4d09-8898-40f91db50c85.jpeg"}], "track": {"name": "People & Culture"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=_zO7YtLmNuA", "description": "<p>\nDevelopment is about working with computers, right? Well, not quite. Development is all about working with computers (easy), and working with people (hard). Oh, and it’s about physics. Things like the speed of light and thermodynamics influence APIs, because they influence hardware and networking. If, like Holly, you slept through statistics modules in university, it will be a surprise to discover how statistics has changed our development workflows. Finally, we mustn’t forget economics. The end of zero-interest-rates has changed the employment landscape for many of us. In this wide-ranging talk, Holly will cover why the end of Moore’s law means we might finally need to get to grips with concurrent programming, why is Loom a good idea now when green threads were a bad idea, why is AOT a good idea now when it used to be a bad idea, and how much you should care about business studies, finance, and statistics.\n<\/pre>", "totalFavourites": 500, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-09T11:50:00Z", "to": "2025-10-09T12:40:00Z", "room": "BOF 1", "kind": "Speaker Room", "pause": true, "talk": null}, {"from": "2025-10-09T11:50:00Z", "to": "2025-10-09T12:40:00Z", "room": "BOF 2", "kind": "Conference", "pause": false, "talk": {"id": 26822, "title": "Meta-Programming with Agentic AI: Unleashing the Power of Code Reflection", "speakers": [{"fullName": "Michael Hoffer", "company": "Hamilton Freiburg GmbH", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-3286db22-df7a-4972-baf7-768971296027.jpg"}], "track": {"name": "Java"}, "audienceLevel": "ADVANCED", "youtubeUrl": "", "description": "This talk is an exploration into using Meta-Programming in the context of agentic AI to create powerful, flexible, and adaptable language features. Did you ever think about meta programming features where the programming language itself and the Agentic AI are tightly integrated? This exploration will demonstrate several examples of how this exciting and modern take on meta programming can be used to interact with agentic AI systems, giving them deep insights into the structure and behavior of the code they are working with as well as unfolding a hierarchy of compile stages and execution contexts that can be used to interact and create software in completely new ways. This session will be highly interactive and will include live coding examples, discuss new and upcoming features of Java (Project Babylon: Code Reflection), including a discussion about the future of programming languages as a whole, new execution contexts and how they can be adapted to work seamlessly with agentic AI systems.", "totalFavourites": 55, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-09T12:40:00Z", "to": "2025-10-09T13:00:00Z", "room": "Exhibition Hall", "kind": "Break", "pause": true, "talk": null}, {"from": "2025-10-09T13:00:00Z", "to": "2025-10-09T13:50:00Z", "room": "Room 3", "kind": "Conference", "pause": false, "talk": {"id": 47107, "title": "AI Agents and BPM: How to Instruct and Integrate AI Components into Complex Insurance Processes", "speakers": [{"fullName": "Nicolas Crappe", "company": "Belfius", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-cd105227-44e4-47d7-a953-65f8b1d21d9d.jpg"}], "track": {"name": "GenAI & Beyond"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=1aW7bHCZvLw", "description": "<em>AI is increasingly present in the IT landscape. Beyond hype, its real power lies in handling unstructured, complex processes — if we can make it <\/em><strong><em>trustworthy<\/em><\/strong><em>.<\/em><br><em> <\/em><br><em>At Belfius Insurance, we follow a simple principle: <\/em><strong><em>augmentation first, automation next<\/em><\/strong><em>. We start by assisting colleagues with AI components, then carefully extend to automation of routine tasks.<\/em><br><em> <\/em><br><em> In this talk, we will share how we:<\/em><br><em> • Design processes with a workflow engine (BPM) that integrate AI interactions and safeguards.<\/em><br><em> • Use feedback loops with business users to build trust and improve models.<\/em><br><em> • Visualize and monitor AI outputs to keep systems transparent.<\/em><br><em> • Decide when and how to involve humans in the loop.<\/em><br><em> • Apply these principles in our first deployments, where AI supports claim handlers with summarization and document analysis.<\/em><br><em> <\/em><br><em>By working side by side with business experts, we aim to make AI a <\/em><strong><em>trusted partner<\/em><\/strong><em> across insurance processes.<\/em>", "totalFavourites": 104, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-09T13:00:00Z", "to": "2025-10-09T13:50:00Z", "room": "Room 4", "kind": "Conference", "pause": false, "talk": {"id": 23199, "title": "Java as an AI development Platform", "speakers": [{"fullName": "Zoran Sevarac", "company": "Deep Netts Technologies", "imageUrl": "https://lh3.googleusercontent.com/a/ACg8ocIkZndS4tNQ9JJihah1O-c2v0fwUMMR2rcgC9MQ1DvfTB1cqoeJ=s96-c"}], "track": {"name": "Java"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=5DKwBUwbsUc", "description": "As artificial intelligence continues to redefine the technological landscape, developers are increasingly seeking robust, scalable, and interoperable platforms for AI development.<br>Java is emerging as a powerful and production-ready platform for building, deploying, and maintaining AI applications at scale. <br>This talk explores Java's evolving role in the AI ecosystem, driven by recent innovations such as Project Panama and the Vector API, which significantly enhance performance, interoperability, and hardware-level optimization.<br><br>We will showcase modern Java-based tools and libraries, including Deep Netts that provide native support for deep learning, model training, inference, and integration with enterprise systems. By leveraging the Java Virtual Machine (JVM), developers gain access to high-performance computing, cross-platform compatibility, and mature tooling for large-scale system integration.<br><br>This session will demonstrate how Java can serve not only as a reliable backend for AI-powered services but also as a full-stack AI development platform suitable for mission-critical applications in finance, manufacturing, and telecommunications. Attendees will leave with a clearer understanding of Java’s unique advantages in AI development and practical strategies for adopting Java-based AI solutions in real-world projects.", "totalFavourites": 171, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-09T13:00:00Z", "to": "2025-10-09T13:50:00Z", "room": "Room 5", "kind": "Conference", "pause": false, "talk": {"id": 46055, "title": "Serialization 2.0: A Marshalling Update!", "speakers": [{"fullName": "Viktor Klang", "company": "Oracle", "imageUrl": "https://lh3.googleusercontent.com/a/AAcHTtdkY-Lks0gsRcvl05pqpW8-GOpvuVndojO99ZxUsSy0rgo=s96-c"}], "track": {"name": "Java"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=guF2NvgJIN8", "description": "Almost three decades have passed since the creation of Java Serialization—a feature which is widely frowned upon—and application requirements for externalization of objects have changed significantly.This presentation explains in which way requirements and constraints have changed, and how recent enhancements of the Java Language together with a simpler and clearer division of responsibilities can lead to a dramatically simpler, and safer, model for programmatically reasoning about the structure of Objects; offer greater flexibility in state extraction, versioning, encoding, and reconstruction; and, support a wide selection of wire formats.<br>", "totalFavourites": 384, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-09T13:00:00Z", "to": "2025-10-09T13:50:00Z", "room": "Room 6", "kind": "Conference", "pause": false, "talk": {"id": 5912, "title": "Panel Discussion: LangChain4j Turns Two - What We’ve Learned and What’s Next", "speakers": [{"fullName": "Guillaume Laforge", "company": "Google", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-22955cd1-9c41-4d6e-a7f2-b0f415794a7f.jpg"}, {"fullName": "Lize Raes", "company": "Oracle", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-b0334cda-79ec-4532-80ed-7a01c1eb117b.png"}, {"fullName": "Dimitris Andreadis", "company": "Red Hat", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-aa62a276-fe45-44bb-b279-b48eb1550190.jpeg"}, {"fullName": "Julien Dubois", "company": "Microsoft", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-61de7e4d-c8e9-429e-a76b-e73747f9174d.jpg"}], "track": {"name": "GenAI & Beyond"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=SfK1THAFnIk", "description": "First introduced at Devoxx.BE 2023, LangChain4j has evolved into the de-facto standard for integrating Large Language Models into Java applications.<br><br>Join us in this panel discussion with member of the LangChain4j community as they reflect on the project's journey so far, share lessons learned, and explore what's next for LangChain4j.<br><br>You can submit your questions to the panelists at any time using this form:<br>https://forms.gle/do8if12kA7HycnQh8<br><br>See you there!", "totalFavourites": 157, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-09T13:00:00Z", "to": "2025-10-09T13:50:00Z", "room": "Room 7", "kind": "Conference", "pause": false, "talk": {"id": 6250, "title": "Gen AI Grows Up: Enterprise JVM Agents With Embabel", "speakers": [{"fullName": "Rod Johnson", "company": "Embabel", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-75114ae0-c77b-4c3e-9eeb-d87da765c471.jpg"}], "track": {"name": "GenAI & Beyond"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=_Y-srK-Ad4c", "description": "Since the emergence of Gen AI, it's become obvious that agents will be a big part of our future as both technologists and citizens. Building predictable, safe, manageable, testable agents that integrate with existing enterprise systems is critically important to us all.<br><br>In this session, Rod Johnson will show how JVM developers can be central to unlocking the business value of agentic AI, using the Embabel agent framework (https://github.com/embabel/embabel-agent).<br><br>Embabel is an innovative framework for Java and Kotlin developers, seamlessly integrated with Spring. Built in Kotlin, it aims not to play catchup with Python frameworks like Crew AI, but to leapfrog them to be the best agent framework, period.<br><br>Embabel innovates in several ways. It introduces a planning step that maximizes autonomy while maintaining determinism and safety. It is type safe, ensuring excellent toolability and avoiding errors in prompts. It enables developers to use a rich domain model, defining not just types but behavior exposed to user code and to LLMs as tools.<br><br>This will be a hands on talk. Rod will show the power of agents built on Embabel and how Java and Kotlin developers (especially if they know Spring) can start building agents immediately, using their existing skill set and established best practices.<br><br>Takeaway: Your employer's Gen AI strategy just got a lot closer to reality.", "totalFavourites": 337, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-09T13:00:00Z", "to": "2025-10-09T13:50:00Z", "room": "Room 8", "kind": "Conference", "pause": false, "talk": {"id": 7042, "title": "Application Architecture for Real-World Continuous Delivery", "speakers": [{"fullName": "Christopher Batey", "company": "Core Engineering Consulting Group ", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-9b933d03-8a32-4a73-9a08-9b03a23466eb.jpg"}], "track": {"name": "Architecture"}, "audienceLevel": "BEGINNER", "youtubeUrl": "https://www.youtube.com/watch?v=mSO6x2QdBI8", "description": "Building a Continuous Delivery pipeline is only half the challenge. The other half is ensuring the applications flowing through it are actually built to be delivered. In our experience, even recently developed systems often fall short of what is required to support safe, scalable, and repeatable delivery in a containerised environment.<br><br>This talk is a practical primer for engineers who want to build software at speed. We will explore the essential architectural foundations that make Continuous Delivery possible—not in theory, but in the environments we see today.<br><br>You will learn how to design for:<br><br><ul><li><strong>Disposability<\/strong>: Applications must start quickly and shut down cleanly to avoid downtime during rescheduling or scaling<\/li><li><strong>Statelessness<\/strong>: Enables horizontal scaling and resilience through multiple interchangeable instances<\/li><li><strong>Externalised logs and metrics<\/strong>: Ensures observability across environments without relying on local storage<\/li><li><strong>Minimal infrastructure dependencies<\/strong>: Avoid coupling to platform-specific components that limit portability<\/li><li><strong>Database and schema ownership<\/strong>: Embed migrations within the application lifecycle to remove release blockers<\/li><\/ul><br>Whether you are modernising legacy workloads or building new services, these patterns can help ensure your architecture supports the speed and safety that Continuous Delivery demands.", "totalFavourites": 527, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-09T13:00:00Z", "to": "2025-10-09T13:50:00Z", "room": "Room 9", "kind": "Conference", "pause": false, "talk": {"id": 26842, "title": "Self-Healing Rollouts: Automating Production Fixes with Agentic AI & Argo Rollouts", "speakers": [{"fullName": "Carlos Sanchez", "company": "Adobe", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-5a7ed48c-a2ee-4c08-888b-7a7d9aafd213.jpg"}], "track": {"name": "Development Practices"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=ABjIUw7ojiU", "description": "Even with robust CI/CD, production rollouts can hit unexpected snags. While Argo Rollouts excels in Kubernetes at progressive delivery and automated rollbacks to mitigate deployment issues, what if we could go a step further?<br><br>This session explores how to elevate your release process by integrating Agentic AI with Argo Rollouts. We'll demonstrate how an intelligent agent can automatically analyze logs when a rollout fails, pinpointing the root cause. Beyond diagnosis, these agents can take proactive steps on your behalf—from suggesting and even implementing code fixes or deployment manifest adjustments, to generating new pull requests and sending immediate notifications. This approach moves us closer to truly self-healing deployments.<br><br>Join us to learn how to combine the power of Kubernetes and Argo Rollouts with the autonomous capabilities of Agentic AI, achieving a release experience that is not only seamless but also resilient.", "totalFavourites": 141, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-09T13:00:00Z", "to": "2025-10-09T13:50:00Z", "room": "Room 10", "kind": "Conference", "pause": false, "talk": {"id": 26263, "title": "Spec Driven Development Why your prompt chaos won’t scale", "speakers": [{"fullName": "Simon Maple", "company": "Tessl", "imageUrl": "https://lh3.googleusercontent.com/a-/AOh14GiJVAK5_CgDbPdH3ZLvku71QXe3agF9CSXWv1cIoA=s96-c"}], "track": {"name": "GenAI & Beyond"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=tEHzFedonNc", "description": "AI coding has come a long way — but relying on vibes, prompts, and prototypes quickly hits a wall. What starts as productive soon becomes unmanageable: fragile hacks, copy-pasted prompts, and inconsistent outputs that resist collaboration and refactoring.<br><br>This session introduces <strong>Spec Driven Development<\/strong> — a practical, scalable approach where AI coding is guided by human-readable specifications that capture intent, structure, and rules. You’ll see how moving beyond freestyle prompting enables better reuse, stronger tests-as-guardrails, and smoother transitions when frameworks or requirements change.<br><br>We’ll walk through real-world examples showing how specs help keep code and AI aligned — even during ongoing iteration and team collaboration. You’ll also learn how to handle common SDD challenges like spec drift, refinement, and evolving abstractions.<br><br>If you’ve ever felt like Copilot was helping you fly in circles, this talk offers a way to move forward — with direction.", "totalFavourites": 358, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-09T13:00:00Z", "to": "2025-10-09T13:50:00Z", "room": "BOF 1", "kind": "Conference", "pause": false, "talk": null}, {"from": "2025-10-09T13:00:00Z", "to": "2025-10-09T13:50:00Z", "room": "BOF 2", "kind": "Speaker Room", "pause": true, "talk": null}, {"from": "2025-10-09T13:50:00Z", "to": "2025-10-09T14:30:00Z", "room": "Exhibition Hall", "kind": "Break", "pause": true, "talk": null}, {"from": "2025-10-09T14:30:00Z", "to": "2025-10-09T15:20:00Z", "room": "Room 3", "kind": "Conference", "pause": false, "talk": {"id": 3264, "title": "Understanding Prompt Injection - Techniques, Challenges, and Advanced Escalation", "speakers": [{"fullName": "Brian Vermeer", "company": "Snyk", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-5bcd9809-b062-461e-9767-e9a22f25e511.jpg"}], "track": {"name": "Security"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=72e_0WxaQl0", "description": "As developers, we’re embracing AI and large language models (LLMs) in our applications more than ever. However, there’s an increasing concern we need to be aware of: prompt injection. This sneaky attack can undermine our AI systems by manipulating the input to produce unintended outputs.<br>In this session, we’ll break down what prompt injection really means and look at some common techniques attackers use, like instruction overrides and hidden prompts. But we won't stop there; we’ll also explore advanced challenges, including escalation techniques that can exacerbate the risks.<br>Most importantly, we won’t just identify the problem. We’ll dive into practical steps you can take to mitigate these risks and keep your AI interactions secure. Join us at Devoxx Belgium to gain insights that will help you stay ahead in AI security and ensure your applications remain robust against these emerging threats.<br><br><br>", "totalFavourites": 449, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-09T14:30:00Z", "to": "2025-10-09T15:20:00Z", "room": "Room 4", "kind": "Conference", "pause": false, "talk": {"id": 4736, "title": "Generative AI: tech du-jour or the next big thing?", "speakers": [{"fullName": "Massimo Re Ferre'", "company": "Amazon Web Services", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-a365b743-33b7-4d20-b470-58b6754b0632.jpg"}], "track": {"name": "GenAI & Beyond"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=d3ObY-aLEm0", "description": "Is generative AI a fundamental improvement in our day-by-day? Or is it just the cool tech trend which shall pass? Are generative AI assistants useful? Can they make us more productive? Can we trust them? Are developers going to be replaced? In this session Massimo will share his perspective on the new opportunities and new challenges that generative AI is bringing to the table.", "totalFavourites": 81, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-09T14:30:00Z", "to": "2025-10-09T15:20:00Z", "room": "Room 5", "kind": "Conference", "pause": false, "talk": {"id": 6237, "title": "Domain-centric? Why Hexagonal, Onion and Clean architecture are answers to the wrong question", "speakers": [{"fullName": "Oliver Drotbohm", "company": null, "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-5b15135f-1fa5-40e8-bf56-7ea3f9ea0a05.jpg"}], "track": {"name": "Architecture"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=co3acmgP2Ng", "description": "To separate technical from domain code, architectural approaches like Hexagonal or Onion Architecture are currently all the rage. However, discussions about their semantic details and their mapping to the source code structure of software projects are at least equally ubiquitous.<br><br>How much abstraction and mapping between architectural concepts is needed? Is persistence metadata in the domain model heresy? Above all: what is the actual goal of the exercise, and: does it have to be so complicated?<br><br>We address these and other questions in a theoretical overview and by looking at concrete examples. We discuss the trade-offs of different approaches and how various tools and libraries help us to maintain the intended structural integrity.", "totalFavourites": 585, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-09T14:30:00Z", "to": "2025-10-09T15:20:00Z", "room": "Room 6", "kind": "Conference", "pause": false, "talk": {"id": 12472, "title": "Breaking Down AI Silos: Building Interoperable Multi-Agent Systems with Google's A2A Protocol and Java SDK", "speakers": [{"fullName": "Stefano Maestri", "company": "IBM", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-6ea4e61a-c0de-4d57-8b66-be9b54ef9713.jpg"}], "track": {"name": "GenAI & Beyond"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=7nosZt4JjMg", "description": "The enterprise AI landscape is fragmenting into isolated agent ecosystems—Python agents can't talk to JavaScript ones, vendor-specific frameworks create walled gardens, and businesses struggle to orchestrate complex workflows across their tech stacks. Google's Agent2Agent (A2A) protocol, now under Linux Foundation stewardship, offers a breakthrough solution: a universal language for AI agents.<br>This talk reveals how A2A is revolutionizing multi-agent collaboration by enabling seamless communication between agents regardless of their underlying technology. We'll explore the protocol's architecture, demonstrate real interoperability through live demos, and showcase the newly launched Java SDK that brings enterprise-grade agent development to the JVM ecosystem.<br><strong>What You'll Learn:<\/strong><br><ul><li><strong>The Interoperability Crisis<\/strong>: Why siloed agents limit AI potential and how A2A solves this with a standardized communication protocol<\/li><li><strong>A2A Architecture Deep Dive<\/strong>: Agent Cards for discovery, task lifecycle management, secure artifact exchange, and JSON-RPC over HTTP communication<\/li><li><strong>Java SDK in Action<\/strong>: Building production-ready agents with minimal boilerplate using enterprise-proven technologies like Mutiny-Zero for reactive streams<\/li><\/ul><br><strong>Multi-Language Demo<\/strong>: Live demonstration of Python, JavaScript, and Java agents collaborating in a real business workflow", "totalFavourites": 65, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-09T14:30:00Z", "to": "2025-10-09T15:20:00Z", "room": "Room 7", "kind": "Conference", "pause": false, "talk": {"id": 22147, "title": "Outcoded by Our Kids: It Took Us 20 Years, They Used 20 Prompts!", "speakers": [{"fullName": "jan van wassenhove", "company": "Sopra Steria", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-9b6e3ecd-7001-4088-ab4a-6955926e6bb2.jpg"}, {"fullName": "Bart Wullems", "company": "Vlaamse Landmaatschappij", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-6957732f-b92c-419c-8310-656eb5a42637.png"}], "track": {"name": "Build Different"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=ZO-619lqjK0", "description": "What took us two decades—learning frameworks, debugging builds, arguing about folder structure—took our kids… 20 prompts.<br>This is the painfully real story of two tech dads—Jan and Bart—whose 11 and 12 year-old sons built games using agentic platforms. With no coding experience, they created levels, enemies, sounds, and score systems by simply describing what they wanted. No IDE. No syntax errors. Just intent, interpreted by a growing wave of AI agents.<br>In this talk, we contrast their lightning-fast creative process with our traditional, structured dev mindset. We showcase their games, break down how these tools work, and explore what this means for software development.<br>Some key questions we asked ourselves:<br><ul><li>Are we witnessing the end of traditional programming?<\/li><li>Are we still relevant as architects, developers, and engineers?<\/li><li>What roles and skills matter in a world of AI-assisted, no-code creation?<\/li><li>How do we move from being builders to being orchestrators?<\/li><\/ul>Funny, humbling, and deeply relevant—this session is for every dev who's ever thought, \"That’s not how we used to do it...\" And for those who are ready to embrace what’s next.<br>", "totalFavourites": 164, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-09T14:30:00Z", "to": "2025-10-09T15:20:00Z", "room": "Room 8", "kind": "Conference", "pause": false, "talk": {"id": 7028, "title": "TDD & DDD From the Ground Up (Live Coding)", "speakers": [{"fullName": "Chris Simon", "company": "Chris Simon - Technology Coaching & Advisory", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-4792a5f2-c281-40d9-ad3d-62803f2562c0.jpg"}], "track": {"name": "Development Practices"}, "audienceLevel": "BEGINNER", "youtubeUrl": "https://www.youtube.com/watch?v=eWxOisRMcII", "description": "Are you interested in using Domain-Driven Design (DDD) to create maintainable and scalable software, but not sure how to get started? Or perhaps you've heard that DDD is only suitable for complex domains - and when starting out, you're not sure if your project will need it?<br><br>Join me for a live coding demonstration that will show you how to apply Test-Driven Development (TDD) from the very beginning of a project so you can bring DDD in when you need it.<br><br>We start with the simplest implementation - a CRUD system to help a university handle enrolments. We'll gradually add more complex requirements, such as the need to ensure courses don't become over-enrolled. Through gradual refactoring we'll develop the DDD tactical patterns of repositories, aggregates and domain services.<br><br>Mid-way, inspiration will strike! What if the model were changed? What if we allowed all enrollments and then allocated resources to the most popular courses as required so we never have to prevent a student from enrolling? We'll now see how the TDD tests and the neatly refactored domain models make it much easier to embark on this dramatic change - in other words, how much more maintainable our DDD codebase has become.", "totalFavourites": 397, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-09T14:30:00Z", "to": "2025-10-09T15:20:00Z", "room": "Room 9", "kind": "Conference", "pause": false, "talk": {"id": 15462, "title": "Six and a half ridiculous things to do with Quarkus", "speakers": [{"fullName": "Holly Cummins", "company": "IBM", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-ad86bc9d-af00-4d09-8898-40f91db50c85.jpeg"}], "track": {"name": "Server Side Java"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=s9d6JPjegRU", "description": "Let’s abuse the tools! Everyone knows Quarkus is computationally efficient, expressive, and rock-solid for production. But did you know that we can use Quarkus efficiency to build applications that shouldn’t go anywhere *near* production? In this demo-driven session, Holly will put the joy into “developer joy”. She’ll show you all sorts of things you can do with Quarkus that you probably shouldn’t:<br><br>- Build an LLM-powered app that’s *guaranteed* to hallucinate, because you can do more than you think with guardrails, and truth is so boring<br>- Write your business code in rockstarlang, because everything should be a hair metal ballad<br>- Use Minecraft as your observability client, because the LGTM stack doesn’t have enough explosions<br>- Write a CLI for generating memes faster, because everything is better on the command-line<br>- Benchmark an application against a grapefruit, because metric units aren’t tasty<br><br>Business value? Learning? If you insist. As well as absurd demos, you’ll leave this session with a deeper understanding of how to get the most out of Quarkus and Java. There will be new Java 25 language features, Quarkus best practices, powerful integrations, and nifty use cases alongside the silly explosions and grapefruit.", "totalFavourites": 212, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-09T14:30:00Z", "to": "2025-10-09T15:20:00Z", "room": "Room 10", "kind": "Conference", "pause": false, "talk": {"id": 7050, "title": "Garbage Collection in Java: Choosing the Correct Collector", "speakers": [{"fullName": "Stefan Johansson", "company": "Oracle", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-fe0e2097-c5bd-4fff-b942-d3fdada21910.jpg"}], "track": {"name": "Java"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=MQanscTqZ24", "description": "Garbage collection (GC) is a type of automatic memory management and a key feature of the Java platform. It allows developers to focus on their application logic rather than low-level memory management issues.<br><br>The Java platform implements multiple garbage collection algorithms, making it suitable for handling all kinds of workloads. The default collector, G1, is often a great choice, but depending on your use case, another GC might provide even better performance. This talk will explore:<br><ul><li>the basics of garbage collection<\/li><li>why there are multiple collectors<\/li><li>key characteristics of G1 and ZGC <\/li><li>the performance differences between collectors and JDK releases<\/li><\/ul>", "totalFavourites": 329, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-09T14:30:00Z", "to": "2025-10-09T15:20:00Z", "room": "BOF 1", "kind": "Conference", "pause": false, "talk": null}, {"from": "2025-10-09T14:30:00Z", "to": "2025-10-09T15:20:00Z", "room": "BOF 2", "kind": "Speaker Room", "pause": true, "talk": null}, {"from": "2025-10-09T15:20:00Z", "to": "2025-10-09T15:40:00Z", "room": "Exhibition Hall", "kind": "Break", "pause": true, "talk": null}, {"from": "2025-10-09T15:40:00Z", "to": "2025-10-09T16:30:00Z", "room": "Room 3", "kind": "Conference", "pause": false, "talk": {"id": 14143, "title": "Brokk: an AI-Native Code Platform for Java, in Java", "speakers": [{"fullName": "Jonathan Ellis", "company": "Brokk", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-9ff65a95-b926-48e2-b45f-3b7b938abf95.jpg"}], "track": {"name": "GenAI & Beyond"}, "audienceLevel": "ADVANCED", "youtubeUrl": "https://www.youtube.com/watch?v=DUFrGRbiRmU", "description": "Brokk is a new tool written with Java Swing for supervising code-writing AI assistants.<br><br>It is a standalone application because effective context engineering for software development requires a different paradigm than the 40 year old IDE design optimized for reading and writing code at human speeds.<br><br>This talk will cover the principles behind Brokk's design, how Brokk leverages static analysis to help LLMs understand your code at a level deeper than raw text, and Java-specific optimizations like dependency decompilation to avoid hallucinations.<br><br>We'll also take a brief look at the JVM tech powering Brokk, including Joern (the static analysis engine) and Jlama (pure Java LLM inference).", "totalFavourites": 44, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-09T15:40:00Z", "to": "2025-10-09T16:30:00Z", "room": "Room 4", "kind": "Conference", "pause": false, "talk": {"id": 26835, "title": "Is AIOps the Future of IT Operations? Real Use Cases from the Trenches", "speakers": [{"fullName": "Iveri Prangishvili", "company": "Adobe", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-9c765636-a50e-45e1-8e08-c18a223b0b0b.jpg"}, {"fullName": "Danilo Banjac", "company": "Adobe", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-d327fba4-3996-450c-9e15-7171964ee6e8.jpg"}], "track": {"name": "GenAI & Beyond"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=dVy-lengAhY", "description": "AIOps isn't just a buzzword; it's a fundamental shift in how we manage the complex systems that power modern digital businesses. It provides the intelligence and automation required to manage the dynamic and complex systems that underpin modern digital businesses.<br><br>This session will showcase concrete use cases and lessons learned at Adobe. We will cover some of them, including:<br><br><ul><li>Using AIOps to drive continuous improvement and innovation<\/li><li>Harnessing the power of LLMs to diagnose issues and reduce human effort<\/li><li>Building AI agents to automate tasks ie. during on-call to reduce MTTR <\/li><\/ul><br>Attendees will leave with a clear understanding of how AIOps can help their organizations achieve their transformation and automation goals based on real use cases.<br>", "totalFavourites": 61, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-09T15:40:00Z", "to": "2025-10-09T16:30:00Z", "room": "Room 5", "kind": "Conference", "pause": false, "talk": {"id": 20655, "title": "Why I Am Not Afraid AI Will Take My Job", "speakers": [{"fullName": "Maarten Mulders", "company": "Info Support", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-511fa63f-2dc6-4547-ace6-1daf1a86f79e.jpg"}], "track": {"name": "Build Different"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=w-TXBwukxqY", "description": "Large language models (LLMs) are here to stay. So is their impact on many professions. Our work in IT is no exception to that rule. Some doomsayers predict that such models will soon make large parts of our work redundant.<br><br>So, is it time to start queuing up in the unemployment line? I don't think so! To understand why, I will explain how an LLM works behind the facade of the prompt window. Once we understand what an LLM essentially is, we will better understand the threats <em>and<\/em> the opportunities for our work.<br><br>Join me to get a better understanding of the inner workings of an LLM. As a bonus, you will leave the room with a much more optimistic view of what their impact on your work can be.", "totalFavourites": 392, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-09T15:40:00Z", "to": "2025-10-09T16:30:00Z", "room": "Room 6", "kind": "Conference", "pause": false, "talk": {"id": 6201, "title": "GPULlama3.java: Beyond CPU Inference with Modern Java", "speakers": [{"fullName": "Michalis Papadimitriou", "company": "University of Manchester", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-12efd8ad-2284-4e62-95d6-fd64fd8a95a8.jpeg"}], "track": {"name": "GenAI & Beyond"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=PO6wOtzUb3w", "description": "As Large Language Models (LLMs) become crucial to AI applications, Java developers are now equipped to run powerful local inference using modern JDK features without relying on Python or specialized runtimes. Thanks to Java 21+'s Vector API and projects like <strong>JLama<\/strong> and <strong><u>llama3.java<\/u><\/strong>, the JVM ecosystem now supports efficient, native CPU inference for popular open-source models like Llama 2/3, Gemma, and Mistral. At the same time, GPU computing for Java is reaching new maturity with <strong>TornadoVM<\/strong>. <br>This session introduces <strong><u>GPULlama3.java<\/u><\/strong>, an open-source framework built on top of <strong>llama3.java<\/strong>, which uses TornadoVM to offload inference computation to GPUs, just by leveraging its API. <strong>GPULlama3<\/strong> showcases how to enable half-precision data types in the JVM, express GPU-optimized matrix operations, implement fast Flash Attention, and ensure compatibility with Llama 2/3 and Mistral models. Moreover, demonstrates integration with <strong>LangChain4j<\/strong> for seamless GPU execution in Java-based inference engines.<br>Finally, the session will include a live demo showing how <strong>GPULlama3.java<\/strong> can run on any JDK and hardware ranging from Apple Silicon to high-end NVIDIA GPUs. Also, explores how to leverage TornadoVM’s profiling and analysis tools to evaluate GPU performance during inference.<br>Whether you're building AI apps on the JVM or looking to scale LLMs on Java with modern acceleration, this session will give you a clear path to GPU-enabled inference in a fully Java-native stack.<br>", "totalFavourites": 46, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-09T15:40:00Z", "to": "2025-10-09T16:30:00Z", "room": "Room 7", "kind": "Conference", "pause": false, "talk": {"id": 14141, "title": "The LLM Smörgåsbord", "speakers": [{"fullName": "John Davies", "company": "Incept5", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-84d39eec-0366-4490-8ae1-fee79515e09f.jpg"}], "track": {"name": "GenAI & Beyond"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=0B5kYjVQ-I4", "description": "Believe it or not, there are already nearly two million LLMs available on Hugging Face, this doesn't include the public-facing GPTs like ChatGPT, Claude, Gemini, Grok, Mistral, Qwen, DeepSeek, and many more.<br>LLMs are not just text, chat-bots or code generators, an increasing number can process speech, images, video and often several of these at once. Some fit on a mobile phone, some require a car-size investment in hardware but most will run comfortably on modern laptops.<br><br>The talk will bring you up to date with all the latest models (literally up to date), what they're good at, what people are using them for and what's not so good. What's worth trying out, a quick \"How to get started\" and where the future might be going. We will cover how to run LLMs locally and in-cloud, the advantages of local models and how get the best out of them. Plenty of code, plenty of examples but a LOT more LLMs.<br><br>This is for everyone especially those programming with or using LLMs, you should walk away with a clear knowledge of the choices available and the LLMs that might get you to the next level.", "totalFavourites": 102, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-09T15:40:00Z", "to": "2025-10-09T16:30:00Z", "room": "Room 8", "kind": "Conference", "pause": false, "talk": {"id": 4716, "title": "Structured Concurrency in Action", "speakers": [{"fullName": "Nicolai Parlog", "company": "Oracle", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-7513a9db-6f8e-41a9-827e-848cbd8e3b13.jpg"}], "track": {"name": "Java"}, "audienceLevel": "ADVANCED", "youtubeUrl": "https://www.youtube.com/watch?v=rcrA4SOdhzA", "description": "In Java 25, the structured concurrency API sees its fifth preview with considerable changes over previous iterations. With chances being good that it will finalize without a further overhaul, let's put it into action and explore how to:<br><br><ul><li>structure concurrent code<\/li><li>process and propagate errors and cancellation<\/li><li>observe thread relationships<\/li><li>refactor from a reactive approach<\/li><\/ul><br>After this presentation you'll be ready to put the structured concurrency API into action in your project.", "totalFavourites": 466, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-09T15:40:00Z", "to": "2025-10-09T16:30:00Z", "room": "Room 9", "kind": "Conference", "pause": false, "talk": {"id": 12457, "title": "The Best of Java Shorts Show: 100 Snippets in 50 Minutes", "speakers": [{"fullName": "Adam Bien", "company": "adam-bien.com", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-5585e065-579a-4c57-af82-6518c8aaf6e4.jpg"}], "track": {"name": "Java"}, "audienceLevel": "BEGINNER", "youtubeUrl": "https://www.youtube.com/watch?v=qonlBhm9iFY", "description": "Following the initial introduction of the first 100 Java snippets at Devoxx 2024, we will proceed with the next batch of the most popular, best rated, curious and unusual Java code \"shorts\", such as running a Java app without compiling with libraries, printing all emojis, launching HTTP dev server, conveniently invoking a native library, using programmatic Java Compiler (javac), programmatic Java Archive (JAR), implementing LRU caches, Standard/Input/Output (stdout) APIs, printing colourful logs, performing easy date and time tricks, implementing a file watcher, implementing smart enums and performing easy file parsing (.~100 other popular Java snippets can be found at http://youtube.com/@bienadam/shorts.<br><br>There will be no builds, Maven or classpath, and no external dependencies — just plain Java, and occasionally javac and Visual Studio Code.", "totalFavourites": 335, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-09T15:40:00Z", "to": "2025-10-09T16:30:00Z", "room": "Room 10", "kind": "Conference", "pause": false, "talk": {"id": 4735, "title": "Hacking your parenting", "speakers": [{"fullName": "Patricia Lenten", "company": "bol.", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-e844918f-4b9b-47c4-a7f1-cfd252584c56.jpeg"}], "track": {"name": "People & Culture"}, "audienceLevel": "BEGINNER", "youtubeUrl": "https://www.youtube.com/watch?v=osnfw4yaDe4", "description": "<strong>As a single mother of four and an engineering manager, I’ve had my fair share of chaos, tough decisions, and those unexpected little wins that make it all worthwhile.<\/strong><br><br>There have been seasons where I felt like I was constantly choosing between being the parent my kids needed and the professional I wanted to be. There were days I dropped balls, at work or at home, and nights I questioned if I could keep all the plates spinning. But through the chaos, I also discovered strength, resilience, and a new way of thinking that helped me not just survive, but actually <em>grow<\/em> in both roles.<br><br>In this session, I’ll share some of the key mindset shifts that changed the game for me, how I moved from guilt to grace, from overdrive to intentional action. I’ll also walk you through some of the practical hacks that helped me make space for what really matters, both as a parent and a professional.<br><br><strong>This isn’t a story about having it all figured out, it’s about navigating the mess with honesty, learning on the go, and redefining success on your own terms.<\/strong><br><br>By the end of this talk, my hope is that you’ll walk away with:<br><ul><li>A bit more breathing room<\/li><li>A few real-life strategies to try out<\/li><li>And the reassurance that you're not alone in this balancing act<\/li><\/ul><br>Because you <em>can<\/em> be present at home <em>and<\/em> grow in your career,without burning out in the process.", "totalFavourites": 181, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-09T15:40:00Z", "to": "2025-10-09T16:40:00Z", "room": "BOF 1", "kind": "BOF", "pause": false, "talk": {"id": 44655, "title": "Meet the Spring team", "speakers": [{"fullName": "Daniel Garnier-Moiroux", "company": "Spring", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-aba4300d-289f-4c87-8dfa-6917abeac329.jpg"}, {"fullName": "Josh Long", "company": "the Spring team", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-5c074f46-dfb5-4caf-872c-c8f7d216345a.jpg"}, {"fullName": "Christian Tzolov", "company": "Broadcom", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-f95fd57e-acf9-4791-9a68-7096de8eb4f4.png"}, {"fullName": "Moritz Halbritter", "company": "Spring Team @ Broadcom", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-c200bb79-80fa-4729-a2a3-3b4a0e583e72.jpg"}, {"fullName": "Oliver Drotbohm", "company": null, "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-5b15135f-1fa5-40e8-bf56-7ea3f9ea0a05.jpg"}, {"fullName": "Brian Clozel", "company": "Spring team", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-c7495415-fa8d-4c97-8f12-898261d1c087.jpg"}, {"fullName": "Stephane Nicoll", "company": "Spring Team", "imageUrl": "https://lh3.googleusercontent.com/a/ACg8ocLXhpZP1pg4IcNwhZGMJD3nNUk_2bRf6Ppmz67DF8DKycIG9AM=s96-c"}, {"fullName": "Dariusz Jędrzejczyk", "company": "Spring Team @ Broadcom", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-c8d112b7-65fb-4baf-88b8-2faeb655bfe9.jpg"}], "track": {"name": "Server Side Java"}, "audienceLevel": "BEGINNER", "youtubeUrl": "", "description": "Come meet the Spring team! This year at Devoxx, many maintainers, advocates and contributors will be at the conference, and we’re delighted to meet with our users and members of the community. In this “open mic” session, you’ll have the opportunity to ask us anything about the various Spring projects, our current efforts and ideas for the future, and of course, the soon-to-be-released new generation with Boot 4 and Framework 7.<br> <br>Whether you’re a Spring veteran or a new user getting started with the project, you are more than welcome to join.", "totalFavourites": 90, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-09T15:40:00Z", "to": "2025-10-09T16:30:00Z", "room": "BOF 2", "kind": "Speaker Room", "pause": true, "talk": null}, {"from": "2025-10-09T16:30:00Z", "to": "2025-10-09T16:50:00Z", "room": "Exhibition Hall", "kind": "Break", "pause": true, "talk": null}, {"from": "2025-10-09T16:50:00Z", "to": "2025-10-09T17:35:00Z", "room": "Room 5", "kind": "Closing Keynote", "pause": false, "talk": {"id": 12494, "title": "Rise of the Agents: You, AI, and the Future of Society", "speakers": [{"fullName": "Martijn Verburg", "company": "Microsoft", "imageUrl": "https://lh3.googleusercontent.com/a-/AOh14GjsKcIXAdvTXHyxMNxrIzNm0fgtH2wbkEKacpYONg=s96-c"}], "track": {"name": "People & Culture"}, "audienceLevel": "BEGINNER", "youtubeUrl": "https://www.youtube.com/watch?v=U7BoaihbbZU", "description": "AI agents are here, evolving fast, and poised to fundamentally reshape how we live, work, govern, and relate to one another. From autonomous coding assistants to distributed agent ecosystems making decisions on our behalf, we are entering a new era of software that can act with intent.<br><br>In this thought-provoking session, we explore the deep and far-reaching consequences of AI agents on every facet of human society:<br><br><ul><li>Technology & Work: What happens when agents take on complex knowledge work, collaborate with humans in software teams, and begin making architectural decisions? Will they elevate us—or replace us?<\/li><li>Economics & Labour: As cognitive automation spreads, who benefits? We’ll unpack the economic ripple effects across industries, from productivity gains to job displacement and re-skilling.<\/li><li>Governance & Law: Autonomous agents will challenge legal frameworks, and accountability. Who’s liable when an agent acts? What does “intent” mean in a world of autonomous agents?<\/li><li>Ethics & Privacy: With agents that observe, learn, and act in persistent digital spaces, what are the risks to personal freedom, surveillance, and human dignity?<\/li><li>Culture & Identity: When generative agents create art, write books, and simulate personalities, how do we define creativity, authenticity, and human expression?<\/li><\/ul><br>Whether you’re an optimist, a skeptic, or somewhere in between, this session will challenge your assumptions, spark new questions, and help you prepare for the world that’s rapidly unfolding.", "totalFavourites": 356, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-09T16:50:00Z", "to": "2025-10-09T17:50:00Z", "room": "BOF 1", "kind": "BOF", "pause": false, "talk": {"id": 5913, "title": "LangChain4j Community BOF", "speakers": [{"fullName": "Georgios Andrianakis", "company": "IBM", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-c2227ba4-1c50-44fc-8569-7a2636770dba.jpg"}, {"fullName": "Dimitris Andreadis", "company": "Red Hat", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-aa62a276-fe45-44bb-b279-b48eb1550190.jpeg"}, {"fullName": "Mario Fusco", "company": "IBM", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-5909dee1-b4ae-4597-8ba5-878d30a68aec.jpg"}], "track": {"name": "GenAI & Beyond"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "", "description": "<strong>Curious about the evolution and future direction of LangChain4j? Join our Birds of a Feather (BOF) session for an open and interactive discussion with members of the LangChain4j community.<\/strong><br><br>Since its debut at Devoxx Belgium 2023, LangChain4j has rapidly grown into a key framework for integrating large language models into Java applications. Whether you're already using LangChain4j in production or just starting to explore its capabilities, this session is a great opportunity to connect with fellow developers, contributors, and enthusiasts.<br><br>We'll discuss the current state of the project, real-world adoption stories, ongoing challenges, and exciting new developments on the roadmap. This is your chance to ask questions, share feedback, exchange ideas, and help shape the future of LangChain4j.<br><br>Come with curiosity and leave with insights, connections, and inspiration!", "totalFavourites": 39, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-09T16:50:00Z", "to": "2025-10-09T17:50:00Z", "room": "BOF 2", "kind": "BOF", "pause": false, "talk": {"id": 20670, "title": "Java and JVM lovers in Belgium, let's unite!", "speakers": [{"fullName": "Loïc Magnette", "company": "Oniryx", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-df59856c-239a-4702-bb00-aac9d1f6a121.jpg"}, {"fullName": "Tom Cools", "company": "Timefold", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-41f9c32f-de59-4677-aa11-e1bd88fcd3c8.jpeg"}, {"fullName": "Frank Delporte", "company": "Azul", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-99dab1f1-9a67-4dd6-9fb6-5056f94551cc.jpg"}], "track": {"name": "People & Culture"}, "audienceLevel": "BEGINNER", "youtubeUrl": "", "description": "Are you passionate about Java and curious to meet the people shaping its community here in Belgium? Whether you’re a first-time Devoxx attendee, a seasoned Java veteran, or just someone who enjoys geeking out over JVM minutiae, this is the place to be.<br><br>Join us for an informal and interactive session. We’ll share what the BeJUG is all about: how we connect Java enthusiasts across the country, the kinds of events we organize (from meetups to hands-on sessions), and how you can get involved as an attendee, a speaker, or even a contributor.<br><br>Come say hi, share your ideas, ask questions, or just hang out and network with fellow Java lovers. No slides, no strict agenda, just a room full of like-minded people who care about the Java ecosystem and its vibrant Belgian community. Everyone is welcome, and we’d love to hear what you would like to see from your local Java User Group!", "totalFavourites": 43, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-09T18:00:00Z", "to": "2025-10-09T20:00:00Z", "room": "Room 8", "kind": "Movie: \"Tron: Ares\"", "pause": true, "talk": null}]}, {"name": "Friday", "date": "2025-10-10", "slots": [{"from": "2025-10-10T06:30:00Z", "to": "2025-10-10T07:30:00Z", "room": "Exhibition Hall", "kind": "Breakfast", "pause": true, "talk": null}, {"from": "2025-10-10T07:30:00Z", "to": "2025-10-10T08:20:00Z", "room": "Room 4", "kind": "Conference", "pause": false, "talk": {"id": 20676, "title": "Local Development in the AI Era", "speakers": [{"fullName": "Kevin Dubois", "company": "IBM", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-2a25ea66-b643-4651-ba8a-a52a5afb4294.jpeg"}], "track": {"name": "GenAI & Beyond"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=HeQErLzvnhc", "description": "Most of us like to do local development. It means we’re in control of any dependencies, network issues/latency, configurations and cost. And we love to say that “It works on my machine” don’t we? 🙂<br>Now, with the advent of AI-driven development, it has become more challenging than ever before to do pure local development. <br>In this session we’ll take a look at various solutions to continue to do local, network-optional development, even with AI: <br>* Run AI models locally.<br>* Evaluate different code assistants that can work with these locally running models<br>* Explore how to infuse AI capabilities from local models into our code<br>* Compare models from different vendors; and with different sizes to find the right balance between performance and accuracy<br>* Weigh pros and cons of using local vs remote models<br>Come to this session to learn more about local development while leveraging AI to optimize our development flow, code and our functionality itself!<br>", "totalFavourites": 392, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-10T07:30:00Z", "to": "2025-10-10T08:20:00Z", "room": "Room 5", "kind": "Conference", "pause": false, "talk": {"id": 24572, "title": "Finally, final means final - A deep dive into field immutability in Java", "speakers": [{"fullName": "Per Minborg", "company": "Oracle", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-0a47a774-c8f9-4a3c-941c-7dcc09f228b7.jpeg"}], "track": {"name": "Java"}, "audienceLevel": "ADVANCED", "youtubeUrl": "https://www.youtube.com/watch?v=J754RsoUd00", "description": "Java's main tool for expressing immutability is the keyword 'final'. But did you know that the current JVM must assume some 'final' fields will change, and why this will slow down your application? <br><br>In this talk, we will take a deep dive into the semantics and practical implications of field immutability in Java – from compile-time guarantees to JVM behavior. We will take a closer look at how the current JVM treats final fields and how you can leverage this to create faster code already today. We will also explore some of the recent efforts to enhance the strength of the 'final' keyword over time and what the roadmap for this will look like. At the end, we will see how Java's new preview feature \"Stable Value\" can offer the flexibility of mutable fields while still retaining the performance of 'final' fields, and where this is important.", "totalFavourites": 473, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-10T07:30:00Z", "to": "2025-10-10T08:20:00Z", "room": "Room 6", "kind": "Conference", "pause": false, "talk": {"id": 19142, "title": "Quarkus Unleashed", "speakers": [{"fullName": "Roberto Cortez", "company": "IBM", "imageUrl": "https://lh3.googleusercontent.com/a/ACg8ocLM2ZKLOnSr18TIJPnbJdNvlhfzAzQECyWF7vPyBk1FToKAg9GW=s96-c"}], "track": {"name": "Server Side Java"}, "audienceLevel": "ADVANCED", "youtubeUrl": "https://www.youtube.com/watch?v=zVEcqrHQXwI", "description": "Quarkus mission is to transform your entire application, including its libraries, into an artifact that uses significantly fewer resources than traditional approaches. These can then be used to build native applications using GraalVM. To do this, you need to analyze and understand the whole \"closed world\" of the application. The best that can be achieved without the full context is partial and limited generic support. <br><br>In this session, we will unleash the power of Quarkus Extensions, and show you how to achieve all the Quarkus cool features, like hot reloading, Dev Services, or native compilation to any Java library.", "totalFavourites": 144, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-10T07:30:00Z", "to": "2025-10-10T08:20:00Z", "room": "Room 8", "kind": "Conference", "pause": false, "talk": {"id": 41953, "title": "Architecture as Code: Quantifying Architectural Trade-offs", "speakers": [{"fullName": "Neal Ford", "company": "Thoughtworks, Inc.", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-2432138d-586f-4eea-b5a6-9cf0a26c4287.jpg"}], "track": {"name": "Architecture"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=r9cfeOEgHrM", "description": "Architects often describe their work in diagrams and other visual artifacts, but how can they test to see if the implementation is aligned with the architecture? Architects are expected to not only design new systems, but continuously govern what they’ve already built and ensure that their architecture is aligned with the technical and business environment. This session uncovers a new way to think about architecture—as code. We have infrastructure, policy, data, and a host of other things “as code”, but not architecture…until now. This course covers numerous intersections of software architecture with all the tendrils of the organization, defining each intersection using code. <br>This session provides an overview of the architectural intersections with implementation, infrastructure, engineering practices, team topologies, data topologies, systems integration, the enterprise, and the business environment , defining each interaction with fitness functions that allow architects to not only design solutions but make sure they are implemented and aligned correctly via automated verification. <br>This isn't a <em>testing<\/em> framework, it's a <em>feedback<\/em> framework.", "totalFavourites": 528, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-10T07:30:00Z", "to": "2025-10-10T08:20:00Z", "room": "Room 9", "kind": "Conference", "pause": false, "talk": {"id": 20661, "title": "From the comfort of AWS to the unknown of GCP (and Back?!)", "speakers": [{"fullName": "Natalie Godec", "company": "Zencore", "imageUrl": "https://lh3.googleusercontent.com/a/AAcHTtekY3DQbw6cZJcyJKCy6PCVmYyaancw1fhPCo_RsNgd8Q=s96-c"}, {"fullName": "Endy Kasanardjo", "company": "Choreograph Create", "imageUrl": "https://lh3.googleusercontent.com/a/ACg8ocLT4dejO-e--pQUq-DuAsYv757LUcFHSYRzKVMsbQEU1TBnkMY=s96-c"}], "track": {"name": "Architecture"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=70AuY_mShrI", "description": "They had a beautiful, high-performing, genuinely well-engineered platform running on AWS. Microservices that made actual sense, data flowing nicely, fully automated CI/CD and infrastructure as code, and a skilled team orchesrating it all. Kubernetes, Gitlab, Flux2, Prometheus, Terraform, Kafka, Postgres... And even a lightweight LinkerD instead of Istio for service mesh. <br><br>And then, they had to migrate it all to GCP.<br><br>You'd think - k8s, containers, clean arhcitecture - that should be a no-brainer? <br><br>Spoiler alert - it wasn't!<br><br>This is about taking a perfectly good setup and meticulously (and sometimes painfully) re-engineering it for a new cloud. Does everything really work the same, regardless of who manages your kubernetes clusters? Will data replication tools just work? Does using Prometheus and fluentd lead to a seamless transition of your monitoring and logging? <br><br>Come hear the unfiltered stories of our \"oops\" moments and the clever solutions that eventually led us to successfully flip that final DNS record to GCP.", "totalFavourites": 59, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-10T07:30:00Z", "to": "2025-10-10T08:20:00Z", "room": "BOF 1", "kind": "Speaker Room", "pause": true, "talk": null}, {"from": "2025-10-10T08:20:00Z", "to": "2025-10-10T08:40:00Z", "room": "Exhibition Hall", "kind": "Break", "pause": true, "talk": null}, {"from": "2025-10-10T08:40:00Z", "to": "2025-10-10T09:30:00Z", "room": "Room 4", "kind": "Conference", "pause": false, "talk": {"id": 4743, "title": "Your Code Base as a Crime Scene", "speakers": [{"fullName": "Scott Sosna", "company": "Scott Sosna Consulting", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-248faa1b-9709-45d5-9340-acadbeaec010.jpg"}], "track": {"name": "Development Practices"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=-iKd__Lzt7w", "description": "The objective of the board game <em>Cluedo<\/em> is to deduce how, where, and by whom the victim was murdered based on clues gathered from the other players. Was it Colonel Mustard with the spanner in the Conservatory? Or perhaps Mrs. White with the candlestick in the Lounge? Use your deductive powers to ask the right questions, gather the facts, and determine the answers before anyone else and win the game.<br><br>An objective look at your code base <em>should<\/em> find a multitude of problems: lost architectural vision, questionable code structure, security through obscurity, undeleted dead code, inconsistent coding paradigms, copy-pasted code updated inconsistently, and much more! Instead of looking at the current state, let's look at he journey. Was it the sleep-deprived engineer at home with an misunderstood Stack Overflow answer, the Product Manger making unreasonable commitments on-site, or the non-technical leader making a technical decision? Or all of the above? The reasons are distributed throughout the organization with plenty of blame to distribute.<br><br>Join me for a fun discussion about possible triggers that started the decline of your code quality and what actions you, as the engineer, can take to protect the code and yourself!", "totalFavourites": 405, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-10T08:40:00Z", "to": "2025-10-10T09:30:00Z", "room": "Room 5", "kind": "Conference", "pause": false, "talk": {"id": 4749, "title": "Behavioral Software Engineering", "speakers": [{"fullName": "Mario Fusco", "company": "IBM", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-5909dee1-b4ae-4597-8ba5-878d30a68aec.jpg"}], "track": {"name": "People & Culture"}, "audienceLevel": "BEGINNER", "youtubeUrl": "https://www.youtube.com/watch?v=Aa2Zn8WFJrI", "description": "According to the traditional economic theory, markets are fully efficient and humans operate in them in a rational way. In the late 70s Daniel Kahneman and Amos Tversky started disproving this efficient markets hypothesis, contrasting the consistently logical Homo Economicus (Econ) they depicted, with the more realistic Human who takes decisions based on his questionable points of view. Doing so they gave birth to the study of the psychological factors involved in the making of these decisions, called Behavioral Economics.<br><br>The same flawed reasoning also impacts other fields like software engineering: we cannot behave as cold Econ when spending or investing our money, or as rational Engeen when coding. We are humans and this inevitably influences our choices.<br><br>The anchoring effect and the availability bias affect how we benchmark and evaluate the performances of our programs. The pro-innovation and bandwagon biases drive our technical decisions, making us to blindly follow hypes and gurus. The not-invented-here syndrome pushes us to create homemade tools instead of using de-facto standards. The framing effect makes us solving the same problem in different ways, depending on how it is presented.<br><br>During this talk we will go through these and other heuristics and shortcuts used by our brain, as found by behavioral economists in almost 50 years of research, and examine them in the context of software engineering, discussing their consequences on the quality of our work.", "totalFavourites": 333, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-10T08:40:00Z", "to": "2025-10-10T09:30:00Z", "room": "Room 6", "kind": "Conference", "pause": false, "talk": {"id": 14115, "title": "How browsers REALLY load Web pages", "speakers": [{"fullName": "Robin Marx", "company": "Akamai", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-91dbebed-8f89-4331-a81c-5164612b0944.png"}], "track": {"name": "Architecture"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=n34UjuPKIYI", "description": "When browsers load a Web page and its subresources, A LOT happens under the hood. They need to take into account render/parsing blocking resources, use a preload scanner, listen to resource hints (like preload/preconnect), loading modifiers (async/defer/module), fetchpriority, responsive images, and much more. <br><br>Based on all those signals, they then need to somehow decide when to load which resources, to make optimal use of the modern HTTP/2 and HTTP/3 connections. And, as you might have guessed, none of the browsers do this in quite the same way (understatement alert!). Several even intentionally delay requesting some resources until others have been downloaded (insert shocked face emoji here). <br><br>This talk is a deep dive into how browsers decide when to load a specific resource, and some ways in which you can influence them to modify their behaviour (so you can make sure that important Hero image is definitely one of the first things to come in!). We will look at A LOT of different page load waterfalls and discuss why each looks the way it does, why browsers often make different decisions, and how to solve common problems (no, don’t just preload everything with fetchpriority=high, you monster!). <br><br>You will walk away with a deeper understanding of what happens under the hood, which will allow you to better deal with the various gotchas and quirks present in today’s browsers and resource loading features.", "totalFavourites": 269, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-10T08:40:00Z", "to": "2025-10-10T09:30:00Z", "room": "Room 8", "kind": "Conference", "pause": false, "talk": {"id": 7038, "title": "Spring Boot: Chapter 4", "speakers": [{"fullName": "Brian Clozel", "company": "Spring team", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-c7495415-fa8d-4c97-8f12-898261d1c087.jpg"}, {"fullName": "Stephane Nicoll", "company": "Spring Team", "imageUrl": "https://lh3.googleusercontent.com/a/ACg8ocLXhpZP1pg4IcNwhZGMJD3nNUk_2bRf6Ppmz67DF8DKycIG9AM=s96-c"}], "track": {"name": "Java"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=4NQCjSsd-Mg", "description": "Spring Boot 4.0 is scheduled for next November. While the Java baseline remains at 17, it’s the perfect time to leverage new language and framework features. Stéphane and Brian will start by upgrading their existing application to Spring Boot 4.0.<br><br>Along the way, we will prevent future NullPointerExceptions in production thanks to Nullness metadata in Spring projects and JSpecify Nullability checks. We will also revisit our application dependency arrangement: Spring Boot now provides fine-grained dependencies that allow for more flexibility in your application. The new Jackson 3.0 integration simplifies our Jackson setup and updates configuration options with more modern opinions. We will also see how we can use a RestClient in asynchronous scenarios without involving Reactive types.", "totalFavourites": 542, "slidesUrl": "", "teamRating": null}}, {"from": "2025-10-10T08:40:00Z", "to": "2025-10-10T09:30:00Z", "room": "Room 9", "kind": "Conference", "pause": false, "talk": {"id": 5910, "title": "Live Coding The Hive: building a microservices-ready modular monolith", "speakers": [{"fullName": "Julien Topçu", "company": "Shodo", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-fbbc389f-61b8-4ff5-96a3-0c384a9cda8f.png"}, {"fullName": "Thomas PIERRAIN", "company": "Agicap", "imageUrl": "https://devoxxian-image-thumbnails.s3-eu-west-1.amazonaws.com/profile-cc5eedfb-b4d4-4b10-adcd-68d07c8000e6.jpeg"}], "track": {"name": "Architecture"}, "audienceLevel": "INTERMEDIATE", "youtubeUrl": "https://www.youtube.com/watch?v=VKcRNtj0tzc", "description": "After a decade, the industry is realizing that poorly designed microservices can easily transform into a distributed monolith, even more problematic than the spaghetti monolith they aimed to address. To tackle this issue, the concept of a modular monolith is
